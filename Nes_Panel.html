de\\3 Pricing\\Düğüncom_subscription_models\\1. All Current Rate Cards_6.10.2026.xlsx"}], "tags": ["bundle", "PDF", "elle fiyat", "upsell"], "source": "2 Upsell/Upsell/CLAUDE.md (Bundle PDFs)", "pin": false, "links": []}, {"id": "t-ups-ek-kategori", "cat": "Upsell", "order": 50, "kind": "bilgi", "title": "İkinci (ek) kategori satışı: neden değer katar", "tldr": "Aynı mekânı ikinci bir kategoride (ör. Düğün Salonu + Balo) listelemek farklı çiftlere ulaştırır ve toplam talebi artırır; çift kategorili müşteri daha çok yeniler. Upsell sepetlerinin temel mantığı budur.", "body": "**Nedir:** bir mekânın aynı alanını ikinci bir kategoride de yayınlamak (çoğu zaman Düğün Salonu + Balo ve Davet, ya da Kır + Balo).\n**Ne biliyoruz (DS + Balo çalışması, 25.09.2026):**\n- İkinci sayfa çoğunlukla farklı çiftlere ulaşır (çok az örtüşme); toplam talep belirgin artar.\n- Çift kategorili müşteri tek kategorili müşteriden daha çok yeniler.\n- Ama ayda çok talep alan dolu İstanbul 6X salonlarında ikinci sayfa talebi artırmaz, böler; onlara X yükseltmesi önerilir.\n**Satış dili:** 'farklı kitleye erişim ve toplam talep artışı'; 'ikinci bir salon kadar talep' denmez.\n**Kapasite kuralı:** ek kategori aynı mekânda — DS / Balo için kapalı alan ≥ 200 kişi, Kır için açık alan ≥ 200.\n**Dikkat:** bir firmanın kendi öncesi / sonrasında 'TL başına talep' kıyaslanmaz; aynı dönemde firmalar arası kesit kullanılır.", "jobs": [{"title": "DS + Balo birlikte satış analizi", "date": "25.09.2026", "why": "Upsell sepetlerinde ikinci kategori önermenin firmaya gerçekten değer katıp katmadığını ölçmek ve satış dilini belirlemek.", "files": [{"label": "DS_Balo_Cift_Kategori PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\2 Upsell\\DS_Balo_Cift_Kategori\\PROJECT.md"}, {"label": "second-category-listing-value.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\2 Upsell\\DS_Balo_Cift_Kategori\\notes\\second-category-listing-value.md"}, {"label": "DS + Balo Davet Birlikte Satış Analizi_25.09.2026.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\2 Upsell\\DS_Balo_Cift_Kategori\\DS + Balo Davet Birlikte Satış Analizi_25.09.2026.xlsx"}]}], "kit": {}, "files": [{"label": "second-category-listing-value.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\2 Upsell\\DS_Balo_Cift_Kategori\\notes\\second-category-listing-value.md"}], "tags": ["ek kategori", "DS", "Balo", "upsell", "talep"], "source": "2 Upsell/DS_Balo_Cift_Kategori; Upsell PROJECT.md §78", "pin": false, "links": []}, {"id": "t-ups-upgrade", "cat": "Upsell", "order": 60, "kind": "bilgi", "title": "Upgrade kampanyası (ilk 3 ay üst paket)", "tldr": "Kasım 2025 – Şubat 2026'da satılan bu kampanyada firma ilk 3 ay bir üst paketle (2X → 4X, 4X → 6X) yayınlanır, sonra satın aldığı pakete döner; bu satışlar bir Google Sheet'te takip edilir.", "body": "**Nedir:** yeni satışta firmaya üst paketi 3 ay denetip sonra upsell'e çevirmeyi hedefleyen kampanya. Her satış aynı sözleşmede iki üründür: 3 aylık üst paket + kalan süre satılan paket.\n**Takip sheet'i (Upgrade Kampanyalı Ürünler):** işlem tarihi, Provider ID, RÇİ, satış yapılan sözleşme ID, manuel açılan sözleşme ID (iş yapılınca silinir), CRM linki, iş açıldı mı, iş ID, Upsell (evet / boş).\n**Dikkat:** 9 aylık ürünün 'önceki ürünü' olarak 3 aylık kampanya ürünü işaretlenmeli; yoksa yenileme ve churn raporları bozulur. Yenileme listesinde bu ürünler 'Upgrade kampanyalı ürün, 9 ay yayınlanmış' notuyla gelir.\n**Sonuç:** kampanya ürünü bittikten sonra üst pakete geçen firma çok az çıktı (Eylül 2026 kontrolü: sheet'te zaten 'Upsell' işaretli 5 firma).", "jobs": [{"title": "Upgrade kampanyası sonrası upsell kontrolü", "date": "22.09.2026", "why": "Kampanya ürünü bitince kaç firmanın gerçekten üst pakete geçtiğini görmek; kampanyanın upsell'e dönüşüp dönüşmediğini ölçmek.", "files": [{"label": "Upgrade_Kampanyasi_Upsell_Kontrolu PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\2 Upsell\\Upgrade_Kampanyasi_Upsell_Kontrolu\\PROJECT.md"}, {"label": "Upgrade Kampanyası_Upsell Kontrolü_22.09.2026.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\2 Upsell\\Upgrade_Kampanyasi_Upsell_Kontrolu\\Upgrade Kampanyası_Upsell Kontrolü_22.09.2026.xlsx"}]}], "kit": {}, "files": [{"label": "Upgrade Kampanyalı Ürünler (Google Sheet)", "url": "https://docs.google.com/spreadsheets/d/1iw1ud--0pjy3iXtHOY_zf_N31gzq4vZ23kUIocGuHEE/edit"}], "tags": ["upgrade", "kampanya", "önceki ürün", "CRM"], "source": "Google Drive › Upgrade Kampanyalı Ürünler; 2 Upsell/Upgrade_Kampanyasi_Upsell_Kontrolu", "pin": false, "links": []}, {"id": "t-soz-sozlesme-tipleri", "cat": "Sözleşme & CRM", "order": 10, "kind": "bilgi", "title": "Sözleşme tipleri, ödeme tipleri, vade farkı ve KDV", "tldr": "Bir satışın vergisi ve ödeme planı sözleşmenin projeli mi KDV'li (projesiz) mi olduğuna ve ödeme tipine göre değişir; tüm sözleşme konularının temeli budur.", "body": "**Nedir:** CRM'de her sözleşmenin bir tipi ve bir ödeme tipi vardır; fatura ve vergi bunlara göre çıkar.\n**Sözleşme tipi:**\n- `Projeli` — mekan (SAS / MoS) satışlarının çoğu; AR-GE (Teknokent) sözleşmesidir. CRM'de proje alanı doluysa projelidir. TES satışı projeli olamaz.\n- `KDV'li (projesiz)` — tüm TES (Plus) satışları ve bazı SAS satışları.\n**Ödeme tipi:**\n- `Aylık` — kredi kartından her ay çekim (abonelik).\n- `Peşin` — direkt ödeme, havale, çek / senet (en fazla 6), kredi kartına taksit.\n**Vade farkı (yalnız peşin):** %15. Kredi kartında 6 taksite kadar, çek / senette 4 aya kadar farksız; 6 aydan uzun vade girilmez.\n**KDV (özet):**\n- Projeli aylık ve yıllıkta lisans kısmı KDV'siz; yalnız listeleme ve pazarlama bedeli KDV'li (ayrıntı: 'Yeni KDV kuralı' kartı).\n- Projesiz: 9.900 TL ve üzeri faturada %14 tevkifatlı, altında %20 KDV. Vergi mükellefi olmayan firmada CRM › Müşteri › Şirket Türü = 'Vergi mükellefi değil'.\n**Dikkat:** oranlar ve sınırlar (vade %15, KDV %20 / %14, tevkifat sınırı 9.900 TL) değişebilir; kullanmadan önce dokümandaki güncel hâline bak.", "jobs": [], "kit": {"prompt": "Düğün.com'da satış / sözleşme süreçlerini devralıyorum. Önce 'Sözleşme Tipleri (doküman)' ve 'Agreements CLAUDE.md' dosyalarını oku. Projeli (AR-GE) ve KDV'li (projesiz) sözleşme farkını, ödeme tiplerini, vade farkını ve KDV / tevkifat kurallarını bana sade bir tabloyla anlat. Bana genelde 'bu satış hangi sözleşmeyle, hangi vergiyle yazılır' ve 'bu tutar doğru mu' diye sorulacak. Cevap verirken oranların güncelliğini dokümandan kontrol et ve emin olmadığın yeri açıkça söyle.", "files": [{"label": "Sözleşme Tipleri (doküman)", "url": "https://docs.google.com/document/d/1CgNU-mivkSWrLDcejK7jIp4T6LljYTZQjJAxNe1-Wtc/edit"}, {"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}]}, "files": [{"label": "Sözleşme Tipleri (doküman)", "url": "https://docs.google.com/document/d/1CgNU-mivkSWrLDcejK7jIp4T6LljYTZQjJAxNe1-Wtc/edit"}, {"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}, {"label": "Vergi Değişiklikleri (Tevkifat KDV vs).xlsx — eski (2024) çalışma", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Vergi Değişiklikleri\\Vergi Değişiklikleri (Tevkifat KDV vs).xlsx"}], "tags": ["sözleşme", "KDV", "tevkifat", "projeli", "ödeme tipi", "vade farkı"], "source": "Drive › Sözleşme Tipleri (doküman); eski kart ld-7", "pin": false, "links": []}, {"id": "t-soz-arge-ga-gy", "cat": "Sözleşme & CRM", "order": 20, "kind": "bilgi", "title": "AR-GE (Teknokent) sözleşmeleri: GA ve GY", "tldr": "Mekan satışları İstanbul Teknokent'teki Perador Bilişim adına kesilen AR-GE ve Üyelik Sözleşmesi ile yapılır: GA = aylık ödemeli, GY = yıllık / peşin.", "body": "**Nedir:** SAS ve MoS'un mekan satışlarında kullandığı basılı sözleşme formları. Sözleşmeyi kesen firma Perador Bilişim ve Yazılım Hizmetleri A.Ş. (İstanbul Teknokent); AR-GE kapsamında olduğu için lisans bedeli KDV'den istisnadır.\n**Formlar:**\n- `GA` — AR-GE ve Aylık Ödemeli Üyelik Sözleşmesi (eski adı GTS). Aylık kredi kartı çekimi.\n- `GY` — AR-GE ve Üyelik Sözleşmesi, yıllık / peşin (eski adı GT).\n- Ön yüz: tutarlar ve ödeme planı. Arka yüz: maddeler. Maddelerin geçerli metni 07.08.2026 revizyonlu Word dosyalarıdır.\n- `Tasarım Formu` — sözleşmenin eki, firmanın sayfa bilgileri.\n**Neden, ne zaman:** her mekan yeni satış ve yenilemesinde. TES / Plus bu formlarla satılmaz (ayrı kart: 'TES (Plus) sözleşmeleri').\n**Dikkat:** 01.09.2026 baskısında GA / GY yanında OA, OY, VA, VY formları da var; harflerin anlamı dosyalarda yazmıyor, devralırken sorulmalı.", "jobs": [{"title": "4691 sayılı kanun vergi düzenlemesine göre GT / GTS taslakları", "date": "07.2026", "why": "Yeni KDV düzenlemesi için sözleşme ön yüzleri ve maddeler hukuk ile birlikte yeniden yazıldı; GT / GTS'in yerine GY / GA geçti.", "files": [{"label": "ar-ge-GTS (4691 Sayılı Kanun Vergi Düzenlemesi).docx (aylık taslak)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Sözleşmeler\\ar-ge-GTS (4691 Sayılı Kanun Vergi Düzenlemesi).docx"}, {"label": "ar-ge-GT (4691 Sayılı Kanun Vergi Düzenlemesi)_örnek.docx (yıllık taslak)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Sözleşmeler\\ar-ge-GT (4691 Sayılı Kanun Vergi Düzenlemesi)_örnek.docx"}]}, {"title": "AR-GE sözleşme revizyon kontrolü", "date": "21.08.2026", "why": "Yeni basılacak GY / GA formları eski formlar ve hukuk onaylı Word metinleriyle karşılaştırıldı; ön yüzde teyit edilmesi gereken farklar (IBAN, listeleme satırı, kaldırılan kutular) baskıdan önce işaretlendi.", "files": [{"label": "AR-GE Sözleşme Revizyon Kontrolü 21.08.2026.html", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\AR-GE Sözleşme Revizyon Kontrolü 21.08.2026.html"}]}, {"title": "Eylül 2026 yeni baskı", "date": "01.09.2026", "why": "Kontrolden geçen formlar basıma gönderildi; baskı dosyaları tek klasörde.", "files": [{"label": "2026 Eylül Yeni Baskı (GA, GY, OA, OY, VA, VY)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Sözleşmeler\\2026 Eylül Yeni Baskı"}]}], "kit": {"prompt": "Düğün.com'un mekan satış sözleşmelerini (AR-GE / Teknokent, GA ve GY) devralıyorum. Önce 'Agreements CLAUDE.md' dosyasını, sonra iki 07.08.2026 revizyon Word dosyasını oku; maddelerin geçerli metni bunlardır. GA ile GY'nin farkını, formun hangi alanının ne anlama geldiğini ve TES sözleşmesinden farkını bana anlat. Bana genelde 'bu madde ne diyor', 'yeni baskıda ne değişti' ve 'formun şu alanı nasıl doldurulur' diye sorulacak. Tutar doldurma için 'Yeni KDV kuralı' kartındaki kılavuzu kullan.", "files": [{"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}, {"label": "AR-GE ve Üyelik Sözleşmesi (07.08.2026 revizyon).docx — GY maddeleri", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\İstanbul Üniversitesi Teknokent AR-GE ve Üyelik Sözleşmesi (07.08.2026 revizyon).docx"}, {"label": "AR-GE ve Aylık Ödemeli Üyelik Sözleşmesi (07.08.2026 revizyonları).docx — GA maddeleri", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\İstanbul Üniversitesi Teknokent AR-GE ve Aylık Ödemeli Üyelik Sözleşmesi (07.08.2026 revizyonları).docx"}]}, "files": [{"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}, {"label": "ar-ge-GA.pdf (aylık form)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\ar-ge-GA.pdf"}, {"label": "ar-ge-GY.pdf (yıllık form)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\ar-ge-GY.pdf"}, {"label": "Tasarım Formu.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\Tasarım Formu.pdf"}, {"label": "AR-GE ve Üyelik Sözleşmesi (07.08.2026 revizyon).docx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\İstanbul Üniversitesi Teknokent AR-GE ve Üyelik Sözleşmesi (07.08.2026 revizyon).docx"}, {"label": "AR-GE ve Aylık Ödemeli Üyelik Sözleşmesi (07.08.2026 revizyonları).docx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\İstanbul Üniversitesi Teknokent AR-GE ve Aylık Ödemeli Üyelik Sözleşmesi (07.08.2026 revizyonları).docx"}, {"label": "ar-ge-GT.pdf / ar-ge-GTS.pdf (eski formlar, yalnız karşılaştırma için)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\ar-ge-GT.pdf"}], "tags": ["sözleşme", "GA", "GY", "AR-GE", "Teknokent", "SAS", "MoS"], "source": "6 Contracts/Agreements; Nesibe İşler/Sözleşmeler; eski kart lb-3", "pin": false, "links": []}, {"id": "t-soz-kdv-kurali", "cat": "Sözleşme & CRM", "order": 30, "kind": "kural", "title": "Yeni KDV kuralı: GA / GY tutarları nasıl yazılır", "tldr": "Satıştan önce listeleme bedeli düşülür (GA 250, GY 3.000 TL, KDV hariç); kalanın %85'i KDV'siz lisans bedeli, %15'i %20 KDV'li pazarlama bedeli olarak yazılır.", "body": "**Nedir:** 4691 sayılı kanuna göre AR-GE lisans bedeli KDV'den istisnadır, pazarlama ve organizasyon bedeli değildir. Bu yüzden satış tutarı formda üç parçaya bölünür. 21.09.2026'da başladı, 22.09.2026'dan beri listeleme bedeli önce satıştan düşülüyor.\n**GA (aylık), örnek aylık satış 10.000 TL:**\n- Lisans Kullanım Bedeli = (satış − 250) × %85 = 8.287,50 (KDV yok).\n- Listeleme satırı formda basılı: 250 + 50 KDV = 300.\n- Pazarlama ve Organizasyon Bedeli = (satış − 250) × %15 = 1.462,50 + %20 KDV 292,50.\n- Aylık Ödenecek = (satış − 250) × 1,03 + 300 = 10.342,50.\n- Aylık Liste Fiyatı = güncel rate card fiyatı; Aylık İndirim = liste − satış; Kampanya İndirimi yalnız 'ilk ay 1 TL' gibi kampanyalarda.\n**GY (yıllık), örnek 180.000 TL:**\n- Lisans = (180.000 − 3.000) × %85 = 150.450 · Pazarlama = × %15 = 26.550 + KDV 5.310 · Listeleme basılı 3.000 + 600.\n- Net Toplam = satış (180.000) · Tevkifatlı KDV = 600 + 5.310 · Genel Toplam = (satış − 3.000) × 1,03 + 3.600 = 185.910.\n**Dikkat:**\n- Bir tutar kuruşluysa o formdaki bütün tutarlar 2 ondalıkla yazılır.\n- TES / Plus bu kuralla yazılmaz, düz KDV'li yazılır.\n- Hesabı elle yapma; D-One'daki Sözleşme Doldurma Kılavuzu'nu kullan.", "jobs": [{"title": "Sözleşme Doldurma Kılavuzu'nun ilk sürümleri", "date": "21.09.2026 – 06.10.2026", "why": "Satış ekibi yeni KDV kuralıyla formu nasıl dolduracağını bilmiyordu; il → ilçe → kategori → paket seçen, tutarları kendi hesaplayan etkileşimli bir kılavuz yapıldı. Son yerel sürüm 06.10.2026; bugün geçerli olan D-One'daki kopyasıdır.", "files": [{"label": "Sözleşme Doldurma Kılavuzu_06.10.2026.html (son yerel sürüm)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\Sözleşme Doldurma Kılavuzu_Aylık ve Yıllık_Yeni KDV Kuralı_06.10.2026.html"}]}], "kit": {"prompt": "Düğün.com mekan sözleşmelerindeki yeni KDV kuralını öğrenmem gerekiyor. Önce 'Agreements CLAUDE.md' dosyasını oku, sonra D-One'daki Sözleşme Doldurma Kılavuzu'na bak. Bana GA ve GY için tutarların nasıl bölündüğünü (listeleme, %85 lisans, %15 pazarlama + KDV) birer örnekle anlat. Bana genelde satıştan 'şu tutarı forma nasıl yazarım' veya 'bu sözleşmedeki rakamlar doğru mu' diye sorulacak. Her hesabı formüllerle göster ve TES / Plus satışlarının bu kuralın dışında olduğunu unutma.", "files": [{"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}, {"label": "Sözleşme Doldurma Kılavuzu (D-One)", "url": "https://d-one.dugun.work/satis/kampanyalar/sozlesme-kilavuzu"}]}, "files": [{"label": "Sözleşme Doldurma Kılavuzu (D-One)", "url": "https://d-one.dugun.work/satis/kampanyalar/sozlesme-kilavuzu"}, {"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}, {"label": "Sözleşme Tipleri (doküman)", "url": "https://docs.google.com/document/d/1CgNU-mivkSWrLDcejK7jIp4T6LljYTZQjJAxNe1-Wtc/edit"}], "tags": ["sözleşme", "KDV", "GA", "GY", "4691", "SAS", "MoS"], "source": "6 Contracts/Agreements/CLAUDE.md; eski kart lb-1", "pin": true, "links": []}, {"id": "t-soz-kilavuz-d-one", "cat": "Sözleşme & CRM", "order": 40, "kind": "kural", "title": "Sözleşme Doldurma Kılavuzu yalnızca D-One'da", "tldr": "10.11.2026'dan beri tek geçerli kılavuz D-One › Satış › Güncel Kampanyalar › 'Sözleşme Kılavuzu' sekmesidir; eski GitHub sayfası yalnız oraya yönlendirir.", "body": "**Nedir:** satışçının fiyat seçip GA / GY formunun her alanına ne yazacağını gördüğü sayfa. Liste fiyatları CRM'den canlı gelir.\n**Nerede:** D-One › Satış › Güncel Kampanyalar › 3. sekme. TES için değildir.\n**Kural (Nes 10.11.2026):**\n- Satışa yalnız D-One linki verilir.\n- Eski GitHub sayfası (nesibekeles.github.io/duguncom/Sozlesme_Doldurma_Kilavuzu.html) yalnız yönlendirme notu gösterir; eski üretim script'i bir daha 'publish' ile çalıştırılmaz, yoksa notu eski kılavuzla ezer.\n- Kılavuzda bir değişiklik D-One kodunda yapılır (D-One `docs/modules/kampanya.md`).\n**Dikkat:** Welcome Paketi paket seçicide kapalıdır, çünkü Welcome yalnız yıllık satılıyor; aylık Welcome açılırsa seçici güncellenmeli.", "jobs": [{"title": "Kılavuzun D-One'a taşınması", "date": "04.11.2026 – 10.11.2026", "why": "Kılavuzun herkese açık bir GitHub sayfasında ve Excel fiyatlarıyla durması riskliydi; D-One'a alınıp fiyatlar CRM'den okunur hâle getirildi, GitHub sayfası yönlendirmeye çevrildi.", "files": [{"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}]}], "kit": {}, "files": [{"label": "Sözleşme Doldurma Kılavuzu (D-One)", "url": "https://d-one.dugun.work/satis/kampanyalar/sozlesme-kilavuzu"}, {"label": "Eski GitHub sayfası (yalnız yönlendirme)", "url": "https://nesibekeles.github.io/duguncom/Sozlesme_Doldurma_Kilavuzu.html"}, {"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}], "tags": ["sözleşme", "kılavuz", "D-One"], "source": "6 Contracts/Agreements/CLAUDE.md SCOPE 10.11.2026; eski kart lb-2", "pin": false, "links": []}, {"id": "t-soz-tes-plus", "cat": "Sözleşme & CRM", "order": 50, "kind": "bilgi", "title": "TES (Plus) sözleşmeleri ve saha formları", "tldr": "TES mekan dışı firmalara Plus'ı AR-GE formuyla değil KDV'li Üyelik Sözleşmesi ile satar; saha ekibi için aylık 'A' ve yıllık 'Y' basılı formları var.", "body": "**Nedir:** TES (mekan dışı: Big 5 ve diğerleri) satışlarının sözleşmesi. Plus AR-GE kapsamında olmadığı için lisans / pazarlama bölmesi yoktur; tutar düz KDV'li yazılır.\n**Formlar (saha ekibi, Eylül 2026'dan beri; TES hibrit modeli 14.09.2026'da başladı):**\n- `A` — aylık Üyelik Sözleşmesi: liste fiyatı, aylık indirim, kampanya indirimi, aylık ödenecek; kredi kartı aylık çekim.\n- `Y` — yıllık Üyelik Sözleşmesi: net toplam, tevkifatlı KDV, genel toplam; ödeme planı nakit / havale / çek / kredi kartı.\n- Arka yüz metinleri: `Aylık (KDVli).docx`, `Yıllık (KDV'li).docx`. Eki: `Tasarım Formu`.\n- Ofis ekibi aynı ürünü telefonda e-sözleşme ile satar.\n**Fiyat:** Plus fiyatları ve satış kodları PRICING.md'de (bölüm 3b).\n**Dikkat:** aylık metinde taraf adresi Beyoğlu, yıllıkta Avcılar yazıyor; aylık Word taslağında 7.7 maddesi basılı e-sözleşmeye göre eksik.", "jobs": [{"title": "TES aylık ve yıllık KDV'li metinlerin hazırlanması", "date": "06.2026 – 09.2026", "why": "TES'in kendi sözleşmesi olmadığı için aylık (otomatik yenilemesiz, 12 ay taahhütlü) ve yıllık KDV'li metinler Word'e çıkarılıp düzeltildi.", "files": [{"label": "TES Hazırlık klasörü", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\TES\\Hazırlık"}, {"label": "TES Aylık_Otomatik Yenileme Yok-12 Ay Taahhüt Var_Haziran 2026.docx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Sözleşmeler\\TES Aylık_Otomatik Yenileme Yok-12 Ay Taahhüt Var-Cayma Bedeli Klasik_Haziran 2026.docx"}]}, {"title": "TES saha sözleşmesi formları (A / Y)", "date": "29.09.2026 – 01.10.2026", "why": "Hibrit modelle sahaya çıkan TES ekibinin elde dolduracağı basılı form gerekti; GY ön yüzünden TES'e uygun yıllık ön yüz ve A / Y formları hazırlandı.", "files": [{"label": "TES SAHA klasörü (A.pdf, Y.pdf, arka yüzler, Tasarım Formu)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\TES\\SAHA"}]}], "kit": {"prompt": "Düğün.com'da TES (mekan dışı firmalar, ürün Plus) sözleşmelerini devralıyorum. Önce 'Agreements CLAUDE.md' dosyasını, sonra 'PRICING.md' içindeki Plus bölümünü (3b) oku. TES sözleşmesinin mekan AR-GE sözleşmesinden (GA / GY) farkını, saha formları A ve Y'nin alanlarını ve Plus fiyatlarını bana anlat. Bana genelde 'Plus satışı hangi formla, hangi tutarla yazılır' ve 'metinde şu madde ne diyor' diye sorulacak. Arka yüz için TES SAHA klasöründeki Word dosyalarını esas al.", "files": [{"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}, {"label": "PRICING.md (fiyat kartları rehberi)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\3 Pricing\\Düğüncom_subscription_models\\PRICING.md"}]}, "files": [{"label": "Agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\CLAUDE.md"}, {"label": "PRICING.md (fiyat kartları rehberi)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\3 Pricing\\Düğüncom_subscription_models\\PRICING.md"}, {"label": "A.pdf (TES aylık saha formu)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\TES\\SAHA\\A.pdf"}, {"label": "Y.pdf (TES yıllık saha formu)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\TES\\SAHA\\Y.pdf"}, {"label": "Aylık (KDVli).docx (arka yüz)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\TES\\SAHA\\Aylık (KDVli).docx"}, {"label": "Yıllık (KDV'li).docx (arka yüz)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\TES\\SAHA\\Yıllık (KDV'li).docx"}, {"label": "Tasarım Formu.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\TES\\SAHA\\Tasarım Formu.pdf"}], "tags": ["sözleşme", "TES", "Plus", "saha", "KDV"], "source": "6 Contracts/Agreements/TES; PRICING.md §3b; eski kart lb-4", "pin": false, "links": []}, {"id": "t-soz-garanti", "cat": "Sözleşme & CRM", "order": 60, "kind": "kural", "title": "Garantili üyelik (Garanti Belgesi) ve garanti talebi değerlendirmesi", "tldr": "İlk kez üye olan firmaya 12 ayda hiç anlaşma olmazsa ücretsiz kullanım hakkı veren belge; firma talep edince PY için kanıta dayalı bir değerlendirme raporu yazılır.", "body": "**Nedir:** AR-GE / üyelik sözleşmesinin eki olan Garanti Belgesi. Güncel sürüm 2026 belgesi (30.10.2026).\n**Kimler:** yalnız ilk kez üye olan firmalar, bir kere. Yenilemede garanti yoktur. Welcome Paketi satışları garantili satılır.\n**Firmanın şartları (2026):**\n- 12 ay aktif üyelik, hiç borç olmaması.\n- İlk 7 günde panelin eksiksiz olması (en az 30 düğün temalı görsel, tanıtım yazısı, firma bilgisi).\n- Her teklife 24 saat içinde telefonla dönüş; ulaşamadığı çifte yazılı bilgi ve en az 3 tekrar arama.\n- Paket değişikliği, devir / ortak değişimi garantiyi bitirir; başka kampanyayla birleşmez.\n**Anlaşma sayılanlar:** çiftin Düğün.com numarasından araması, panelde yazılı teklif, 'anlaştım' işareti, yorum, Wedding Planner aramasında anlaştığını söylemesi. Tek bir iş garantiyi yerine getirir.\n**Talep:** sözleşme bitişinden sonra 15 gün içinde yazılı olarak satis.destek@dugun.com'a. Süre geçerse hak düşer.\n**Talep gelince:** PY ekibine Word raporu yazılır: her şart madde madde kanıtla kontrol edilir (7 günde panel, dönüş süresi, anlaşma kanıtı, borç, talep süresi). Okuyucu PY'dir: Qlik alan adı, yöntem yazılmaz; her firma tek başına değerlendirilir. Yazım kuralları notes dosyasında.\n**Eski belgeler:** 2025'teki '6 Ay' belgesi (6 ayda iş yoksa ödeme iadesi + 6 ay ücretsiz, 40 görsel, 12 saatte dönüş) ve '1 Yıl' belgesi. 2026 belgesi bunların yerini aldı.", "jobs": [{"title": "Garanti sözleşmesi (ücret iadesi + 6 ay ücretsiz kullanım) hazırlığı", "date": "11.2025", "why": "Yeni mekan satışını artırmak için garantili satış kurgulandı; metin hukuk onayından geçti ve garantili satışa uygun firma listeleri (İstanbul, Kocaeli) çıkarıldı.", "files": [{"label": "Garanti Sözleşmesi klasörü (taslaklar, hukuk onayı, uygun firma listeleri)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Garanti Sözleşmesi"}, {"label": "garanti-belgesi-2025_baskı.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Garanti Sözleşmesi\\garanti-belgesi-2025_baskı.pdf"}]}, {"title": "Garanti talebi değerlendirmeleri (Zin Urla, Celtik Garden, Blue Mudanya Hotel)", "date": "06.08.2026 – 18.08.2026", "why": "Üç firma garanti talep etti; PY'nin karar verebilmesi için şartların yerine gelip gelmediği kanıtlarla raporlandı. Yeni raporlarda örnek olarak kullanılır.", "files": [{"label": "Blue Mudanya Hotel_Garanti Sozlesmesi Kontrol_18.08.2026.docx (örnek rapor)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\Blue Mudanya Hotel_Garanti Sozlesmesi Kontrol_18.08.2026.docx"}, {"label": "guarantee_agreements klasörü (tüm raporlar)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements"}]}, {"title": "2026 Garanti Belgesi", "date": "30.10.2026", "why": "Şartlar sadeleştirildi (görsel 40 → 30, dönüş 12 → 24 saat + 3 tekrar arama, iade maddesi yok) ve yeni sözleşme baskısına eklendi.", "files": [{"label": "garanti-belgesi-2026.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\garanti-belgesi-2026.pdf"}]}], "kit": {"prompt": "Düğün.com'da garantili üyelik (Garanti Belgesi) konusunu devralıyorum. Önce 'garanti-belgesi-2026.pdf' dosyasını, sonra 'guarantee_agreements CLAUDE.md' ve 'Garanti raporu yazım kuralları' notunu oku. Bana şartları, anlaşma sayılan durumları ve talep sürecini kısa anlat. Bana genelde 'şu firma garanti talep etti, hak kazanıyor mu' diye sorulacak; o zaman örnek rapordaki yapıyla, PY'nin okuyacağı sade dilde, her şartı kanıtla kontrol eden bir Word raporu hazırla. Firmanın sözleşmesi hangi belge sürümüyle yapıldıysa o sürümün şartlarını uygula.", "files": [{"label": "guarantee_agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\CLAUDE.md"}, {"label": "Garanti raporu yazım kuralları (guarantee-agreement-analysis.md)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\notes\\guarantee-agreement-analysis.md"}, {"label": "garanti-belgesi-2026.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\garanti-belgesi-2026.pdf"}]}, "files": [{"label": "garanti-belgesi-2026.pdf (güncel)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\6 Contracts\\Agreements\\garanti-belgesi-2026.pdf"}, {"label": "guarantee_agreements CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\CLAUDE.md"}, {"label": "Garanti raporu yazım kuralları (guarantee-agreement-analysis.md)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\notes\\guarantee-agreement-analysis.md"}, {"label": "Blue Mudanya Hotel_Garanti Sozlesmesi Kontrol_18.08.2026.docx (örnek rapor)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\Blue Mudanya Hotel_Garanti Sozlesmesi Kontrol_18.08.2026.docx"}, {"label": "garanti-belgesi-6 Ay.pdf (eski)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\garanti-belgesi-6 Ay.pdf"}, {"label": "garanti-belgesi-1 Yıl.pdf (eski)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\guarantee_agreements\\garanti-belgesi-1 Yıl.pdf"}], "tags": ["garanti", "sözleşme", "Welcome", "yeni satış", "PY", "rapor"], "source": "6 Contracts/Agreements/garanti-belgesi-2026.pdf; 5 Provider Reports/guarantee_agreements; Nesibe İşler/Garanti Sözleşmesi; eski kartlar lb-5, lb-6", "pin": false, "links": []}, {"id": "t-soz-referans-kampanyasi", "cat": "Sözleşme & CRM", "order": 70, "kind": "kural", "title": "Referans kampanyası (firma firmayı getirir)", "tldr": "Bir firma başka bir firmayı önerir ve o firma 30 gün içinde üye olursa, öneren firma yeni sözleşme bedelinin 1/12'si kadar Hepsiburada hediye çeki alır.", "body": "**Nedir:** mevcut firmalarımızın yeni firma getirmesini ödüllendiren kampanya. Koşullar metni firmayla paylaşılan resmi metindir.\n**Koşullar:**\n- Referans formla veya satışçıya söylenerek verilir; satış referanstan sonraki 30 gün içinde tamamlanmalı. Önerilen firma zaten aktif üye olamaz.\n- Ödül: yeni firmanın sözleşme bedelinin 1/12'si. Üst sınır: referans başına 10.000 TL, firma başına ayda 20.000 TL, toplam 40.000 TL.\n- Ödül, sözleşme aktif olduktan sonra 45 iş günü içinde Hepsiburada hediye çeki olarak verilir.\n- Aynı firmaya birden çok referans gelirse ilk veren kazanır. Kendine veya aynı ortaklıktaki firmaya referans verilemez.\n**Takip:** referanslar ve kazananlar Drive'daki takip ve kazananlar sheet'lerinde tutulur.\n**Dikkat:** PY'nin 'referans aramaları' bu kampanya değildir; o, yenilemeyen firmaları geri kazanma aramasıdır (ayrı kart).", "jobs": [{"title": "Referans formdan gelen satışlar ve takipte olmayanlar kontrolü", "date": "11.2023", "why": "Formdan gelip satılan firmalar ile Qlik'te referansla gelen ama takip sheet'inde olmayan kayıtlar karşılaştırıldı; ödülü atlanan referans kalmasın diye.", "files": [{"label": "Referans Formdan Yapılan Satışlar.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Referans Kontrol\\Referans Formdan Yapılan Satışlar.xlsx"}, {"label": "Qlik'te Olup Takipte Olmayanlar.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Referans Kontrol\\Qlik'te Olup Takipte Olmayanlar.xlsx"}]}, {"title": "Referans formuna soru ekleme önerisi", "date": "02.2025", "why": "Takibi kolaylaştırmak için referans formuna yeni sorular eklenmesi önerildi.", "files": [{"label": "Referans Formu - Soru Ekleme_v2.pptx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Referans Kontrol\\Referans Formu - Soru Ekleme_v2.pptx"}]}, {"title": "Katılım koşullarının güncellenmesi", "date": "06.2026", "why": "Kampanya koşulları (üst sınırlar, Hepsiburada çeki) yeni metinle güncellendi.", "files": [{"label": "Referans Kampanyası_Katılım Koşulları ve Şartlar.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Referans Kontrol\\Düğün.com Referans Kampanyası_Katılım Koşulları ve Şartlar.pdf"}]}], "kit": {}, "files": [{"label": "Referans Kampanyası_Katılım Koşulları ve Şartlar.docx (güncel metin)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Referans Kontrol\\Düğün.com Referans Kampanyası_Katılım Koşulları ve Şartlar.docx"}, {"label": "2025 Referans Kampanyası Takip", "url": "https://docs.google.com/spreadsheets/d/1o_CtvFfHQvwK-imtSse95lzaTkOnKiY_Pu66HRITO-U/edit"}, {"label": "Referans Kampanyası Kazananlar", "url": "https://docs.google.com/spreadsheets/d/143Uqs0FypmrPwCbyUPRBW_4ZaW5BjPDmbbjBhUBhXnU/edit"}, {"label": "Referans Kampanyası (Drive klasörü)", "url": "https://drive.google.com/drive/folders/1siqqrv_9FZTVC9XxI_xw8F0qTN2WSyek"}], "tags": ["referans", "kampanya", "hepsiburada", "yeni satış"], "source": "Nesibe İşler/Referans Kontrol; Drive › Referans Kampanyası; eski kart lc-15", "pin": false, "links": []}, {"id": "t-soz-ilk-odeme-zaman-asimi", "cat": "Sözleşme & CRM", "order": 80, "kind": "yasak", "title": "İlk ödeme zaman aşımına düşen sözleşme yok sayılır", "tldr": "İlk ödemesi süresinde alınmayan sözleşme pasife düşer ve ürünleri silinir; tekrar aktife alınmaz, üzerinden işlem yapılmaz, yeni sözleşme gönderilir.", "body": "**Nedir:** CRM'de sözleşme gönderildikten sonra ilk ödeme belli sürede alınmazsa sözleşme kendiliğinden pasife düşer. Pasif ikonunda sebep 'ilk ödeme zaman aşımı' yazar.\n**Süre:** erken yenileme işaretli sözleşmede 15 gün, işaretsizde 2 gün.\n**Yapılmaz:**\n- Sözleşme tekrar aktife alınmaz (ürünler silindiği için yayın zaten açılmaz).\n- Bu sözleşmeden elle ödeme çekimi denenmez, elle vade düzenlenmez.\n**Yapılır:** satış / satış destek CRM'den sıfırdan yeni sözleşme gönderir.", "jobs": [], "kit": {}, "files": [{"label": "Aktarım Dosyası (CRM sözleşme / yayın kuralları)", "url": "https://docs.google.com/document/d/1R7DHMZcw3kudwKTl5gQEEkHUBpAjy17z0-OVPnRps4A/edit"}], "tags": ["CRM", "sözleşme", "ödeme", "zaman aşımı"], "source": "Drive › Aktarım Dosyası; eski kart l-crm-1", "pin": true, "links": []}, {"id": "t-soz-erken-yenileme", "cat": "Sözleşme & CRM", "order": 90, "kind": "nasil", "title": "Erken yenileme: nasıl çalışır, hangi talebe ne yapılır", "tldr": "Aktif ürünü olan firma bitişten önce yeni ürün alabilir; yeni ürün eskisi bitmeden başlamaz, ödeme başlangıç tarihinde çekilir ve yayın ödemeden önce açılmaz.", "body": "**Nedir:** firmanın mevcut ürünü bitmeden yenileme (veya upsell) sözleşmesi imzalaması. CRM'de sepet ve sözleşme ekranındaki 'Erken yenileme mi?' alanı işaretlenir.\n**Nasıl çalışır:**\n- Her ürüne başlangıç tarihi seçilir; yeni ürün aktif ürünün bitişinden önce başlayamaz.\n- Ödeme ürün başlangıç tarihine göre çekilir. Kredi kartından çekilemezse uyarı (alert) maili gelir.\n- İlk ödeme zaman aşımı erken yenilemede 15 gündür.\n**Kural:**\n- Alert gelmesi için erken yenileme işaretli ve yayın kapalı olmalı; yayın ödemeden önce açılmaz.\n- Sözleşme tipi 'Abonelik AR-GE veya e-sözleşme' olmalı; alert ve otomatik çekim yalnız abonelikte çalışır.\n**Sık talepler:**\n- 'Ödemeyi şimdi yapacağız' → sözleşme ileri tarihli olsa da ödeme linki hemen gider; yenileme yayını asıl tarihinde başlar.\n- 'Aynı / düşük paketle devam, ödeme 3-4 gün sonra, kapanmasın' → yönetim onayı. Eski ürünün bitişi uzatılır, yeni ürünün başlangıcı ve ilk vadesi aynı gün kadar ileri alınır.\n- 'Upsell yaptı, yeni yayın şimdi açılsın, şimdi ödeyecek' → aktif yayın pasife alınır, bugünden başlayan sözleşme gönderilip ödeme çekilir.\n- 'Upsell yaptı, yayın şimdi açılsın, ödeme asıl tarihte' → mutlaka yönetim onayı; alert gelmeyeceği için ödeme elle takip edilir.\n**Elle takip:** otomatik çekim / alert çalışmayan firmalar 'Erken Yenileme Takip - Manuel Çekim Firmaları' sheet'inde vade çekim tarihi ve sorumlusuyla izlenir.", "jobs": [], "kit": {"prompt": "Düğün.com CRM'inde erken yenileme ve sözleşme / yayın kurallarını öğrenmem gerekiyor. Önce 'Aktarım Dosyası' dokümanını oku; erken yenileme, ilk ödeme zaman aşımı, ticari unvan / provider taşıma ve önceki ürün bağlama kuralları oradadır. Bana erken yenilemenin nasıl çalıştığını ve dört tipik talebe ne yapılacağını sade anlat. Bana genelde satış veya PY'den 'firma şunu istiyor, nasıl yaparız' diye sorulacak; cevapta yönetim onayı gereken durumları ayrıca belirt. Elle takip edilen firmalar için 'Erken Yenileme Takip' sheet'ini kullan.", "files": [{"label": "Aktarım Dosyası (CRM sözleşme / yayın kuralları)", "url": "https://docs.google.com/document/d/1R7DHMZcw3kudwKTl5gQEEkHUBpAjy17z0-OVPnRps4A/edit"}]}, "files": [{"label": "Aktarım Dosyası (CRM sözleşme / yayın kuralları)", "url": "https://docs.google.com/document/d/1R7DHMZcw3kudwKTl5gQEEkHUBpAjy17z0-OVPnRps4A/edit"}, {"label": "Erken Yenileme Takip - Manuel Çekim Firmaları", "url": "https://docs.google.com/spreadsheets/d/17xfmKpU--7m4YyyTnW2L-QkqPlSi0UV3aKa4vwfS6_Y/edit"}, {"label": "Erken Yenilemeler (Drive klasörü)", "url": "https://drive.google.com/drive/folders/1qkvnN-0iKv5xPu1hT1eFFCM8QZ2YZftC"}], "tags": ["CRM", "erken yenileme", "upsell", "ödeme", "alert"], "source": "Drive › Aktarım Dosyası; Erken Yenileme Takip sheet'i; eski kartlar l-crm-2, l-crm-3, l-crm-4, ld-19, ld-25", "pin": true, "links": []}, {"id": "t-soz-unvan-provider-tasima", "cat": "Sözleşme & CRM", "order": 100, "kind": "kural", "title": "Ticari unvan kontrolü ve provider taşıma", "tldr": "Sözleşme, CRM'deki müşterinin ticari unvanıyla aynı unvana yapılır; firma eski sayfasını yeni unvanla kullanmak isterse provider taşınır, bu da feragatname ister.", "body": "**Nedir:** CRM'de müşteri = fatura kesilen tüzel kişi. Farklı ticari bilgili bir firmanın altından sözleşme / ödeme gönderilmez; aynı kişi, ortak ya da aile olsa bile.\n**Unvan değişirse:** sözleşmeden önce operasyon yetkilisine haber verilir, kontroller istenir.\n**Provider taşıma** (firma eski fotoğraf, yorum, teklif geçmişini yeni unvanla kullanmak istiyorsa):\n- Feragatname olmadan taşınmaz (kardeş / ortak olsa bile). Alınamazsa sıfırdan yeni müşteri açılır, içerik baştan girilir.\n- Yeni unvanın sözleşmesi veya devir dilekçesi olmadan taşınmaz. Devam eden sözleşmede unvan değişirse iki tarafın imzalı devir dilekçesi ve tüm ticari evrakı gerekir.\n- Devam eden vade veya borç varsa finans onayı olmadan taşınmaz.\n**Kayıt:** her taşıma 'Provider Taşıma İşlemleri' sheet'ine yazılır; taşımada ödeme planı bozulduysa iş (ISD) açılıp düzeltilir. Belgeler Drive klasöründe.", "jobs": [], "kit": {}, "files": [{"label": "Aktarım Dosyası (CRM sözleşme / yayın kuralları)", "url": "https://docs.google.com/document/d/1R7DHMZcw3kudwKTl5gQEEkHUBpAjy17z0-OVPnRps4A/edit"}, {"label": "Provider Taşıma İşlemleri (kayıt sheet'i)", "url": "https://docs.google.com/spreadsheets/d/1ktLKrxVj_0tZgLJhyr0hr8MZau6DRuQRCtwEuqpK_GA/edit"}, {"label": "Provider Taşıma - Ticari Unvan (Drive klasörü)", "url": "https://drive.google.com/drive/folders/15fB1Y3IWmBhkgKd8erSvmn0BGGO0qkSg"}], "tags": ["CRM", "ticari unvan", "provider taşıma", "feragatname"], "source": "Drive › Aktarım Dosyası; Provider Taşıma İşlemleri; eski kartlar l-crm-5, ld-18", "pin": true, "links": []}, {"id": "t-soz-onceki-urun", "cat": "Sözleşme & CRM", "order": 110, "kind": "kural", "title": "Önceki ürün bağlama (yenileme ve churn raporları için)", "tldr": "Ürün taşındığında, paket / kategori değiştiğinde veya geç yenilendiğinde yeni ürüne önceki ürünü bağlanır; bağlanmazsa firma raporlarda yanlışlıkla churn görünür.", "body": "**Nedir:** CRM'de her ürünün bir 'önceki ürün'ü olabilir. Yenileme ve churn raporları firmanın devamlılığını bu bağdan okur.\n**Ne zaman bağlanır (Performans ekibi / back office):**\n- İlk 3 ay üst paket, sonraki 9 ay satılan paket gibi kampanyalarda: 9 aylık ürünün önceki ürünü 3 aylık ürün.\n- Ürün başka provider altına taşınınca; kategori veya paket değiştirmek için yeni ürün / provider açılınca.\n- Geç yenilemede (ör. 1 ay boşlukla yenilenen ürün) ve Qlik'te churn görünen ama churn olmayan üründe.\n**Nereden:** CRM › Firma › Product veya Sözleşme › Product.\n**Sınırlar:**\n- Önceki ürün aynı müşteri altında olmalı (müşteriler arası olmaz).\n- Yeni ürünün başlangıcından en çok 3 ay önce bitmiş ürün seçilebilir; hiç yayınlanmamış ürün sayılmaz.\n- Bir ürün birden çok ürünün önceki ürünü olabilir.", "jobs": [], "kit": {}, "files": [{"label": "Aktarım Dosyası (CRM sözleşme / yayın kuralları)", "url": "https://docs.google.com/document/d/1R7DHMZcw3kudwKTl5gQEEkHUBpAjy17z0-OVPnRps4A/edit"}], "tags": ["CRM", "önceki ürün", "churn", "yenileme", "rapor"], "source": "Drive › Aktarım Dosyası; eski kart l-crm-6", "pin": false, "links": []}, {"id": "t-soz-crm-urun-gecmisi", "cat": "Sözleşme & CRM", "order": 120, "kind": "kural", "title": "CRM ürün düzenleme geçmişi: bir ürüne ne yapıldığının tek kaynağı", "tldr": "Bir ürünün süresi neden uzadı, neden önceki ürün bağlandı gibi soruların cevabı CRM'deki ürün düzenleme geçmişinin 'Sebep Açıklaması'ndadır; Qlik'te yoktur. Yalnız okunur.", "body": "**Nedir:** CRM'de her ürünün değişiklik geçmişi; her değişiklikte serbest metin bir sebep yazılır. Bu bilgi hiçbir Qlik uygulamasına yüklenmiyor.\n**Ne zaman kullanılır:** yenileme listesinde bir ürünün tarihleri ya da durumu beklenmedikse (ör. 'kalan yayın hakkı eklendi', 'ödeme sözü alındı, kapalı kalan süre eklendi', 'mekan tadilatta, yayın saklı', '+1 ay kampanya').\n**Kural:**\n- Yalnız okunur; CRM'de hiçbir şey değiştirilmez. Satırdaki göz ikonu (firmaya hoş geldin maili / SMS açar) ve kalem (düzenleme) tıklanmaz.\n- Görüşme ve sözleşme notları CRM'den değil Qlik'ten okunur.\n- BI bu alanı Qlik'e yüklerse CRM'e bakmaya gerek kalmaz.\n**Nerede anlatılıyor:** Monthly Renewal Lists PROJECT.md › 'Resolving Kontrol rows'.", "jobs": [], "kit": {}, "files": [{"label": "Monthly Renewal Lists PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\1 Renewals\\Monthly Renewal Lists\\PROJECT.md"}, {"label": "crm_history.js (geçmişi toplu okuyan yardımcı)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\1 Renewals\\Monthly Renewal Lists\\tools\\crm_history.js"}], "tags": ["CRM", "ürün geçmişi", "yenileme", "salt okunur"], "source": "1 Renewals/Monthly Renewal Lists/PROJECT.md; eski kart la-31", "pin": false, "links": []}, {"id": "t-soz-py-ikna-aramalari", "cat": "Sözleşme & CRM", "order": 130, "kind": "nasil", "title": "PY 'referans' (ikna) aramaları: yenilemeyen iyi firmaları geri kazanma", "tldr": "Yenilemeyen ama performansı iyi firmalar PY tarafından satış görüşmesi gibi hissettirmeden aranır ve satışla randevuya yönlendirilir; adı 'referans' olsa da referans kampanyası değildir.", "body": "**Nedir:** churn olmuş verimli firmaları geri kazanmak için PY'lerin yaptığı arama kampanyası.\n**Kitle:** 6 aydan kısa süre önce churn olmuş, satışın artık görüşmediği firmalar; skoru Yeşil / Sarı ve şehir-kategori ortalamasında veya üstünde olanlar. İlk faz 100 firma, 1 hafta.\n**Nasıl:**\n- Konuşma: 'portföye bakıyordum, sayfanız hâlâ kapalı' samimiyetiyle başla → çiftlerin en çok anlaştığı döneme vurgu → yenilikler → satışla randevu.\n- Sık itirazlara hazır cevaplar dokümanda (pahalı, Instagram yeter, memnun kalmadık, meşgulüm).\n- Sonuç yenileme dosyasındaki takip kolonlarına yazılır; randevuya ikna olanlar hemen Slack'teki 'ikna turu' kanalına bildirilir.\n- PY'ye yönlendirdiği her randevu ve 1 ay içinde yenileyen her firma için prim.", "jobs": [{"title": "Faz 1 aramaları (100 firma)", "date": "27.04 – 30.04 (yıl dokümanda yok)", "why": "Kayıp verimli firmaları geri kazanmanın PY eliyle işe yarayıp yaramadığını görmek için ilk deneme yapıldı; sonuçlar ayrı dosyada.", "files": [{"label": "Referans Aramaları - Sonuçlar", "url": "https://drive.google.com/file/d/1cdi4aQzCWelk856zSZZmvLGzeCrG1vRz/view"}]}], "kit": {}, "files": [{"label": "PY Referans Aramaları (doküman: script ve itirazlar)", "url": "https://docs.google.com/document/d/1mOPE9G-7nCaPHh4qjudwr4VW3Jkd7cTBh9uXGRlpe-I/edit"}, {"label": "1. Renewal Data_2025-26 (Referans sekmesi)", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit"}], "tags": ["PY", "ikna", "winback", "yenileme", "churn"], "source": "Drive › PY Referans Aramaları; eski kart ld-10", "pin": false, "links": []}, {"id": "t-rap-performans-ligi", "cat": "Firma raporları & performans", "order": 10, "kind": "tanim", "title": "Performans Ligi ve Firma Skoru", "tldr": "Mekan firmalarının paneldeki aksiyonlarına göre her ay 100 üzerinden puan aldığı ve sıralandığı lig; firma panelde gördüğü skora 'Firma Skoru' der.", "body": "**Nedir:** firmaların panele bağlılığını ve teklif dönüş performansını artırmak için 2025 sonbaharında başlatılan oyunlaştırma. Skor her ay yeniden hesaplanır, aylık kazananlar ödül alır ('Aylık ödül listesi' kartı).\n**Kimde, nerede görünür:**\n- Yalnız mekan (venue) provider'larda; Big 5 / diğerleri için eski profil kalite skoru sürer, ödülde ayrı mekan dışı sıralaması var.\n- Panel: ana sayfa kartı, Sayfalarım, İstatistikler › Sayfa İstatistikleri, İstatistikler › Rakip Analizi. CRM'de PY de görür.\n- Veri Qlik'teki Provider Contest Dashboard'dan gelir, her sabah 08:30'da güncellenir.\n**Puanla nın düşmesi); tercihen yaklaşan araştırma sezonu vurgulanır.\n- Mutlak lead sayısı (oran olarak yazılır: '%35 daha yüksek'), ödeme gecikmesi, PY notu alıntısı, rakip adı / fiyatı, indirim oranı, teklif başı maliyet.\n**Nasıl yazılır:**\n- 'Danışmanlarımız' değil 'Wedding Planner ekibimiz'.\n- Bölüm başlıkları kısa; teklif kartında yalnız BUGÜN ➜ ÖNERİMİZ paketi.\n**Ürün gerçeği:** ek ilçe yalnız Düğün Salonları kategorisinde var; Söz-Nişan, Kına vb. için önerilmez.", "jobs": [], "kit": {}, "files": [{"label": "Firmaya giden rapor kuralları (customer-facing-report-rules.md)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\notes\\customer-facing-report-rules.md"}], "tags": ["firma", "müşteri", "yazım", "rapor", "kural"], "source": "5 Provider Reports/notes/customer-facing-report-rules.md; eski kart lb-10", "pin": false, "links": []}, {"id": "t-rap-firma-karnesi", "cat": "Firma raporları & performans", "order": 40, "kind": "bilgi", "title": "Firma Karnesi (yenileme görüşmesi destesi)", "tldr": "Saha / PY ekibinin yenileme görüşmesine götürdüğü 9 sayfalık PowerPoint + PDF karne: firmanın paket dönemindeki trafiği, teklifleri, dönüş hızı ve rakip kıyası.", "body": "**Nedir:** bir firmanın paket döneminde Düğün.com'dan ne aldığını ve kendi performansını gösteren sunum. İlk olarak Pro Start 3 yenilemeleri için yapıldı, Eylül 2026'dan beri her ürüne çıkarılabiliyor.\n**İçinde ne var:** kart görüntüleme, sayfa ziyareti, teklif ve dönüşüm; dönülen teklif oranı ve ortalama dönüş süresi; dönüş yöntemi (telefon / SMS / mail); Wedding Planner red sebepleri; aynı şehir + kategorideki rakiplerle kıyas; 'Çiftler mekanınızı çok sevdi!' maddeleri; Pro Start firmalarında upsell önerisi (Winner 4X).\n**Neden, ne zaman:** yenileme görüşmesinde firmaya ürünün işe yaradığını göstermek. Düzenli değil, PY / satış provider listesi gönderince hazırlanır.\n**Dikkat:**\n- Ortalama dönüş süresi aritmetik ortalamadır, medyan değil (Nes 04.09.2026).\n- 'Çiftler mekanınızı çok sevdi!' maddeleri firmanın kendi Düğün.com sayfasından elle yazılır.\n- Karnedeki metrikler değiştirilmez, yalnız öneri cümleleri düzenlenir. Metinler 'Firmaya giden rapor kuralları'na uyar.\n- Ekim 2026 itibarıyla BI'a devir paketi hazır; devralan kişi BI ile kimin üreteceğini netleştirmeli.", "jobs": [{"title": "Pro Start 3 karnelerinin ilk partileri", "date": "07.2026 – 18.09.2026", "why": "Pro Start 3 yenilemesine giden saha ekibi için karneler talep üzerine üretildi; şablon ve renk / yazım kuralları bu partilerde oturdu.", "files": [{"label": "Firma_Karnesi output/18.09.2026 (örnek parti)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Firma_Karnesi\\output\\18.09.2026"}]}, {"title": "BI devir paketi", "date": "15.09.2026", "why": "Karnenin düzenli üretimini BI'a devretmek için şablon, script'ler, örnekler ve tanımlar tek pakette toplandı.", "files": [{"label": "Firma_Karnesi_BI_Handover_15.09.2026.zip", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Firma_Karnesi\\Firma_Karnesi_BI_Handover_15.09.2026.zip"}, {"label": "README_BI.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Firma_Karnesi\\README_BI.md"}]}, {"title": "Pro Start dışı ürünler ve çok sayfalı müşteriler", "date": "22.09.2026", "why": "Winner 6X gibi diğer ürünler ve birden çok sayfası olan müşteriler için karne genişletildi (upsell sayfası yalnız Pro Start'ta).", "files": [{"label": "output/22.09.2026", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Firma_Karnesi\\output\\22.09.2026"}]}], "kit": {"prompt": "Düğün.com'da Firma Karnesi'ni (yenileme görüşmesine giden firma sunumu) hazırlamayı devralıyorum. Önce 'Firma_Karnesi CLAUDE.md', sonra 'Firma_Karnesi PROJECT.md' ve 'Firmaya giden rapor kuralları' dosyalarını oku; metrik tanımları, renk eşikleri ve Qlik tuzakları oradadır. Bana genelde PY veya satıştan bir provider_id listesi gelecek ve bu firmalar Qlik"], "source": "5 Provider Reports/Firma_Karnesi; Nesibe İşler/PROJECT.md + README.md (eski kopya); eski kartlar lb-7, lc-31", "pin": false, "links": []}, {"id": "t-rap-turbo-karne", "cat": "Firma raporları & performans", "order": 50, "kind": "bilgi", "title": "Turbo Karne Stüdyosu", "tldr": "Turbo (geçici görünürlük artışı) alan firmaların Turbo döneminde ne kazandığını gösteren canlı sayfa; satış / PY firmaya buradan A4 PDF karne indirir.", "body": "**Nedir:** Turbo alan her firmanın Turbo dönemini, Turbo'dan önceki 182 günle karşılaştıran karne sayfası. Turbo'nun sözü: sayfa görüntülenmesi en az 2 kat.\n**İçinde ne var:** sayfa görüntülenme, kart görüntüleme, teklif ve teklif oranı (yalnız organik teklifler), Instagram ziyareti gibi etkileşimler; dönem öncesi / sırası kıyası.\n**Neden, ne zaman:** Turbo'yu tekrar satmak veya firmaya ürünün işe yaradığını göstermek için. Talep gelince firma eklenir.\n**Dikkat:**\n- Yalnız Turbo dönemi bitmiş firmalar eklenir (Nes 16.09.2026).\n- Turbo kaydı yalnız Qlik Executive uygulamasında var; kaydı olmayan firma eklenmez.\n- Sayfa GitHub Pages'te herkese açıktır; firma ekleme / çıkarma PROJECT.md'deki akışla yapılır.\n- Açık konu (13.11.2026): Qlik'te Instagram ziyaretleri geriye dönük düzeltildi; eski firmaların değerlerinin yenilenip yenilenmeyeceği karara bağlanmadı.", "jobs": [{"title": "Stüdyonun kurulması (30 firma)", "date": "06.08.2026", "why": "Turbo'nun etkisini firmaya kanıtlamak için ilk 30 Turbo firmasıyla canlı karne sayfası kuruldu.", "files": [{"label": "Turbo Karne Stüdyosu", "url": "https://nesibekeles.github.io/duguncom/Turbo_Firma_Karnesi.html"}]}, {"title": "Yeni firma ekleme partileri", "date": "16.09.2026 – 13.11.2026", "why": "Satış / PY talebiyle Turbo dönemi biten firmalar eklendi; dönemi bitmeyen firma çıkarıldı, Turbo kaydı olmayan eklenmedi.", "files": [{"label": "Turbo_Karne PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Turbo_Karne\\PROJECT.md"}]} ı & performans", "order": 60, "kind": "nasil", "title": "Müşteri şikâyeti performans değerlendirmesi", "tldr": "'Teklif / trafik alamıyorum' diyen ödeyen firma için: firmanın kendi işini yapıp yapmadığını, ürünün sözünü tutup tutmadığını gösteren iç rapor ve firmaya gidecek tek sayfalık özet.", "body": "**Nedir:** memnuniyetsiz bir firma için PY / satışın istediği değerlendirme. İki çıktı: iç rapor (+ kısa özet) ve firmaya gidecek performans özeti (Word + PDF).\n**Cevaplanan sorular:** firma kendi işini yaptı mı (dönüş, içerik); aynı paketteki benzer firmalara göre altta mı; sorun profil mi lokasyon mu; ürün sözünü tuttu mu; ne önerilir.\n**Nasıl kıyaslanır:** kart görüntüleme aynı paket (X) firmalarıyla, sayfa ve teklif oranları komşu ilçelerle; Wedding Planner red sebepleri de bakılır.\n**Ne zaman:** talep üzerine.\n**Dikkat:** firmaya giden sürüm 'Firmaya giden rapor kuralları'na tam uymalı. Script'ler ilk vakaya göre yazıldı (firma ve tarih sabit); yeni vakada önce düzenlenir.", "jobs": [{"title": "Margaret Davet (Tuzla) değerlendirmesi", "date": "21.09.2026", "why": "Teklif alamadığını söyleyen firmanın şikâyetinin haklı olup olmadığı ve ne önerileceği gösterildi; sorunun büyük ölçüde lokasyondan geldiği çıktı. Yeni vakalarda örnek rapor budur.", "files": [{"label": "Margaret Davet_77391_Performans ve Memnuniyet Değerlendirmesi_v2_21.09.2026.docx (iç rapor)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\Margaret Davet_77391_Performans ve Memnuniyet Değerlendirmesi_v2_21.09.2026.docx"}, {"label": "Margaret Davet_Performans Özeti_Firma için_21.09.2026.pdf (firma sürümü)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\Margaret Davet_Performans Özeti_Firma için_21.09.2026.pdf"}]}], "kit": {"prompt": "Düğün.com'da 'teklif / trafik alamıyorum' diyen firmalar için performans değerlendirmesi hazırlamayı devralıyorum. Önce 'Musteri_Performans_Degerlendirme CLAUDE.md', 'PROJECT.md' ve 'Firmaya giden rapor kuralları' dosyalarını oku, sonra Margaret Davet örnek raporlarına bak. Bana genelde PY'den bir firma id'si gelecek ve 'bu firma haklı mı, ne önerelim' diye sorulacak. Firmanın kendi performansını aynı paketteki ve komşu ilçedeki firmalarla kıyaslayan iç raporu ve firmaya gidecek tek sayfalık özeti hazırla. Firma sürümünü göndermeden önce bana onaylat.", "files": [{"label": "Musteri_Performans_Degerlendirme CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\CLAUDE.md"}, {"label": "Musteri_Performans_Degerlendirme PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\PROJECT.md"}, {"label": "customer-complaint-performance-report.md (kısa not)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\notes\\customer-complaint-performance-report.md"}, {"label": "Firmaya giden rapor kuralları (customer-facing-report-rules.md)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\notes\\customer-facing-report-rules.md"}]}, "files": [{"label": "Musteri_Performans_Degerlendirme CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\CLAUDE.md"}, {"label": "Musteri_Performans_Degerlendirme PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\PROJECT.md"}, {"label": "Firmaya giden rapor kuralları (customer-facing-report-rules.md)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\notes\\customer-facing-report-rules.md"}, {"label": "Musteri_Performans_Degerlendirme tools", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\5 Provider Reports\\Musteri_Performans_Degerlendirme\\tools"}], "tags": ["müşteri", "şikâyet", "performans", "PY", "rapor"], "source": "5 Provider Reports/Musteri_Performans_Degerlendirme; eski kart lb-9", "pin": false, "links": []}, {"id": "t-rap-pasiflik-alarmi", "cat": "Firma raporları & performans", "order": 70, "kind": "bilgi", "title": "Pasiflik alarmı ve Provider Alarm Log", "tldr": "Dün aktif olup bugün pasife düşen ödemeli ürün ve sözleşmeleri her sabah yakalayan alarm; amaç churn'ü ve yenilemede kaybı erken görüp PY'nin firmayı hemen araması.", "body": "**Nedir:** her sabah Qlik'ten 'dün aktif, bugün pasif / silinmiş' ürün × sözleşmeleri bulan, mail (HTML tablo + Excel) olarak gönderen alarm. Kayıtlar kümülatif olarak 'Provider Alarm Log' sheet'inde birikir (31.07.2026'dan beri).\n**Alarm tipleri (v2):**\n- `Sözleşme + Provider Pasifte` — gerçek kayıp riski (churn / decay).\n- `İlk Ödeme Zaman Aşımı` — yeni sözleşmenin ilk ödemesi alınmadı.\n- `Yenileme ama Eski Sözleşmede Borcu Var`.\n- `Sadece Provider Pasifte` / `Sadece Sözleşme Pasifte`.\n- Sorunsuz yenilemeler yalnız sayı olarak verilir.\n**Log'da ne var:** provider, kategori, ürün, şehir, kaç gündür pasif, yenileme ihtimali, sözleşme durumu, sorumlu PY, CRM linki, borç durumu, reject tipi / notu.\n**Neden:** firmanın kapanmasını ay sonunda değil ertesi sabah görmek.\n**Dikkat:**\n- v2 taslağı (17.08.2026) hazır; tam otomasyona geçiş onay bekliyordu. Devralan kişi alarmın şu an çalışıp çalışmadığını ve log'u kimin beslediğini kontrol etmeli.\n- Alıcı Nes'in iş adresi; devralan kendi adresine çevirmeli. Taslakta eski çalışan adı kalmışsa düzeltilmeli.\n- Karar ağacı hiçbir Qlik alanında yok, yalnız kodda; değiştirmeden önce notları oku.", "jobs": [{"title": "v1: provider bazlı ilk alarm", "date": "07.2026", "why": "Pasife düşen provider'ları günlük görmek için ilk sürüm Claude sohbetinde kuruldu (Apps Script + kurulum rehberi).", "files": [{"label": "Old Conversations_Files (v1 arşivi)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\Old Conversations_Files"}]}, {"title": "v2: ürün × sözleşme ve 5 alarm tipi", "date": "17.08.2026 – 18.08.2026", "why": "Provider bazlı alarm sebebi ayırt etmiyordu; ürün × sözleşme seviyesine inilip karar ağacı eklendi, iptal / zaman aşımı sözleşmeleri görmek için kaynak General ve Finance'e çevrildi.", "files": [{"label": "REVIZE_NOTLARI.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\2026-08-17_Taslak\\REVIZE_NOTLARI.md"}, {"label": "KAYNAK_DEGISIKLIGI.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\KAYNAK_DEGISIKLIGI.md"}]}], "kit": {"prompt": "Düğün.com'da günlük pasiflik alarmını (Provider Alarm Log) devralıyorum. Önce 'Passive_Providers_Agreements_Alerts CLAUDE.md', sonra 'passive-provider-alarm-automation.md', 'REQUIREMENTS.md' ve 'REVIZE_NOTLARI.md' dosyalarını oku. Bana alarm tiplerini, karar ağacını ve verinin hangi Qlik uygulamasından geldiğini sade anlat. İlk işim alarmın şu an çalışıp çalışmadığını ve alıcı adresinin bana çevrilmesini kontrol etmek olacak; sonra bana genelde 'şu firma neden alarma düştü' diye sorulacak. Hiçbir maili benim onayım olmadan gönderme.", "files": [{"label": "Passive_Providers_Agreements_Alerts CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\CLAUDE.md"}, {"label": "passive-provider-alarm-automation.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\notes\\passive-provider-alarm-automation.md"}, {"label": "REQUIREMENTS.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\REQUIREMENTS.md"}, {"label": "REVIZE_NOTLARI.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\2026-08-17_Taslak\\REVIZE_NOTLARI.md"}]}, "files": [{"lab satırlar 'KONTROL' ile işaretlenir.\n**Takip:** 'Prime Plaket' sheet'i: yeni gelen Prime firmalar, plakete yazılacak isim, adet, kargoya iletildi mi, teslimat kontrolü, kırık gidip yeniden gönderilecekler. Gönderimi operasyon tarafında Hasan yapar.\n**Dikkat:** sheet'te kişilerin adres ve telefonları var; dışarı paylaşılmaz.", "jobs": [{"title": "2026 plaket listesinin tekilleştirilmesi", "date": "07.09.2026", "why": "Aynı yere iki plaket gitmesin diye kaynak liste satır satır kontrol edildi; her 'Hayır' için sebep yazıldı.", "files": [{"label": "Prime Firmalar_Plaket Kontrol_07.09.2026.xlsx", "url": "https://drive.google.com/file/d/1VTUYUfsXzqxx38NZcwYQFgI9hufKGSpj/view"}]}, {"title": "Plaket amblemi alternatifleri", "date": "25.09.2026", "why": "Plaketteki defne çelengi yas çağrıştırdığı için 4 yeni amblem önerildi.", "files": [{"label": "Amblem_Alternatifleri_Ozet_25.09.2026.png", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Prime_Plaket_2026\\Logo_Alternatifleri\\Amblem_Alternatifleri_Ozet_25.09.2026.png"}]}, {"title": "Kutu mektubunun Word'e çevrilmesi", "date": "02.10.2026", "why": "Tasarımcının PDF'i düzenlenemiyordu; mektup her yıl kolayca güncellensin diye Word sürümü hazırlandı.", "files": [{"label": "Prime Mektup_02.10.2026.docx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Prime_Plaket_2026\\Mektup\\Prime Mektup_02.10.2026.docx"}]}], "kit": {}, "files": [{"label": "Prime Plaket (takip sheet'i)", "url": "https://docs.google.com/spreadsheets/d/1WK0d27XIGW7Ug8plnecY_kolPK3f2_A64EYyZbG7eUU/edit"}, {"label": "2026 Plaket Kutu Gönderimi (Drive klasörü)", "url": "https://drive.google.com/drive/folders/1hYlJ0XxENu868ObQjxJrmajoGIN_JB9b"}, {"label": "Prime_Plaket_2026 CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Prime_Plaket_2026\\CLAUDE.md"}, {"label": "Mektup PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Prime_Plaket_2026\\Mektup\\PROJECT.md"}, {"label": "Prime Mektup_02.10.2026.docx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Prime_Plaket_2026\\Mektup\\Prime Mektup_02.10.2026.docx"}, {"label": "Prime Firmalar_Plaket Kontrol_07.09.2026.xlsx", "url": "https://drive.google.com/file/d/1VTUYUfsXzqxx38NZcwYQFgI9hufKGSpj/view"}], "tags": ["Prime", "plaket", "kutu", "yıllık", "tasarım"], "source": "7 Design/Prime_Plaket_2026; Drive › Prime Plaket; eski kartlar lb-18, ld-23", "pin": false, "links": []}, {"id": "t-sat-ekipler", "cat": "Satış ekipleri & paneller", "order": 10, "kind": "bilgi", "title": "Satış ekipleri: SAS, MoS, TES, SAD", "tldr": "Satış dört ekipten oluşur; hangi firmaya hangi ekibin, hangi ürünle gittiğini bilmeden hiçbir liste, kampanya ya da hedef doğru kurulamaz.", "body": "**Nedir:** düğün.com satış departmanının ekip yapısı (Eylül 2026 itibarıyla).\n**Kim ne satar:**\n- **SAS** (kıdemli saha satış) — mekanlarda her yerde Winner yenileme, geri kazanım (winback) ve upsell; ayrıca Adana / Mersin / Antalya ve alt bölgelerinde Welcome yeni satış.\n- **MoS** (yeni saha satış, Nisan 2026'dan beri) — İstanbul / Ankara / İzmir / Bursa ve alt bölgelerinde mekanlara yalnız **Welcome** yeni satış. Yenileme yapmaz; Pro Start emekli.\n- **TES** (tele satış) — mekan dışı firmalara her yerde **Plus**; \"Yeni Şehirler\"de mekanlara Welcome. 14.09.2026'dan beri **hibrit**: İstanbul saha kolu Big 5 firmalarını yerinde ziyaret eder (aynı Plus, aynı fiyat; ayrı ürün yok), ofis kolu telefonla satar.\n- **SAD** (satış destek) — satış yapmaz; randevu ayarlar, çoğunlukla MoS için.\n**Big 5:** Gelin Saçı ve Makyajı, Düğün Organizasyon, Düğün Fotoğrafçıları, Gelinlik, Müzik.\n**Hangi şehir hangi ekipte:** mekanlar için güncel rate card'daki `City-Team Categories for Venues` sayfası (D-One'da `dw_city_sales_team`); mekan dışı her zaman TES.\n**Dikkat:** Eylül 2026 öncesi yazılmış dokümanlar MoS'u Pro Start satan, TES'i yalnız telefonla satan ekip olarak anlatır; bu bilgi eskidir.", "jobs": [], "kit": {"prompt": "Ben düğün.com'da satış ekipleriyle çalışacak yeni sorumluyum. Önce 'sales-team-structure.md' notunu oku, sonra güncel rate card'daki 'City-Team Categories for Venues' sayfasına bak. Dört ekibi (SAS, MoS, TES, SAD) kimin hangi ürünü, hangi şehirde sattığıyla birlikte bana kısa bir tabloda özetle. Bir liste ya da kampanya hazırlarken firmayı hangi ekibe vereceğimi bu kurallarla belirle; mekan dışı firma her zaman TES'tir. Eylül 2026 öncesi dokümanlarda MoS = Pro Start yazıyorsa onu eski kabul et.", "files": [{"label": "sales-team-structure.md (satış ekipleri notu)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\notes\\sales-team-structure.md"}, {"label": "PRICING.md (fiyat kuralları)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\3 Pricing\\Düğüncom_subscription_models\\PRICING.md"}]}, "files": [{"label": "sales-team-structure.md (satış ekipleri notu)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\notes\\sales-team-structure.md"}, {"label": "1. All Current Rate Cards_6.10.2026.xlsx (güncel rate card)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\3 Pricing\\Düğüncom_subscription_models\\1. All Current Rate Cards_6.10.2026.xlsx"}, {"label": "Cities_Venue-Sales-Team sheet'i (şehir → ekip / SAD kota)", "url": "https://docs.google.com/spreadsheets/d/1qz58tnoEyEeKqVhImVEj_0JrlnrDA4H7N4v1kYJXcqo/edit?usp=sharing"}], "tags": ["SAS", "MoS", "TES", "SAD", "Big 5", "ekip"], "source": "_Resources/notes/sales-team-structure.md · kök CLAUDE.md §3", "pin": false, "links": []}, {"id": "t-sat-welcome-ekibi", "cat": "Satış ekipleri & paneller", "order": 20, "kind": "tanim", "title": "Welcome ekibi (onboarding) ve mezuniyet", "tldr": "Welcome ekibi yeni müşterinin ilk 90 gününü yönetir; firma en az 1 iş alıp 1 TL dışında bir ödeme yapınca 'mezun' olur ve ekip primi bu mezuniyet oranına bağlıdır.", "body": "**Nedir:** yeni müşterilerin platforma girişini (onboarding) yöneten ekip. SAS ve TES müşterileri için birer kişi, iki tarafa da bakan bir hibrit kişi ve bir operasyon yöneticisinden oluşur.\n**Ne yapar:** platform ve ürün anlatımı, ilk 90 gün aktiflik takibi, geri bildirim toplama, erken churn müdahalesi.\n**Mezuniyet:** en az **1 iş** almış olmak + en az **1 TL dışında bir ödeme** yapmış olmak.\n**Hedef ve prim:** en az %90 devam, %70 verimlilik. Aylık prim, mezuniyet zamanı gelen firmalardaki mezun oranına göre kademeli; ayrıca 3 aylık ortalamaya göre çeyrek primi var. Ek şartlar: konuşma kalitesi, verimlilik, mola uyumu. Tutarlar dosyada.\n**Dikkat:** 'Welcome ekibi' ile 'Welcome Paketi' (Eylül 2026'da çıkan yeni satış ürünü) farklı şeylerdir. Süreç dosyaları 2024 tarihlidir; güncel ekip yapısını ve prim tablosunu yöneticiye teyit ettir.", "jobs": [], "kit": {}, "files": [{"label": "Welcome Ekibi.docx (süreç tanımı)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Ekip Süreç Dosyaları\\Welcome Ekibi.docx"}, {"label": "Pre-Onboarding Ekibi.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Ekip Süreç Dosyaları\\Pre-Onboarding Ekibi.pdf"}], "tags": ["Welcome ekibi", "onboarding", "mezuniyet", "prim"], "source": "Nesibe İşler/Ekip Süreç Dosyaları (08.2024)", "pin": false, "links": []}, {"id": "t-sat-red-flag", "cat": "Satış ekipleri & paneller", "order": 30, "kind": "tanim", "title": "RED Flag akışı ve Komisyon 1 / Komisyon 2", "tldr": "Ödemesi aksayan, ikna edilemeyen churn talebi olan ya da yeni churn olmuş firmalar Red Flag ekibine gider; ekip özel çözümleri (inisiyatif) komisyon onayıyla kullanır.", "body": "**Nedir:** riskli firmaları standart PY sürecinden ayırıp uzman bir ekibe veren akış.\n**Firmalar 3 kanaldan girer (ayrı takip edilir):**\n- Son **90 gün** ödeme hareketi olmayan firmalar.\n- Churn talebi olup standart yöntemle ikna edilemeyenler (OYD dahil).\n- Churn olmuş firmalar: sözleşme pasife geçtikten sonra **60 gün** geri kazanım takibi.\n**Amaç:** ödeme sorununun nedenini bulup süreci sürdürmek ya da düzgün sonlandırmak; churn talebinde müşteriyi tutmak; geri kazanımda pasif sözleşmeyi aynı koşullarla geri açmak.\n**İnisiyatif ve onay:** enflasyon artışının geri alınması, panele kısıtlı süre ekleme, açık ödemelerin yapılandırılması → **Komisyon 1**; sözleşme revizesi ve borç silme → **Komisyon 2**; ödeme planı revizesi tutara göre K1 ya da K2. K2, K1 üyelerine üst yönetimin eklenmesiyle oluşur (isimler dosyada).\n**Dikkat:** dosya 2024 tarihli bir süreç taslağıdır (içinde 'gözden geçirilmeli' notları var); bugünkü uygulamayı ve komisyon üyelerini teyit ettir.", "jobs": [], "kit": {}, "files": [{"label": "RED_Flag_Akisi_BS.docx (süreç tanımı)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Ekip Süreç Dosyaları\\RED_Flag_Akisi_BS (1).docx"}], "tags": ["red flag", "churn", "tahsilat", "komisyon", "geri kazanım"], "source": "Nesibe İşler/Ekip Süreç Dosyaları/RED_Flag_Akisi_BS (1).docx (08.2024)", "pin": false, "links": []}, {"id": "t-sat-revid", "cat": "Satış ekipleri & paneller", "order": 40, "kind": "tanim", "title": "REVİD (B2B lead): nedir, nereden gelir, nasıl sayılır", "tldr": "REVİD, düğün.com'da listelenmek isteyen ya da paketini değiştirmek isteyen firmalardan gelen B2B başvurudur; SAD'ın ve saha ekiplerinin randevu kaynağıdır.", "body": "**Nedir (Nes 19.10.2026):** REVİD = **B2B lead**: yeni satış, upsell, yenileme, referans vb. için firmanın bize ulaşması.\n**Nereden gelir:**\n- **düğün.com formları** (CRM, B2B panel, iş ortağım sitesi) → Qlik General › **Contact Forms**.\n- **Meta reklam formları** → ayrı kanal; satışa yalnız bir Google Sheet ile ulaşır, CRM id'si yoktur (telefonla eşleştirilir). SAD bunları Sonitel'de **\"Meta\"** liste kaynağından arar.\n**Satış nasıl REVİD'e yazılır (Nes 04.11.2026):** form anında zaten ödeyen ya da ürünü formdan önceki 90 gün içinde bitmiş müşteri REVİD satışı sayılmaz (o satış yenileme / upsell / winback'tir). Formdan çok önce (14+ gün) yapılmış bir toplantı varsa satış temsilcinin bağlantısıdır; not düşülür. Ödeme durumu firmanın tüm ürün geçmişinden okunur.\n**Neden önemli:** saha satıştaki en büyük darboğaz az REVİD (az yeni randevu). REVİD kalite raporu henüz otomatik değil; kurulması açık bir ihtiyaç.\n**Eski arşiv:** `Nesibe İşler\\REVİD` klasörleri (2022–2024).", "jobs": [{"title": "Meta AI reklamı lead analizi (ilk sürüm)", "date": "19.10.2026", "why": "Reklam ekibi Meta'da yapay zekâ ile üretilmiş yeni bir B2B reklamı (9990-ai) başlattı; eski reklamlar kadar lead getirip getirmediğini ve bu lead'lerin aranıp satışa dönüp dönmediğini görmek için yapıldı.", "files": [{"label": "Meta_AI_Reklam_Analizi CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\CLAUDE.md"}, {"label": "Meta_AI_Reklam_Lead_Analizi_Mekan_19.10.2026.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\Meta_AI_Reklam_Lead_Analizi_Mekan_19.10.2026.xlsx"}]}, {"title": "Meta AI reklamı analizi güncellemesi ve reklam ekibine paket", "date": "04.11.2026", "why": "Kreatif hakkında karar verebilmek için daha uzun dönemle tekrarlandı ve REVİD sayma kuralları netleştirildi; analizi reklam ekibinin kendisi tekrarlayabilsin diye yöntem dokümanı ve script paketi hazırlandı.", "files": [{"label": "Meta_AI_Reklam_Lead_Analizi_Yontem_ve_Sonuclar.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\Meta_AI_Reklam_Lead_Analizi_Yontem_ve_Sonuclar.md"}, {"label": "Meta_AI_Reklam_Ozet_04.11.2026.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\Meta_AI_Reklam_Ozet_04.11.2026.xlsx"}, {"label": "Meta_AI_Reklam_Analizi_Paketi_04.11.2026.zip (scriptler)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\Meta_AI_Reklam_Analizi_Paketi_04.11.2026.zip"}]}], "kit": {"prompt": "Ben düğün.com'da B2B lead'lerle (REVİD) çalışacağım. Önce 'Meta_AI_Reklam_Analizi CLAUDE.md' dosyasını, sonra 'Meta_AI_Reklam_Lead_Analizi_Yontem_ve_Sonuclar.md' yöntem dokümanını oku. REVİD'in iki kanalını (düğün.com formları = Qlik General › Contact Forms; Meta formları = ayrı Google Sheet) ve bir satışın ne zaman REVİD satışı sayıldığını bana kısa anlat. Benden genelde bir kampanya ya da reklamın kaç lead getirdiği, bu lead'lerin aranıp aranmadığı ve satışa dönüp dönmediği sorulacak. Meta formlarında CRM id yok; eşleştirmeyi telefonla yap, isim eşleşmelerini doğrulanmamış diye ayrı göster.", "files": [{"label": "Meta_AI_Reklam_Analizi CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\CLAUDE.md"}, {"label": "Meta_AI_Reklam_Lead_Analizi_Yontem_ve_Sonuclar.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\Meta_AI_Reklam_Lead_Analizi_Yontem_ve_Sonuclar.md"}]}, "files": [{"label": "Meta_AI_Reklam_Analizi CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\CLAUDE.md"}, {"label": "Meta B2B form sheet'i", "url": "https://docs.google.com/spreadsheets/d/1YH1vqLjPkD2PIX4-4lMYDeWTtY1NtX4UGkL7Mqw2_PQ"}, {"label": "Meta_AI_Reklam_Ozet_04.11.2026.xlsx (son karar dosyası)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\Meta_AI_Reklam_Ozet_04.11.2026.xlsx"}], "tags": ["REVİD", "B2B lead", "Meta", "contact forms", "SAD"], "source": "8 Analyses/Meta_AI_Reklam_Analizi/CLAUDE.md (19.10 ve 04.11.2026)", "pin": false, "links": []}, {"id": "t-sat-sad-arama-listesi", "cat": "Satış ekipleri & paneller", "order": 50, "kind": "bilgi", "title": "SAD günlük arama listesi, potansiyel skor ve Ekip Panosu", "tldr": "SAD'ın her gün kimi arayacağını belirleyen müşteri bazlı liste ve onu sıralayan potansiyel skor; spec BI'a verildi, ekip lideri panosunun tasarımı hazır, veri beslemeleri bekliyor.", "body": "**Nedir:** SAD (randevu ekibi) için iki parçalı bir tasarım. Nes yazdı, BI kuracak (Qlik / D-One).\n- **Günlük arama listesi:** her temsilcinin o gün aradığı **müşteri** listesi (provider değil; telefon müşteriye açılır).\n- **Ekip Panosu** (\"Ekip Performans & Hedef Takip\"): ekip liderinin görüşme → randevu → gerçekleşen → sözleşme hunisini ve hedefe göre başarıyı izlediği sayfa.\n**Listeye kim girer:** hiç ödeyen sayfası olmayan, son ürünü uzun zaman önce bitmiş (daha yenisi yenileme ekibinde), en az bir mekan sayfası olan ve MoS / SAS şehirlerinde bulunan müşteriler. Blacklist kimseyi çıkarmaz, uyarı olarak gösterilir.\n**Sıralama (potansiyel skor):** firmanın Google'daki görünürlüğünü, aynı şehir ve kategoride **ödeyen** firmaların tipik görünürlüğüyle kıyaslar; trend, etkileşim, geri kazanım ve REVİD ile güçlendirilir. Tıklama değil **gösterim** kullanılır, çünkü ödeyen sayfalarda reklam organik tıklamayı çalar. Skor bir sıralama sayısıdır, olasılık değildir.\n**Dağıtım:** müşterinin şehrine göre `Cities_Venue-Sales-Team` sheet'inden; temsilci başına günde yaklaşık 100 müşteri. Kota değişikliği sheet'ten yapılır, BI gerekmez.\n**Ekip Panosu kuralları:** ekip hedefi günde 15 randevu (temsilci başı 3), görüşme = 45 sn üstü konuşma; ekranda 'Kota' değil 'Hedef' yazar; sıralama notlarında 'rakip', 'prim' ve isim geçmez.\n**Durum:** arama sonucunu kaydetme (write-back), Sonitel ve Ekmob verileri Qlik'te yok; hatırlatmalar ve pano bunlar gelmeden canlıya çıkamaz (BI).\n**Dikkat:** iki ayrı skor var: bu klasördeki *potansiyel skor* (Google talebi) ile Qlik General'daki *Potential Sale* tablosunun 'Score'u (son aktivite işaretleri) aynı şey değildir. Örnek panel (`SAD_Ornek_Panel.html`) 05.11.2026'dan beri kullanılmıyor, revize edilmez.", "jobs": [{"title": "SAD arama listesi spec'i ve potansiyel skor", "date": "08.2026", "why": "SAD'ın elinde bir arama listesi ve sıralama yoktu; saha takvimini kaliteli randevularla doldurmak için kimin, hangi sırayla aranacağını tanımlayıp BI'a kurulacak bir spec olarak verildi.", "files": [{"label": "SAD PROJECT.md (BI'a verilen ana spec)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\PROJECT.md"}, {"label": "SAD_CALL_SCORE_SPEC.md (arama skoru)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\SAD_CALL_SCORE_SPEC.md"}, {"label": "POTENTIAL_SCORE_SPEC.md (potansiyel skor)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\POTENTIAL_SCORE_SPEC.md"}, {"label": "POTENTIAL_SALE_TABLE_SCORE_SPEC.md (Qlik 'Potential Sale' skoru, farklı skor)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\POTENTIAL_SALE_TABLE_SCORE_SPEC.md"}, {"label": "SAD_Daily_Call_List_Table_Descriptions.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\SAD_Daily_Call_List_Table_Descriptions.xlsx"}]}, {"title": "Örnek panel (gerçek veriyle taslak, arşiv)", "date": "08.2026", "why": "Spec'i BI ile somut bir sayfa üzerinden konuşabilmek için kuruldu; 05.11.2026'da test sayfası olarak emekli edildi, yalnız referans.", "files": [{"label": "SAD örnek panel (arşiv, giriş gerekir)", "url": "https://nesibekeles.github.io/sad-arama-listesi/"}, {"label": "SAD panel kullanıcı sheet'i", "url": "https://docs.google.com/spreadsheets/d/1WVhYftS1m76-9M0imRDueOh44AznkpzVX4ayolaQoa0"}]}, {"title": "Ekip Panosu spec 1.2 ve D-One referans sayfası", "date": "30.09.2026", "why": "Ekip liderinin ekibi hedefe göre izleyebilmesi için panonun ekranı, metrikleri ve hedef hesabı kesinleştirildi; BI'ın D-One'da kuracağı sayfanın kurallı örneği hazırlandı.", "files": [{"label": "Satış Destek, Ekip Panosu 1.2.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\Satış Destek, Ekip Panosu 1.2.md"}, {"label": "EKIP_PANOSU_RULES.md (kurallar)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\EKIP_PANOSU_RULES.md"}, {"label": "Ekip Panosu_D-One_30.09.2026.html (örnek, temsili veri)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\Ekip Panosu_D-One_30.09.2026.html"}]}], "kit": {"prompt": "Ben düğün.com'da SAD (satış destek / randevu) ekibinin arama listesi ve ekip panosu işini devralıyorum. Önce 'SAD PROJECT.md' dosyasını oku (§1–3 bağlam, §11 açık sorular), sonra 'SAD_CALL_SCORE_SPEC.md' ve 'POTENTIAL_SCORE_SPEC.md' skor dokümanlarını, en son 'EKIP_PANOSU_RULES.md' dosyasını oku. Listeye kimin girdiğini, nasıl sıralandığını, nasıl dağıtıldığını ve BI'dan hâlâ ne beklendiğini (write-back, Sonitel, Ekmob) bana kısa özetle. Bu klasördeki potansiyel skor ile Qlik'teki 'Potential Sale' skorunu karıştırma. Örnek paneli (SAD_Ornek_Panel.html) revize etme, kullanılmıyor.", "files": [{"label": "SAD PROJECT.md (BI'a verilen ana spec)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\PROJECT.md"}, {"label": "SAD_CALL_SCORE_SPEC.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\SAD_CALL_SCORE_SPEC.md"}, {"label": "POTENTIAL_SCORE_SPEC.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\POTENTIAL_SCORE_SPEC.md"}, {"label": "EKIP_PANOSU_RULES.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\EKIP_PANOSU_RULES.md"}]}, "files": [{"label": "SAD CLAUDE.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\4 Sales Dashboards\\Sales Support - Call List Dashboard\\CLAUDE.md"}, {"label": "SAD PROJECT.md (BI'a verilen ana spec)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\ kleri sheet'i (SAS, TES, SAD)", "tldr": "Satış ekiplerinin günlük ve aylık faaliyet sayıları (ziyaret, görüşme, süre) ve yeni satış / yenileme cirolarının tutulduğu sheet.", "body": "**Nedir:** satış faaliyetinin günlük ve aylık özet sheet'i (veri Mart 2026'dan).\n**İçinde ne var:**\n- `GÜNLÜK_YENİ` — günlük satırlar · `AYLIK_YENİ` — ay toplamları · `Metrik Birimleri` — her metriğin birimi (adet / dakika / TL)\n- **SAS:** ziyaret adedi (toplam / yeni / yenileme), ziyaret süresi, yeni ve yenileme cirosu\n- **TES:** görüşme adedi ve süresi, ciro\n- **SAD:** görüşme metrikleri\n**Neden, ne zaman kullanılır:** ekiplerin faaliyet hacmini ve ciroya etkisini aydan aya kıyaslamak için.\n**Dikkat:** Mayıs 2026 sonrası aylık satırlar boş görünüyordu; kullanmadan önce güncel tutulup tutulmadığını kontrol et.", "jobs": [], "kit": {}, "files": [{"label": "Satış Metrikleri", "url": "https://docs.google.com/spreadsheets/d/1R-rpm5-3yBGGlFzzMIJZbc72gFOZ_-TBahqrH9t5vqs/edit"}], "tags": ["satış", "metrik", "SAS", "TES", "SAD"], "source": "Google Drive > Satış Metrikleri", "pin": false, "links": []}, {"id": "t-sat-py-call-list", "cat": "Satış ekipleri & paneller", "order": 80, "kind": "bilgi", "title": "PY Call List (haftalık PY arama listesi)", "tldr": "Her hafta açılan sheet: her PY'nin sekmesinde firmalarının hafta başındaki performans uyarıları (flag) ve PY'nin aldığı aksiyon.", "body": "**Nedir:** PY'lerin (portföy yöneticileri) haftalık arama listesi. Temmuz–Ekim 2026 arasında her hafta yeni bir `PY Call List <tarih>` dosyası açıldı.\n**İçinde ne var:**\n- **PY başına bir sekme:** `Firmanın Hafta Başındaki Flag Durumu`, `Provider`, `Customer ID`, `Link`; kampanya / dönüş oranı / dönüş süresi flag'i var mı; `Son Görülme` (panel girişi); PY'nin aksiyonu.\n- `PY Feedbacks` — sahadan gelen geri bildirimler · `Weekly Report` — PY başına aksiyon adedi ve oranı · `Task-Sorumlu Dağılımı`.\n**Neden kullanılır:** düşük performanslı firmayı (kampanyası yok, geç / az dönüyor, panele girmiyor
