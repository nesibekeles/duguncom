 sayısıdır, olasılık değil. Tipik aralık 0,05–10, medyan ≈ 0,6.\n- SAD skoru v3.1 bunun üstüne REVİD (müşterinin tüm sayfalarına), son panel girişi (müşteri bazında) ve marka trafiği bileşenini ekler; trafik bileşeni demand_ratio ile çift sayılmasın diye sönümlenir.", "tags": ["skor", "win-back", "SAD", "GSC"], "source": "Desktop/Nesibe İşler/Claude/4 Sales Dashboards/Sales Support - Call List Dashboard/POTENTIAL_SCORE_SPEC.md · SAD_CALL_SCORE_SPEC.md", "links": [], "updated": "2026-08-17"}, {"id": "lb-16", "cat": "Raporlar & paneller", "kind": "nasil", "pin": false, "title": "Welcome Paketi bölge sayfaları (one-pager) yeniden üretme", "tldr": "Her bölge için A4 yatay PDF fiyat sayfası `build.py` ile fiyat sheet'inden üretilir; satışa yalnız 'Ek Kategori İndirimli' sürüm gider.", "body": "- **Bölgeler:** İstanbul, Ankara, İzmir, Bursa, Adana/Mersin (tek sayfa), Antalya, Uydu İller.\n- `7 Design/Welcome_Paketi/build.py` fiyat sheet'ini okur, HTML + PDF yazar (Chrome headless; Türkçe karakterli yol sorun çıkarır → ASCII adla scratchpad'e kopyala). PDF adlarında '(Ek Kategori İndirimli)' eki yok (Nes 07.09.2026 kaldırttı).\n- 'Ek Kategori İndirimsiz' sürüm 08.09.2026'dan beri üretilmiyor, yalnız arşiv.\n- **Bilinen eksik:** 08.09.2026 PDF'leri hâlâ 'Kredi Kartı (1–6 Taksit)' yazıyor; 12 taksit eklendi → Nes isterse yeniden derle.\n- Uydu ilçe eklemeleri `EXTRA_DISTRICTS`'te (Çeşme → İzmir, 30.09.2026); asıl liste güncel rate card'ın 'Uydu(Taşra) İlçeler' sayfası.\n- 08.09.2026'da değişen 8 fiyat hücresi kırmızı işaretli Excel'de (CRM girişlerini düzeltmek için).", "tags": ["Welcome", "tasarım", "PDF"], "source": "Desktop/Nesibe İşler/Claude/7 Design/Welcome_Paketi/PROJECT.md", "links": [], "updated": "2026-09-30"}, {"id": "lb-17", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Paket özellik sayfaları (Winner 2X/4X/6X + Welcome, TR ve EN)", "tldr": "Firmaya verilen 'pakette neler var' tek sayfaları 24.09.2026'da iş ortağım logosu ve 2026 özellikleriyle yenilendi.", "body": "- **TR:** `7 Design/Paketler_TR/build.py` → `output/<tarih>/Düğün.com Winner 2x|4x|6x_<tarih>.pdf` + `Düğün.com Welcome Paketi_<tarih>.pdf`. Logo: **düğün.com iş ortağım** (firmaya giden materyal).\n- Üç bölüm: Daha Çok Çift Düğün.com'da · Performans Takibi ve Analizler · Ayrıcalıklı Düğün.com Profili. 2026'da eklenenler: Etkileşim Takip Ekranı, Hedefli Reklamlar, Satışa Dönüşen Eğitimler, Instagram ve Website Linki, WhatsApp İletişim Butonu; Wedding Planner – Çiftlerle Birebir Eşleşme ve Size Özel Performans Desteği yeniden yazıldı. Çıkarılanlar: Önerilen Firmalar, Instagram Story Paylaşımı, 'telefonda sınırsız destek'.\n- **Paket farkları:** Rakip Analizi 3 / 5 / 10 rakip; Müşteri Takip Sistemi yalnız 4X ve 6X; 'Listelemede Üst Sıralarda Çıkma' yalnız Winner'da. **Welcome = 2X sayfası, üst sıralarda çıkma ve katsayı cümleleri olmadan** (Nes 24.09.2026).\n- **EN:** `Paketler_EN/Düğün.com Winner Packages_EN_10.09.2026_v2.pdf` (terimler: Priority Placement in Listings, Multi Leads, Vendors, Unlimited, Showcase).", "tags": ["paket", "Winner", "Welcome", "tasarım"], "source": "Desktop/Nesibe İşler/Claude/7 Design/Paketler_TR/PROJECT.md · Paketler_EN/CLAUDE.md", "links": [], "updated": "2026-09-24"}, {"id": "lb-18", "cat": "Nasıl yapılır", "kind": "nasil", "pin": false, "title": "Prime 'Çiftlerin Tercihi' plaketi ve kutu mektubu", "tldr": "Her yıl prime firmalara giden plaket listesi tekilleştirilir (aynı müşteri + aynı fiziksel yer = tek plaket); mektup Word'e çevrildi.", "body": "- **Plaket listesi 2026:** kaynak `2026 Kutu/Prime Firmalar_Control_2.09.2026.xlsx`; çıktı `Prime Firmalar_Plaket Kontrol_07.09.2026.xlsx` — 'Plaket Gitsin mi?' Evet/Hayır + her Hayır için 'Kontrol Notu'.\n- **Kural:** aynı müşteri + aynı fiziksel yer (aynı ad, aynı adreste aynı marka ya da aynı adreste farklı ad) = tek plaket. KONTROL etiketli satırlar yargı gerektirir.\n- Logo alternatifleri (25.09.2026): defne çelengi yas çağrıştırdığı için 4 yeni amblem önerildi (`Logo_Alternatifleri/`).\n- Mektup (02.10.2026): tasarımcının PDF'i yalnız çizgi (outline) olduğu için Word'e yeniden yazıldı — `Mektup/Prime Mektup_02.10.2026.docx`, Century Gothic 12 pt; 2025 Emek Kırbıyık mektubu da Word'de.", "tags": ["Prime", "plaket", "tasarım", "yıllık"], "source": "Desktop/Nesibe İşler/Claude/7 Design/Prime_Plaket_2026/CLAUDE.md · Mektup/PROJECT.md", "links": [], "updated": "2026-10-02"}, {"id": "lb-19", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "21.08.2026 — Yeni AR-GE sözleşme formları GY / GA basıldı", "tldr": "Eski GT (yıllık) ve GTS (aylık) formları yerini GY ve GA'ya bıraktı; arka yüz 07.08.2026 Teknokent revizyonuna göre.", "body": "- 24.07.2026: eski GT / GTS PDF'leri.\n- 07.08.2026: İstanbul Üniversitesi Teknokent AR-GE ve Üyelik Sözleşmesi metin revizyonu (.docx).\n- 21.08.2026: yeni GY / GA basıldı, ön yüzde 6 nokta teyide gönderildi (listeleme KDV sütunu, İ.G.Y. alanı, IBAN'lar, Sözleşme No etiketi, e-fatura ONAY kutusu, GY 600 TL).", "tags": ["sözleşme", "GA", "GY"], "source": "Desktop/Nesibe İşler/Claude/6 Contracts/Agreements/AR-GE Sözleşme Revizyon Kontrolü 21.08.2026.html", "links": [], "updated": "2026-08-21"}, {"id": "lb-20", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "21.09.2026 — Yeni KDV kuralı ile sözleşme doldurma (22/09 düzeltmesi)", "tldr": "Lisans bedeli KDV'siz (%85), pazarlama bedeli %20 KDV'li (%15) bölmesi başladı; 22.09.2026'dan beri listeleme bedeli önce düşülüyor.", "body": "- 21.09.2026: yeni KDV kuralı ve interaktif Sözleşme Doldurma Kılavuzu (GitHub, herkese açık).\n- 22.09.2026: listeleme KDV hariç tutarı (GA 250 / GY 3.000) satıştan önce düşülmeye başlandı.\n- 06.10.2026: Ekim 2026 Winner kartı (+%10) ile yeniden derlendi.\n- 04.11.2026: D-One kopyası (Güncel Kampanyalar). 10.11.2026: kılavuz yalnız D-One'da.", "tags": ["KDV", "sözleşme"], "source": "Desktop/Nesibe İşler/Claude/6 Contracts/Agreements/CLAUDE.md", "links": [{"label": "Sözleşme Kılavuzu (D-One)", "url": "https://d-one.dugun.work/satis/kampanyalar/sozlesme-kilavuzu"}], "updated": "2026-09-21"}, {"id": "lb-23", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "08/2026–10/2026 — Satış Küpü sunumu ve D-One'a devir", "tldr": "Saha satış paneli 20.08.2026'da başladı, canlı harita 21.09.2026'da yayına girdi, 07.10.2026'da BI'a (D-One /satis-kupu/) devredildi.", "body": "- 20.08.2026: Sale Dashboard başlangıcı. 22/08: revizyon (Rev 9). 28/08: BI'ın simülatörü (Barış İşık) eklendi.\n- 31.08.2026: 'Yeni Satış Metodumuz' eğitimi deşifre edilip sunuma eşlendi.\n- 21.09.2026: Canlı etkileşim haritası canlıda.\n- 07.10.2026: D-One devir paketi; 12.10.2026'dan beri haftalık veri yenileme BI'da.", "tags": ["sunum", "D-One", "SAS", "MoS"], "source": "Desktop/Nesibe İşler/Claude/4 Sales Dashboards/Sale_Dashboard/docs/PROJECT.md", "links": [{"label": "Satış Küpü (D-One)", "url": "https://d-one.dugun.work/satis-kupu/"}], "updated": "2026-10-07"}, {"id": "lb-24", "cat": "Linkler", "kind": "bilgi", "pin": false, "title": "SAD örnek panel ve giriş sheet'i (arşiv)", "tldr": "BI için hazırlanan SAD arama listesi taslağının GitHub sayfası ve giriş kontrol sheet'i; 05.11.2026'dan beri kullanılmıyor.", "body": "- Taslak panel GitHub Pages'te, giriş Google Sheet'teki mail + şifre ile Apps Script üzerinden; girişler 'Girişler' sekmesine loglanır.\n- **05.11.2026'dan beri test sayfası olarak emekli** — revize edilmez, raporlanmaz. Yalnız spec'i anlamak için referans.", "tags": ["SAD", "link"], "source": "Desktop/Nesibe İşler/Claude/4 Sales Dashboards/Sales Support - Call List Dashboard/PROJECT.md §13", "links": [{"label": "SAD örnek panel (arşiv)", "url": "https://nesibekeles.github.io/sad-arama-listesi/"}, {"label": "SAD panel kullanıcı sheet'i", "url": "https://docs.google.com/spreadsheets/d/1WVhYftS1m76-9M0imRDueOh44AznkpzVX4ayolaQoa0"}], "updated": "2026-11-05"}, {"id": "lc-1", "cat": "Aylık rutin işler", "kind": "nasil", "pin": true, "title": "Performans ligi aylık ödül listesi (Ödül Kazananlar)", "tldr": "Her ayın 1'inde, biten ayın performans ligi kazananları Qlik'ten çekilir; mekan kullanıcılarına 500 TL Hepsiburada çeki, mekan dışı ilk 30'a rozet listesi PY ekibine gider.", "body": "**Ne zaman:** her ayın **1'i** (veya hemen sonrası). Ay X'in yarışması = **X+1 ayının 1'indeki feed** (Eylül 2026 → 01.10.2026 feed'i). 2'sinden itibaren skorlar yeni aya göre sıfırlandığı için 2'sinin verisi kullanılmaz.\n**Kaynak:** Qlik **Provider Contest Dashboard** (`e7196a51-312d-4032-b0bd-070e61e965d8`), tablo `provider_feed_date`; iletişim bilgisi General › `provider_contacts`; PY = General `customers.employee_name`.\n**Adımlar:**\n- `py -3.12 tools/pull.py 2026-12-01` → `data/2026-12-01/*.csv`\n- `py -3.12 tools/build.py 2026-12-01` → `<Ay> <YYYY> Ödül Kazananlar_<GG.AA.YYYY>.xlsx` + `user_rank_<YYYYMM>.xlsx`\n- Dosyayı kontrol et (Control sütunu), PY ekibine ilet.\n**Kurallar:**\n- Kazanan = Qlik'in kendi `gift = 1` bayrağı: **mekan ilk 100** + **mekan dışı ilk 30** (eşitlikler 100'ü aşabilir; 01.10.2026'da 111 provider).\n- **Kullanıcı bazında tek satır:** bir kullanıcı birden fazla kazanan provider'da ise en iyi sıra kalır.\n- Mekan kazananı her kullanıcıya **500 TL Hepsiburada çeki**; mekan dışı sadece **rozet** (çek sütunu yok).\n- Çek toplamı = `Listeden Çıkar.` dışındaki **tüm** satırlar (`Kontrol` satırı da kazanandır — 04.11.2026'da 155 satır → 154 çek düzeltmesi).\n- Kalıcı istisnalar `rules/cek_istemeyenler.csv`: 111353 / 22074 (Uçar Garden, Ebru Uçar) → çek 170920 Kübra Akardere'ye · 169992 çıkar · 173108 (Svadba Tuzla) → 168676 Resul Demir · 170978 çıkar.\n- E-posta yoksa cep numarası yazılır, Control = `Kontrol – …`.\n**Çıktı sayfaları:** Gift Users · Badge Providers (İlk 30-NonVenu) · Metric Details · Çek İstemeyenler · Sayfa8.\n**Sonuçlar:** Eylül 2026: 137 satır, 136 × 500 = **68.000 TL**, rozet 40 satır. Ekim 2026: 155 satır, 154 × 500 = **77.000 TL**, rozet 32 satır.\n**Tuzaklar:** varsayılan `python` 3.14 (pandas yok) → `py -3.12` kullan; tarih seçimi **sayısal** `SelectValues` olmalı; 49 sütunluk küp 150 satırlık sayfalarla çekilir.", "tags": ["performans ligi", "ödül", "provider contest", "hepsiburada", "aylık"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Provider_Contest_Winners\\PROJECT.md", "links": [{"label": "Ağustos 2026 Ödül Kazananlar (format referansı)", "url": "https://docs.google.com/spreadsheets/d/11SdbRgzm1dnBXdafUtKHc7OYN_auhuOo"}, {"label": "Yarışma Metrikler-IT › Ağustos 2026 Revize", "url": "https://docs.google.com/spreadsheets/d/1yOqytvK1T5_WEOm-tBwHPz2bae7-8cre4wQPJIVOu5Q/edit?gid=400726811"}, {"label": "Qlik › Provider Contest Dashboard", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com/sense/app/e7196a51-312d-4032-b0bd-070e61e965d8"}, {"label": "Performans Ligi Guide", "url": "https://docs.google.com/document/d/1ONc5J-kP7aK0L7VN41CJnw8M2lXgtLh-NNliqz3CpAM/edit"}, {"label": "Referans Kampanyası Kazananlar💰 (Performans Ligi Ödüller sekmesi)", "url": "https://docs.google.com/spreadsheets/d/143Uqs0FypmrPwCbyUPRBW_4ZaW5BjPDmbbjBhUBhXnU/edit"}, {"label": "Yarışma ve Ödüller (klasör)", "url": "https://drive.google.com/drive/folders/1OheIIYuj-b6KLsD6LCIVxTMw9Qgyi6FN"}, {"label": "Performans Ligi (klasör, Ödül Kazananlar)", "url": "https://drive.google.com/drive/folders/1fuiYepZCtUdsRozBnU2XfQlPLRkUiy4n"}], "updated": "2026-11-04"}, {"id": "lc-2", "cat": "Aylık rutin işler", "kind": "nasil", "pin": false, "title": "Otomatik yenileme bitişi – yenileme firmalarının manuel takip akışı", "tldr": "2025'te otomatik yenileme kaldırıldı; her ay gelecek ayın yenileme firmaları listelenir, finans sözleşmeyi pasife alır, PY tahmin verir, satış randevu alır, backoffice tarihleri ayın ortasına uzatır.", "body": "**Arka plan (2025):** hiçbir firma artık otomatik yenilenmez; yıl sonunda satış ekibi yenileme görüşmesi yapar ve **yeni sözleşme** imzalanır. Aylık ödeyen firma da yıl sonunda otomatik yenilenmez. Yıl içinde iptal = cayma bedeli. Ödeme planı sabit, yıl içinde enflasyon artışı yok. Yeni satışta sadece yıllık peşin.\n**Aylık takvim:**\n- **Ayın son haftası:** gelecek ayın yenileme firmaları listesi hazırlanır (marketing / bizim ekip) ve ekiplere iletilir.\n- **Finans (tahsilat@dugun.com):** listedeki sözleşmeleri **pasife alır**. Son tarih = `product_end_date − 3 gün` (hafta sonuna denk gelirse önceki iş günü). Sebep: otomatik yenileme job'u yayın bitişinden **48 saat önce** çalışır; geç kalınırsa hatalı ürün + ödeme planı oluşur. Borçlu olsun olmasın pasife alınır (borç tahsili için iş: ISD-3041). Churn bilgisi: İptal Türü / Nedeni = *Özel Durum İnisiyatifi*, Açıklama = *Yenileme süreç değişikliği sebebi ile*.\n- **PY ekibi (performans.yonetimi@dugun.com), ayın 3. haftası:** gelecek ayın firmaları için yeniler / yenilemez tahmini (söylem, davranış, skor, flag'ler).\n- **3. hafta:** tahminler tamamlanınca liste satış ekibine gider; randevu ve takip = satış destek.\n- **Backoffice:** ayın ilk iki haftasında bitecek firmaların tarihleri ayın **15, 16 veya 17'sine** uzatılır (hafta sonu olmayacak şekilde).\n**Not:** \"Yenilemez\" etiketi satışta moral bozduğu için risk dili (Düşük Risk / Yüksek Risk) önerildi (Haziran 2026). Bugünkü liste üretimi `1 Renewals/Monthly Renewal Lists`'te.", "tags": ["yenileme", "otomatik yenileme", "pasife alma", "PY tahmin", "aylık"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Otomatik Yenileme Sonlanma Süreci\\Otomatik yenileme bitişi – manuel takip akışı.docx", "links": [{"label": "Pasife alma takip sheet'i", "url": "https://docs.google.com/spreadsheets/d/1WePvZ-dsgj9VhM0HgMmMSt139vlOa9HA4035h1dYvuQ/edit?usp=sharing"}, {"label": "PY tahmin listeleri (Drive klasörü)", "url": "https://drive.google.com/drive/folders/1ii7j0tT5RFlzhRXNEtQd0zgSKiPfRv4o?usp=drive_link"}], "updated": "2025-01-01"}, {"id": "lc-3", "cat": "Aylık rutin işler", "kind": "nasil", "pin": false, "title": "NPS anketi: aylık kitle ve Sonitel arama listesi", "tldr": "Temmuz 2025 – Mart 2026 arası her ay NPS kitlesi seçildi, telefonlar Sonitel'e CallPoolFile olarak yüklendi, sonuçlar SurveyReport dosyalarıyla raporlandı.", "body": "**Ne:** paid firmaların yetkililerine telefonla NPS anketi (NPS puanı, PY puanı, genel memnuniyet).\n**Sıklık:** aylık, ay sonuna doğru (CallPoolFile tarihleri: 23.07.2025, 29.08.2025, 29.09.2025, 27.10.2025, 24.11.2025, 29.12.2025, 29.01.2026, 27.02.2026, son **30.03.2026**). Sonraki aylar için dosya yok: devam edip etmediğini Emek Bey / PY ile netleştir.\n**Kitle (`nps aylık kitle_yeni_*.xlsx`):**\n- Gruplar: **Venue - Prime**, **Venue - General**, **B5 - General**.\n- Flag (sağlık rengi) kotası, ör. Aralık 2025: General → Yeşil ≤ 90, Sarı ≤ 70, Turuncu + Kırmızı ≤ 40; Prime → Yeşil ≤ 100, Sarı ≤ 70.\n- Bir kullanıcı aynı dönemde iki kez aranmaz (NPS Month / 2nd / 3rd sütunları geçmişi tutar).\n- Telefon: Qlik General `provider_contacts` (primary, valid).\n**Çıktılar:** `CallPoolFile_<tarih>.csv` (tek sütun PhoneNr, Sonitel'e yüklenir) → `SurveyReport_<ay>.xlsx` (Sonitel sonuç) → `<Ay> NPS Rapor` (flag dağılımı, katılım, PY yorumları).\n**Klasör:** `Nesibe İşler\\NPS`.\n**Fikir (pozisyon aktarım dosyası):** gönderim–toplama–raporlama manuel; Claude ile otomatikleştirilebilir.", "tags": ["NPS", "anket", "Sonitel", "aylık"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\NPS", "links": [], "updated": "2026-03-30"}, {"id": "lc-4", "cat": "Aylık rutin işler", "kind": "bilgi", "pin": false, "title": "Aylık kampanya ekleri (satış ekiplerine giden dosyalar)", "tldr": "Her ay ekiplere kampanya mailiyle birlikte ekip bazında ekler gider: MoS/SAS'a şehir Welcome Paketi PDF'leri, SAS'a Pro Start 3 yenileme firmaları listesi, TES'e liste fiyatları & kampanyalar Excel'i.", "body": "**Klasör:** `Claude\\_Resources\\Kampanya_Ekleri_Yukleme\\<YYYY-MM> <Ekip>` ve ay klasörleri (`9 Monthly Campaigns\\Kasım 2026`).\n**Ekip bazında örnekler:**\n- **MoS (Eylül 2026):** Welcome Paketi – İstanbul / Ankara / İzmir / Bursa PDF'leri.\n- **SAS (Eylül–Kasım 2026):** Welcome Paketi – Adana-Mersin / Antalya / Uydu İller PDF'leri + **Pro Start 3 Yenileme Firmaları** listesi (09.09.2026, 06.10.2026, 30.10.2026) + Ekim'den beri **Upsell Stüdyosu Kullanım Kılavuzu** (16.10.2026).\n- **TES (Eylül 2026):** `TES_Eylül 2026 Liste Fiyatları & Kampanyalar_14.09.2026.xlsx` + Uydu İller Welcome PDF'i.\n**Nasıl:** ay sonunda (Kampanya Stüdyosu 24'ünde çalışır) yeni ayın fiyat kartı + kampanya kararları netleşince ekler güncellenir; dosya adı Türkçe ve `GG.AA.YYYY` tarihli.\n**Dikkat:** Welcome PDF'leri fiyat kartı değişince (ör. Ekim 2026 Winner +%10) yeniden üretilir; eski ayın PDF'i yeni aya taşınmışsa (Ekim SAS klasöründe Eylül PDF'leri) fiyatı kontrol et.", "tags": ["kampanya", "ekler", "Welcome Paketi", "Pro Start 3", "aylık"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\Kampanya_Ekleri_Yukleme", "links": [], "updated": "2026-10-30"}, {"id": "lc-5", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "11.11.2025 – Performans ligi canlıya çıktı", "tldr": "Mekan firmaları için oyunlaştırılmış Firma Performans Ligi 11.11.2025'te canlıya çıktı; puanlama Ağustos 2026'da revize edildi.", "body": "- **Eylül–Ekim 2025:** tasarım ve simülasyon (`Yarışma\\Çalışma Excelleri`, Provider Score Metrics, Simulation Data 01.10.2025).\n- **11.11.2025:** performans ligi canlıda (panel ana sayfa kartı, landing page, Detaylar sayfası). Renkler: Yeşil 80+ · Sarı 60–79 · Turuncu 30–59 · Kırmızı 0–29.\n- **15.11.2025:** eventler **kullanıcı bazında** sayılmaya başladı. Haftalık \"Scoreboard Events\" raporları 17.11.2025 – 16.01.2026.\n- **Aralık 2025:** özel büyük ödül (Aralık özel kazananlar, deal count / anlaşma oranı bazlı; kazanan provider 117820, 4 kullanıcı).\n- **04.05.2026:** Düğüncom özel fiyat bonusu skordan çıktı (\"Nisan 2026'da çıkarıldı\").\n- **03.09.2026:** yeni ağırlıklar (Dönüş Yöntemi 10 puan eklendi; galeri/yorum 5→2, fiyat 5→1). Eylül 2026 ilk yeni skorlu ay.\n- **01.10.2026:** aylık ödül listesi ilk kez Claude pipeline'ı ile (Eylül 2026).\n**Ödül mantığı (proje sayfası):** puanlama provider (RÇİ) bazında; ödül, kazanan sayfada yetkili ve son 1 ayda panelde işlem yapmış **tüm kullanıcılara**, kullanıcı başına en fazla 1 ödül. Ödül seçeneği olarak Biletix ve Starbucks da değerlendirildi; Hepsiburada seçildi.", "tags": ["performans ligi", "milestone", "yarışma"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Önemli Olaylar Exceli_15.11.2025.xlsx; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Yarışma", "links": [{"label": "Yarışma Metrikler-IT", "url": "https://docs.google.com/spreadsheets/d/1yOqytvK1T5_WEOm-tBwHPz2bae7-8cre4wQPJIVOu5Q/edit?gid=400726811"}], "updated": "2025-11-11"}, {"id": "lc-6", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "05/2025 – 10/2026 Liste fiyatı zamları (%25 · %15 · %10 · +%10)", "tldr": "Mekan listeleme fiyatları yılda birkaç kez zamlandı: 07.10.2025 %25, 02.02.2026 %15, 08.06.2026 %10, Ekim 2026 Winner kartı +%10.", "body": "- **Mayıs 2025 (12.05.2025):** liste fiyatı güncellemesi.\n- **07.10.2025:** listeleme fiyatları **%25** zamlandı.\n- **02.02.2026:** **%15** zam (Mart 2026'da Winner 3X eklendi).\n- **08.06.2026:** **%10** zam.\n- **Ekim 2026 (06.10.2026 kartı):** Winner kartı **+%10**.\n- Tarihli liste fiyatı tabloları: `Nesibe İşler\\İndirim Kodları\\İndirim Kodu Formüller_<tarih>.xlsx` (Liste Fiyatları sayfası, Ekim 2024'ten Ekim 2026'ya tüm dönemler yan yana).\n- Eski dönem: 2024 fiyatları `Pricing Policy\\2024 Fiyatlar` (Şubat 2024 mekan %10–16 zam).\n- Önceki model \"3 ayda 1 enflasyon zammı\" (%15, aylık ödemeli sözleşmelerde) otomatik yenilemenin bitişiyle kalktı; ödeme planları artık 12 ay sabit.\n**Güncel fiyat:** her zaman `3 Pricing\\Düğüncom_subscription_models` içindeki adındaki tarihe göre en yeni `*All Current Rate Cards_*.xlsx`.", "tags": ["fiyat", "zam", "liste fiyatı", "milestone"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Önemli Olaylar Exceli_15.11.2025.xlsx; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\İndirim Kodları", "links": [], "updated": "2026-10-06"}, {"id": "lc-7", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "06/2026 – 08/2026 İlk ay 1 TL kampanyası (yeni dönem)", "tldr": "04.06.2026'da TES'te ilk ay 1 TL tekrar başladı; Haziran–Ağustos 2026 boyunca yeni satışta ilk ay 1 TL kullanıldı, hedef listeler Haziran 2026'da kuruldu.", "body": "- **04.06.2026:** TES tarafında **ilk ay 1 TL** kampanyası yeniden başladı (Önemli Olaylar Exceli).\n- **Haziran 2026:** \"1 TL kampanyası yeni dönem\" için mekan hedef listeleri kuruldu: İstanbul masterlist (08–16/06), A–A+ segment ekleme (18/06), B–D segment ekleme (19/06), Adana master list (24–25/06), Prestij firmalar (29/06), MoS potansiyel liste kontrolü (02/07), gönderim sonrası kontrol (22–23/06). Fiyat çalışması 08.06.2026, satış simülasyonu 11.06.2026.\n- **Kullanım dönemi:** Haziran başından **Ağustos sonuna** kadar (Nes).\n- **Mekanik:** aylık ödemeli sözleşmede ilk vade 1 TL; Pro Start 12'de \"first month 1 TL\"; SAS Upsell'de ek kategori için ilk ay 1 TL. Sözleşmede \"Kampanya İndirim\" satırı sadece bu tür tekliflerde dolar.\n- **Bitiş sonrası:** Eylül 2026'dan itibaren MoS'ta Welcome Paketi (12 ay peşin, başka kampanya üst üste binmez) → ilk ay 1 TL'nin yerini aldı.\n- **WhatsApp görseli:** `WhatsApp Reklam\\Final_ilk-ay-1-tl-WhatsApp.png`.\n- **Sonuç ölçümü:** dosyalarda kampanya sonuç raporu yok; Kampanya Stüdyosu'nun açık maddesi \"geçmiş kampanya sonuçları\" hâlâ bekliyor (bundan sonra %15 holdout önerisi).", "tags": ["ilk ay 1 TL", "kampanya", "TES", "MoS", "milestone"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Loyalty & Acquisiton\\1 TL kampanyası yeni dönem; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Önemli Olaylar Exceli_15.11.2025.xlsx", "links": [{"label": "1 tl – kampanya metinleri", "url": "https://docs.google.com/document/d/19pIds2FLZPKYk6MJ521gl3Aykojry6kP35FzPQA-mFU/edit"}, {"label": "1 TL (klasör)", "url": "https://drive.google.com/drive/folders/1FMKPSN-laBBVqwIVyY2Vx_W301Hctaq3"}, {"label": "1 TL Verim Analiz_2024.xlsx", "url": "https://drive.google.com/file/d/1PNMCXEoFO-vMXWp1LeKlRnITz62XS3ec/view"}], "updated": "2026-08-31"}, {"id": "lc-8", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "04/2026 – 09/2026 Satış ekibi değişiklikleri (MoS, Welcome, TES saha)", "tldr": "Nisan 2026'da MoS kuruldu ve İstanbul SAS yenilemeye geçti; Eylül 2026'da Welcome Pro Start'ın yerini aldı ve 14.09.2026'da TES hibrit (saha + ofis) oldu.", "body": "- **06.04.2026:** İstanbul SAS **sadece yenileme**; İstanbul yeni satışı **MoS** (yeni saha satış ekibi, Nisan 2026) yapar.\n- **Mayıs–Haziran 2026:** Burdur Projesi ile 6 il pilotu; performansı düşük illerde SAS–TES geçişleri.\n- **Eylül 2026:** **Welcome Paketi** MoS'un tek ürünü oldu; Pro Start emekli. Pro Start 3 sözleşmeleri SAS tarafından Winner olarak yenilenir.\n- **14.09.2026:** **TES hibrit** (TES kampanya mailinde duyuruldu; Nes 11.09.2026'da söyledi): İstanbul **saha kolu** Big 5 firmalarını (Gelin Saçı ve Makyajı, Düğün Organizasyon, Düğün Fotoğrafçıları, Gelinlik, Müzik) yerinde ziyaret eder; **ofis kolu** diğer illeri ve küçük İstanbul mekan dışı firmaları telefonla arar. Saha kolu **aynı fiyatla Plus** satar, ayrı saha ürünü yok (Nes 16.09.2026).\n- **Ağustos 2026:** Eren Kadakal ayrıldı → tüm otomasyon / mail / Sheets alıcısı Nes'in iş adresi (devralan kendi adresine çevirmeli).\n- Sonra: MoS'un diğer şehirlere genişleyip yeni satışta SAS'ın yerini alması planlanıyor.", "tags": ["MoS", "TES saha", "Welcome", "ekip", "milestone"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\notes\\sales-team-structure.md; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\memory\\areas\\sales-dashboard.md", "links": [], "updated": "2026-09-14"}, {"id": "lc-9", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "04/2025 – 08/2026 Marka iş birlikleri ve site değişiklikleri (Önemli Olaylar)", "tldr": "Lead / trafik trendi yorumlarken bu tarihleri işaretle: TV reklamı, N Kolay, Altınyıldız, Arçelik-Beko iş birlikleri, Özel fiyat, Ekmob kesintisi.", "body": "- **10.04.2025 – 16.05.2025:** TV reklamı.\n- **12.05.2025:** Düğün Salonları \"Düğün Mekanı\" altında listelenmeye başladı.\n- **10.06.2025:** N Kolay canlıda · **11.08.2025:** N Kolay ihtiyaç kredisi · **18.09.2025:** ihtiyaç kredisi bannerları canlıda (mekan listeleme hariç).\n- **09.07.2025 – 30.09.2025:** Altınyıldız iş birliği.\n- **14.07.2025:** Arçelik banner · **25.07.2025:** Arçelik-Beko LP · **04–15.08.2025:** Arçelik TV reklamı · **27/08 – 01.09.2025:** Arçelik sayfaları kapalı (bayiler çok kod aldı) · **22/09 – 10.10.2025:** Arçelik radyo · **17.05.2026:** WP ekibi Arçelik/Beko kod gönderimini durdurdu.\n- **15–17.09.2025:** bannerlarda hata, event sayılmadı.\n- **30.09.2025:** **Düğüncom Özel Fiyat** canlıda.\n- **28.10.2025:** çoklu banner alanlarında impression oranı yönetilebilir oldu; **31.10.2025** ana sayfa N Kolay %50 / Arçelik %25 / Beko %25.\n- **11.03.2026:** Ekmob entegrasyonu bozuldu → **17.08.2026** düzeldi → **21.08.2026** eski datalar gönderildi (bu aralıkta Ekmob saha verisi eksik).\n- Orijinal liste: `Önemli Olaylar Exceli_15.11.2025.xlsx` (sonradan eklenenler 2026 satırları).", "tags": ["önemli olaylar", "iş birliği", "Arçelik", "N Kolay", "Ekmob", "milestone"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Önemli Olaylar Exceli_15.11.2025.xlsx", "links": [], "updated": "2026-08-21"}, {"id": "lc-10", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "07/2023 – 07/2026 Vergi değişiklikleri (KDV ve tevkifat)", "tldr": "KDV 10.07.2023'te %18→%20 oldu; tevkifat sınırı 2023'te 2.000 TL, 01.03.2024'te 6.900 TL, Temmuz 2026'da 12.000 TL oldu.", "body": "- **10.07.2023:** KDV **%18 → %20**.\n- **01.08.2023:** tevkifat 2.000 TL ve üstü faturalar için; TES fiyatı **1.998 TL**'de sabitlendi, satılan 8 firmanın ödeme planı güncellendi.\n- **01.03.2024:** tevkifat alt sınırı **6.900 TL**, oran 5/10.\n- **Temmuz 2026:** tevkifat sınırı **12.000 TL** üzeri faturalar (İndirim Kodu Formüller › \"KDV'li satışlar için\" sayfası).\n- **2026 (Temmuz–Eylül):** mekan (SAS/MoS) satışları **AR-GE / Teknokent (4691 sayılı kanun)** sözleşmesine geçti: lisans bedeli KDV'den müstesna. Detay: \"Yeni SAS KDV kuralı\" maddesi.\n- Kaynak tablo: `Vergi Değişiklikleri\\Vergi Değişiklikleri (Tevkifat KDV vs).xlsx`; TES tevkifat düzeltme listesi `Yeni Fiyat TES\\TES_Tevkifat Sorunundan Fiyat Güncellenecekler.xlsx`.", "tags": ["KDV", "tevkifat", "vergi", "milestone"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Vergi Değişiklikleri\\Vergi Değişiklikleri (Tevkifat KDV vs).xlsx", "links": [], "updated": "2026-07-01"}, {"id": "lc-11", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "11/2025 – 12/2025 Garantili satış ve Dijital Partner Sertifikası", "tldr": "Kasım 2025'te mekanlara Garantili Üyelik (6 ayda iş yoksa ücret iadesi + ücretsiz kullanım) çıktı; Aralık 2025'te ~1.500 firmaya Dijital Partner Sertifikası gönderildi.", "body": "**Garantili satış (Kasım 2025):**\n- Sözleşme metni hukuk onaylı final 17–18.11.2025; uygun firma listeleri 18, 19, 24.11.2025 (İstanbul 251 firma + Kocaeli listesi).\n- Kitle (Acquisition planı): sadece 1–3. segment, 6 büyük il (İstanbul, Ankara, İzmir, Bursa, Adana, Antalya), belirli kategoriler. Detay: \"Garanti sözleşmesi\" maddesi.\n**Dijital Partner Sertifikası (Aralık 2025):**\n- `Sertifika\\Tüm Sertifikalar Kümüle_3.12.2025.xlsx`: ~1.500 kullanıcı; kitle (ör. \"Sınav\"), fiziksel / dijital gönderim bayrakları.\n- Fiziksel baskı + çerçeve + mühür + CEO imzalı tebrik kartı; mail + WhatsApp + LinkedIn paylaşım metni.\n- CRM'e toplu ekleme: `Sertifika\\CRM BULK EKLEME` (Ödüller ve Sertifikalar bulk listeleri 11.12.2025, 05.01.2026).\n- İade kontrolleri: `İade Check_Tüm Sertifikalar Kümüle_8.07.2026.xlsx`.", "tags": ["garantili satış", "sertifika", "milestone"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Garanti Sözleşmesi; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Sertifika", "links": [{"label": "Sertifika görseli (Drive)", "url": "https://drive.google.com/file/d/1h0PmbqYcF2FzP0np4MoATtKkpNP4evuS/view?usp=sharing"}], "updated": "2025-12-03"}, {"id": "lc-12", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "05/2026 – 06/2026 Burdur Projesi (yeni il pilotu)", "tldr": "Mayıs–Haziran 2026'da Burdur Projesi ile yeni illerde (Trabzon, Tekirdağ, Diyarbakır vb.) haftalık aranan firma listeleriyle pilot yapıldı.", "body": "- **Fiyatlandırma:** `Pro Start Paketi_Haziran 2026 Fiyatlandırma_Burdur Projesi_2.04.2026.xlsx`, firma listesi + fiyatlar 14.05.2026.\n- **Haftalık listeler:** 2. hafta 09/06, 3. hafta 15/06, 4. hafta 22.06.2026. Arayanlar satış ekibi (ör. Taner, Furkan); sütunlar: Durum (Ret / Ulaşılamadı / Görüşüldü-Bağlantı / Randevu), RET LOG, \"SAHA GİTSİN Mİ\", üyelik geçmişi, panele son giriş.\n- **Analiz 17.06.2026:** 610 kayıt; Ret 32, Ulaşılamadı 28, Bağlantı 21, Randevu 17, Görüşmek istemedi 6.\n- **Diyarbakır:** ayrı landing page ve one-pager (`Burdur Projesi\\Diyarbakır Projesi`).\n- Pozisyon aktarım dosyasına göre: 6 il pilotlandı, yeni satış ekipleri geldi, düşük performanslı illerde SAS–TES geçişleri yapıldı.", "tags": ["Burdur", "yeni il", "pilot", "milestone"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Burdur Projesi", "links": [], "updated": "2026-06-30"}, {"id": "lc-15", "cat": "Sözleşmeler", "kind": "kural", "pin": false, "title": "Referans kampanyası katılım koşulları", "tldr": "Referans veren firma, getirdiği firma üye olursa sözleşme bedelinin 1/12'si kadar Hepsiburada çeki alır; referans başına en çok 10.000 TL, ayda 20.000 TL, toplam 40.000 TL.", "body": "- Referans; form ile veya satış personeline bilgi verilerek iletilir.\n- Satış **referanstan sonraki 30 gün içinde** tamamlanmalı; referans alan firma aktif üye olamaz.\n- Ödül: referans alan firmanın sözleşme bedelinin **1/12**'si, üst sınırlar: referans başına **10.000 TL**, firma başına ayda **20.000 TL**, toplamda **40.000 TL**.\n- Ödül, sözleşme aktivasyonundan sonra **45 iş günü** içinde, **Hepsiburada hediye çeki** (dijital kod, 1 yıl geçerli, parçalı kullanılabilir; altın/ziynet/dijital ürün hariç).\n- Aynı firmaya birden çok referans → ilk referans veren kazanır. Kendine / aynı ortaklık yapısındaki firmaya referans verilemez (tespit edilirse çek bedeli geri ödenir).\n- Pozisyon aktarım dosyası: \"py referans kampanyası kurgusu\" yenileme tarafında yaratıldı.\n**Takip:** `Nesibe İşler\\Referans Kontrol`: \"Referans Formdan Yapılan Satışlar\" (formdan gelip satılanlar) ve \"Qlik'te Olup Takipte Olmayanlar\" (Qlik'te referansla gelen ama takip sheet'inde olmayan 62 kayıt). Referans formuna soru ekleme sunumu da burada.\n**Eksik:** \"Referans takip\" Google Sheet linki yerel dosyalarda bulunamadı; Nes'ten alınmalı.", "tags": ["referans", "kampanya", "hepsiburada", "sözleşme"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Referans Kontrol\\Düğün.com Referans Kampanyası_Katılım Koşulları ve Şartlar.docx", "links": [{"label": "2025 Referans Kampanyası Takip", "url": "https://docs.google.com/spreadsheets/d/1o_CtvFfHQvwK-imtSse95lzaTkOnKiY_Pu66HRITO-U/edit"}, {"label": "Referans Kampanyası Kazananlar💰", "url": "https://docs.google.com/spreadsheets/d/143Uqs0FypmrPwCbyUPRBW_4ZaW5BjPDmbbjBhUBhXnU/edit"}, {"label": "Referans Kampanyası (klasör)", "url": "https://drive.google.com/drive/folders/1siqqrv_9FZTVC9XxI_xw8F0qTN2WSyek"}], "updated": "2026-11-25"}, {"id": "lc-16", "cat": "CRM & Sözleşme", "kind": "nasil", "pin": false, "title": "KDV'li satışlarda indirim kodu ve tevkifat (Plus / TES)", "tldr": "CRM sadece aylık vade tutarına bakarak tevkifatlı (%14 net KDV) ya da tevkifatsız (%20) KDV uygular; tevkifat sınırı Temmuz 2026'dan beri 12.000 TL.", "body": "**Kural:** CRM'de sözleşmedeki **her vade satırı ayrı bir faturadır**; CRM o vadenin tutarı tevkifat sınırını (**12.000 TL**, Temmuz 2026) aşıyor mu diye bakar ve tevkifatlı (%14) veya tevkifatsız (%20) KDV uygular.\n**Plus güncel fiyatlar (İndirim Kodu Formüller_12 Ekim 2026):** aylık liste **14.850**, satış **9.900** (KDV öncesi); tevkifatsız KDV dahil 11.880, tevkifatlı 11.286.\n**İndirim kodu yaratırken girilecek satış fiyatı:**\n- Tevkifatsız: aylık **9.900** / yıllık **118.800**.\n- Tevkifatlı (aylık tutarı sınırın altında kalan ama **yıllık peşin** satılacak ya da sınırı aşan bir vadesi olan sözleşmeler): aylık **9.405** / yıllık **112.860** (formüllü satır, değiştirme).\n**İndirim üst üste binme:** toplam indirim = 1 − (1 − ana) × (1 − ek). Ör. 30+15 → %40,5; 20+15 → %32.\n**Hediye çeki tablosu (aynı dosya):** SAS İstanbul Winner 6X 20.000 · 4X 10.000 · 2X 7.500; TES Plus 2.000 TL.\n**Dosyalar:** `Nesibe İşler\\İndirim Kodları\\İndirim Kodu Formüller_<tarih>.xlsx` (en yenisi 12.10.2026), `SAS İndirim Kodları.xlsx`, `Reba Aktarım\\KDV'li Satışlar İçin İndirim Kodu.xlsx`.", "tags": ["indirim kodu", "tevkifat", "KDV", "Plus", "CRM"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\İndirim Kodları\\İndirim Kodu Formüller_12 Ekim 2026.xlsx", "links": [{"label": "Plus fiyat sheet'i (CRM girişi)", "url": "https://docs.google.com/spreadsheets/d/1QOXTqfg_hr2nX22FpsPWy-cPnOTfKX2ltbuuHxpjt3U/edit?usp=sharing"}], "updated": "2026-10-12"}, {"id": "lc-17", "cat": "Fiyat & Kampanya", "kind": "bilgi", "pin": false, "title": "2026 Loyalty (erken yenileme) ve Acquisition (yeni satış) kampanya tasarımı", "tldr": "2026 başında yazılan plan: yenilemede tarihe bağlı azalan indirim merdiveni, yeni satışta indirim oranlarını düşürüp garanti, dondurma, şimdi al sonra öde gibi avantajlar vermek.", "body": "**Durum:** tasarım / öneri dokümanı; uygulanan güncel kurallar için \"Erken yenileme nasıl çalışır\" ve \"Güncel fiyat kaynağı\" maddelerine bak. Bu doküman fikirlerin kaynağı.\n**Loyalty – yenileme planı:**\n- Rate card üstünden: sabit %20 + Özgür Bey onaylı %5 + yenileme firması %10 + 60 gün erken %5 + 75 gün erken %5; yıllık ödemeye ek %20 (3 taksite kadar vade farksız), 6 taksitte ek %10; 12 taksit yok. Ortalama %35–40, maksimum %56.\n- Takvim (T = yenileme tarihi): T−75 gün ek %10, T−60 gün ek %5, T ile T+15 sadece yenileme %10'u, T+15 sonrası sadece %20+5.\n- Firmaya en fazla **%100 zam**: indirimli fiyat son ödemenin 2 katını aşarsa fiyat = son ödeme × 2.\n- İletişim: 75 gün kala panel bannerı + push/SMS/popup/e-posta, 30 gün kalana kadar; sonra sadece satış.\n**Acquisition – yeni satış planı:**\n- İndirim oranları %25-30-35 → %20-25-30; ek kategoriye %50 ve churn firmaya %40 kaldırılır.\n- **Garantili satış** (1–3. segment, 6 büyük il) · **Dondurma hakkı** (2 ay, sayfa açık ama lead yok) · **Ücretsiz ek ürünler** (ek kategoride ilk 3 ay üst paket vb.) · **Şimdi Al Sonra Öde** (10.000 TL peşin, kalanı 2 ay sonra).\n- İş ortağım sayfası pop-up'ları, avantaj çarkı, testimonial videoları.\n- Hedef: yeni satışta yıllık **%20 artış**.", "tags": ["loyalty", "acquisition", "erken yenileme", "kampanya tasarımı"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Loyalty & Acquisiton\\Loyalty _ Acquisiton.docx", "links": [], "updated": "2026-11-25"}, {"id": "lc-18", "cat": "Fiyat & Kampanya", "kind": "bilgi", "pin": false, "title": "TES Big 5 & Others fiyat ve kontenjan mantığı (2023)", "tldr": "Ağustos 2023'te TES fiyatları şehir grubuna göre ayrıldı: doluluğu yüksek 6 büyük şehirde 1.699 TL, doluluğu düşük uydu illerde 1.199 TL; 20 kategoride kontenjan artırıldı.", "body": "- **Analiz:** 6 büyük şehirde kontenjan doluluğu **%75** (842 satış, 275 boş), uydu illerde **%17** (160 satış, 807 boş).\n- **Karar (Ağustos 2023):** 6 büyük şehir indirimli fiyat **1.699 TL**, uydu iller **1.199 TL**; 20 kategoride kontenjan artışı.\n- **Mantık:** doygun şehirde fiyatla karlılık; doluluğu düşük şehirde ucuz fiyatla kontenjan doldurup bağlı müşteri.\n- **Bugün:** Plus tek fiyat (aylık satış 9.900, yıllık yenileme 6.000 ₺/ay — `PRICING.md`); kontenjan ve açık il listeleri `Nesibe İşler\\Satışa Açık İller` (TES Mekan Yeni İller Listesi v3 08.06.2026, Plus Kontenjan Listesi, Taşra İlçeler).", "tags": ["TES", "Plus", "kontenjan", "uydu iller", "fiyat"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Yeni Fiyat TES\\Bilgilendirme Metni.docx", "links": [], "updated": "2023-08-01"}, {"id": "lc-19", "cat": "Satış ekipleri", "kind": "tanim", "pin": false, "title": "Welcome ekibi (onboarding), mezuniyet ve prim", "tldr": "Welcome ekibi yeni müşterinin ilk 90 gününü yönetir; firma en az 1 iş alıp 1 TL dışında ödeme yapınca 'mezun' olur, prim mezuniyet oranına göre ödenir.", "body": "- **Görev:** yeni müşterilerin platforma girişi, ürün anlatımı, **ilk 90 gün** aktiflik takibi, erken churn müdahalesi.\n- **Yapı:** SAS için 1 kişi, TES için 1 kişi, iki tarafa da çalışan 1 hibrit kişi + operasyon yöneticisi.\n- **Mezuniyet koşulları:** en az **1 iş** almış olmak + en az **1 TL dışında bir ödeme** yapmış olmak.\n- **Hedef:** en az %90 devam; verimlilik %70.\n- **Aylık prim (Graduated Rate):** mezuniyet zamanı gelen firmalar içinde mezun oranı; %85 → 5.000 TL … %90 → 10.000 TL … %100 → 17.500 TL. **Çeyrek primi:** 3 ay ortalaması; %90 → 15.000 … %95 → 22.500 … %100 → 30.000 TL. Ek şartlar: konuşma kalitesi 90+, verimlilik %60+, mola uyumu tam.\n- Dosya: `Ekip Süreç Dosyaları\\Welcome Ekibi.docx` (ayrıca Pre-Onboarding Ekibi PDF'i).", "tags": ["Welcome", "onboarding", "prim", "mezuniyet"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Ekip Süreç Dosyaları\\Welcome Ekibi.docx", "links": [], "updated": "2026-11-25"}, {"id": "lc-20", "cat": "Satış ekipleri", "kind": "tanim", "pin": false, "title": "RED Flag akışı ve Komisyon 1 / Komisyon 2 onayları", "tldr": "90 gündür ödeme yapmayan, ikna edilemeyen churn talebi olan veya yeni churn olmuş firmalar 3 kişilik Red Flag ekibine gider; inisiyatifler komisyon onayıyla kullanılır.", "body": "**Girişler (3 ayrı kanal):**\n- Son **90 gün** ödeme hareketi olmayan firmalar (90. gün).\n- Churn talebi olup standart yöntemle ikna edilemeyenler (OYD dahil).\n- Churn olmuş firmalar: sözleşme pasife geçtikten sonra **60 gün** geri kazanım takibi.\n**Çözüm süreleri:** ödeme kaynaklı → 120. gün yeni fatura kesilmeden önce (~25 gün); geri kazanım → 60 gün.\n**İnisiyatifler:** enflasyon artışının geri alınması, panel kısıtlı süre ekleme, açık ödemelerin yapılandırılması → **Komisyon 1**; sözleşme revizesi → **Komisyon 2**; ödeme planı revizesi tutara göre K1/K2. Churn sonrası 60–90 gün aktivasyon K1, 90+ gün K2.\n**Komisyonlar:** K1 = Nevzat, Gökhan, Burhan · K2 = K1 + Emek Kırbıyık, Emin Mazı.\n**Ölçüm:** veri dokunma / sonuçlandırma süresi ve başarısı, tahsile dönen firma, churn ikna oranı, geri kazanım oranı.", "tags": ["red flag", "churn", "tahsilat", "komisyon"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Ekip Süreç Dosyaları\\RED_Flag_Akisi_BS (1).docx", "links": [], "updated": "2026-11-25"}, {"id": "lc-21", "cat": "Satış ekipleri", "kind": "bilgi", "pin": false, "title": "Saha ziyareti gözlemleri (satış süreci sorunları ve öneriler)", "tldr": "Nes'in 2 günlük saha eşliğinden çıkan tespitler: az REVİD, sık iptal olan randevular, dijital sunum yok, kampanyalar hikaye gibi anlatılmıyor; öneriler yeni satış ve yenileme için ayrı.", "body": "- **Örneklem:** 3 yeni satış + 3 yenileme ziyareti → 2 sözleşme, 1 ret, 3 bağlantı. Günde en fazla 3 randevu, ortalama 2 saat; İstanbul saha satışta 3 kişi.\n- **Sorunlar:** düşük REVİD, randevu iptali ve yedek plan yok, birbirinden uzak lokasyonlar, zayıf ön hazırlık (\"puanımıza baktınız mı? geçen yıl ne ödüyorduk?\"), tanıtım sunumu yok, fiyatlar kağıda yazılarak anlatılıyor, kampanya son ikna aracı olarak sunuluyor, ödeme seçenekleri tam anlatılmıyor.\n- **Öneriler (yeni satış):** REVİD artışı (yeni video, garanti / dondurma kampanyaları), randevu teyidi + dijital sunum SMS/WhatsApp, interaktif dijital sunum, kampanyayı hikaye gibi anlatmak (liste → ilk müşteri %30 → upgrade → dondurma → iade garantisi).\n- **Öneriler (yenileme):** yılda bir satışsız \"nasılsınız\" ziyareti + analiz raporu, erken yenileme randevusu, yenileme dönemini kaçırana daha az indirim, randevu gündemi = yıl sonu raporu (15 dk kala bildirim + rapor linki).\n- Dosyalar: `Loyalty & Acquisiton\\Saha Ziyareti Raporu.docx` ve `Saha Ziyaret Raporu_*.html` sunumları.", "tags": ["saha", "satış süreci", "randevu", "yenileme"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Loyalty & Acquisiton\\Saha Ziyareti Raporu.docx", "links": [], "updated": "2026-11-25"}, {"id": "lc-22", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "REVİD (B2B lead) nedir, nereden gelir", "tldr": "REVİD = B2B lead: yeni satış, upsell, yenileme, referans dahil firmalardan gelen başvuru; Qlik General › Contact Forms düğün.com URL'lerinden gelenleri, Meta formları ayrı bir sheet'i kapsar.", "body": "- **Tanım (Nes 19.10.2026):** REVİD = **B2B lead** (yeni satış, upsell, yenileme, referans …).\n- **Kanallar:** Qlik General › **Contact Forms** = düğün.com URL'lerinden (CRM, B2B panel, iş ortağım sitesi) gelen formlar. **Meta lead formları** ayrı kanal: satışa sadece bir Google Sheet ile ulaşır, CRM id'si yok (telefonla eşleştirilir); SAD bunları Sonitel'de **\"Meta\"** liste kaynağından arar.\n- **Satış sayma kuralları (Nes 04.11.2026):** form anında ödeyen veya ürünü formdan önceki 90 gün içinde biten müşteri REVİD değildir (sonraki sözleşme yenileme / upsell / winback, sayılmaz). Formdan 14+ gün önceki toplantı = temsilcinin bağlantısı; not düşülür ama formdan sonraki sözleşme sayılır.\n- **Ödeme durumu** `provider_master`'ın son ürününden değil **tüm ürün geçmişinden** okunur.\n- Geliştirme ihtiyacı (aktarım dosyası): REVİD kalite raporu otomatik değil; sistem kurulmalı. Eski REVİD dosyaları `Nesibe İşler\\REVİD` (2022–2024).", "tags": ["REVİD", "B2B lead", "Meta", "contact forms"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\CLAUDE.md", "links": [{"label": "Meta B2B form sheet'i", "url": "https://docs.google.com/spreadsheets/d/1YH1vqLjPkD2PIX4-4lMYDeWTtY1NtX4UGkL7Mqw2_PQ"}], "updated": "2026-11-04"}, {"id": "lc-23", "cat": "Metrikler & tanımlar", "kind": "bilgi", "pin": false, "title": "Lead verisini etkileyen sistem değişiklikleri (release timeline)", "tldr": "Lead / dönüşüm trendini yorumlarken bu tarihleri işaretle: Sizi Arayalım bannerları, multilead sorunu, özel fiyat, WP 6 lead sınırı, sıralama değişikliği, GA4 düzeltmesi, WP firma değişimi.", "body": "- **04/2024:** Instagram etkileşimi → lead yerine IG ziyareti (veri 27.04.2024'ten).\n- **18.03.2025:** Leadpool bannerları \"Sizi Arayalım\" oldu → leadpool lead'leri düşüyor (~2,7 bin/ay → 2026'da <1 bin).\n- **05/2025 – 09/2025:** multilead arayüz sorunu, mekan multilead hacmi yarıya indi; Ekim 2025'te düzeldi.\n- **10/2025:** Düğüncom Özel Fiyat (liste kartını değiştirir; `has_special_offer`).\n- **Ekim 2025 ortası:** WP aramasında en fazla **6 mekan lead'i** → WP lead −%15–20.\n- **01/2026:** listeleme sıralama mantığı değişti.\n- **18.03.2026:** unpaid kartlar büyütüldü (Temmuz 2026'dan itibaren geri alınıyor).\n- **13.05.2026:** GA4 purchase tetikleyici düzeltmesi → ölçülen `conversion` ~−%10 (gerçek düşüş değil).\n- **Mayıs 2026 sonu:** WP dış tedarikçi değişti → WP lead geçici düşüş.\n- **2026 H2:** multilead kullanıcı-gün sınırı 6 (planlı).\n- **03.02.2026:** WP v20 çağrı sistemi (karşılaştırılabilir WP verisi bu tarihten).", "tags": ["lead", "trend", "release timeline", "WP"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\references\\BU_Knowledge_Handbook.md §5.6–5.7", "links": [], "updated": "2026-07-01"}, {"id": "lc-24", "cat": "Veri & Qlik", "kind": "tanim", "pin": false, "title": "Diğer Qlik uygulamaları (Executive / General dışında)", "tldr": "Handbook'taki 11 rapor uygulaması + Provider Contest Dashboard, Finance ve Sonitel QVD uygulamaları; veriler gece 02:00–08:00 yüklenir, ekranlar 'dün itibarıyla'dır.", "body": "Tenant: `rx2lc2xpounq8gv.eu.qlikcloud.com`, link kalıbı `/sense/app/<APP_ID>`.\n- **Leads** `52532952-e37f-4fa9-8685-9e1473470418` — lead trendleri.\n- **Analytics Reports** `452282aa-909f-44c4-8e6a-c1bbd75f9d94` — web + app trafik.\n- **SEO Reports** `d0fe82a4-f999-4316-94ba-e0e409c3f61a` (Marketing alanı).\n- **Feedback** `9d08b5ca-6e77-4223-8e63-a33236568e09` — anlaşma / geri bildirim.\n- **Couple Details** `4efa0ffe-4589-46db-8761-796d245f7c46` — çift tarafı, WhatsApp öneri, WP arama listeleri.\n- **Finance** `b723e906-cff6-4325-b7f9-52c5429e966a` — ödemeler, sözleşme–provider bağı, vade (sözleşme bazlı vade burada).\n- **Provider Item** `a4d15756-14b1-4ca9-96a9-421bcc99f57d` — katalog ürünleri.\n- **WP Monitor History** `42f75563-d295-4bab-ac00-1e2da432ffde` — WP çağrı merkezi performansı, \"Arama Teklif Limitleri\".\n- **Provider Listing GA4** `29795114-bedd-4d7a-8b17-f60f45e2eff6` — liste pozisyonu / kart CTR.\n- **Provider Contest Dashboard** `e7196a51-312d-4032-b0bd-070e61e965d8` — performans ligi (handbook'ta yok).\n- **Sonitel QVD üretici uygulamaları:** SAD `d6729640…`, PY `7bb37bd6…`, Finance `b8d3b0e5…`; **Only For AI API's** `1737fda0…` (Ekmob toplantıları, `pm_note_master`).\n**Yükleme:** gece **02:00–08:00** (üreticiler önce, raporlar sonra; Executive ~07:32, General ~06:29). Bugün asla tam değildir.", "tags": ["Qlik", "uygulama", "app id", "Finance", "Sonitel"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\references\\BU_Knowledge_Handbook.md; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Meta_AI_Reklam_Analizi\\CLAUDE.md", "links": [{"label": "Qlik tenant", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com"}, {"label": "Finance app", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com/sense/app/b723e906-cff6-4325-b7f9-52c5429e966a"}, {"label": "Leads app", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com/sense/app/52532952-e37f-4fa9-8685-9e1473470418"}, {"label": "WP Monitor History", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com/sense/app/42f75563-d295-4bab-ac00-1e2da432ffde"}], "updated": "2026-11-04"}, {"id": "lc-25", "cat": "Veri & Qlik", "kind": "yasak", "pin": false, "title": "Qlik veri tuzakları (sessiz hatalar)", "tldr": "Qlik çoğu hatada hata vermez, boş ya da yanlış veri döner: tarih seçimi sayısal olmalı, eski seçimler temizlenmeli, büyük küpler küçük sayfalarla çekilmeli, 'latest product' alanlarına güvenilmemeli.", "body": "- **Tarih seçimi:** `date` alanı dual; **sayısal** `SelectValues` (`qNumber`, Excel seri günü, 01.08.2026 = 46235) kullan. Metin seçimi hiçbir şey seçmez ve hata vermez.\n- **Set analysis'te tarih aralığı** metin biçiminde: `date={\">=2026-06-03<=2026-09-02\"}`. Sayısal seri aralığı 0 döner.\n- **Eski seçimler:** Qlik Cloud motor oturumu bağlantılar arasında seçimleri tutar → `OpenDoc`'tan hemen sonra `ClearAll`.\n- **Sayfa boyutu:** geniş küplerde 1000 satır \"Result too large\" → 150 satırlık sayfalar.\n- **Biçimli ölçüler** `6,533.5714` gelir → virgülü silip `float()`.\n- **Executive Dashboard iptal / ilk ödeme zaman aşımı sözleşmelerini hiç göstermez** (BI filtresi, 18.08.2026). Silinen / pasife düşen kaydı tespit için **General** kullan; Executive sadece zenginleştirme.\n- **General `latest_product_name` / `latest_product_end` kademeli sözleşmelerde yanlış** (4X sonra 2X): 266 satırın 78'i hatalıydı (09.11.2026). `provider_products`'ta en geç `ends_on` satırını al.\n- **`payment_due` müşteri bazlı**; sözleşme bazlı vade Finance app'te.\n- **Katalog fiyatı:** `c_catalog_price_unit` kişi sayısı kademesi (1/50/100/…), birim değil; kişi başı için `Yemekli` + 300–20.000 TL filtresi; `Kokteyl` çoğunlukla paket toplamı.\n- **Provider id ile tek firma geçmişi:** `provider_id`'de metin `Select` çalışır, sayısal çalışmaz.", "tags": ["Qlik", "tuzak", "set analysis", "sayısal seçim", "latest_product"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\KAYNAK_DEGISIKLIGI.md; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Churn_Mekan_Listesi\\CLAUDE.md; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\notes\\venue-catalog-price-model.md", "links": [], "updated": "2026-11-09"}, {"id": "lc-26", "cat": "Veri & Qlik", "kind": "nasil", "pin": false, "title": "Yardımcı scriptler: qlik.py, d_one_ro.py, transcribe.py", "tldr": "Root `tools/` klasöründeki üç script: Qlik Engine API yardımcısı, canlı D-One veritabanına salt okunur sorgu ve Türkçe görüşme kaydı deşifresi.", "body": "- **`tools/qlik.py`** — Qlik Cloud WebSocket (Engine JSON-RPC) yardımcısı. `App('exec')` / `App('general')`, `.table()`. Anahtarı çalışırken `qlik_api_key.txt`'ten okur; **anahtar hiçbir dosyaya, koda, maile kopyalanmaz**. Yeniden yazma, bunu kullan.\n- **`tools/d_one_ro.py`** — canlı D-One veritabanına **salt okunur** sorgu (host adı \"staging\" ama veri canlı, Barış 26.10.2026). Sadece SELECT / WITH / SHOW / DESCRIBE / EXPLAIN; READ ONLY transaction, 30 sn sınır, varsayılan 200 satır. Çalıştırma: `D-One/python/.venv/Scripts/python.exe tools/d_one_ro.py \"SELECT …\"` (`--format csv --limit 1000`). Kişisel veri proje klasörüne yazılmaz.\n- **`tools/transcribe.py`** — Türkçe Whisper deşifre, tamamen yerel: `python transcribe.py \"kayit.mp3\" [--model medium] [--split-channels]` → `<dosya>_transkript.txt`. FFmpeg yolu script içinde.\n- **`tools/todo_reminder.ps1`** — eski sabah TODO popup'ı (kapandı; to-do'lar Nes Panel'de).\n- **Python sürümü:** `python` = 3.14 (pandas yok, Kasım 2026); pandas işleri için `py -3.12` veya D-One venv.\n- **`tools/` ve `qlik_api_key.txt` taşınmaz**, scriptler yolla bulur.", "tags": ["tools", "qlik.py", "d_one_ro", "transcribe", "script"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\tools", "links": [], "updated": "2026-11-04"}, {"id": "lc-27", "cat": "Veri & Qlik", "kind": "nasil", "pin": false, "title": "Login gerektiren Google Sheet'i okumak (gviz CSV)", "tldr": "Link ile açılmayan sheet'ler Chrome'da (Nes'in oturumuyla) gviz CSV adresinden okunur; export?format=csv ve gviz JSON çalışmaz.", "body": "- Kalıp: Chrome'da sheet açıkken `fetch('/spreadsheets/d/<ID>/gviz/tq?tqx=out:csv&gid=<GID>')`.\n- Denendi ve çalışmadı: `export?format=csv` ve gviz JSON (login-only sheet'lerde).\n- Link-okunur sheet'lerde (ör. Meta formları) doğrudan `export?format=csv&gid=0` indirilebilir.\n- Grid iframe içindeyse (`/htmlview?gid=…`) satırlar `javascript_tool` ile alınır (Post firmaları sheet'i, 21.10.2026).\n- Harici sistemler **sadece görüntüleme**: sheet'e yazılmaz, açılan sekmeler iş bitince kapatılır.", "tags": ["Google Sheets", "gviz", "Chrome", "okuma"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Provider_Contest_Winners\\PROJECT.md; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Post_Firmalari_Satis_Takibi\\CLAUDE.md", "links": [], "updated": "2026-11-05"}, {"id": "lc-28", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Günlük ürün & sözleşme pasiflik alarmı", "tldr": "Her sabah 09:00'da dün aktif olup bugün pasife düşen / silinen ürün ve sözleşmeleri bulan, HTML mail + Excel üreten otomasyon; v2 karar ağacı taslak aşamasında.", "body": "- **Ne:** dün aktif, bugün pasif / silinmiş **ürün × sözleşme**ler; churn / decay erken uyarısı.\n- **5 alarm tipi (v2, 17.08.2026):** Sözleşme + Provider Pasifte (mor) · İlk Ödeme Zaman Aşımı (kırmızı) · Yenileme ama Eski Sözleşmede Borcu Var (kırmızı) · Sadece Provider Pasifte (turuncu) · Sadece Sözleşme Pasifte (amber). Temiz yenilemeler sadece sayı olarak.\n- **Borç:** kredi kartlı sözleşmede ödeme durumu ∈ {Gelecek ödeme alınamadı, Devam eden ödeme alınamadı, Gelecek ödeme}.\n- **Kaynak değişti (18.08.2026):** Executive iptal / zaman aşımı sözleşmeleri göstermediği için tespit **General**'den, borç **Finance**'ten.\n- **Hedef çalışma:** Google Apps Script, her gün 09:00 İstanbul; kümülatif log Drive \"Otomasyon\" klasöründe; Excel her gün sıfırdan.\n- **Alıcı:** Nes'in iş adresi (devralan kendi adresine çevirmeli) (Eren Kadakal Ağustos 2026'da ayrıldı; eski kodda adresi / \"Merhaba Eren\" kalmışsa düzelt).\n- **Durum:** `2026-08-17_Taslak` güncel taslak; tam otomasyon (Aşama 2) onay bekliyordu. Taslak dışında gönderim yapılmaz.\n- Klasör: `8 Analyses\\Passive_Providers_Agreements_Alerts`.", "tags": ["alarm", "pasiflik", "churn", "otomasyon", "günlük"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Passive_Providers_Agreements_Alerts\\notes\\passive-provider-alarm-automation.md", "links": [{"label": "Drive › Otomasyon klasörü", "url": "https://drive.google.com/drive/folders/1uwGDMLkpS9LnsTT0MVgkUtliBcSQottk"}], "updated": "2026-08-18"}, {"id": "lc-29", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Tracker: bekleyen Claude oturumları (localhost:8841)", "tldr": "Nes'e cevap bekleyen Claude masaüstü oturumlarını en uzun bekleyen başta listeleyen yerel sayfa; 30 dakikadan sonra Windows bildirimi verir, Nes Panel ana sayfası da aynı listeyi okur.", "body": "- **Adres:** <http://localhost:8841> (`Claude\\Tracker\\tracker.py`, sadece okur).\n- **Gruplar:** `soru` (son tur soruyla bitti) · `izin` (5 dk'dan uzun açık araç çağrısı) · `bitti` / `durdu` (2 gün sessiz grupta). Sorular 7 gün kalır.\n- **Uyarı:** bekleyen tur başına 30 dk sonra bir Windows bildirimi; 24 saatten eski beklemeler uyarmaz.\n- **Çalışma:** Windows görevi \"Nes Tracker\" (oturum açılışında); kurulum `install_task.ps1`, kaldırma `uninstall_task.ps1` (Nes kendisi kurar).\n- **Nes Panel bağlantısı:** `/api/sessions` (şekil: `now`, `items[{title, kind, since, folder, link}]`); CORS sadece `null` (file://) ve `https://nesibekeles.github.io`.\n- **Sınırlar:** arşivlenen oturumu göremez; uygulama güncellemesi dosya biçimini değiştirirse liste boş / yanlış olur.\n- Halef için: kişisel bir araç; Nes ayrıldıktan sonra gerekmez.", "tags": ["tracker", "oturum", "Nes Panel"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\Tracker\\CLAUDE.md", "links": [{"label": "Tracker (yerel)", "url": "http://localhost:8841"}], "updated": "2026-11-25"}, {"id": "lc-30", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Tek seferlik analizler (8 Analyses) – ne var, ne bulundu", "tldr": "8 Analyses klasöründeki tekrar kullanılabilir analizler: Meta AI reklamı, post firmaları satış kontrolü, churn mekan listesi, otel referans dosyası, Adana-Mersin potansiyel liste, İstanbul ilçe tier, nakit akış simülatörü.", "body": "- **Meta AI reklam analizi (19/10 ve 04.11.2026):** Meta B2B formları × CRM; AI reklamı (`ad_name` içinde `ai`, ör. `9990-ai`, 12.10.2026'dan beri) diğerleriyle kıyas. Karar dosyası `Meta_AI_Reklam_Ozet_<tarih>.xlsx`; reklam ekibine taşınabilir paket `paket/`.\n- **Post firmaları (21–23.10.2026):** sosyal medya çift postlarındaki firmalar post sonrası satıldı mı? 20 satır satış (7 yeni, 13 yenileme/upsell); satılmayanlar TES ve MoS/SAS'a ayrı dosyalarla soruldu.\n- **Churn mekan listesi (10.11.2026):** şehir bazlı, son paid ürünü pencerede biten ve hiçbir paid sayfası olmayan mekanlar (yeni satış listesi).\n- **Otel referans dosyası (10.11.2026):** JW Marriott Ankara satışı için en fazla 10 uluslararası otel markası; fiyat, segment, iç ID asla yok.\n- **Adana-Mersin potansiyel liste (09/2026):** 1.440 satırlık listenin 90 paid ile isim/adres eşleştirmesi + saçmalık bayrakları.\n- **İstanbul ilçe tier (17.08.2026):** 39 ilçe mekan tier analizi.\n- **Cash Flow (14.09.2026):** BI'ın Eylül–Aralık tahsilat simülatörü; Finance app ödeme verisinin referans dokümanı `00_FINANCE_DATA_UNDERSTANDING.md`.", "tags": ["analiz", "Meta", "post firmaları", "churn", "otel referans", "cash flow"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\CLAUDE.md", "links": [{"label": "Meta B2B form sheet'i", "url": "https://docs.google.com/spreadsheets/d/1YH1vqLjPkD2PIX4-4lMYDeWTtY1NtX4UGkL7Mqw2_PQ"}, {"label": "Post firmaları sheet'i (CRM Linkli - Satış Görüşmesi Boş Firmalar)", "url": "https://docs.google.com/spreadsheets/d/1y6AzsMNkNp2V6Ye6aABiJ19tSSxBYruzqI34PqtOLeU"}], "updated": "2026-11-10"}, {"id": "lc-31", "cat": "Raporlar & paneller", "kind": "nasil", "pin": false, "title": "Pro Start 3 firma karnesi (yenileme görüşmesi destesi)", "tldr": "Pro Start 3 yenileme toplantısına götürülen 9 slaytlık firma karnesi; Qlik'ten metrik çeker, PPTX + PDF üretir, BI'a devredilecek paket olarak hazırlandı.", "body": "- **Klasör:** `Nesibe İşler` kök klasöründeki `PROJECT.md` / `README.md` (BI devri), şablon `template/Pro3_Karne_Template.pptx`.\n- **Akış:** `python tools/pull.py <provider id'leri>` → `data/bullets.json`'a her yeni firma için 3 madde (\"Çiftler mekanınızı çok sevdi!\", firmanın dugun.com sayfasındaki \"Neden Tercih Etmelisin?\" bölümünden, elle) → `python tools/build.py` → `powershell -File tools/export.ps1` (PowerPoint COM ile PDF).\n- **Dönem:** firmanın son Pro Start 3 ürünü (General `provider_products`), bugünle sınırlı.\n- **Ortalama dönüş süresi = aritmetik ortalama** (Nes 04.09.2026), medyan gösterilmez.\n- **Renk kuralları:** Yorum ≥10 yeşil / 5–9 sarı / <5 kırmızı · Fotoğraf <40 kırmızı / 40–50 sarı / >50 yeşil · CR <%2 turuncu / 2–3 sarı / ≥3 yeşil · Dönüş süresi 0–2 sa yeşil / 2–6 sarı / 6–12 turuncu / 12+ kırmızı.\n- **Karnedeki metrikler değiştirilmez**, sadece öneri cümleleri.\n- Gereken: Python 3.12 + python-pptx, PowerPoint, Montserrat fontları.", "tags": ["karne", "Pro Start 3", "yenileme", "PPTX"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\PROJECT.md; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\README.md", "links": [], "updated": "2026-09-15"}, {"id": "lc-32", "cat": "Çalışma kuralları", "kind": "bilgi", "pin": true, "title": "Pozisyon: Revenue Growth Team Lead – iş dağılımı ve sorumluluklar", "tldr": "Nes'in pozisyonu Emek Kırbıyık'a raporlar, 1 stajyerle çalışır; zamanın %45'i proje, %25'i performans takibi, %20'si ekipler arası koordinasyon.", "body": "**Pozisyon aktarım dosyası (Ağustos 2026, hazırlayan Nesibe Keleş):**\n- **Raporlama:** Emek Kırbıyık. **Ekip:** 1 stajyer. **Yakın birimler:** BI, Satış, Performans Yönetimi, Finans, Ürün/IT, İçerik, Performans Marketing.\n- **Zaman dağılımı:** proje takibi %45 (ör. Turbo bitiş raporları) · performans takibi %25 (yeni satış, yenileme, kampanya, fiyat; ay sonu raporları) · ekipler arası koordinasyon %20 (ör. pasife alınan sözleşme otomasyonu, Ekmob–CRM entegrasyon testleri) · CRM desteği %5 · operasyonel işler %5 (NPS, yenileme listeleri, performans ligi ödülleri, düzenli raporlar).\n- **Karar yetkisi:** yeni ürün / kampanya / fiyat kurgularında aktif; bu kurguların **CRM geçişlerini süper adminler dışında pazarlamada yapan tek kişi**; satış ve performans ekipleriyle ürün tarafındaki operasyonel kararları bağımsız alır.\n- **Yapılan büyük işler:** Power / Pro / Turbo yeni ürünler; erken yenileme sistemine geçiş; PY referans kampanyası; aylık kampanya tasarımları; **3 ayda bir fiyat güncellemesi**; yeni kategori açılışı; Garantili satış, Şimdi Al Sonra Öde, ilk ay ücretsiz modelleri; manuel liste gönderimleri ve Ekmob'da randevu vermeyenlerin takibi.\n- **Açık geliştirme önerileri:** REVİD kalite raporunun otomasyonu, potansiyel satış listelerinin puanlanması, CRM'de karne entegrasyonu, CRM bilgi bankası, aylık yenileme listelerinin otomasyonu (%90 iş yükü azalması), NPS otomasyonu.\n- Dosya: `Nesibe İşler\\İşten Çıkış\\Pozisyon Aktarım Dosyası_Nesibe.docx` (devir notları bölümü ay sonunda doldurulacaktı).", "tags": ["pozisyon", "aktarım", "rol", "sorumluluk"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\İşten Çıkış\\Pozisyon Aktarım Dosyası_Nesibe.docx", "links": [], "updated": "2026-08-01"}, {"id": "lc-33", "cat": "Çalışma kuralları", "kind": "bilgi", "pin": false, "title": "Nesibe İşler (Claude dışı) klasör haritası", "tldr": "Claude klasörünün dışında, Nesibe İşler altında 2023–2026 arası tüm iş arşivi var: sözleşmeler, garanti, yarışma, NPS, REVİD, fiyat politikası, indirim kodları, kişi bazlı 'X için' klasörleri.", "body": "- **Sözleşmeler / Garanti:** `Sözleşmeler` (GA/GY/OA/OY/VA/VY 2026 Eylül baskı, Temmuz 2026 SAS AR-GE), `Garanti Sözleşmesi`, `Paketler` (Winner / Plus paket PDF'leri, Kasım 2024 sözleşmeleri).\n- **Fiyat:** `Pricing Policy` (2024 fiyatları), `İndirim Kodları` (tarihli formül + liste fiyatı dosyaları), `Yeni Fiyat TES`, `Vergi Değişiklikleri`, `Satışa Açık İller` (il + kategori, Plus kontenjan, taşra ilçeler).\n- **Kampanya / hedef:** `Loyalty & Acquisiton` (aylık \"İlk N Ay analiz_FTS\", Q4 2026 kampanya fiyatları, Power/Pro Start giriş paketi, erken yenileme banner'ı, 1 TL kampanyası), `WhatsApp Reklam`, `Referans Kontrol`, `Burdur Projesi`.\n- **Yenileme:** `Yenileme Raporları - 2025`, `Otomatik Yenileme Sonlanma Süreci`, `Kaliteli Churn Görüşmeleri` (örnek ikna kayıtları).\n- **Sadakat:** `Yarışma` (performans ligi 2025), `Sertifika`, `NPS`.\n- **Lead / satış:** `REVİD`, `REVİD to Sale`, `REVİD TEMİZLİK` (makro), `Ekmob için`, `Ekmob 3-6 Ay Listesi`.\n- **Süreç:** `Ekip Süreç Dosyaları` (Welcome, Pre-Onboarding, RED Flag), `Görev Tanımları`, `PY Projesi.docx`, `Online Satış.docx`, `Panel Yeni Görünüm` (panel ana sayfa re-design brief'i).\n- **\"<Kişi> için\" klasörleri:** ekip arkadaşlarına hazırlanmış tek seferlik dosyalar.\n- **Önemli Olaylar Exceli:** site / marka / fiyat olay tarihleri.", "tags": ["klasör", "arşiv", "harita"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler", "links": [], "updated": "2026-11-25"}, {"id": "lc-34", "cat": "Çalışma kuralları", "kind": "bilgi", "pin": false, "title": "Geçmiş ürün ve süreç fikirleri (panel, online satış, PY verimliliği)", "tldr": "Hayata geçmemiş ya da kısmen geçmiş eski çalışmalar: panel ana sayfa kartları, Plus için online satış akışı, PY mesai ve arama analizi.", "body": "- **Panel Yeni Görünüm (2023):** panel ana sayfasında sabit kartlar: son giriş tarihi, dönüş süresi, teklif alma oranı, sayfa görüntüleme, dönüş sırası, profil puanı, kategori-şehir sırası, arayarak dönüş oranı, takip görüşmesi sayısı, PY iletişim kartı. Performans ligi kartı bu fikrin devamı.\n- **Online Satış (taslak):** ilk aşamada sadece **Plus** online; mekanlar için \"Bizimle iletişime geç\". Akış: tanıtım → kategori seçimi (Plus değilse REVİD formu) → sözleşme + SSS → ticari bilgi + online imza → 3D secure (ilk ay 1 TL) → PY randevusu.\n- **PY Projesi:** 9–10 arası ulaşma oranı %32, 17–18 arası %52 → mesaiyi 1 saat kaydırmak ayda 2.000+ başarılı görüşme; ring süresi 45 → 30 sn ile ~2 iş günü kazanç; firmaların %10–15'inde welcome ilk ayda bitmiyor ve churn edenlerin yaklaşık yarısında welcome kötü gitmiş; 2023 churn firmalarının profil skoru ortalaması 37.\n- **WhatsApp B2B mesajları:** promo firmalara \"lead'ine dönüş yaptın / lead aldın ama panele girmedin\" kitleleri (`WhatsApp Reklam`).", "tags": ["panel", "online satış", "PY", "fikir"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Panel Yeni Görünüm\\Panel Yeni Görünüm-Brief.docx; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Online Satış.docx; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\PY Projesi.docx", "links": [], "updated": "2026-11-25"}, {"id": "lc-35", "cat": "Linkler", "kind": "bilgi", "pin": true, "title": "Drive / Sheets / Docs linkleri (yerel dosyalarda bulunanlar)", "tldr": "Yerel dokümanlarda geçen Google Drive, Sheets ve Docs linklerinin tam listesi, ne işe yaradıklarıyla.", "body": "- **1. Renewal Data_2025-26** (yenileme sheet'i; yenileme ayı her zaman buradan) — Pivot Tablo (Customer).\n- **Yarışma Metrikler-IT › Ağustos 2026 Revize** — performans ligi resmi puan tanımı.\n- **Ağustos 2026 Ödül Kazananlar** — aylık ödül listesi format referansı (login gerekir).\n- **Otomatik yenileme pasife alma takip sheet'i** — finansın pasife alma kontrol listesi.\n- **PY yenileme tahmin listeleri** — Drive klasörü.\n- **Drive › Otomasyon** — pasiflik alarmının kümülatif logu.\n- **Cities_Venue-Sales-Team** — il uygunluğu, öncelik, temsilci başı günlük adet (SAD arama listesi).\n- **Plus fiyat sheet'i** — Plus fiyatlarının CRM girişi.\n- **SAD kullanıcı sheet'i** — Call List Dashboard giriş yetkileri.\n- **Decay dokümanı** (Google Doc).\n- **Meta B2B form sheet'i** ve **Post firmaları sheet'i**.\n- **Dijital Partner Sertifikası görseli**.\n- **Bulunamadı:** \"Referans takip\" sheet'i — yerel dosyalarda link yok, Nes'ten alınmalı.", "tags": ["link", "drive", "sheets"], "source": "Claude klasöründeki .md / .py dosyaları ve Nesibe İşler docx'leri", "links": [{"label": "1. Renewal Data_2025-26 (yenileme sheet'i)", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE"}, {"label": "Yarışma Metrikler-IT › Ağustos 2026 Revize", "url": "https://docs.google.com/spreadsheets/d/1yOqytvK1T5_WEOm-tBwHPz2bae7-8cre4wQPJIVOu5Q/edit?gid=400726811"}, {"label": "Ağustos 2026 Ödül Kazananlar", "url": "https://docs.google.com/spreadsheets/d/11SdbRgzm1dnBXdafUtKHc7OYN_auhuOo"}, {"label": "Pasife alma takip sheet'i", "url": "https://docs.google.com/spreadsheets/d/1WePvZ-dsgj9VhM0HgMmMSt139vlOa9HA4035h1dYvuQ/edit?usp=sharing"}, {"label": "PY yenileme tahmin klasörü", "url": "https://drive.google.com/drive/folders/1ii7j0tT5RFlzhRXNEtQd0zgSKiPfRv4o?usp=drive_link"}, {"label": "Drive › Otomasyon", "url": "https://drive.google.com/drive/folders/1uwGDMLkpS9LnsTT0MVgkUtliBcSQottk"}, {"label": "Cities_Venue-Sales-Team", "url": "https://docs.google.com/spreadsheets/d/1qz58tnoEyEeKqVhImVEj_0JrlnrDA4H7N4v1kYJXcqo/edit?usp=sharing"}, {"label": "Plus fiyat sheet'i", "url": "https://docs.google.com/spreadsheets/d/1QOXTqfg_hr2nX22FpsPWy-cPnOTfKX2ltbuuHxpjt3U/edit?usp=sharing"}, {"label": "SAD kullanıcı sheet'i", "url": "https://docs.google.com/spreadsheets/d/1WVhYftS1m76-9M0imRDueOh44AznkpzVX4ayolaQoa0"}, {"label": "Decay dokümanı", "url": "https://docs.google.com/document/d/1RdDg0YyikwQncZCPyjjHPo7D0ub_EZNqWq96YOxtRMM"}, {"label": "Meta B2B form sheet'i", "url": "https://docs.google.com/spreadsheets/d/1YH1vqLjPkD2PIX4-4lMYDeWTtY1NtX4UGkL7Mqw2_PQ"}, {"label": "Post firmaları sheet'i", "url": "https://docs.google.com/spreadsheets/d/1y6AzsMNkNp2V6Ye6aABiJ19tSSxBYruzqI34PqtOLeU"}, {"label": "Dijital Partner Sertifikası görseli", "url": "https://drive.google.com/file/d/1h0PmbqYcF2FzP0np4MoATtKkpNP4evuS/view?usp=sharing"}], "updated": "2026-11-25"}, {"id": "lc-36", "cat": "Linkler", "kind": "bilgi", "pin": false, "title": "Sistem ve sayfa linkleri (Qlik, CRM, D-One, iş ortağım)", "tldr": "Sık kullanılan sistem adresleri: Qlik tenant ve uygulamaları, CRM müşteri linki kalıbı, D-One sözleşme kılavuzu, başarı hikayeleri, Kampanya Stüdyosu ve Nes Panel.", "body": "- **Qlik tenant:** uygulama linki `…/sense/app/<APP_ID>`.\n- **CRM müşteri sayfası:** `https://crm.dugun.com/customers/{customer_id}#providers`.\n- **D-One sözleşme doldurma kılavuzu** (tek güncel kaynak, 10.11.2026'dan beri).\n- **D-One SAD ilçe kuralları:** `https://d-one.dugun.work/satis/satis-destek/kurallar`.\n- **Başarı hikayeleri (testimonial videoları):** iş ortağım sayfası.\n- **Kampanya Stüdyosu Artifact** ve **Nes Panel** (GitHub Pages).\n- **Destek adresleri:** `satis.destek@dugun.com` (garanti talepleri), `tahsilat@dugun.com` (pasife alma), `performans.yonetimi@dugun.com` (PY tahminleri). WhatsApp hattı +90 212 293 74 17.", "tags": ["link", "Qlik", "CRM", "D-One"], "source": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\CLAUDE.md; C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\9 Monthly Campaigns\\PROJECT.md", "links": [{"label": "Qlik tenant", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com"}, {"label": "Qlik › Executive Dashboard", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com/sense/app/3e66f065-9c5d-4d10-8454-9125686c72e8"}, {"label": "Qlik › General", "url": "https://rx2lc2xpounq8gv.eu.qlikcloud.com/sense/app/ce318523-86fc-4e8d-bcf5-55bc22fb56e8"}, {"label": "D-One › Sözleşme Doldurma Kılavuzu", "url": "https://d-one.dugun.work/satis/kampanyalar/sozlesme-kilavuzu"}, {"label": "D-One › SAD kuralları", "url": "https://d-one.dugun.work/satis/satis-destek/kurallar"}, {"label": "İş ortağım › Başarı hikayeleri", "url": "https://dugun.com/isortagim/basari-hikayeleri"}, {"label": "Kampanya Stüdyosu (Artifact)", "url": "https://claude.ai/artifact/YMVnH1eTBHVqYMhKH4pQKA"}, {"label": "Nes Panel", "url": "https://nesibekeles.github.io/duguncom/Nes_Panel.html"}], "updated": "2026-11-25"}, {"id": "ld-1", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": true, "title": "Yenileme ana sheeti: 1. Renewal Data_2025-26", "tldr": "Tüm yenileme takibinin tek kaynağı: aylık yenileme listesi (ALL_new), PY tahminleri, customer bazlı tablo, decay takip ve referans aramaları aynı Google Sheet'te.", "body": "- **Ne:** Her ay yenilemeye gelen provider'ların listesi + PY tahmini + gerçekleşen yenileme durumu. Drive'da `PY Yenileme Tahmin Dosyaları` klasöründe.\n- **Sekmeler:**\n   - `ALL_new`: ana liste. Kolonlar: Yenileme Ayı, Yenileme mi?, Yenileme Ayı Not, RÇİ, PY, Müşteri İD, Ürün ID, Söz. ID, Söz. Tipi, Bitiş/Başlama Tarihi, Ekip (SAS/TES/MoS), Kategori, Ürün Adı, Şehir, İlçe, Müşteri Statüsü, Yenileme Öncesi Tutar, X Count, **PY Tahmin**, **Yenilememe Sebep**, PY Tahmin Not, **Yenileme Durumu** (Yenilendi / Yenilemedi / Bağlantı / Randevu Vermedi…), Yenilenen Tutar\n   - `Customer Bazında Yenileme Tablosu`: aynı veri customer bazında (provider count, X count, toplam fiyat)\n   - `Pivot Tablo (Provider)` / `Pivot Tablo (Customer)`: ay bazında ciro / adet / X / customer yenileme %, 1-1 hedef %\n   - `Renewal Target`: aylık Target Renewal, Renewed Value, kümüle hedef ve **1-1 Gerçekleşen %**\n   - `Mail`: aylık özet maili tablosu (**mekan kapanışları hariç** SAS+TES; ciro bazında 1-1 hedef % ve provider yenileme %)\n   - `Upsell`: yenilemede upsell / yeni provider eklenen müşteriler ve notları\n   - `Pro Start_Renewal`: MoS Pro Start ürünlerinin yenileme takibi (3 aylık ürün)\n   - `Decay Takip` / `Decay Dağılımı`: aylık decay çalışmasının sonucu (bkz. decay maddesi)\n   - `Referans`: PY referans / ikna aramaları Faz 1 ve Faz 2 PY bazında müşteri sayısı ve tutar\n- **Kim doldurur:** liste BU (Nes) tarafından her ay Qlik'ten hazırlanır; `PY Tahmin`, `Yenilememe Sebep`, `PY Tahmin Not` kolonlarını PY'ler doldurur; `Yenileme Durumu` ay içinde güncellenir.\n- **Ne sıklıkla:** her ay yeni yenileme ayı eklenir (hazırlık adımları: 'PY Yenileme Tahmin dosyası nasıl hazırlanır').\n- **Dikkat:** `Yenileme mi?` = 'Yenileme Değil' satırlar (ör. vade planı hatası, mekan kapanışı öncesi sayfa kapanışı) oranlardan çıkar; notu `Yenileme Ayı Not`'a yazılır.", "tags": ["yenileme", "renewal", "sheet", "PY", "drive"], "source": "Google Drive > PY Yenileme Tahmin Dosyaları > 1. Renewal Data_2025-26", "links": [{"label": "1. Renewal Data_2025-26", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit"}, {"label": "PY Yenileme Tahmin Dosyaları (klasör)", "url": "https://drive.google.com/drive/folders/1ii7j0tT5RFlzhRXNEtQd0zgSKiPfRv4o"}], "updated": "2026-11-25"}, {"id": "ld-6", "cat": "Metrikler & tanımlar", "kind": "bilgi", "pin": false, "title": "Firma Skoru: kimde, nerede görünür, veri nereden gelir", "tldr": "Firma Skoru sadece venue (category_type = venue) provider'lar için, provider bazında hesaplanır; panelde 4 yerde görünür; veri Qlik feed'inden her sabah 08:30'da güncellenir.", "body": "- **Kimde:** sadece `category_type = venue` provider'lar; Big 5 / Others için eski 'profil kalite skoru' değişmeden kalır. Kullanıcının hiç mekan provider'ı yoksa panelinde değişiklik olmaz.\n- **Nerede (panel):** ana sayfa sabit kartı · Sayfalarım'daki provider kartları · İstatistikler > Sayfa İstatistikleri · İstatistikler > Rakip Analizi (rakiplerin skor ve sıralaması). CRM'de PY takibi için de görünür.\n- **Veri:** data ekibinin Qlik feed'i, günlük, her sabah **08:30**. Feed kolonları: 'Feed Metrikleri' sheet'i.\n- **Firmaya anlatılan metin:** 'Bilgilendirme Metni - IT' dokümanı ilk lansman metnidir; canlıya çıktıktan sonra **güncellenmiyor**, sonraki değişiklikler doğrudan canlı düğün.com panelinde yapıldı. Güncel metrik ve puanlar: 'Yarışma Metrikler-IT' > 'Ağustos 2026 Revize' sekmesi (Nes 26.11.2026).\n- **IT brief'i:** 'Yarışma IT işi' (venue) ve 'BIG5 - Yarışma IT işi'.", "tags": ["firma skoru", "performans ligi", "panel", "venue"], "source": "Google Drive > Yarışma ve Ödüller (Yarışma IT işi, Bilgilendirme Metni - IT)", "links": [{"label": "Yarışma IT işi", "url": "https://docs.google.com/document/d/10W-UMiO6cBN5W8o-zdAytH_-MGfMH7kMT6CIJ2ZuQpg/edit"}, {"label": "BIG5 - Yarışma IT işi", "url": "https://docs.google.com/document/d/1YV-EvSvOp8rqkMFigFIsHX0lcLqGXcw00wBuTTjZkZo/edit"}, {"label": "Bilgilendirme Metni - IT (ilk lansman, güncellenmiyor)", "url": "https://docs.google.com/document/d/1O3JpQdFqaKyIAP_ZFiHE1K6LjWkUAb7aLm3mvjfBXXU/edit"}, {"label": "Feed Metrikleri", "url": "https://docs.google.com/spreadsheets/d/1gKe6Hl1KsWF3VrjbGgpRSmzi9Dzoc2W4SOcJ2DaqrgI/edit"}, {"label": "Yarışma Metrikler-IT", "url": "https://docs.google.com/spreadsheets/d/1yOqytvK1T5_WEOm-tBwHPz2bae7-8cre4wQPJIVOu5Q/edit"}], "updated": "2026-11-25", "rev": 1}, {"id": "ld-7", "cat": "Sözleşmeler", "kind": "kural", "pin": false, "title": "Sözleşme tipleri, ödeme tipleri, vade farkı ve KDV", "tldr": "Projeli (SAS'ın çoğu) ve KDV'li projesiz (tüm TES + bazı SAS) sözleşmelerde vergi farklıdır: projeli peşinde 600 TL, projesizde 9.900 TL ve üzeri faturada %14 tevkifatlı, altında %20 KDV.", "body": "- **Sözleşme tipi:**\n   - **Projeli:** SAS satışlarının büyük çoğunluğu. Güncel durumda **hiçbir TES satışı projeli olamaz.** CRM'de proje alanı doluysa projeli, boşsa projesiz.\n   - **KDV'li (projesiz):** tüm TES satışları + bazı SAS satışları.\n- **Ödeme tipleri:**\n   - Aylık · Kredi kartı (otomatik yenilemeli eski sistem; sözleşmede 12 aylık 'tek çekim' ödeme planı varsa kesinlikle aylıktır).\n   - Peşin: direkt ödeme (ödeme planı oluşmaz) · havale · çek (en fazla 6 çek) · senet (en fazla 6 senet) · kredi kartına taksit (tek satır toplam + 'tek çekim / 3-6-12 taksit').\n- **Vade farkı (sadece peşinde):** oran %15. Kredi kartında 6 taksite kadar farksız, üstü vade farklı. Çek/senette 4 aya kadar farksız, üstünde aylık rate'ten vade farkı; 6 aydan uzun vade girilemez.\n- **KDV:**\n   - Projeli aylık: vergi eklenmez. Projeli peşin: sözleşme toplamına **600 TL** (sadece 3.000 TL'ye %20 KDV = 600 TL; 3.000 TL tabanı değişirse 600 TL de değişir).\n   - Projesiz **tevkifatlı:** 9.900 TL ve üzeri faturalarda, KDV %14.\n   - Projesiz **tevkifatsız:** 9.900 TL altı faturalarda, KDV %20. Şirket vergi mükellefi değilse tevkifatsız fatura: CRM > Müşteriler > Düzenle > Şirket Türü = 'Vergi mükellefi değil'.\n- **Değişebilecek parametreler:** vade farkı %15, KDV %20 / %14, tevkifat sınırı 9.900 TL, projeli vergi 600 TL, taksit (>6) ve çek/senet (>4 ay) sınırları — kullanmadan önce güncelini kontrol et.\n- Yeni SAS sözleşme formatı ve KDV kuralının son hali için yerel `6 Contracts/Agreements` klasörüne de bak.", "tags": ["sözleşme", "KDV", "tevkifat", "projeli", "vade farkı", "ödeme tipi"], "source": "Google Drive > Sözleşme Tipleri (Google Doc)", "links": [{"label": "Sözleşme Tipleri (doküman)", "url": "https://docs.google.com/document/d/1CgNU-mivkSWrLDcejK7jIp4T6LljYTZQjJAxNe1-Wtc/edit"}], "updated": "2026-11-25"}, {"id": "ld-9", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "04/2025 – Referans Kampanyası başladı", "tldr": "Nisan 2025 kampanya takvimiyle 'Düğün.com'u Tavsiye Eden Kazanıyor!' referans kampanyası açıldı: 10K'ya varan Hepsiburada hediye çeki, hedef kitle NPS'te yüksek puan veren paid firmalar.", "body": "- **Tema:** 'Düğün.com'u Tavsiye Eden Kazanıyor!' — 2025 Kampanya Takvimi'nde Nisan 2025.\n- **Kurgu:** NPS anketinde yüksek puan (7-10) verenlere özel mail / bildirim; refere ettiği firma satın alınca hediye çeki (+1 ay bedava fikri de vardı).\n- **İlk kayıtlar:** Mart 2025'te (B2B Form talepleri), ilk çekler 21.04.2025'te iletildi.\n- **Aynı takvimdeki diğer 2025 temaları:** Şubat 2025 Sevgililer Günü ('Aşk İçin Çalışıyoruz'), Mart 2025 Demo Paketi ('6 ay kullan 5 ay öde' Winner 3X; '12 ay kullan 10 ay öde' Winner 2/4/6X).", "tags": ["referans", "kampanya", "2025", "kilometre taşı"], "source": "Google Drive > 2025 Kampanya Takvimi; 2025 Referans Kampanyası Takip", "links": [{"label": "2025 Kampanya Takvimi", "url": "https://docs.google.com/spreadsheets/d/1WJ5664YgmPfNSPOIfXC17sk87c-M9b-ygOtNH41hGDY/edit"}, {"label": "2025 Referans Kampanyası Takip", "url": "https://docs.google.com/spreadsheets/d/1o_CtvFfHQvwK-imtSse95lzaTkOnKiY_Pu66HRITO-U/edit"}], "updated": "2025-04-21"}, {"id": "ld-10", "cat": "Nasıl yapılır", "kind": "nasil", "pin": false, "title": "PY referans / yenileme ikna aramaları", "tldr": "Yenilemeyen ama performansı iyi olan firmalar PY tarafından 'proje araması gibi hissettirmeden' aranır, satışa randevuya yönlendirilir; sonuç 1. Renewal Data_2025-26'daki takip kolonlarına yazılır.", "body": "- **Amaç:** yenileme yapmamış ama verimli firmaları geri kazanmak.\n- **Kitle:** <6 ay önce churn olmuş, satışta bağlantıda olmayan (kesin ret) firmalar. Faz 1 = 100 firma, 1 hafta (27–30 Nisan; dokümanda yıl yok). Seçim: 'Yeniler' tahminli + skor Yeşil/Sarı + şehir-kategori ortalaması veya üstü.\n- **Operasyon:** yenileme dosyasının yanında takip kolonları (py ikna araması – ikna sonuç kodu – not) → `1. Renewal Data_2025-26`; `Referans` sekmesinde Faz 1 / Faz 2 PY bazında sayı ve tutar. Randevuya ikna olanlar anında Slack 'ikna turu' kanalından Nes'e bildirilir. PY'nin yönlendirdiği her randevu ve 1 ay içinde yenileyen her firma için **prim**.\n- **Script özeti:** samimi şaşkınlıkla giriş ('portföye bakıyordum, sayfanız hâlâ kapalı') → aciliyet (çiftlerin en çok anlaşma yaptığı dönem) → yenilikler (Instagram/WhatsApp linki, etkileşim takip ekranı, '360') → satışla randevu. Satış görüşmesi gibi hissettirmemek temel kural.\n- **İtirazlar:** pahalı → 'size özel paket hazırlasınlar, rakamı duymadan karar vermeyelim'; Instagram yeter → 'çiftler önce düğün.com'a gelir, şu an sadece rakiplerinizi görüyor'; memnun kalmadık → 'yeni dönemde süreç değişti'; meşgulüm → 'sadece randevu saatini belirleyelim'.", "tags": ["referans", "ikna", "yenileme", "PY", "churn"], "source": "Google Drive > PY Referans Aramaları (Google Doc)", "links": [{"label": "PY Referans Aramaları (doküman)", "url": "https://docs.google.com/document/d/1mOPE9G-7nCaPHh4qjudwr4VW3Jkd7cTBh9uXGRlpe-I/edit"}, {"label": "1. Renewal Data_2025-26 (Referans sekmesi)", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit"}, {"label": "Referans Aramaları - Sonuçlar (dosya)", "url": "https://drive.google.com/file/d/1cdi4aQzCWelk856zSZZmvLGzeCrG1vRz/view"}], "updated": "2026-11-25"}, {"id": "ld-12", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Hedefe Kalanlar sheet'i (PY yenileme aksiyon listesi)", "tldr": "Yenileme ayına göre PY başına sekmeli liste: PY tahmini, yenilememe sebebi ve 'Alınması Planlanan Aksiyon'; ayrıca 'Kalan Power Startlar' sekmesi.", "body": "- **Sekmeler:** `Sayfa1` (tümü), PY başına: Nida, Mine, Sinem, Bera, Kübra, Yiğit; `Kalan Power Startlar`.\n- **Kolonlar:** ALL_new ile aynı (Yenileme Ayı, RÇİ, PY, Müşteri İD, Söz. ID, Ürün Adı, Yenileme Öncesi Tutar, X Count, PY Tahmin, Yenilememe Sebep, PY Tahmin Not) + **Alınması Planlanan Aksiyon** / Yenileme Durumu.\n- **Kullanım:** hedefe kalan tutarı kapatmak için PY'lerin hangi firmada ne aksiyon alacağını takip; Ekim–Aralık 2026 satırları var.\n- Benimle paylaşılan (Shared with me) dosya; sahibi başka biri olabilir.", "tags": ["yenileme", "hedef", "PY", "power start"], "source": "Google Drive > Shared with me > Hedefe Kalanlar", "links": [{"label": "Hedefe Kalanlar", "url": "https://docs.google.com/spreadsheets/d/19dK-YiscCu9p2Vh5dy9w5Sx30Cc05xJU9QW_snlT-mg/edit"}], "updated": "2026-11-25"}, {"id": "ld-13", "cat": "Raporlar & paneller", "kind": "bilgi",
