 "pin": false, "title": "PY Call List (haftalık, PY başına flag listesi)", "tldr": "Her hafta yeni bir 'PY Call List <tarih>' sheet'i açılır: PY başına sekmede firmanın hafta başı flag durumu (kampanya, dönüş oranı, dönüş süresi, son görülme) ve PY'nin aksiyonu.", "body": "- **Sıklık:** haftalık (Temmuz–Ekim 2026 arası her hafta bir dosya: 6 Temmuz … 5 Ekim).\n- **Sekmeler:** Yiğit, Mine, Kübra, Bera, Nida, Sinem · `PY Feedbacks` (sahadan gelen geri bildirimler) · `Weekly Report` (PY başına kampanya aksiyonu adet/%) · `Task-Sorumlu Dağılımı`.\n- **Kolonlar:** Firmanın Hafta Başındaki Flag Durumu, Provider, Customer ID, Link, Kampanya / Dönüş Oranı / Dönüş Süresi flag'i var mı, Son Görülme…\n- Drive klasörü: `PY Call List`.", "tags": ["PY", "call list", "flag", "haftalık"], "source": "Google Drive > Shared with me > PY Call List 5 Ekim", "links": [{"label": "PY Call List 5 Ekim (en yeni)", "url": "https://docs.google.com/spreadsheets/d/1Y0OUhHgWchFa4YRqEqmbuhjC02511XgrVNX2MSogL6Q/edit"}, {"label": "PY Call List (klasör)", "url": "https://drive.google.com/drive/folders/1SHMES50qijShh2oOY_mDD7mZqj_f8mHN"}], "updated": "2026-11-25"}, {"id": "ld-14", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Provider Alarm Log (Kümülatif)", "tldr": "Günlük alarm kaydı: sözleşmesi / provider'ı pasife düşen ödemeli firmalar, kaç gündür pasif, borç durumu, reject tipi ve sorumlu PY.", "body": "- **Kolonlar:** Gün, Alarm (ör. 'Sözleşme + Provider Pasifte'), Provider ID, Kategori, Ürün, Şehir, Son Aktif, Pasif Gün, Yenileme İhtimali, Agr. Durum, Sözleşme ID, Perf. Yön., CRM Link, CRM Durum, Borç Durumu, Ürün Silinme Durumu, Merge ID, Agr. Reject Type / Value / Note.\n- **Kullanım:** yolda kaybı (decay) erken görmek; PY'nin firmayı araması. Kayıtlar 31.07.2026'dan itibaren.\n- Benimle paylaşılan dosya.", "tags": ["alarm", "pasif", "decay", "PY"], "source": "Google Drive > Shared with me > Provider Alarm Log (Kümülatif)", "links": [{"label": "Provider Alarm Log (Kümülatif)", "url": "https://docs.google.com/spreadsheets/d/1xdErJ6DsAYzOjQyIAn2vpWXkw8xgn78y9v7UF-eXJwc/edit"}], "updated": "2026-07-31"}, {"id": "ld-15", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "PrimNOW – SAD ve Saha Randevu veri girişi", "tldr": "SAD'ın aldığı ve sahanın gerçekleştirdiği randevuların kaydı: tarih, müşteri, il, randevuyu alan, kategori, satış türü (yeni/yenileme), toplantıyı yapan, sonuç.", "body": "- **Kolonlar:** Tarih, Customer ID, RÇİ ID, Müşteri, İl, Randevuyu Alan, Kategorisi, Satış Türü, Toplantıyı Gerçekleştiren, Toplantı Sonucu (Bağlantı …).\n- **Kullanım:** SAD / saha randevu primi (PrimNOW) ve randevu → satış dönüşümü. Kayıtlar Eylül 2026'dan.\n- İlgili: 'Satış Metrikleri' (SAD görüşme sayıları), yerel `4 Sales Dashboards/Sales Support - Call List Dashboard (SAD)`.", "tags": ["SAD", "randevu", "saha", "prim"], "source": "Google Drive > Shared with me > PrimNOW – SAD ve Saha Randevu Veri Giriş", "links": [{"label": "PrimNOW – SAD ve Saha Randevu Veri Giriş", "url": "https://docs.google.com/spreadsheets/d/1nuQtIBPcwBmy6kTx6oonZZ6bfvGAwpyfhCeLaWAZ6HU/edit"}], "updated": "2026-09-07"}, {"id": "ld-16", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Satış Metrikleri (günlük / aylık SAS-TES-SAD)", "tldr": "SAS ziyaret adedi/süresi, TES görüşme adedi/süresi, SAD görüşme sayıları ve yeni/yenileme ciroları günlük ve aylık tutulur.", "body": "- **Sekmeler:** `GÜNLÜK_YENİ` (günlük), `AYLIK_YENİ` (ay toplamı), `Metrik Birimleri` (adet / dakika / TL).\n- **Metrikler:** SAS ziyaret adedi (toplam / yeni / yenileme), ziyaret süresi, SAS satış ciroları (yeni / yenileme); TES görüşme adedi / süresi, TES ciroları; SAD görüşme metrikleri.\n- Veri Mart 2026'dan; Mayıs 2026 sonrası aylık satırlar boş görünüyor (güncel mi kontrol et).", "tags": ["satış", "SAS", "TES", "SAD", "metrik"], "source": "Google Drive > Satış Metrikleri", "links": [{"label": "Satış Metrikleri", "url": "https://docs.google.com/spreadsheets/d/1R-rpm5-3yBGGlFzzMIJZbc72gFOZ_-TBahqrH9t5vqs/edit"}], "updated": "2026-04-30"}, {"id": "ld-17", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "HEDEF_Takip_2025-26 (Adet / X / TL haftalık hedef takibi)", "tldr": "Aktif portföyün hedefe göre Adet, X ve TL bazında ay ve hafta kırılımında gerçekleşen yüzdesi.", "body": "- **Satırlar:** Adet, X, TL, Churn (sadece venue).\n- **Kolonlar:** her ay için hedef, haftalık gerçekleşen (ör. Ağu_11 / 18 / 25), ay sonu gerçek, gerçek %.\n- Örnek: Temmuz hedef 2.564 adet → 2.445 (%95); TL hedef 32,75 M → 30,84 M (%94).\n- Hedef dosyaları için yerel `1 Renewals/New Sales & Renewal Targets-Monthly`'ye de bak.", "tags": ["hedef", "target", "aktif portföy"], "source": "Google Drive > HEDEF_Takip_2025-26", "links": [{"label": "HEDEF_Takip_2025-26", "url": "https://docs.google.com/spreadsheets/d/1abj9OlVLZQP9hiTGk0STj0PwLEtIhQ5hg4dM8H5YXu4/edit"}], "updated": "2026-11-25"}, {"id": "ld-18", "cat": "CRM & Sözleşme", "kind": "nasil", "pin": false, "title": "Provider taşıma işlemleri kaydı", "tldr": "Ticari unvan değişikliği vb. ile taşınan paid provider'lar tek sheet'te loglanır; taşımada ödeme planı bozulduysa ISD işi açılıp düzeltilir.", "body": "- **Kolonlar:** tarih, Taşınan Paid Provider ID, RÇİ, Eski Link, Yeni Link, Ürün taşıma sebebi (ör. Ticari ünvan değişikliği), En yakın ödenmemiş vade tarihi, Stage ('İşlem yapılmalı, ödeme planı bozuldu' / 'İşleme gerek yok, tek provider'), iş no (ISD-…), Güncelleme ('Ödeme planı düzeltildi').\n- **Kural hatırlatma:** feragatname / devir dilekçesi ve borçta finans onayı şartları için mevcut 'Ticari unvan kontrolü ve provider taşıma' maddesine bak.\n- Belgeler: Drive `Provider Taşıma - Ticari Unvan` klasörü.", "tags": ["provider taşıma", "ticari unvan", "CRM", "ödeme planı"], "source": "Google Drive > Provider Taşıma İşlemleri", "links": [{"label": "Provider Taşıma İşlemleri", "url": "https://docs.google.com/spreadsheets/d/1ktLKrxVj_0tZgLJhyr0hr8MZau6DRuQRCtwEuqpK_GA/edit"}, {"label": "Provider Taşıma - Ticari Unvan (klasör)", "url": "https://drive.google.com/drive/folders/15fB1Y3IWmBhkgKd8erSvmn0BGGO0qkSg"}], "updated": "2026-11-25"}, {"id": "ld-19", "cat": "CRM & Sözleşme", "kind": "nasil", "pin": false, "title": "Erken yenileme manuel çekim takibi", "tldr": "Erken yenilemede otomatik çekim/alarm çalışmayan firmalar için vade çekim tarihi ve sorumlu kişi bir sheet'te takip edilir.", "body": "- **Kolonlar:** Deadline, RÇİ, Firma Adı, Sorumlu, Status (Tamamlandı…), Vade Çekim Tarihi, Sözleşme Tarihi, Ürün Bitiş Tarihi, Tatil mi, Not, Dosya.\n- **Neden:** yayın ödeme alınmadan önden açılırsa ödeme tarihinde çekim olmazsa otomatik alarm maili gelmez → manuel takip zorunlu (bkz. 'Erken yenileme nasıl çalışır').\n- `Sheet2`: SAS sorumlusu ve paket/aylık tutar listesi.\n- Klasör: `Erken Yenilemeler`.", "tags": ["erken yenileme", "manuel çekim", "ödeme"], "source": "Google Drive > Erken Yenileme Takip - Manuel Çekim Firmaları", "links": [{"label": "Erken Yenileme Takip - Manuel Çekim Firmaları", "url": "https://docs.google.com/spreadsheets/d/17xfmKpU--7m4YyyTnW2L-QkqPlSi0UV3aKa4vwfS6_Y/edit"}, {"label": "Erken Yenilemeler (klasör)", "url": "https://drive.google.com/drive/folders/1qkvnN-0iKv5xPu1hT1eFFCM8QZ2YZftC"}], "updated": "2026-11-25"}, {"id": "ld-20", "cat": "CRM & Sözleşme", "kind": "nasil", "pin": false, "title": "Upgrade kampanyalı ürünler kaydı (ilk 3 ay üst paket)", "tldr": "Upgrade kampanyasıyla (ilk 3 ay üst paket, sonra satılan paket) satılan sözleşmelerde manuel açılan ürün ve iş ID'si bir sheet'te tutulur.", "body": "- **Kolonlar:** İşlem Tarihi, Provider ID, RÇİ, Satış Yapılan Sözleşme ID, Manuel Açılan Sözleşme ID (iş yapılınca silinir), Link, İş Açıldı mı?, İş ID, Upsell.\n- **Kritik:** 9 aylık ürünün önceki ürün id'si olarak 3 aylık ürün işaretlenmeli, yoksa yenileme/churn raporları bozulur (bkz. 'Önceki ürün bağlama').\n- Yenileme listesinde bu ürünler 'Upgrade kampanyalı ürün (ilk 3 ay üst paket), 9 ay yayınlanmış' notuyla gelir.", "tags": ["upgrade", "kampanya", "önceki ürün", "CRM"], "source": "Google Drive > Upgrade Kampanyalı Ürünler", "links": [{"label": "Upgrade Kampanyalı Ürünler", "url": "https://docs.google.com/spreadsheets/d/1iw1ud--0pjy3iXtHOY_zf_N31gzq4vZ23kUIocGuHEE/edit"}], "updated": "2025-11-06"}, {"id": "ld-21", "cat": "Fiyat & Kampanya", "kind": "nasil", "pin": false, "title": "PY yenileme fiyat hesaplama tablosu", "tldr": "PY'lerin yenileme teklifinde kullandığı hesap tablosu: son ay vadesi ve yıl içindeki enflasyon güncellemesi sayısı girilir; önce liste fiyatı söylenir.", "body": "- **Girdi:** son ay vadesi; yıl içinde kaç kez enflasyon güncellemesi aldığı (vergi değişikliği veya paket/ürün değişikliği enflasyon artışı değildir; enflasyon artışı **yaklaşık %16** olmalı, emin değilsen yöneticiye sor).\n- **Kural:** firmaya **mutlaka önce liste fiyatı** söylenir, sunulan fiyat avantajı vurgulanır.\n- Yenileme tabanı kuralı için mevcut 'Yenileme tabanı ×1,4' maddesine bak.", "tags": ["yenileme", "fiyat", "PY", "enflasyon"], "source": "Google Drive > PY Yenileme - Fiyat Hesaplama Datası", "links": [{"label": "PY Yenileme - Fiyat Hesaplama Datası", "url": "https://docs.google.com/spreadsheets/d/1j1YvMHrzb1xu9aMJVQN59uXJee09hTQj9vvaDkjvT6k/edit"}, {"label": "Turbo Fiyat Hesaplama Listeler (klasör)", "url": "https://drive.google.com/drive/folders/1B7WW6vSJM0SyvTBgUZ_HFZfWtUaVmRwD"}], "updated": "2026-11-25"}, {"id": "ld-22", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Firma Süreçleri (satışa iletilen kritik vakalar)", "tldr": "PY'lerin satışa ilettiği kritik firma vakaları (P1 vb.) tek sheet'te: kategori, ileten PY, durum, iletim/sonuç tarihi, CRM linki, olay özeti.", "body": "- **Kolonlar:** Kritiklik Seviyesi (P1…), Kategori (Yeni Satış…), İleten PY, Status, Satışa İletim Tarihi, Sonuçlanma Tarihi, Provider, CRM Link, Olay Özet, Dosya, Detaylar.\n- Örnek vaka (21.05.2026): yıkım kararı nedeniyle caymasız kapanış sonrası aynı kişiye asın\" button. First step: send 10 November-list firms a one-page basket PDF with a callback link. Panel feasibility not checked.", "source": "muse test, upsell count", "status": "yeni", "reason": ""}, {"date": "09.11.2026", "title": "Tuşla Sonuç", "text": "3 days after a firm presses 1, the same automatic call asks the outcome (reached / offer given / booked / date full / could not reach) and fills the lead's sonuç kodu, giving a booking signal in days instead of months. Self-reported, so check against WP feedback. First step: PY asks 20 firms the five-option question about last week's leads and records the answer rate.", "source": "muse, lead auto-call feature", "status": "yeni", "reason": ""}, {"date": "09.11.2026", "title": "Yedek Firma", "text": "If a firm presses 2 or ignores the call and the lead stays unanswered, a couple with fewer than 6 leads gets a WhatsApp offering 2 fast similar firms. First step: count Aug-Oct unanswered leads of such couples that had a Yeşil firm in the same category and city. Technical feasibility not checked.", "source": "muse, lead auto-call feature", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "15 Dakikanın Reçetesi", "text": "Turn the screens and their order from the 23 visits with 15+ minutes of D-One into a ready \"Saha ziyareti\" template on Listelerim's customer page. First step: compare `rp_visit.modules` of those 23 rows, signed vs not signed, and write one 5-step flow. Causality is a guess on 23 visits.", "source": "muse, sales meeting deck", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "Duyduk, Ekledik", "text": "When a Görüşmelerim transcript holds an upsell signal (new venue, the firm asks for more), D-One prefills the Upsell Stüdyosu Ekleme talebi. First step: read the transcripts since 15.10.2026 by hand and count such signals for firms not on the list. Volume not checked.", "source": "muse, sales meeting deck", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "Zincir Haritası", "text": "Tag hotel pages by brand and parent group and show paid / churned / never-paid per group, so each unsold hotel gets a ready proof line from its sister properties. First step: match 15 brand names in `dw_provider_master` and count paid / unpaid per group. Number of unsold hotels not checked.", "source": "muse, otel referans dosyası", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "Referans Kulübü", "text": "Long-standing upper-segment hotels agree to one peer call per quarter and a 60-second phone video, in return for a named place in the reference file and a \"Referans Otel\" plaque. First step: SAS owners ask the 8 no-video hotels the one question, starting with Le Méridien Etiler. Willingness and brand rules not checked.", "source": "muse, otel referans dosyası", "status": "yeni", "reason": ""}, {"date": "17.11.2026", "title": "Çift Önerisi Paketi", "text": "A campaign gift: N WhatsApp pushes of the firm to its best-matching couples in one month, measured by leads from those couples. First step: run the couple list for 5 early-renewal firms and count couples scoring above zero. Feasibility not checked.", "source": "muse, Kampanya Stüdyosu", "status": "yeni", "reason": ""}, {"date": "17.11.2026", "title": "Talep Garantili 60 Gün", "text": "A committed minimum lead count in the first 60 days of a new Welcome firm; a shortfall adds days to the term, never a refund. First step: pull first-60-day leads of the Eylül Welcome firms to see what minimum is safe.", "source": "muse, Kampanya Stüdyosu", "status": "yeni", "reason": ""}, {"date": "17.11.2026", "title": "Fiyat Kilidi / Getir, Ay Kazan / Boş Tarih Vitrini", "text": "Three more campaign mechanisms: skip the next inflation raise when signing by a date; a paying venue refers a vendor and gets +1 month when TES signs it; venues list unsold near dates that are pushed to couples with close wedding dates. None checked for feasibility. Already used in the Aralık 2026 drafts: B async function copy(text, okMsg){

  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";

}

/* dates (ISO yyyy-mm-dd strings, local) */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const pdate = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const dayDiff = (a,b) => Math.round((pdate(b)-pdate(a))/864e5);
const addDays = (s,n) => { const d=pdate(s); d.setDate(d.getDate()+n); return iso(d); };
/* dates (Nes 26.11.2026): short dates dd.mm.yyyy; headlines long, "15 Ocak 2027 Cuma" (flong) */
const fdate = s => { if(!s) return ""; const d=typeof s==="string"?pdate(s.slice(0,10)):s; return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; };
const flong = s => { if(!s) return ""; const d=typeof s==="string"?pdate(s.slice(0,10)):s; return `${d.getDate()} ${AY[d.getMonth()+1]} ${d.getFullYear()} ${GUN[d.getDay()]}`; };
const dLabel = s => fdate(s);
function dueLabel(s){
  if(!s) return "";
  const n=dayDiff(TODAY(), s);
  if(n<0) return n===-1 ? "dün" : `${-n} gün gecikti`;
  if(n===0) return "bugün"; if(n===1) return "yarın";
  if(n<7) return GUN[pdate(s).getDay()];
  return dLabel(s);
}

/* No server (Nes 23.11.2026): the build script (build_html.py) puts the data into the page as window.PANEL_DATA.
   What Nes changes in the page lives in this browser's localStorage. New items that Claude adds to data/store.json or
   data/library.json reach the page at the next build: seed items whose id the browser has never seen are merged in;
   items she deleted stay deleted. "Yedek al / Yedek yükle" moves her data between browsers. */
function storeGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function mergeSeed(seed, localKey, seenKey, lists){
  const local=storeGet(localKey); const seen=new Set(storeGet(seenKey)||[]);
  let out;
  if(!local) out=JSON.parse(JSON.stringify(seed));
  else{
    out=local;
    lists.forEach(k=>{ out[k]=out[k]||[]; const have=new Set(out[k].map(x=>x.id)); (seed[k]||[]).forEach(x=>{ if(!have.has(x.id) && !seen.has(x.id)) out[k].push(x);
      /* a seed item with a higher "rev" replaces the browser copy (corrections Claude makes to existing notes) */
      else if(x.rev){ const j=out[k].findIndex(y=>y.id===x.id); if(j>-1 && (out[k][j].rev||0)<x.rev) out[k][j]=JSON.parse(JSON.stringify(x)); } }); });
    if(seed.decisions){ out.decisions=out.decisions||{}; Object.entries(seed.decisions).forEach(([k,v])=>{ if(!(k in out.decisions) && !seen.has("dec:"+k)) out.decisions[k]=v; }); }
    ["jnotes"].forEach(k=>{ if(seed[k] && !out[k]) out[k]=JSON.parse(JSON.stringify(seed[k])); });
    if(seed.last_day && !out.last_day) out.last_day=seed.last_day;
    if(seed.categories){ out.categories=[...new Set([...(out.categories||[]), ...seed.categories])]; }
  }
  const ids=lists.flatMap(k=>(seed[k]||[]).map(x=>x.id)).concat(Object.keys(seed.decisions||{}).map(k=>"dec:"+k));
  storeSet(seenKey, [...new Set([...seen, ...ids])]); storeSet(localKey, out);
  return out;
}
async function load(){
  const P=window.PANEL_DATA;
  if(!P){ $("view").innerHTML=`<div class="empty">Veri bulunamadı. Sayfayı <code>build_html.py</code> ile yeniden oluştur.</div>`; return false; }
  D=JSON.parse(JSON.stringify(P));
  D.store=mergeSeed(P.store||{todos:[],projects:[],goals:[]}, "np_store", "np_seen_store", ["todos","projects","goals","handovers"]);
  D.store.todos=D.store.todos||[]; D.store.projects=D.store.projects||[]; D.store.goals=D.store.goals||[]; D.store.handovers=D.store.handovers||[]; D.store.jnotes=D.store.jnotes||{}; D.store.last_day=D.store.last_day||"2027-01-15";
  D.library=mergeSeed(P.library||{items:[]}, "np_library", "np_seen_lib", ["items"]);
  D.tracker={ok:false, static:true, items:[]};
  loadedAt=P.built ? new Date(P.built) : new Date();
  return true;
}

function importBackup(){

}

/* ---------- domain: to-dos, projects, targets ---------- */
const todos = () => D.store.todos;
const projects = () => D.store.projects;
const goals = () => D.store.goals;
const proj = id => projects().find(p=>p.id===id);
const isOpen = t => t.status !== "done";
const isLate = t => isOpen(t) && t.due && t.due < TODAY();
const isToday = t => isOpen(t) && t.due === TODAY();
const PRIO = {"yüksek":0,"orta":1,"düşük":2};
const byPrio = (a,b) => (PRIO[a.priority]??1)-(PRIO[b.priority]??1) || (a.due||"9999").localeCompare(b.due||"9999");
function todoTargets(t){ return t.targets||[]; }   // only links set on the to-do itself count (no inheritance from the project)

/* team targets come from the monthly "İlk N Ay analiz" workbook (9 Monthly Campaigns/data/hedef) */
const H = () => D.hedef || {};
const pct = (a,b) => b ? Math.round(a/b*100) : null;
const hDurum = p => p==null ? null : p>=100 ? "ok" : p>=85 ? "near" : "bad";
const HET = {ok:"Hedefte", near:"Yakın", bad:"Geride"};
function lastAy(){ const r=(H().ekip_aylik||[]).filter(r=>r.gerceklesen!=null); return r.length ? Math.max(...r.map(r=>r.ay_no)) : null; }
function teams(){ return [...new Set((H().ekip_aylik||[]).filter(r=>(r.hedef!=null||r.gerceklesen!=null) && r.ekip!=="MoS - Yenileme").map(r=>r.ekip))]; }   // MoS never renews
function teamStat(ekip){
  const rows=(H().ekip_aylik||[]).filter(r=>r.ekip===ekip); const ay=lastAy();
  const last=rows.find(r=>r.ay_no===ay && r.hedef!=null && r.gerceklesen!=null);
  const done=rows.filter(r=>r.hedef!=null && r.gerceklesen!=null);
  const ytdH=done.reduce((s,r)=>s+r.hedef,0), ytdG=done.reduce((s,r)=>s+r.gerceklesen,0);
  const nx=(H().sonraki_ay_hedef||[]).find(r=>r.ekip===ekip);
  const b = last ? pct(last.gerceklesen,last.hedef) : null;
  return {ekip, ay:last?last.ay:null, hedef:last?last.hedef:null, ger:last?last.gerceklesen:null, basari:b, durum:hDurum(b), next:nx?nx.hedef:null, nextAy:nx?nx.ay:null, ytdH, ytdG, ytdPct:pct(ytdG,ytdH)};
}
function allTargets(){ return teams().map(t=>({key:"ekip:"+t, label:t, kind:"ekip"})).concat(goals().map(g=>({key:"goal:"+g.id, label:g.title, kind:"goal"}))); }
function targetLabel(k){ if(k.startsWith("ekip:")) return k.slice(5); const g=goals().find(g=>"goal:"+g.id===k); return g ? g.title : k; }
const ekipOf = c => `${c.team} - ${c.kind==="yeni" ? "Yeni" : "Yenileme"}`;
function latestCampaignMonth(){ const m=Object.keys((D.campaigns||{}).months||{}).sort(); return m[m.length-1]||null; }
function campaignsFor(ekip){ const m=latestCampaignMonth(); return m ? (D.campaigns.months[m].campaigns||[]).filter(c=>ekipOf(c)===ekip) : []; }
function support(key){
  const t=todos().filter(t=>isOpen(t) && todoTargets(t).includes(key));
  const p=projects().filter(p=>p.status!=="bitti" && (p.targets||[]).includes(key));
  const c=key.startsWith("ekip:") ? campaignsFor(key.slice(5)) : [];
  return {todos:t, projects:p, campaigns:c, total:t.length+p.length+c.length};
}
function goalProgress(g){
  if(g.mode==="todos"){ const l=todos().filter(t=>todoTargets(t).includes("goal:"+g.id)); return {p: l.length ? Math.round(l.filter(t=>!isOpen(t)).length/l.length*100) : 0, txt:`${l.filter(t=>!isOpen(t)).length} / ${l.length} iş bitti`}; }
  const p = g.target ? Math.round((+g.current||0)/(+g.target)*100) : 0;
  const u = g.unit==="₺" ? tl : (v=>fmt1(v)+(g.unit?" "+g.unit:""));
  return {p, txt:`${u(+g.current||0)} / ${u(+g.target||0)}`};
}

function waiting(){ const T=D.tracker||{}; const dm=lsGet("np_tr_dismissed")||{}; return (T.items||[]).filter(i=>(i.kind==="soru"||i.kind==="izin") && (dm[i.id]||0)<i.since).map(i=>Object.assign({}, i, {mins: Math.round(((T.now||Date.now()/1000)-i.since)/60)})).sort((a,b)=>b.mins-a.mins); }
function nextRun(){ const t=pdate(TODAY()); let d=new Date(t.getFullYear(), t.getMonth(), 24); if(d<t) d=new Date(t.getFullYear(), t.getMonth()+1, 24); const s=iso(d); const tm=new Date(d.getFullYear(), d.getMonth()+1, 1); return {date:s, days:dayDiff(TODAY(), s), forMonth:`${tm.getFullYear()}-${String(tm.getMonth()+1).padStart(2,"0")}`}; }
function decisionsCount(){ const m=latestCampaignMonth(); const dd=D.store.decisions||{}; return m ? (D.campaigns.months[m].campaigns||[]).reduce((s,c)=>s+(c.decisions||[]).filter((x,i)=>!(dd[c.id+"#"+i]||{}).done).length,0) : 0; }
function alerts(){
  const A=[]; const go=(h)=>h;
  const late=todos().filter(isLate);
  if(late.length) A.push({lvl:"bad", icon:"clock", title:`${late.length} iş gecikti`, text:late.slice(0,3).map(t=>t.text).join(" · "), act:["İşlere git", "#tasks", ()=>{S.ttab="todo"; S.tfilter="gecikmis";}]});
  // grouped (Nes 25.11.2026): one card for all teams that are behind with no linked open to-do
  const bh=teams().map(teamStat).filter(s=>s.durum==="bad" && !support("ekip:"+s.ekip).todos.length);
  if(bh.length) A.push({lvl:"near", icon:"target", title:`${bh.length} geride ekibin bağlı açık işi yok`, text:bh.map(s=>`${s.ekip} %${s.basari}`).join(" · "), act:["Hedefler", "#targets", ()=>{ S.tsel=null; }]});
  const dc=decisionsCount(); const lm=latestCampaignMonth();
  if(dc) A.push({lvl:"info", icon:"campaign", title:`${ymLabel(lm)} kampanyalarında ${dc} karar seni bekliyor`, text:"Fiyat, hediye ve kontrol grubu soruları, tek listede.", act:["Kararlara git", "#campaign", ()=>{ K.view="kararlar"; lsSet("np_k_view","kararlar"); }]});
  const nr=nextRun();
  if(nr.days<=3) A.push({lvl:"info", icon:"cal", title:`Aylık kampanya çalışması ${nr.days===0?"bugün":nr.days+" gün sonra"} (${dLabel(nr.date)} 09:30)`, text:`${ymLabel(nr.forMonth)} önerileri üretilecek. Yeni hedef dosyası geldiyse önce onu ekle.`});
  const la=lastAy(); const cm=pdate(TODAY()).getMonth()+1;
  if(la && ((cm-1-la+12)%12)>=1) A.push({lvl:"near", icon:"chart", title:`Hedef verisi ${AY[la]} ayında kaldı`, text:`${AY[(la%12)+1]} "İlk N Ay analiz" dosyası geldiyse Claude'a "hedef verisini yenile" de.`});
  const an=(D.campaigns||{}).analyses||{};
  if(an.last_closed_month){ const [y,m]=an.last_closed_month.split("-").map(Number); const t=pdate(TODAY()); const gap=(t.getFullYear()*12+t.getMonth()+1)-(y*12+m); if(gap>=2) A.push({lvl:"near", icon:"chart", title:`Kampanya analizleri ${ymLabel(an.last_closed_month)} verisinde`, text:"Bir sonraki aylık çalışmada yenilenir; acilse Claude'a \"kampanya verisini yenile\" de."}); }
  return A;
}

function todoRow(t, o){
  o=o||{}; const r=el("div","row clk"+(isOpen(t)?"":" done"));
  const p=proj(t.project); const tg=todoTargets(t);
  const due = t.due ? `<span class="due ${isLate(t)?"late":isToday(t)?"today":""}">${esc(dueLabel(t.due))}</span>` : "";
  r.innerHTML=`<input type="checkbox" class="chk" ${isOpen(t)?"":"checked"} aria-label="Bitti olarak işaretle"><div class="grow"><span class="t">${esc(t.text)}</span><span class="meta"><span class="prio ${esc(t.priority)}" title="Öncelik: ${esc(t.priority)}"></span>${due}${t.status==="doing"?'<span class="chip near">Yapılıyor</span>':""}${p&&!o.noProject?`<span class="chip"><span class="sw ${esc(p.color)}" style="width:8px;height:8px;border-radius:3px"></span>${esc(p.name)}</span>`:""}${o.noTargets?"":tg.slice(0,3).map(k=>`<span class="chip target">${esc(targetLabel(k))}</span>`).join("")}${tg.length>3&&!o.noTargets?`<span class="note">+${tg.length-3}</span>`:""}</span></div>`;
  const cb=r.querySelector(".chk");

  cb.onchange=()=>{
    const after=()=>{ if(o.onChange) o.onChange(); else render(); };
    if(!cb.checked){ t.status="todo"; t.done_at=null; saveStore(); after(); return; }
    // a ticked task waits 5 s with "Geri al" before it moves to Bitti (Nes 25.11.2026)
    r.classList.add("pending");
    const commit=()=>{ PEND.delete(t.id); t.status="done"; t.done_at=TODAY(); saveStore(); };
    const tm=setTimeout(()=>{ commit(); after(); }, 5000); PEND.set(t.id, {tm, commit});
    undoToast("Bitti olarak işaretlendi", ()=>{ clearTimeout(tm); PEND.delete(t.id); cb.checked=false; r.classList.remove("pending"); });
  };
  r.onclick=()=>todoModal(t);
  return r;
}

  const cm=pdate(TODAY()).getMonth()+1; const nx=(H().sonraki_ay_hedef||[]).filter(r=>T.includes(r.ekip));
  const nH=nx.reduce((a,r)=>a+(r.hedef||0),0), nG=nx.some(r=>r.ciro!=null) ? nx.reduce((a,r)=>a+(r.ciro||0),0) : null;

  return `<a class="slide tslide ${first?"on":""}" href="#targets" data-e="${esc(s.ekip)}"><span class="chips"><span class="chip ${esc(tm)}">${esc(tm)}</span><span class="chip ${kd==="Yeni"?"yeni":"yenileme"}">${kd==="Yeni"?"Yeni satış":"Yenileme"}</span></span><span class="v">%${s.basari}</span><div class="bar"><i style="width:${Math.min(100,s.basari)}%;background:${HCOL[s.durum]}"></i></div><dl><dt>Hedef</dt><dd>${tl(s.hedef)}</dd><dt>Ciro</dt><dd>${tl(s.ger)}</dd><dt>Yıl başından</dt><dd>%${s.ytdPct}</dd>${s.next?`<dt>${esc(s.nextAy)} hedefi</dt><dd>${tl(s.next)}</dd>`:""}</dl></a>`;
}
function buildSlider(host){
  const sl=sliderData(); if(!sl.length){ host.innerHTML=`<span class="k">Hedef</span><span class="note">Hedef verisi yok.</span>`; return; }
  host.innerHTML=`<div class="slides">${sl.map((x,i)=>x.team?teamSlide(x.team,!i):`<a class="slide ${i?"":"on"}" href="#targets"><span class="k"><span class="ico">${ic("target")}</span>${esc(x.k)}</span><span class="v">${x.p!=null?"%"+x.p:esc(x.big)}</span><div class="bar">${x.p!=null?`<i style="width:${Math.min(100,x.p)}%;background:${HCOL[hDurum(x.p)]}"></i>`:""}</div><span class="s">${esc(x.main)}</span><span class="s note">${esc(x.sub)}</span></a>`).join("")}</div><div class="dots">${sl.map((x,i)=>`<button type="button" class="${i?"":"on"}" aria-label="${i+1}. slayt"></button>`).join("")}</div>`;
  const show=i=>{ host.querySelectorAll(".slide").forEach((s,j)=>s.classList.toggle("on",i===j)); host.querySelectorAll(".dots button").forEach((s,j)=>s.classList.toggle("on",i===j)); host.dataset.i=i; };
  host.querySelectorAll(".dots button").forEach((b,i)=>b.onclick=()=>show(i));
  host.querySelectorAll(".tslide").forEach(a=>a.onclick=()=>{ S.tsel=a.dataset.e; S.hT=null; S.hK=null; keepUi(); });
  host.onmouseenter=()=>{ host.dataset.hold="1"; }; host.onmouseleave=()=>{ host.dataset.hold=""; };
  host._show=show; host._n=sl.length;
  // mouse wheel / trackpad over the card moves the slides (Nes 25.11.2026)
  let wt=0; host.addEventListener("wheel", e=>{ e.preventDefault(); const t=Date.now(); if(t-wt<450 || Math.abs(e.deltaY)+Math.abs(e.deltaX)<4) return; wt=t; const d=(e.deltaY||e.deltaX)>0?1:-1; show(((+host.dataset.i||0)+d+sl.length)%sl.length); }, {passive:false});
}
function startSlider(){
  render.slide=setInterval(()=>{ const h=$("tslider"); if(!h||!h._n||h.dataset.hold) return; h._show(((+h.dataset.i||0)+1)%h._n); }, 3000);
}

const HCOL = {ok:"#2f9e7a", near:"#e0a526", bad:"#e0734f", hedef:"#d9d5e6", pink:"#6655c4", ref:"#aeaabd"};
const kisa = v => v==null ? "–" : Math.abs(v)>=1e6 ? (Math.round(v/1e5)/10).toLocaleString("tr-TR")+" M" : Math.abs(v)>=1e4 ? Math.round(v/1e3).toLocaleString("tr-TR")+" bin" : Math.abs(v)>=1e3 ? (Math.round(v/100)/10).toLocaleString("tr-TR")+" bin" : fmt(v);
function axis(max, W, H, L, T, B){
  const step=Math.pow(10, Math.floor(Math.log10(max||1))); const k=max/step; const st = k>5?step*2:k>2?step:step/2; const top=Math.ceil(max/st)*st;
  const y=v=>H-B-(v/top)*(H-B-T); let g="";
  for(let v=0; v<=top+1e-9; v+=st) g+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${kisa(v)}</text>`;
  return {y, g};
}
function barChart(rows, series, top, W){
  W=W||760; const Hh=W<600?250:270,L=46,T=22,B=26; const max=Math.max(1,...rows.flatMap(r=>series.map(s=>r[s.key]||0)));
  const {y,g}=axis(max*1.08,W,Hh,L,T,B); const bw=(W-L-6)/rows.length; const iw=Math.min(22,(bw-10)/series.length);
  let o=g;
  rows.forEach((r,i)=>{ const x0=L+i*bw+(bw-iw*series.length-3*(series.length-1))/2;
    series.forEach((s,k)=>{ if(r[s.key]==null) return; const yy=y(r[s.key]); o+=`<rect x="${x0+k*(iw+3)}" y="${yy}" width="${iw}" height="${Math.max(0,Hh-B-yy)}" rx="4" fill="${s.color(r)}"><title>${esc(r.ay)} · ${esc(s.name)}: ${fmt(r[s.key])} ₺</title></rect>`; });
    const tv=top&&top(r); if(tv) o+=`<text class="v" x="${L+i*bw+bw/2}" y="${y(Math.max(...series.map(s=>r[s.key]||0)))-6}" text-anchor="middle">${esc(tv)}</text>`;
    o+=`<text x="${L+i*bw+bw/2}" y="${Hh-8}" text-anchor="middle">${AYK[r.ay_no-1]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img">${o}</svg></div>`;
}
function lineChart(lines, months, zero, W){
  W=W||760; const Hh=250,L=46,T=16,B=26; const all=lines.flatMap(l=>l.pts.map(p=>p.v)); const max=Math.max(1,...all); const min=zero?0:Math.min(...all)*0.9;
  const ax=axis(max*1.05-min,W,Hh,L,T,B); const y=v=>ax.y(v-min); const x=m=>L+14+(months.indexOf(m))*((W-L-34)/Math.max(1,months.length-1));
  let o=ax.g; const step=(max*1.05-min);
  if(min>0){ o=""; const n=4; for(let i=0;i<=n;i++){ const v=min+(step*i/n); o+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${kisa(v)}</text>`; } }
  months.forEach(m=>{ o+=`<text x="${x(m)}" y="${Hh-8}" text-anchor="middle">${AYK[m-1]}</text>`; });
  lines.forEach(l=>{ if(!l.pts.length) return; o+=`<path d="${l.pts.map((p,i)=>(i?"L":"M")+x(p.m)+" "+y(p.v)).join(" ")}" fill="none" stroke="${l.color}" stroke-width="2.5" ${l.dash?'stroke-dasharray="5 5"':""} stroke-linejoin="round"/>`;
    l.pts.forEach(p=>{ o+=`<circle cx="${x(p.m)}" cy="${y(p.v)}" r="${l.dash?2.5:3.5}" fill="${l.color}"><title>${AYK[p.m-1]} · ${esc(l.name)}: ${fmt(p.v)} ₺</title></circle>`; }); });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img">${o}</svg></div>`;
}

const KINDS = {kural:"Kural", yasak:"Asla", nasil:"Nasıl yapılır", tanim:"Tanım", bilgi:"Bilgi"};
function md(text, q){
  const hl = s => q ? s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>") : s;
  const inline = s => hl(esc(String(s).replace(/\b(\d{2})\/(\d{2})\/(\d{4})\b/g,"$1.$2.$3"))).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  const out=[]; let stack=[];
  const close=d=>{ while(stack.length>d){ out.push("</ul>"); stack.pop(); } };
  String(text||"").split("\n").forEach(line=>{
    const m=line.match(/^(\s*)- (.*)$/);
    if(m){ const d=Math.floor(m[1].length/3)+1; while(stack.length<d){ out.push("<ul>"); stack.push(1); } close(d); out.push(`<li>${inline(m[2])}</li>`); return; }
    close(0); if(line.trim()) out.push(`<p>${inline(line)}</p>`);
  });
  close(0); return out.join("");
}

async function fetchTracker(){

  if(trState==="ok" && await trRefresh()){ if(["home","tasks"].includes(route()) && $("modalBg").hidden) render(); return; }
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 2500);
    const r=await fetch("http://127.0.0.1:8841/api/sessions", {signal:ctl.signal, cache:"no-store"}); clearTimeout(to);
    const j=await r.json(); D.tracker=Object.assign({ok:true}, j);
  }catch(e){ D.tracker={ok:false, items:[]}; }
  if(["home","tasks"].includes(route()) && $("modalBg").hidden) render();
}

/* multi-select dropdown for the panel's own pages (white = all, black = a custom selection) */
function msDrop(label, key, all, labels){
  const sel=S[key]; const has=v=>!sel||sel.includes(v); const lb=v=>labels[v]||v;
  const set=v=>{ S[key]=(v && v.length===all.length) ? null : v; keepUi(); render(); };
  const dd=el("div","dd");
  const txt=!sel?"Hepsi":!sel.length?"Seçilmedi":sel.length<=2?sel.map(lb).join(", "):sel.length+" seçili";
  const b=el("button"); b.type="button"; b.dataset.on=sel?"1":"0"; b.innerHTML=`<span style="opacity:.7">${esc(label)}</span> ${esc(txt)}`; b.setAttribute("aria-expanded", String(S.drop===key));
  b.onclick=e=>{ e.stopPropagation(); S.drop=S.drop===key?null:key; render(); };
  dd.appendChild(b);
  if(S.drop===key){
    const p=el("div","ddp"); p.onclick=e=>e.stopPropagation();
    const acts=el("div","acts",`<button type="button" data-a="all">tümünü seç</button><button type="button" data-a="none">temizle</button>`);
    acts.querySelector('[data-a="all"]').onclick=()=>set(null); acts.querySelector('[data-a="none"]').onclick=()=>set([]); p.appendChild(acts);
    all.forEach(v=>{ const l=el("label"); const i=document.createElement("input"); i.type="checkbox"; i.checked=has(v); i.onchange=()=>{ const cur=sel?sel.slice():all.slice(); set(i.checked?cur.concat([v]):cur.filter(x=>x!==v)); }; l.appendChild(i); l.appendChild(document.createTextNode(lb(v))); p.appendChild(l); });
    dd.appendChild(p);
  }
  return dd;
}

      if(!shown.length) res.appendChild(el("div","empty",`"${esc(inp.value)}" için sonuç yok.`));

/* ---------- Tracker inside the panel (Nes 25.11.2026) ----------
   Same logic as Tracker/tracker.py, run in the browser: Nes connects her .claude-config folder once (File System Access
   API, Chrome / Edge); the panel reads the projects folder transcripts (who spoke last) and the sessions folder files (live status, open link).
   Read only. If no folder is connected, it falls back to Tracker on localhost:8841. */
const TR = {TAIL:2000000, FILE_WINDOW:10*86400, ASK_WINDOW:7*86400, DONE_WINDOW:2*86400, ALERT_AFTER:30*60, ALERT_MAX_AGE:24*3600, STALE_TOOL:5*60};
const TR_AUTO = /^\s*<(system-reminder|side-sessions-event|task-notification|agent-message|ci-monitor-event|command-|local-command|tools-used|pasted_content_auto)/i;
const TR_ASK = new Set(["AskUserQuestion","ExitPlanMode"]);
const trCache = new Map(Object.entries(lsGet("np_tr_cache")||{}));   // path -> [lastModified, parsed]; kept between visits so only changed files are read
let trDir = null;               // FileSystemDirectoryHandle of .claude-config
let trState = "none";           // none | prompt | ok | error | unsupported

function idb(){ return new Promise((ok,no)=>{ const r=indexedDB.open("nes-panel",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise(ok=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise(ok=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>ok(true); t.onerror=()=>ok(false); }); }

const trShort = (t, n=170) => { t=String(t||"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/\s+/g," ").replace(/[`*_#>|]/g,"").trim(); return t.length<=n ? t : t.slice(0,n-1).trimEnd()+"…"; };
const trParts = m => { const c=m.content; if(typeof c==="string") return [{type:"text", text:c}]; return Array.isArray(c) ? c.filter(x=>x&&typeof x==="object") : []; };
function trParse(text){
  let title=null, cwd=null, sid=null, last=null, ask=null, recap=null, finalText=null, tools=[];
  for(const line of text.split(/\r?\n/)){
    if(!line) continue; let d; try{ d=JSON.parse(line); }catch(e){ continue; }
    const kind=d.type; sid=d.sessionId||sid;
    if(kind==="custom-title") title=d.customTitle||title;
    if((kind!=="user"&&kind!=="assistant") || d.isSidechain || d.isMeta) continue;
    cwd=d.cwd||cwd; const msg=d.message||{}; const ts=Date.parse(d.timestamp)/1000; if(!ts) continue;
    const P=trParts(msg);
    if(kind==="user"){
      const texts=P.filter(p=>p.type==="text").map(p=>p.text||""); const isRes=P.some(p=>p.type==="tool_result");
      if(texts.some(t=>t.trim() && !TR_AUTO.test(t)) && !isRes){ ask=recap=finalText=null; }
      last={who: texts.length && !isRes ? "human" : "tool_result", ts}; tools=[];
    } else {
      const names=[];
      P.forEach(p=>{ if(p.type==="text" && (p.text||"").trim()) finalText=p.text;
        else if(p.type==="tool_use"){ const n=p.name||""; names.push(n); if(n.endsWith("wrap_up")){ const i=p.input||{}; ask=i.ask||ask; recap=i.recap||recap; } } });
      if(names.length) tools=names;
      last={who:"assistant", ts, stop:msg.stop_reason};
    }
  }
  return {sid, title, cwd, last, tools, ask, recap, text:finalText};
}
function trClassify(p, status, now){
  const L=p.last; if(!L) return [null];
  const ts=L.ts, busy=status==="busy";
  if(L.who==="assistant" && L.stop==="tool_use"){
    if(p.tools.some(t=>TR_ASK.has(t))) return ["soru", ts, trShort(p.text)||"Bir soru soruyor."];
    if(now-ts>TR.STALE_TOOL) return ["izin", ts, "Bir işlem için izin bekliyor olabilir ya da uzun süren bir iş yapıyor."];
    return [null];
  }
  if(L.who==="assistant"){
    if(busy) return [null];
    if(p.ask) return ["soru", ts, trShort(p.ask)];
    const lines=(p.text||"").split(/\r?\n/).filter(l=>l.trim());
    if(lines.length && lines[lines.length-1].replace(/[ *_]+$/,"").endsWith("?")) return ["soru", ts, trShort(lines[lines.length-1])];
    return ["bitti", ts, trShort(p.recap || lines[0] || "")];
  }
  if(!busy && now-ts>TR.STALE_TOOL) return ["durdu", ts, "Cevap vermeden durdu; devam etmesi için bir mesaj gerekebilir."];
  return [null];
}
const trFolder = cwd => { if(!cwd) return ""; const m=cwd.match(/[\\/]Claude(?:[\\/](.*))?$/i); const rel=m ? (m[1]||"") : cwd; return rel ? rel.replace(/[\\/]+/g," > ") : "Ana klasör"; };
// only the first and last lines of the final text are ever used (note, question check)
function trSlim(p){ const L=(p.text||"").split(/\r?\n/).filter(l=>l.trim()); p.text=L.length>1?L[0]+"\n"+L[L.length-1]:(L[0]||null); return p; }
async function trReadFile(fh){
  const f=await fh.getFile(); const blob=f.size>TR.TAIL ? f.slice(f.size-TR.TAIL) : f; let t=await blob.text();
  if(f.size>TR.TAIL) t=t.slice(t.indexOf("\n")+1);
  return {text:t, mtime:f.lastModified/1000};
}
async function trCollect(dir){
  const now=Date.now()/1000; const procs={};
  const ids=Object.assign({}, (D.tracker_ids||{}), lsGet("np_tr_ids")||{});
  try{ const sd=await dir.getDirectoryHandle("sessions");
    for await (const [n,h] of sd.entries()){ if(h.kind!=="file"||!n.endsWith(".json")) continue; try{ const d=JSON.parse(await (await h.getFile()).text()); if(d.sessionId){ procs[d.sessionId]=d; if(d.hostSessionId) ids[d.sessionId]=d.hostSessionId; } }catch(e){} } }catch(e){}
  lsSet("np_tr_ids", ids);
  const dismissed=lsGet("np_tr_dismissed")||{}; const items=[]; const seen=new Set();
  const pd=await dir.getDirectoryHandle("projects");
  for await (const [pn,ph] of pd.entries()){
    if(ph.kind!=="directory") continue;
    for await (const [fn,fh] of ph.entries()){
      if(fh.kind!=="file"||!fn.endsWith(".jsonl")) continue;
      let p; try{
        const f=await fh.getFile(); const mt=f.lastModified/1000; if(now-mt>TR.FILE_WINDOW) continue;
        const key=pn+"/"+fn; const c=trCache.get(key);
        seen.add(key); if(c && c[0]===mt) p=c[1]; else { p=trSlim(trParse((await trReadFile(fh)).text)); trCache.set(key,[mt,p]); }
      }catch(e){ continue; }
      if(!p.title || !p.sid) continue;   // helper runs have no title
      const proc=procs[p.sid]||{};
      const [kind, since, note]=trClassify(p, proc.status, now); if(!kind) continue;
      if(now-since > (kind==="soru"||kind==="izin" ? TR.ASK_WINDOW : TR.DONE_WINDOW)) continue;
      if((dismissed[p.sid]||0) >= since) continue;
      const local=proc.hostSessionId || ids[p.sid];
      items.push({id:p.sid, title:proc.name||p.title, kind, since, note, folder:trFolder(p.cwd), link:local?`claude://claude.ai/epitaxy/${local}`:null});
    }
  }
  items.sort((a,b)=>a.since-b.since);
  const keep={}; seen.forEach(k=>keep[k]=trCache.get(k)); lsSet("np_tr_cache", keep);
  return {now, items};
}
async function trRefresh(){
  if(trState!=="ok" || !trDir) return false;
  try{ const r=await trCollect(trDir); D.tracker=Object.assign({ok:true, source:"klasör"}, r); trNotify(); return true; }
  catch(e){ trState="error"; D.tracker={ok:false, items:[]}; return false; }
}
async function trInit(){
  if(!window.showDirectoryPicker || !window.indexedDB){ trState="unsupported"; return; }
  try{ trDir=await idbGet("claude_dir"); }catch(e){ trDir=null; }
  if(!trDir){ trState="none"; return; }
  const p=await trDir.queryPermission({mode:"read"});
  trState = p==="granted" ? "ok" : "prompt";
}
async function trConnect(){
  try{
    let d;
    if(trDir && trState==="prompt"){ if(await trDir.requestPermission({mode:"read"})!=="granted") return; d=trDir; }
    else {
      d=await window.showDirectoryPicker({id:"claude-config", mode:"read"});
      // accept the Claude root folder too: then use its .claude-config
      try{ await d.getDirectoryHandle("projects"); }catch(e){ try{ d=await d.getDirectoryHandle(".claude-config"); await d.getDirectoryHandle("projects"); }catch(e2){ toast("Bu klasörde Claude oturumları yok. .claude-config klasörünü seç."); return; } }
      await idbSet("claude_dir", d);
    }
    trDir=d; trState="ok";
    if(window.Notification && Notification.permission==="default") try{ Notification.requestPermission(); }catch(e){}
    toast("Claude oturumları okunuyor…"); await trRefresh(); render();
  }catch(e){ if(e && e.name!=="AbortError") toast("Klasör bağlanamadı"); }
}
function trDismiss(i){ const d=lsGet("np_tr_dismissed")||{}; d[i.id]=i.since; lsSet("np_tr_dismissed", d); D.tracker.items=D.tracker.items.filter(x=>x.id!==i.id); render(); }
/* the 30-minute alert, while the panel is open (Tracker sends it from Windows) */
function trNotify(){
  if(!window.Notification || Notification.permission!=="granted") return;
  const T=D.tracker; const al=lsGet("np_tr_alerted")||{};
  const due=(T.items||[]).filter(i=>(i.kind==="soru"||i.kind==="izin") && T.now-i.since>=TR.ALERT_AFTER && T.now-i.since<=TR.ALERT_MAX_AGE && (al[i.id]||0)<i.since);
  if(!due.length) return;
  try{ new Notification(due.length===1 ? `${fmtWait(Math.round((T.now-due[0].since)/60))}dır seni bekliyor` : `${due.length} oturum seni bekliyor`, {body:due.map(i=>i.title).join(", ").slice(0,180)}); }catch(e){ return; }
  due.forEach(i=>al[i.id]=i.since); lsSet("np_tr_alerted", al);
}
/* the box shown where the sessions would be, when the folder is not connected */
function trConnectBox(){
  if(trState==="ok" || (D.tracker||{}).ok) return null;
  const b=el("div","trbox");
  if(trState==="unsupported"){ b.innerHTML=`<span class="note">Bekleyen Claude oturumlarını görmek için sayfayı Chrome ya da Edge'de aç.</span>`; return b; }
  b.innerHTML=`<span class="sdot">${ic("chat")}</span><span class="grow note">${trState==="prompt"?"Bekleyen Claude oturumları için klasör iznini yenile.":"Bekleyen Claude oturumlarını burada görmek için <b>.claude-config</b> klasörünü bir kez bağla."}</span><button class="btn sm" type="button">${trState==="prompt"?"İzin ver":"Klasörü bağla"}</button>`;
  b.querySelector("button").onclick=trConnect;
  return b;
}

/* ---------- date picker (Nes 26.11.2026) ----------
   Modern picker modelled on D-One > Liste fiyatları > Hızlı fiyat bul: month grid with Pzt-first weekdays, click the
   month title for a 12-month view, "Bugün" at the bottom. Every native <input type="date"> is swapped for it
   automatically (MutationObserver); the input stays as a hidden field holding yyyy-mm-dd, so callers read .value as before. */
let DP = null;
const dpText = s => { const d=pdate(s); return `${d.getDate()} ${AY[d.getMonth()+1]} ${d.getFullYear()}`; };
function dpClose(){ if(!DP) return; DP.pop.remove(); DP.btn.setAttribute("aria-expanded","false"); DP.btn.classList.remove("open"); DP=null; }
function dpEnhance(inp){
  if(inp.dataset.dp) return; inp.dataset.dp="1";
  const btn=document.createElement("button"); btn.type="button"; btn.className="dpb";
  btn.setAttribute("aria-haspopup","dialog"); btn.setAttribute("aria-expanded","false");
  inp._dpPaint=()=>{ btn.innerHTML=`${ic("cal")}<span class="${inp.value?"":"dpph"}">${inp.value?esc(dpText(inp.value)):"Tarih seç"}</span>`; };
  inp.type="hidden"; inp.after(btn); inp._dpPaint();
  btn.onclick=e=>{ e.preventDefault(); e.stopPropagation(); if(DP && DP.btn===btn) return dpClose(); dpOpen(inp, btn); };
}
function dpOpen(inp, btn){
  dpClose();
  const sel=inp.value||null, t=TODAY(), b0=pdate(sel||t);
  const st={y:b0.getFullYear(), m:b0.getMonth(), view:"day"};
  const pop=el("div","dp"); pop.setAttribute("role","dialog"); pop.setAttribute("aria-label","Tarih seç");
  document.body.appendChild(pop); DP={pop, btn, inp}; btn.setAttribute("aria-expanded","true"); btn.classList.add("open");
  const pick=v=>{ inp.value=v||""; inp.dispatchEvent(new Event("change",{bubbles:true})); inp._dpPaint(); dpClose(); btn.focus(); };
  const nav=(lbl,n)=>`<button type="button" class="dpn" data-n="${n}" aria-label="${lbl}">${ic(n<0?"left":"right")}</button>`;
  const draw=()=>{
    let head, body;
    if(st.view==="day"){
      const off=(new Date(st.y,st.m,1).getDay()+6)%7, n=new Date(st.y,st.m+1,0).getDate();
      let c=""; for(let i=0;i<off;i++) c+="<span></span>";
      for(let d=1; d<=n; d++){ const v=iso(new Date(st.y,st.m,d)); c+=`<button type="button" data-v="${v}" class="${v===sel?"sel":""}${v===t?" today":""}" aria-label="${esc(flong(v))}"${v===sel?' aria-current="date"':""}>${d}</button>`; }
      head=`${nav("Önceki ay",-1)}<button type="button" class="dpt" data-view="month" aria-label="Ay seç">${AY[st.m+1]} ${st.y}${ic("chev")}</button>${nav("Sonraki ay",1)}`;
      body=`<div class="dpg">${["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<b>${x}</b>`).join("")}${c}</div>`;
    } else {
      const sm=sel?pdate(sel):null, tm=pdate(t);
      head=`${nav("Önceki yıl",-1)}<span class="dpt yr">${st.y}</span>${nav("Sonraki yıl",1)}`;
      body=`<div class="dpm">${AYK.map((x,i)=>`<button type="button" data-mo="${i}" class="${sm&&sm.getFullYear()===st.y&&sm.getMonth()===i?"sel":""}${tm.getFullYear()===st.y&&tm.getMonth()===i?" cur":""}">${x}</button>`).join("")}</div>`;
    }
    pop.innerHTML=`<div class="dph">${head}</div>${body}<div class="dpf">${inp.value?'<button type="button" data-clear="1">Temizle</button>':""}<button type="button" data-today="1">Bugün</button></div>`;
    place();
  };
  const place=()=>{
    const r=btn.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
    let top=r.bottom+6; if(top+h>innerHeight-8 && r.top-h-6>8) top=r.top-h-6;
    pop.style.top=Math.max(8,top)+"px"; pop.style.left=Math.max(8,Math.min(r.left, innerWidth-w-8))+"px";
  };
  pop.onclick=e=>{
    e.stopPropagation(); const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.v) pick(b.dataset.v);
    else if(b.dataset.n){ const n=+b.dataset.n; if(st.view==="day"){ st.m+=n; if(st.m<0){st.m=11;st.y--;} if(st.m>11){st.m=0;st.y++;} } else st.y+=n; draw(); }
    else if(b.dataset.view){ st.view="month"; draw(); }
    else if(b.dataset.mo!=null){ st.m=+b.dataset.mo; st.view="day"; draw(); }
    else if(b.dataset.today) pick(t);
    else if(b.dataset.clear) pick("");
  };
  draw();

const DROP_DEF = () => ({cities:(cityGroups()[0]||[])[1]||null});
function multiDrop(label, key, groups, extra, labels){
  const lb = v => (labels&&labels[v])||v;
  const all=groups.flatMap(g=>g[1]).concat(extra?[extra[0]]:[]);
  const sel=K[key]; const has=v=>!sel||sel.includes(v);
  const set=v=>{ K[key]=(v && v.length===all.length) ? null : v; lsSet("np_k_"+key, K[key]); K.sel=null; K.fsel=null; render(); };
  const cur=()=>sel?sel.slice():all.slice();
  const dd=el("div","dd"); let one;
  const txt =!sel ? "Hepsi" : !sel.length ? "Seçilmedi" : (one=groups.find(g=>g[0] && sel.length===g[1].length && g[1].every(v=>sel.includes(v)))) ? (one[0]==="Ana il"?"Ana iller":one[0]) : sel.length<=2 ? sel.map(v=>extra&&v===extra[0]?extra[1]:lb(v)).join(", ") : sel.length+" seçili";
  const b=el("button"); b.type="button"; const def=DROP_DEF()[key]||null; const norm=x=>x?JSON.stringify(x.slice().sort()):"all"; b.dataset.on=norm(sel)!==norm(def)?"1":"0"; b.innerHTML=`<span style="opacity:.7">${esc(label)}</span> ${esc(txt)}`; b.setAttribute("aria-expanded", String(K.drop===key));
  b.onclick=e=>{ e.stopPropagation(); K.drop = K.drop===key ? null : key; K.ddTop=0; render(); };
  dd.appendChild(b);
  if(K.drop===key){
    const p=el("div","ddp"); p.onclick=e=>e.stopPropagation(); p.onscroll=()=>{ K.ddTop=p.scrollTop; }; setTimeout(()=>{ p.scrollTop=K.ddTop||0; },0);
    const acts=el("div","acts",`<button type="button" data-a="all">tümünü seç</button><button type="button" data-a="none">temizle</button>`);
    acts.querySelector('[data-a="all"]').onclick=()=>set(null); acts.querySelector('[data-a="none"]').onclick=()=>set([]);
    p.appendChild(acts);
    const row=(cls,text,checked,onch,ind)=>{ const l=el("label",cls); const i=document.createElement("input"); i.type="checkbox"; i.checked=checked; i.indeterminate=!!ind; i.onchange=()=>onch(i.checked); l.appendChild(i); l.appendChild(document.createTextNode(text)); p.appendChild(l); };
    groups.forEach(([gn,items])=>{
      if(gn){ const n=items.filter(has).length; row("g", gn, n===items.length, on=>set(cur().filter(v=>!items.includes(v)).concat(on?items:[])), n>0&&n<items.length); }
      items.forEach(v=>row(gn?"i":"", lb(v), has(v), on=>set(cur().filter(x=>x!==v).concat(on?[v]:[]))));
    });
    if(extra) row("g", extra[1], has(extra[0]), on=>set(cur().filter(x=>x!==extra[0]).concat(on?[extra[0]]:[])));
    dd.appendChild(p);
  }
  return dd;
}

    v.querySelector("button").onclick=()=>copy(c.video.map((x,i)=>`${i+1}. ${x}`).join("\n\n"));
    host.appendChild(v);
  }
}


/* ---------- Kararlar: every open question of the month in one queue (new in the panel) ---------- */
function renderKararlar(host){
  const dd = D.store.decisions = D.store.decisions || {};
  const f=el("div","filters"); f.appendChild(multiDrop("Takım", "teams", [["",["SAS","MoS","TES"]]])); host.appendChild(f);
  const list=campaigns().filter(c=>(c.decisions||[]).length && teamOk(c.team));
  const all=list.flatMap(c=>c.decisions.map((x,i)=>c.id+"#"+i)); const done=all.filter(k=>(dd[k]||{}).done).length;
  const top=el("div","card");
  top.innerHTML=`<div class="ch"><h3>${done} / ${all.length} karar verildi</h3><span class="sp"></span><span class="note">Kararların bu tarayıcıda saklanır. Claude'a iletmek için kopyala, sohbete yapıştır.</span><button class="ghost sm" type="button" id="kCopy">Kararları kopyala</button></div><div class="bar"><i style="width:${all.length?Math.round(done/all.length*100):0}%"></i></div>`;
  host.appendChild(top);
  top.querySelector("#kCopy").onclick=()=>{
    const L=[`Kampanya Stüdyosu ${ymLabel(K.month)} kararlarım (campaigns/${K.month}.json'a uygula):`, ""];
    list.forEach(c=>{ const ans=c.decisions.map((q,i)=>[q,dd[c.id+"#"+i]||{}]).filter(([q,st])=>st.done||st.note); if(!ans.length) return; L.push(`${c.title} (${c.id})`); ans.forEach(([q,st])=>L.push(`- ${q}
  → ${st.note||"(karar verildi, not yok)"}`)); L.push(""); });
    if(L.length<=2){ toast("Henüz kararın yok"); return; }
    copy(L.join(String.fromCharCode(10)), "Kararlar kopyalandı; Claude sohbetine yapıştır");
  };
  if(!list.length){ host.appendChild(el("div","empty","Bu seçimde karar bekleyen kampanya yok.")); return; }
  list.forEach(c=>{
    const card=el("div","card");
    card.innerHTML=`<div class="ch"><div class="chips"><span class="chip ${esc(c.team)}">${esc(c.team)}</span><span class="chip ${esc(c.kind)}">${esc(KIND[c.kind])}</span></div><span class="sp"></span><button class="link" type="button">Kampanyayı aç →</button></div><h3 style="font-size:16px">${esc(c.headline||c.title)}</h3>`;
    card.querySelector(".link").onclick=()=>{ K.view="kampanya"; K.sel=c.id; K.tab="kampanya"; lsSet("np_k_view","kampanya"); render(); window.scrollTo(0,0); };
    const rows=el("div","rows");
    c.decisions.forEach((q,i)=>{
      const k=c.id+"#"+i; const st=dd[k]||{};
      const r=el("div","row"+(st.done?" done":""));
      r.innerHTML=`<input type="checkbox" class="chk" ${st.done?"checked":""} aria-label="Karar verildi"><div class="grow"><span class="t">${esc(q)}</span><input type="text" placeholder="Kararın (ör. evet, %15 kontrol grubu olsun)" value="${esc(st.note||"")}" aria-label="Karar notu"></div><button class="ghost sm" type="button">${todos().some(t=>t.decision===k)?"İşte":ic("plus")+"İşe çevir"}</button>`;
      const save=()=>{ dd[k]={done:r.querySelector(".chk").checked, note:r.querySelector("input[type=text]").value.trim()}; saveStore(); };
      r.querySelector(".chk").onchange=()=>{ save(); render(); };
      r.querySelector("input[type=text]").onchange=save;
      const b=r.querySelector("button"); b.disabled=todos().some(t=>t.decision===k);
      b.onclick=()=>{ todos().push({id:uid("t"), text:`Karar ver: ${q.length>110?q.slice(0,107)+"…":q}`, project:proj("p-kampanya")?"p-kampanya":null, due:null, priority:"yüksek", status:"todo", targets:[], created:TODAY(), done_at:null, note:`${c.title} (${ymLabel(c.month||K.month)}): ${q}`, decision:k}); saveStore(); render(); toast("İş olarak eklendi"); };
      rows.appendChild(r);
    });
    card.appendChild(rows); host.appendChild(card);
  });
}

/* ---------- Forecast ---------- */
function fcInputs(c){
  const saved=(lsGet("np_k_fc")||{})[c.id]||{}; const f=c.forecast||{};
  return {n:+(saved.n ?? f.n ?? 0), base:+(saved.base ?? f.base ?? 0), uplift:+(saved.uplift ?? f.uplift ?? 0), value:+(saved.value ?? f.value ?? 0), cost:+(saved.cost ?? f.cost ?? 0)};
}
const bePuan = v => v < 0.1 ? "+0,1 puandan az" : "+" + fmt1(v) + " puan";
function fcCalc(i){
  const b=i.base/100, u=i.uplift/100;
  const bu=i.n*b, su=i.n*(b+u);
  const brev=bu*i.value, srev=su*i.value, cost=su*i.cost;
  const be = i.value>i.cost ? (b*i.cost/(i.value-i.cost))*100 : null;
  return {bu, su, brev, srev, cost, net:srev-cost-brev, extra:su-bu, extraRev:srev-brev, waste:bu*i.cost, be};
}
function renderForecast(host){
  host.appendChild(filterBar());
  const list=visible().filter(c=>c.forecast);
  if(!list.length){ host.appendChild(el("div","empty","Bu seçimde forecast'i olan kampanya yok.")); return; }
  const cur=list.find(c=>c.id===K.fsel)||list[0];
  let tot={extraRev:0,cost:0,net:0};
  const unkN=list.filter(c=>c.forecast.cost_unknown && !fcInputs(c).cost).length;
  const rows=list.map(c=>{ const r=fcCalc(fcInputs(c)); tot.extraRev+=r.extraRev; tot.cost+=r.cost; tot.net+=r.net; return {c,r}; });
  const tb=el("div","card");
  /* collapsed by default: only the selected campaign (first one if none) + the total; toggle shows all (Nes 26.11.2026) */
  const shown=K.fall?rows:rows.filter(({c})=>c.id===cur.id);
  tb.innerHTML=`<div class="ch"><h3>Kampanyalar yan yana</h3><span class="sp"></span>${rows.length>1?`<button class="ghost sm" type="button" id="fAll" aria-expanded="${!!K.fall}">${K.fall?"Daralt":`Tümünü göster (${rows.length})`}</button>`:""}</div><div class="tscroll"><table><tr><th>Kampanya</th><th class="c3">Kampanyasız</th><th class="c3">Kampanyayla</th><th>Ek adet</th><th>Ek ciro</th><th>Maliyet</th><th>Net katkı</th><th class="c3">Başa baş etki</th></tr>${shown.map(({c,r})=>`<tr class="clk ${c.id===cur.id&&K.fall?"sel":""}" data-id="${esc(c.id)}"><td><span class="chip ${esc(c.team)}">${esc(c.team)}</span> ${esc(c.title)}</td><td class="c3">${fmt1(r.bu)} ${esc(c.forecast.unit)}</td><td class="c3">${fmt1(r.su)}</td><td class="nw">+${fmt1(r.extra)} ${esc(c.forecast.unit)}</td><td class="nw">${tl(r.extraRev)}</td><td class="nw">${!r.cost&&(c.forecast.cost_unknown||!c.forecast.cost)?"bilinmiyor":tl(r.cost)}</td><td class="nw ${r.net>=0?"up":"down"}">${tl(r.net)}</td><td class="nw c3">${(r.be==null||!r.cost)?"–":bePuan(r.be)}</td></tr>`).join("")}<tr><td><b>Toplam${K.fall?"":` (${rows.length} kampanya)`}</b></td><td class="c3"></td><td class="c3"></td><td></td><td class="nw"><b>${tl(tot.extraRev)}</b></td><td class="nw"><b>${tl(tot.cost)}</b></td><td class="nw ${tot.net>=0?"up":"down"}"><b>${unkN?"en çok ":""}${tl(tot.net)}</b></td><td class="c3"></td></tr></table></div><p class="note">İl ve kategori filtresi yalnızca kampanya listesini süzer; forecast her kampanyanın tüm hedef kitlesi içindir. Bir satıra tıklayınca o kampanyanın varsayımları açılır. Ciro yıllık sözleşme değeridir. Kampanya etkisi (ek adet) her satırda varsayımdır. Maliyeti "bilinmiyor" olan kampanyalarda maliyet 0 alındı; net katkı orada olduğundan yüksek görünür.</p>`;
  host.appendChild(tb);
  tb.querySelectorAll("tr.clk").forEach(tr=>tr.onclick=()=>{ K.fsel=tr.dataset.id; render(); });
  const fa=tb.querySelector("#fAll"); if(fa) fa.onclick=()=>{ K.fall=!K.fall; render(); };
  const f=cur.forecast; const i=fcInputs(cur); const r=fcCalc(i);
  const g=el("div","fgrid"); host.appendChild(g);
  const inp=el("div","inputs");
  const field=(key,label,note,assume,step)=>`<div class="inp ${assume?"assume":""}"><label for="fc_${key}">${esc(label)}</label><input type="number" id="fc_${key}" data-k="${key}" value="${i[key]}" step="${step||1}" min="0"><small>${esc(note||"")}</small></div>`;
  inp.innerHTML = `<h3 style="font-size:17px;font-weight:700">${esc(cur.title)}</h3><p class="note">${esc(cur.headline||"")}</p>`
    + field("n", f.n_label||"Hedef firma", f.n_formula||"", false)
    + field("base", (f.base_label||"Kampanyasız oran")+" (%)", f.base_formula||"ölçülen oran", !!f.base_unknown, 0.1)
    + field("uplift", "Kampanyanın etkisi (+ puan)", "ölçülemedi; varsayım", true, 0.5)
    + field("value", (f.value_label||"İşlem başına ciro")+" (₺)", f.value_formula||"", false, 100)
    + field("cost", (f.cost_label||"Hediyenin maliyeti")+" (₺)", f.cost_formula||"", !!f.cost_unknown, 100)
    + `<p class="note">Sarı kutu: veriyle ölçülemiyor, varsayım. Değiştirdiğin değerler bu tarayıcıda saklanır.</p><button class="ghost" type="button" id="fcReset">Varsayılana dön</button>`;
  g.appendChild(inp);
  const main=el("div","fmain"); g.appendChild(main);
  const unk = !!f.cost_unknown && !i.cost;
  const U=f.unit;
  main.innerHTML =
    `<div class="frow"><h4>1 · Güncel durum: kampanya yok</h4><div class="kpis">`
      + kpi(`Beklenen ${U}`, fmt1(r.bu), `${fmt(i.n)} firma × %${fmt1(i.base)}`)
      + kpi("Beklenen ciro", tl(r.brev), `${fmt1(r.bu)} × ${fmt(i.value)} ₺`)
      + `</div></div>`
    + `<div class="frow"><h4>2 · Kampanya senaryosu</h4><div class="kpis">`
      + kpi(`Beklenen ${U}`, fmt1(r.su), `${fmt(i.n)} firma × %${fmt1(i.base+i.uplift)}`)
      + kpi("Beklenen ciro", tl(r.srev), `${fmt1(r.su)} × ${fmt(i.value)} ₺`)
      + kpi("Kampanya maliyeti", unk?"bilinmiyor":tl(r.cost), unk?"hediyenin firma başı maliyeti girilmedi":`${fmt1(r.su)} × ${fmt(i.cost)} ₺ (hediyeyi alan herkes)`)
      + `</div></div>`
    + `<div class="frow"><h4>3 · Fark: senaryo − güncel</h4><div class="kpis">`
      + kpi(`Ek ${U}`, "+"+fmt1(r.extra), `${fmt(i.n)} firma × ${fmt1(i.uplift)} puan`, "accent")
      + kpi("Ek ciro", tl(r.extraRev), `ek ${U} × ${fmt(i.value)} ₺`)
      + kpi("Net katkı", tl(r.net), unk?"maliyet düşülmedi":"ek ciro − kampanya maliyeti", r.net>=0?"pos":"neg")
      + kpi("Başa baş etki", (r.be==null||!r.cost)?"–":bePuan(r.be), r.cost?"bu kadar artış maliyeti karşılar":"maliyet girilmedi")
      + kpi("Boşa giden hediye", unk?"bilinmiyor":tl(r.waste), unk?`${fmt1(r.bu)} hediye zaten yapacak olana gider`:"zaten yapacak olanlara verilen")
      + `</div></div>`
    + `<p class="note">Hediye, kampanya döneminde işlemi yapan herkese verilir; bu yüzden zaten yapacak olanlara verilen pay ayrı gösterilir. Tahsilat, erken ödeme ve sonraki yıl yenileme etkisi bu hesapta yok.</p>`;
  inp.querySelectorAll("input").forEach(x=>x.onchange=()=>{ const all=lsGet("np_k_fc")||{}; all[cur.id]=Object.assign({}, fcInputs(cur), {[x.dataset.k]: +x.value}); lsSet("np_k_fc", all); render(); });
  inp.querySelector("#fcReset").onclick=()=>{ const all=lsGet("np_k_fc")||{}; delete all[cur.id]; lsSet("np_k_fc", all); render(); };
}

/* ---------- Yeni kampanya üret (local: copies the request for the Claude chat) ---------- */
const EXAMPLES = [
  "Son 6 ayda ziyaret edip satamadığımız firmalara odaklan; onları aldıracak bir kampanya.",
  "En çok yenileyen kategoriye ve paket yükseltmeye odaklan.",
  "Ödeyen firma sayısı azalan kategorilere odaklan.",
  "İlk yenilemesine gelen firmalara odaklan."
];
function genBox(host){
  const g=el("div","gen");
  g.innerHTML=`<h3>Ne üzerine kampanya istiyorsun?</h3>
    <div class="row2"><span class="eyebrow">Takım</span><select id="genTeam" aria-label="Takım"><option>SAS</option><option>MoS</option><option>TES</option></select><span class="eyebrow">Tür</span><select id="genKind" aria-label="Tür"><option value="yeni">Yeni satış</option><option value="yenileme">Yenileme</option></select><span class="eyebrow">Ay</span><span class="chip">${esc(ymLabel(K.month))}</span></div>
    <textarea id="genBrief" placeholder="Örnek: Son 6 ayda ziyaret edip satamadığımız firmalara odaklanmak istiyorum; onları aldıracak bir kampanya."></textarea>
    <div class="ex" id="genEx"></div>
    <div class="row2"><button class="btn" type="button" id="genGo">İsteği kopyala</button><button class="ghost" type="button" id="genClose">Kapat</button><span class="status" id="genStatus">Kopyala, Claude sohbetine yapıştır: kampanya campaigns/${esc(K.month)}.json dosyasına eklenir ve burada görünür.</span></div>`;
  host.appendChild(g);
  const syncKind=()=>{ const mos=g.querySelector("#genTeam").value==="MoS"; const o=g.querySelector('#genKind option[value="yenileme"]'); o.disabled=mos; o.textContent=mos?"Yenileme (MoS yapmaz)":"Yenileme"; if(mos) g.querySelector("#genKind").value="yeni"; };
  if(K.teams&&K.teams.length===1) g.querySelector("#genTeam").value=K.teams[0]; if(K.kinds&&K.kinds.length===1) g.querySelector("#genKind").value=K.kinds[0]; syncKind();
  g.querySelector("#genTeam").onchange=syncKind;
  EXAMPLES.forEach(t=>{ const b=el("button"); b.type="button"; b.textContent=t; b.onclick=()=>{ g.querySelector("#genBrief").value=t; }; g.querySelector("#genEx").appendChild(b); });
  g.querySelector("#genClose").onclick=()=>{ K.gen=false; render(); };
  g.querySelector("#genGo").onclick=()=>{
    const brief=g.querySelector("#genBrief").value.trim(); const st=g.querySelector("#genStatus");
    if(!brief){ st.className="status err"; st.textContent="Önce ne istediğini yaz."; return; }
    st.className="status";
    copy(`Kampanya Stüdyosu için yeni kampanya üret ve campaigns/${K.month}.json dosyasına ekle.\nTakım: ${g.querySelector("#genTeam").value} · Tür: ${KIND[g.querySelector("#genKind").value]} · Ay: ${ymLabel(K.month)}\nİstek: ${brief}`, "İstek kopyalandı; Claude sohbetine yapıştır");
  };
}

/* ---------- section ---------- */
function renderCampaign(v){
  if(!K.month || !DATA.months[K.month]) K.month = months()[0] || null;
  if(K.cities===undefined){ const main=(cityGroups()[0]||[])[1]; K.cities = main ? main.slice() : null; try{ if(localStorage.getItem("np_k_cities")!==null) K.cities=lsGet("np_k_cities"); if(localStorage.getItem("np_k_cats")!==null) K.cats=lsGet("np_k_cats"); }catch(e){} }
  const A=DATA.analyses||{}; const n=campaigns().length;
  const hero=el("section","hero");
  hero.innerHTML=`<p class="eyebrow">Kampanya stüdyosu</p><h1>${K.month?esc(ymLabel(K.month)):""} kampanyaları</h1><p class="sub">${n} öneri · SAS, MoS ve TES × yeni satış ve yenileme${A.last_closed_month?` · veri: son kapanan ay ${esc(ymLabel(A.last_closed_month))}`:""}${D.campaigns.analyses_updated?` · ${esc(fdate(D.campaigns.analyses_updated))} tarihinde güncellendi`:""}.</p>`;
  v.appendChild(hero);
  if(!K.month){ v.appendChild(el("div","empty","Kampanya verisi yok.")); return; }
  const tb=el("div","toolbar");
  const seg=el("div","ptabs"); seg.setAttribute("role","tablist");
  [["kampanya","Öneriler"],["analiz","Analizler"],["forecast","Forecast"],["kararlar","Kararlar"]].forEach(([id,l])=>{ const n=id==="kararlar"?decisionsCount():0; const b=el("button",null,l+(n?` <span class="cnt">${n}</span>`:"")); b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected", String(K.view===id)); b.onclick=()=>{ K.view=id; K.drop=null; lsSet("np_k_view",id); render(); }; seg.appendChild(b); });
  tb.appendChild(seg); tb.appendChild(el("span","sp"));
  const gb=el("button","btn", ic("spark")+"Yeni kampanya üret"); gb.type="button"; gb.onclick=()=>{ K.gen=!K.gen; render(); }; tb.appendChild(gb);
  v.appendChild(tb);
  if(K.gen) genBox(v);
  const host=el("div","stack"); host.style.gap="16px"; v.appendChild(host);
  if(K.view==="kararlar") renderKararlar(host);
  else if(K.view==="analiz") renderAnaliz(host);
  else if(K.view==="forecast") renderForecast(host);
  else renderKampanya(host);
}
document.addEventListener("click", ()=>{ if(K.drop){ K.drop=null; render(); } });

</script>
