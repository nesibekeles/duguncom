N/CLAUDE.md", "pin": false, "links": []}, {"id": "t-sat-welcome-bolge", "cat": "Satış ekipleri & paneller", "order": 120, "kind": "bilgi", "title": "Welcome Paketi bölge fiyat sayfaları", "tldr": "Welcome Paketi'nin her bölge için tek sayfalık fiyat PDF'i; satışçı görüşmede bu sayfayla fiyat verir.", "body": "**Nedir:** Eylül 2026'da Pro Start'ın yerine gelen yeni satış ürünü **Welcome Paketi**'nin bölge bazlı fiyat sayfaları (A4 yatay).\n**Bölgeler:** İstanbul, Ankara, İzmir, Bursa, Adana / Mersin (tek sayfa, tek ekip), Antalya, Uydu İller.\n**Sayfada ne var:** kategori bazında liste fiyatı (üstü çizili), Welcome fiyatı ve uydu ilçe fiyatı; ek kategori %20 indirimi; peşin ödeme yöntemleri; çek vadeleri; o şehrin uydu ilçe listesi.\n**Ürün kuralları (kısaca):** yalnız yeni ya da en az 6 ay önce churn olmuş firmaya; bir kez satılır, yenilemede Winner'a geçer; 12 aylık, 2X ağırlık; peşin (kredi kartı vade farksız 3-6-12 taksit, çek, havale). Ayrıntı: `PRICING.md`.\n**Nasıl üretilir:** `Welcome_Paketi/build.py` fiyat sheet'ini okuyup sayfaları yeniden üretir; PDF elle düzenlenmez. Satışa yalnız 'Ek Kategori İndirimli' klasöründeki sürüm gider (dosya adlarında bu ek yok).\n**Dikkat:** 08.09.2026 PDF'leri hâlâ '1–6 taksit' yazıyor; 12 taksit sonradan geldi, istenirse yeniden üret. Uydu ilçe listesinin asıl kaynağı güncel rate card'ın `Uydu(Taşra) İlçeler` sayfasıdır.", "jobs": [{"title": "İlk bölge sayfaları ve fiyat güncellemesi", "date": "09.2026", "why": "Welcome Paketi'nin lansmanında (07.09.2026) satışçıların elinde fiyat sayfası olsun diye üretildi; ertesi gün fiyat sheet'i değişince sayfalar yenilendi ve değişen fiyatlar CRM girişlerini düzeltmek için ayrı işaretlendi.", "files": [{"label": "Welcome Paketi_Eylül 2026 Fiyatları_Değişen Fiyatlar Kırmızı_08.09.2026.xlsx", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Welcome_Paketi\\Welcome Paketi_Eylül 2026 Fiyatları_Değişen Fiyatlar Kırmızı_08.09.2026.xlsx"}]}, {"title": "Çeşme'nin İzmir uyd Eylül 2026.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Welcome_Paketi\\Ek Kategori İndirimli\\Welcome Paketi - İzmir - Eylül 2026.pdf"}, {"label": "Welcome Paketi - Bursa - Eylül 2026.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Welcome_Paketi\\Ek Kategori İndirimli\\Welcome Paketi - Bursa - Eylül 2026.pdf"}, {"label": "Welcome Paketi - Adana-Mersin - Eylül 2026.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Welcome_Paketi\\Ek Kategori İndirimli\\Welcome Paketi - Adana-Mersin - Eylül 2026.pdf"}, {"label": "Welcome Paketi - Antalya - Eylül 2026.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Welcome_Paketi\\Ek Kategori İndirimli\\Welcome Paketi - Antalya - Eylül 2026.pdf"}, {"label": "Welcome Paketi - Uydu İller - Eylül 2026.pdf", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\7 Design\\Welcome_Paketi\\Ek Kategori İndirimli\\Welcome Paketi - Uydu İller - Eylül 2026.pdf"}], "tags": ["Welcome Paketi", "fiyat", "bölge", "PDF", "satış materyali"], "source": "7 Design/Welcome_Paketi/PROJECT.md", "pin": false, "links": []}, {"id": "t-veri-tanimlar", "cat": "Veri & Qlik", "order": 10, "kind": "tanim", "title": "Customer, provider, RÇİ ve kimlik numaraları", "tldr": "Customer faturalanan firmadır, provider tek bir ilan sayfasıdır; bir customer'ın birden çok provider'ı olabilir. Her liste ve analiz önce bu ayrımı doğru kurmalıdır.", "body": "**Temel ayrım:**\n- **Customer (müşteri)** — faturalanan taraf, sözleşmeyi imzalayan firma. Telefon ve tahsilat müşteriye bağlıdır.\n- **Provider** — düğün.com'daki tek bir ilan sayfası. Bir müşterinin birden çok sayfası (ör. iki salon ya da iki kategori) olabilir.\n- **RÇİ** — *Reklamda Çıkacak İsim*: provider'ın sayfadaki adı (resmi ünvan değil). Satış sheet'lerinde 'RÇİ' sütunu provider'ı gösterir. Her zaman 'RÇİ' yazılır, 'Rİİ' değil.\n**Sheet sütunu → Qlik alanı:**\n- `RÇİ` → `provider_id` · `Müşteri İD` → `customer_id`\n- `Ürün ID` → `ppp_id` (bir sayfanın bir ürün dönemi) · `Söz. ID` → `customer_agreement_id`\n**CRM linki:** `https://crm.dugun.com/customers/{customer_id}#providers`\n**Diğer sık terimler:** paid provider = gelir getiren sayfa; Big 5 / Venue / Others = kategori grupları; Churn / Decay / Renewal / Drop = aylık B2B durumları (el kitabı Part 5.2 ve 7).", "jobs": [], "kit": {}, "files": [{"label": "BU_Knowledge_Handbook.md (Qlik ve metrik el kitabı)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\references\\BU_Knowledge_Handbook.md"}, {"label": "Renewal_Data_Sheet_Guide.md (sheet sütunları ↔ Qlik alanları)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\1 Renewals\\Monthly Renewal Lists\\Renewal_Data_Sheet_Guide.md"}], "tags": ["customer", "provider", "RÇİ", "terim", "ID"], "source": "kök CLAUDE.md §2 · BU_Knowledge_Handbook Part 7 · Monthly Renewal Lists/PROJECT.md", "pin": false, "links": []}, {"id": "t-veri-qlik-uygulamalar", "cat": "Veri & Qlik", "order": 20, "kind": "bilgi", "title": "Qlik uygulamaları: hangi soru için hangi app", "tldr": "Şirketin raporlama verisi Qlik Cloud'dadır; Executive ödeyen firmaların sağlığını, General tüm firmaların operasyonel detayını, Provider Contest performans ligi skorunu verir. Veri her gece yüklenir, ekranlar 'dün itibarıyla'dır.", "body": "**Nedir:** düğün.com'un BI ekibinin kurduğu Qlik Cloud ortamı (tenant `rx2lc2xpounq8gv.eu.qlikcloud.com`, link kalıbı `/sense/app/<APP_ID>`). Bir metriği aramadan önce **BU Knowledge Handbook**'a bak.\n**En çok kullanılanlar:**\n- **Executive Dashboard** (`3e66f065-…`) — yalnız ödeyen sayfalar, günlük: değer (`provider_monthly_value`), ürün, yenileme / churn akışı, sağlık flag'leri, PY.\n- **General** (`ce318523-…`) — tüm sayfalar: provider / customer master, sözleşmeler, lead'ler, ret nedenleri, `payment_due`, Contact Forms (REVİD), katalog fiyatları.\n- **Provider Contest Dashboard** (`e7196a51-…`) — firmanın panelinde gördüğü **performans ligi skoru** (`total_score`). Ay başında sıfırlanır; skorlama Ağustos 2026'da değişti.\n**Diğerleri:** Leads (lead trendleri) · Analytics Reports (web + app trafik) · SEO Reports (Google gösterim / tıklama) · Feedback (anlaşmalar) · Couple Details (çift tarafı, WP arama listeleri) · **Finance** (ödemeler, sözleşme bazlı vade) · Provider Item (katalog ürünleri) · WP Monitor History (WP çağrı merkezi) · Provider Listing GA4 (liste sırası, kart tıklama) · Providers - PY (TES metrikleri, sözleşme kodları). Tam id listesi el kitabında.\n**Yükleme:** her gece 02:00–08:00 (Executive ~07:30, General ~06:30). Bugünün verisi hiçbir zaman tam değildir.\n**Erişim:** ekranlardan bakmak için Qlik hesabı yeter; scriptle çekmek için kişisel API anahtarı gerekir. Anahtar hiçbir dosyaya, koda ya da maile kopyalanmaz.", "jobs": [], "kit": {"prompt": "Ben düğün.com'da Qlik verisiyle rapor ve analiz yapacağım. Önce 'BU_Knowledge_Handbook.md' dosyasını oku (Part 3–5 en önemlisi), sonra 'Qlik tuzakları' için 'qlik-reload-returns-empty.md' notunu oku. Bana Executive, General ve Provider Contest uygulamalarının farkını ve hangi sorunun hangi uygulamada cevaplandığını kısa bir tabloyla özetle. Sana bir metrik sorduğumda önce el kitabında tanımına bak, sonra Qlik'te ara. API anahtarımı hiçbir dosyaya ya da çıktıya yazma; yalnız çalışırken oku. Ödeme ve vade sorularında Finance app'in referansı '00_FINANCE_DATA_UNDERSTANDING.md' dosyasıdır.", "files": [{"label": "BU_Knowledge_Handbook.md (Qlik ve metrik el kitabı)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\references\\BU_Knowledge_Handbook.md"}, {"label": "qlik-reload-returns-empty.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\notes\\qlik-reload-returns-empty.md"}, {"label": "00_FINANCE_DATA_UNDERSTANDING.md (Finance app ödeme verisi)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\8 Analyses\\Cash Flow\\00_FINANCE_DATA_UNDERSTANDING.md"}]}, "files": [{"label": ", "pin": false, "links": []}, {"id": "t-veri-yenileme-tuzaklar", "cat": "Veri & Qlik", "order": 40, "kind": "kural", "title": "Yenileme ve decay verisinde Qlik tuzakları", "tldr": "Yenileme listesi, decay ve FTS çalışmalarında Qlik'in ay seçimi, Providers - PY uygulamasının yükleme tarihi ve sözleşme kodları özel dikkat ister; yanlış seçim tüm app'i çeker.", "body": "**Nedir:** aylık yenileme listeleri, decay ve FTS işlerinde tekrar tekrar karşılaşılan veri kuralları.\n- **Yenileme Listesi master item'ı** (Executive › B2B Metrics) canlı okunur; '1.' ölçüler bugünü, '2.' ölçüler decay kontrol tarihini baz alır.\n- **Ay seçimi** (`product_ended_ym` vb.) normal seçim komutuyla sessizce başarısız olur; seçimin tuttuğunu mutlaka kontrol et, yoksa tüm uygulama 'kohort' diye çekilir.\n- **Providers - PY** uygulamasında tek bir yükleme tarihi seçilmek zorunda; temizleyince 2023'e döner. Her zaman en yeni tarihi seç. Reload sırasında eski veri döner. TES metrikleri ve sözleşme kodları (GT…, ÖTS…) bu uygulamadadır.\n- **Son günlerde imzalanan sözleşmeler** General / Executive'de Finance'ın gerisinde kalır.\n- **Upsell etiketi** Qlik'te Mart 2025'ten beri boş; upsell ürün geçmişinden çıkarılır.\n- **Liste fiyatı** General'da tam dönem fiyatıdır; aylığa çevirmek için ürün süresine böl.\n**Ayrıntı:** her işin kendi PROJECT.md'si.", "jobs": [], "kit": {}, "files": [{"label": "Monthly Renewal Lists PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\1 Renewals\\Monthly Renewal Lists\\PROJECT.md"}, {"label": "Decay PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\1 Renewals\\Decay\\PROJECT.md"}, {"label": "FTS_Eylul_Yenileme PROJECT.md", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\1 Renewals\\FTS_Eylul_Yenileme\\PROJECT.md"}], "tags": ["Qlik", "tuzak", "yenileme", "decay", "Providers - PY"], "source": "1 Renewals/Monthly Renewal Lists, Decay, FTS_Eylul_Yenileme PROJECT.md", "pin": false, "links": []}, {"id": "t-veri-lead-timeline", "cat": "Veri & Qlik", "order": 50, "kind": "bilgi", "title": "Lead verisini etkileyen sistem değişiklikleri (tarih çizelgesi)", "tldr": "Lead ve dönüşüm trendindeki bazı kırılmalar gerçek talep değişimi değil, ürün veya ölçüm değişikliğidir; trend yorumlarken bu tarihleri işaretle.", "body": "**Neden önemli:** bir düşüş ya da artışı yorumlamadan önce aynı tarihte sistemde bir değişiklik olup olmadığına bak.\n**Çizelge (eskiden yeniye):**\n- **04.2024** — Instagram etkileşimi lead yerine 'IG ziyareti' sayılmaya başladı.\n- **18.03.2025** — Leadpool bannerları 'Sizi Arayalım' oldu; leadpool lead'leri düşüyor.\n- **05–09.2025** — multilead arayüz sorunu, mekan multilead hacmi yarıya indi; Ekim 2025'te düzeldi.\n- **10.2025** — Düğüncom Özel Fiyat başladı (liste kartı değişir).\n- **10.2025 ortası** — WP aramasında en fazla 6 mekan lead'i (WP lead'i azaldı).\n- **01.2026** — listeleme sıralama mantığı değişti.\n- **03.02.2026** — WP v20 çağrı sistemi (karşılaştırılabilir WP verisi bu tarihten).\n- **18.03.2026** — ödemeyen firmaların kartları büyütüldü (Temmuz 2026'dan itibaren geri alınıyor).\n- **13.05.2026** — GA4 satın alma ölçümü düzeltildi; ölçülen dönüşüm düştü ama gerçek düşüş değil.\n- **05.2026 sonu** — WP dış tedarikçisi değişti; WP lead'inde geçici düşüş.\n**Ayrıca:** Ramazan ve bayram haftaları her yıl kayar; yıllık kıyasta bu haftaları ve bayram sonrası haftayı çıkar (el kitabı §5.5).", "jobs": [], "kit": {}, "files": [{"label": "BU_Knowledge_Handbook.md (Qlik ve metrik el kitabı)", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\_Resources\\references\\BU_Knowledge_Handbook.md"}], "tags": ["lead", "trend", "release timeline", "WP", "mevsimsellik"], "source": "BU_Knowledge_Handbook §5.5–5.7", "pin": false, "links": []}, {"id": "t-veri-araclar", "cat": "Veri & Qlik", "order": 60, "kind": "nasil", "title": "Yardımcı araçlar: qlik.py, d_one_ro.py, transcribe.py (ve Tracker)", "tldr": "Ortak `tools/` klasöründeki scriptler Qlik'ten veri çekmeyi, canlı D-One veritabanını salt okunur sorgulamayı ve Türkçe görüşme kayıtlarını deşifre etmeyi sağlar; her işte yeniden yazılmaz, bunlar kullanılır.", "body": "**`tools/qlik.py`** — Qlik Cloud'a bağlanıp tablo çeken yardımcı (Executive ve General kısayollu). API anahtarını yalnız çalışırken okur; anahtar hiçbir dosyaya, koda, maile kopyalanmaz. Uzun çekimlerde Qlik tuzakları kartındaki kurallar geçerli.\n**`tools/d_one_ro.py`** — canlı D-One veritabanına **yalnız okuma** sorgusu (SELECT vb.), süre ve satır sınırlı. Sunucu adı 'staging' olsa da veri canlıdır. Sonuçtaki kişisel veriler (isim, telefon, e-posta) proje klasörüne yazılmaz. D-One'un Python ortamıyla çalışır.\n**`tools/transcribe.py`** — Türkçe görüşme / toplantı kaydını yazıya çevirir (Whisper). Tamamen yerel çalışır, ses dosyası dışarı gitmez; çıktı kaydın yanına `_transkript.txt` olarak yazılır.\n**Kurallar:** `tools/` klasörü ve anahtar dosyası yerinden taşınmaz (scriptler yolla bulur). Varsayılan `python` 3.14'te pandas yok; pandas gereken işlerde `py -3.12` ya da D-One ortamı kullanılır.\n**Tracker (yalnız Nes'in aracı):** cevap bekleyen Claude oturumlarını listeleyen yerel sayfa (`localhost:8841`), 30 dakikadan sonra bildirim verir; Nes Panel de bu listeyi okur. Halef için gerekmez.", "jobs": [], "kit": {"prompt": "Ben düğün.com'da Qlik ve D-One verisiyle çalışacağım ve ortak 'tools' klasöründeki scriptleri kullanacağım. Önce 'qlik.py', 'd_one_ro.py' ve 'transcribe.py' dosyalarının başındaki açıklamaları, sonra 'd-one-live-db-readonly.md' notunu oku. Her scriptin ne işe yaradığını ve nasıl çalıştırıldığını bana kısa anlat. Qlik API anahtarını hiçbir dosyaya, koda ya da çıktıya yazma; D-One'a yalnız okuma sorgusu at ve kişisel verileri proje klasörüne kaydetme. Yeni bir çekim scripti yazarken qlik.py'yi kullan, yeniden yazma.", "files": [{"label": "qlik.py", "path": "C:\\Users\\NesibeK\\Desktop\\Nesibe İşler\\Claude\\tools\\qlik.py"}, {"label": "d_one_ro.py", "path": "C:\\Users\\NesibeK\\Desk }, {"date": "2027-01-01", "name": "Yılbaşı (resmi tatil)", "type": "resmi tatil", "kesin": true}, {"date": "2027-01-18", "end": "2027-01-29", "name": "Okullarda yarıyıl tatili (tahmini)", "type": "tatil", "kesin": false}, {"date": "2027-02-08", "end": "2027-03-08", "name": "Ramazan ayı (tahmini): düğün yapılmaz, firmalar sezona hazırlanır", "type": "dini", "kesin": false}, {"date": "2027-02-14", "name": "Sevgililer Günü: evlilik teklifi zirvesi", "type": "özel gün", "kesin": true}, {"date": "2027-03-08", "name": "Dünya Kadınlar Günü", "type": "özel gün", "kesin": true}, {"date": "2027-03-09", "end": "2027-03-11", "name": "Ramazan Bayramı (tahmini)", "type": "dini", "kesin": false}, {"date": "2027-03-12", "end": "2027-05-14", "name": "Bayram sonrası düğün sezonu açılışı", "type": "sektör", "kesin": false}, {"date": "2027-04-23", "name": "Ulusal Egemenlik ve Çocuk Bayramı", "type": "resmi tatil", "kesin": true}, {"date": "2027-05-01", "name": "Emek ve Dayanışma Günü", "type": "resmi tatil", "kesin": true}, {"date": "2027-05-09", "name": "Anneler Günü", "type": "özel gün", "kesin": true}, {"date": "2027-05-16", "end": "2027-05-19", "name": "Kurban Bayramı (tahmini)", "type": "dini", "kesin": false}, {"date": "2027-05-19", "name": "Atatürk'ü Anma, Gençlik ve Spor Bayramı", "type": "resmi tatil", "kesin": true}, {"date": "2027-06-01", "end": "2027-09-30", "name": "Yaz düğün sezonu", "type": "sektör", "kesin": true}, {"date": "2027-06-20", "name": "Babalar Günü", "type": "özel gün", "kesin": true}, {"date": "2027-07-15", "name": "Demokrasi ve Milli Birlik Günü", "type": "resmi tatil", "kesin": true}, {"date": "2027-08-30", "name": "Zafer Bayramı", "type": "resmi tatil", "kesin": true}, {"date": "2027-10-29", "name": "Cumhuriyet Bayramı", "type": "resmi tatil", "kesin": true}, {"date": "2027-11-26", "name": "Efsane Cuma (Black Friday)", "type": "ticari", "kesin": true}, {"date": "2027-12-31", "name": "Yılbaşı gecesi", "type": "özel gün", "kesin": true}], "ideas": [{"date": "05.11.2026", "title": "Söz Tuttu mu?", "text": "At 30/60/90 days after signing, compare the Studio's forecast with actual teklif for each sold bundle, per firm in D-One. First step: compare the 7 October firms' first 30 days by hand.", "source": "muse test, upsell count", "status": "yeni", "reason": ""}, {"date": "05.11.2026", "title": "Panelde Sepet", "text": "In its renewal window a firm sees its precomputed baskets in its panel, with a \"SAS beni arasın\" button. First step: send 10 November-list firms a one-page basket PDF with a callback link. Panel feasibility not checked.", "source": "muse test, upsell count", "status": "yeni", "reason": ""}, {"date": "09.11.2026", "title": "Tuşla Sonuç", "text": "3 days after a firm presses 1, the same automatic call asks the outcome (reached / offer given / booked / date full / could not reach) and fills the lead's sonuç kodu, giving a booking signal in days instead of months. Self-reported, so check against WP feedback. First step: PY asks 20 firms the five-option question about last week's leads and records the answer rate.", "source": "muse, lead auto-call feature", "status": "yeni", "reason": ""}, {"date": "09.11.2026", "title": "Yedek Firma", "text": "If a firm presses 2 or ignores the call and the lead stays unanswered, a couple with fewer than 6 leads gets a WhatsApp offering 2 fast similar firms. First step: count Aug-Oct unanswered leads of such couples that had a Yeşil firm in the same category and city. Technical feasibility not checked.", "source": "muse, lead auto-call feature", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "15 Dakikanın Reçetesi", "text": "Turn the screens and their order from the 23 visits with 15+ minutes of D-One into a ready \"Saha ziyareti\" template on Listelerim's customer page. First step: compare `rp_visit.modules` of those 23 rows, signed vs not signed, and write one 5-step flow. Causality is a guess on 23 visits.", "source": "muse, sales meeting deck", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "Duyduk, Ekledik", "text": "When a Görüşmelerim transcript holds an upsell signal (new venue, the firm asks for more), D-One prefills the Upsell Stüdyosu Ekleme talebi. First step: read the transcripts since 15.10.2026 by hand and count such signals for firms not on the list. Volume not checked.", "source": "muse, sales meeting deck", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "Zincir Haritası", "text": "Tag hotel pages by brand and parent group and show paid / churned / never-paid per group, so each unsold hotel gets a ready proof line from its sister properties. First step: match 15 brand names in `dw_provider_master` and count paid / unpaid per group. Number of unsold hotels not checked.", "source": "muse, otel referans dosyası", "status": "yeni", "reason": ""}, {"date": "10.11.2026", "title": "Referans Kulübü", "text": "Long-standing upper-segment hotels agree to one peer call per quarter and a 60-second phone video, in return for a named place in the reference file and a \"Referans Otel\" plaque. First step: SAS owners ask the 8 no-video hotels the one question, starting with Le Méridien Etiler. Willingness and brand rules not checked.", "source": "muse, otel referans dosyası", "status": "yeni", "reason": ""}, {"date": "17.11.2026", "title": "Çift Önerisi Paketi", "text": "A campaign gift: N WhatsApp pushes of the firm to its best-matching couples in one month, measured by leads from those couples. First step: run the couple list for 5 early-renewal firms and count couples scoring above zero. Feasibility not checked.", "source": "muse, Kampanya Stüdyosu", "status": "yeni", "reason": ""}, {"date": "17.11.2026", "title": "Talep Garantili 60 Gün", "text": "A committed minimum lead count in the first 60 days of a new Welcome firm; a shortfall adds days to the term, never a refund. First step: pull first-60-day leads of the Eylül Welcome firms to see what minimum is safe.", "source": "muse, Kampanya Stüdyosu", "status": "yeni", "reason": ""}, {"date": "17.11.2026", "title": "Fiyat Kilidi / Getir, Ay Kazan / Boş Tarih Vitrini", "text": "Three more campaign mechanisms: skip the next inflation raise when signing by a date; a paying venue refers a vendor and gets +1 month when TES signs it; venues list unsold near dates that are pushed to couples with close wedding dates. None checked for feasibility. Already used in the Aralık 2026 drafts: Booster (30 gün), Kategori Vitrini Haftası, Kapak Yenileme.", "source": "muse, Kampanya Stüdyosu", "status": "yeni", "reason": ""}, {"date": "17.11.2026", "title": "Welcome İlk 90 Gün", "text": "Flag Welcome firms that are low on leads or not Yeşil by month 3 and run a rescue in month 4 instead of month 11 (28 of the 69 scored Welcome firms are not Yeşil today). First step: list those 28 with their first-90-day leads.", "source": "muse + Kampanya Stüdyosu analysis", "status": "yeni", "reason": ""}], "tracker_ids": {"d12f3b2a-cc24-4c1d-bfa9-a6aacf1a8998": "local_bf15e68a-8b33-467f-ba85-ba4821c48655", "385d6323-2e59-414c-bbb6-22b495314b41": "local_2d5b2d01-d58d-45a2-8905-9b11e5d19461", "fbdc4e41-d54d-446c-be2c-6a557805f87f": "local_888aa326-d9d7-490f-acf1-2328bdb759f1", "208661bf-231d-4c3d-9c8b-244ef6242d98": "local_9a3e8515-4dd6-40a7-8693-992ab58884ea", "52a6f6ad-3ccd-495b-94cf-ae75944e4d12": "local_e7c09d29-d941-4036-986f-9628e9ec5f36", "95b32b9a-7562-411e-935d-c29d27110fdc": "local_86cc356d-8a68-4532-b2e5-67d7bb9ccfc7", "ca4c1b94-e8ee-482d-b98f-c9fc15960e7c": "local_3b7625a8-4a99-41be-80be-0600621f8a24", "73c5ff0a-4c8f-4c15-88d1-c0baecbcf86a": "local_34596734-7fb5-42ed-b93b-a22685867f0f", "5659b8b3-bd01-4339-a8e6-19cd9ad2dc27": "local_b1aed6ee-35b3-4e82-a137-bcab2dc27903", "2f04ef26-6691-47ea-93cb-210654c448ae": "local_2c26aff6-0a9a-4c08-b0ca-b5c4d3af6c20", "f0456de9-5c44-4adf-85e3-edad8130c15a": "local_280b9540-d740-44fb-901d-167169f794f8", "a2748b20-8b66-4866-8190-55230055e90e": "local_e7c6f838-4036-4311-be68-36e69 <script>
/* Nes Panel: shell, Ana sayfa, İşler & Projeler, Hedefler, Kütüphane. The Kampanya section lives in campaign.js.
   Data: GET /api/data (one bundle). Writes: POST /api/store (to-dos, projects, goals) and /api/library. */
"use strict";

/* ---------- helpers (also used by campaign.js) ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null || isNaN(n) ? "–" : Math.round(n).toLocaleString("tr-TR");
const fmt1 = n => n == null || isNaN(n) ? "–" : (Math.round(n*10)/10).toLocaleString("tr-TR");
const tl = n => n == null || isNaN(n) ? "–" : Math.abs(n) >= 1e6 ? (Math.round(n/1e4)/100).toLocaleString("tr-TR") + " M ₺" : fmt(n) + " ₺";
const AY = ["","Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AYK = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const ymLabel = ym => AY[+ym.slice(5,7)] + " " + ym.slice(0,4);
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2000); }
async function copy(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg||"Kopyalandı"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); toast(ok ? (okMsg||"Kopyalandı") : "Kopyalanamadı, metni elle seçin");
  }
}
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };

/* dates (ISO yyyy-mm-dd strings, local) */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const pdate = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const dayDiff = (a,b) => Math.round((pdate(b)-pdate(a))/864e5);
const addDays = (s,n) => { const d=pdate(s); d.setDate(d.getDate()+n); return iso(d); };
/* dates (Nes 26.11.2026): short dates dd.mm.yyyy; headlines long, "15 Ocak 2027 Cuma" (flong) */

const flong = s => { if(!s) return ""; const d=typeof s==="string"?pdate(s.slice(0,10)):s; return `${d.getDate()} ${AY[d.getMonth()+1]} ${d.getFullYear()} ${GUN[d.getDay()]}`; };
const dLabel = s => fdate(s);
function dueLabel(s){
  if(!s) return "";
  const n=dayDiff(TODAY(), s);
  if(n<0) return n===-1 ? "dün" : `${-n} gün gecikti`;
  if(n===0) return "bugün"; if(n===1) return "yarın";
  if(n<7) return GUN[pdate(s).getDay()];
  return dLabel(s);
}

/* No server (Nes 23.11.2026): the build script (build_html.py) puts the data into the page as window.PANEL_DATA.
   What Nes changes in the page lives in this browser's localStorage. New items that Claude adds to data/store.json or
   data/library.json reach the page at the next build: seed items whose id the browser has never seen are merged in;
   items she deleted stay deleted. "Yedek al / Yedek yükle" moves her data between browsers. */
function storeGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function mergeSeed(seed, localKey, seenKey, lists){
  const local=storeGet(localKey); const seen=new Set(storeGet(seenKey)||[]);
  let out;
  if(!local) out=JSON.parse(JSON.stringify(seed));
  else{
    out=local;
    lists.forEach(k=>{ out[k]=out[k]||[]; const have=new Set(out[k].map(x=>x.id)); (seed[k]||[]).forEach(x=>{ if(!have.has(x.id) && !seen.has(x.id)) out[k].push(x);
      /* a seed item with a higher "rev" replaces the browser copy (corrections Claude makes to existing notes) */
      else if(x.rev){ const j=out[k].findIndex(y=>y.id===x.id); if(j>-1 && (out[k][j].rev||0)<x.rev) out[k][j]=JSON.parse(JSON.stringify(x)); } }); });
    if(seed.decisions){ out.decisions=out.decisions||{}; Object.entries(seed.decisions).forEach(([k,v])=>{ if(!(k in out.decisions) && !seen.has("dec:"+k)) out.decisions[k]=v; }); }
    ["jnotes"].forEach(k=>{ if(seed[k] && !out[k]) out[k]=JSON.parse(JSON.stringify(seed[k])); });
    if(seed.last_day && !out.last_day) out.last_day=seed.last_day;
    if(seed.categories){ out.categories=[...new Set([...(out.categories||[]), ...seed.categories])]; }
  }
  const ids=lists.flatMap(k=>(seed[k]||[]).map(x=>x.id)).concat(Object.keys(seed.decisions||{}).map(k=>"dec:"+k));
  storeSet(seenKey, [...new Set([...seen, ...ids])]); storeSet(localKey, out);
  return out;
}
async function load(){
  const P=window.PANEL_DATA;
  if(!P){ $("view").innerHTML=`<div class="empty">Veri bulunamadı. Sayfayı <code>build_html.py</code> ile yeniden oluştur.</div>`; return false; }
  D=JSON.parse(JSON.stringify(P));
  D.store=mergeSeed(P.store||{todos:[],projects:[],goals:[]}, "np_store", "np_seen_store", ["todos","projects","goals","handovers"]);
  D.store.todos=D.store.todos||[]; D.store.projects=D.store.projects||[]; D.store.goals=D.store.goals||[]; D.store.handovers=D.store.handovers||[]; D.store.jnotes=D.store.jnotes||{}; D.store.last_day=D.store.last_day||"2027-01-15";
  libUpgrade(P.library);
  D.library=mergeSeed(P.library||{items:[]}, "np_library", "np_seen_lib", ["items"]);
  D.tracker={ok:false, static:true, items:[]};
  loadedAt=P.built ? new Date(P.built) : new Date();
  return true;
}

  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify({store:D.store, library:D.library}, null, 1)],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove();

function importBackup(){

}

/* ---------- domain: to-dos, projects, targets ---------- */
const todos = () => D.store.todos;
const projects = () => D.store.projects;
const goals = () => D.store.goals;
const proj = id => projects().find(p=>p.id===id);
const isOpen = t => t.status !== "done";
const isLate = t => isOpen(t) && t.due && t.due < TODAY();
const isToday = t => isOpen(t) && t.due === TODAY();
const PRIO = {"yüksek":0,"orta":1,"düşük":2};
const byPrio = (a,b) => (PRIO[a.priority]??1)-(PRIO[b.priority]??1) || (a.due||"9999").localeCompare(b.due||"9999");
function todoTargets(t){ return t.targets||[]; }   // only links set on the to-do itself count (no inheritance from the project)

/* team targets come from the monthly "İlk N Ay analiz" workbook (9 Monthly Campaigns/data/hedef) */
const H = () => D.hedef || {};
const pct = (a,b) => b ? Math.round(a/b*100) : null;
const hDurum = p => p==null ? null : p>=100 ? "ok" : p>=85 ? "near" : "bad";
const HET = {ok:"Hedefte", near:"Yakın", bad:"Geride"};
function lastAy(){ const r=(H().ekip_aylik||[]).filter(r=>r.gerceklesen!=null); return r.length ? Math.max(...r.map(r=>r.ay_no)) : null; }
function teams(){ return [...new Set((H().ekip_aylik||[]).filter(r=>(r.hedef!=null||r.gerceklesen!=null) && r.ekip!=="MoS - Yenileme").map(r=>r.ekip))]; }   // MoS never renews
function teamStat(ekip){
  const rows=(H().ekip_aylik||[]).filter(r=>r.ekip===ekip); const ay=lastAy();
  const last=rows.find(r=>r.ay_no===ay && r.hedef!=null && r.gerceklesen!=null);
  const done=rows.filter(r=>r.hedef!=null && r.gerceklesen!=null);
  const ytdH=done.reduce((s,r)=>s+r.hedef,0), ytdG=done.reduce((s,r)=>s+r.gerceklesen,0);
  const nx=(H().sonraki_ay_hedef||[]).find(r=>r.ekip===ekip);
  const b = last ? pct(last.gerceklesen,last.hedef) : null;
  return {ekip, ay:last?last.ay:null, hedef:last?last.hedef:null, ger:last?last.gerceklesen:null, basari:b, durum:hDurum(b), next:nx?nx.hedef:null, nextAy:nx?nx.ay:null, ytdH, ytdG, ytdPct:pct(ytdG,ytdH)};
}
function allTargets(){ return teams().map(t=>({key:"ekip:"+t, label:t, kind:"ekip"})).concat(goals().map(g=>({key:"goal:"+g.id, label:g.title, kind:"goal"}))); }
function targetLabel(k){ if(k.startsWith("ekip:")) return k.slice(5); const g=goals().find(g=>"goal:"+g.id===k); return g ? g.title : k; }
const ekipOf = c => `${c.team} - ${c.kind==="yeni" ? "Yeni" : "Yenileme"}`;
function latestCampaignMonth(){ const m=Object.keys((D.campaigns||{}).months||{}).sort(); return m[m.length-1]||null; }
function campaignsFor(ekip){ const m=latestCampaignMonth(); return m ? (D.campaigns.months[m].campaigns||[]).filter(c=>ekipOf(c)===ekip) : []; }
function support(key){
  const t=todos().filter(t=>isOpen(t) && todoTargets(t).includes(key));
  const p=projects().filter(p=>p.status!=="bitti" && (p.targets||[]).includes(key));
  const c=key.startsWith("ekip:") ? campaignsFor(key.slice(5)) : [];
  return {todos:t, projects:p, campaigns:c, total:t.length+p.length+c.length};
}
function goalProgress(g){
  if(g.mode==="todos"){ const l=todos().filter(t=>todoTargets(t).includes("goal:"+g.id)); return {p: l.length ? Math.round(l.filter(t=>!isOpen(t)).length/l.length*100) : 0, txt:`${l.filter(t=>!isOpen(t)).length} / ${l.length} iş bitti`}; }
  const p = g.target ? Math.round((+g.current||0)/(+g.target)*100) : 0;
  const u = g.unit==="₺" ? tl : (v=>fmt1(v)+(g.unit?" "+g.unit:""));
  return {p, txt:`${u(+g.current||0)} / ${u(+g.target||0)}`};
}

function waiting(){ const T=D.tracker||{}; const dm=lsGet("np_tr_dismissed")||{}; return (T.items||[]).filter(i=>(i.kind==="soru"||i.kind==="izin") && (dm[i.id]||0)<i.since).map(i=>Object.assign({}, i, {mins: Math.round(((T.now||Date.now()/1000)-i.since)/60)})).sort((a,b)=>b.mins-a.mins); }
function nextRun(){ const t=pdate(TODAY()); let d=new Date(t.getFullYear(), t.getMonth(), 24); if(d<t) d=new Date(t.getFullYear(), t.getMonth()+1, 24); const s=iso(d); const tm=new Date(d.getFullYear(), d.getMonth()+1, 1); return {date:s, days:dayDiff(TODAY(), s), forMonth:`${tm.getFullYear()}-${String(tm.getMonth()+1).padStart(2,"0")}`}; }
function decisionsCount(){ const m=latestCampaignMonth(); const dd=D.store.decisions||{}; return m ? (D.campaigns.months[m].campaigns||[]).reduce((s,c)=>s+(c.decisions||[]).filter((x,i)=>!(dd[c.id+"#"+i]||{}).done).length,0) : 0; }
function alerts(){
  const A=[]; const go=(h)=>h;
  const late=todos().filter(isLate);
  if(late.length) A.push({lvl:"bad", icon:"clock", title:`${late.length} iş gecikti`, text:late.slice(0,3).map(t=>t.text).join(" · "), act:["İşlere git", "#tasks", ()=>{S.ttab="todo"; S.tfilter="gecikmis";}]});
  // grouped (Nes 25.11.2026): one card for all teams that are behind with no linked open to-do
  const bh=teams().map(teamStat).filter(s=>s.durum==="bad" && !support("ekip:"+s.ekip).todos.length);
  if(bh.length) A.push({lvl:"near", icon:"target", title:`${bh.length} geride ekibin bağlı açık işi yok`, text:bh.map(s=>`${s.ekip} %${s.basari}`).join(" · "), act:["Hedefler", "#targets", ()=>{ S.tsel=null; }]});
  const dc=decisionsCount(); const lm=latestCampaignMonth();
  if(dc) A.push({lvl:"info", icon:"campaign", title:`${ymLabel(lm)} kampanyalarında ${dc} karar seni bekliyor`, text:"Fiyat, hediye ve kontrol grubu soruları, tek listede.", act:["Kararlara git", "#campaign", ()=>{ K.view="kararlar"; lsSet("np_k_view","kararlar"); }]});
  const nr=nextRun();
  if(nr.days<=3) A.push({lvl:"info", icon:"cal", title:`Aylık kampanya çalışması ${nr.days===0?"bugün":nr.days+" gün sonra"} (${dLabel(nr.date)} 09:30)`, text:`${ymLabel(nr.forMonth)} önerileri üretilecek. Yeni hedef dosyası geldiyse önce onu ekle.`});
  const la=lastAy(); const cm=pdate(TODAY()).getMonth()+1;
  if(la && ((cm-1-la+12)%12)>=1) A.push({lvl:"near", icon:"chart", title:`Hedef verisi ${AY[la]} ayında kaldı`, text:`${AY[(la%12)+1]} "İlk N Ay analiz" dosyası geldiyse Claude'a "hedef verisini yenile" de.`});
  const an=(D.campaigns||{}).analyses||{};
  if(an.last_closed_month){ const [y,m]=an.last_closed_month.split("-").map(Number); const t=pdate(TODAY()); const gap=(t.getFullYear()*12+t.getMonth()+1)-(y*12+m); if(gap>=2) A.push({lvl:"near", icon:"chart", title:`Kampanya analizleri ${ymLabel(an.last_closed_month)} verisinde`, text:"Bir sonraki aylık çalışmada yenilenir; acilse Claude'a \"kampanya verisini yenile\" de."}); }
  return A;
}

function todoRow(t, o){
  o=o||{}; const r=el("div","row clk"+(isOpen(t)?"":" done"));
  const p=proj(t.project); const tg=todoTargets(t);
  const due = t.due ? `<span class="due ${isLate(t)?"late":isToday(t)?"today":""}">${esc(dueLabel(t.due))}</span>` : "";
  r.innerHTML=`<input type="checkbox" class="chk" ${isOpen(t)?"":"checked"} aria-label="Bitti olarak işaretle"><div class="grow"><span class="t">${esc(t.text)}</span><span class="meta"><span class="prio ${esc(t.priority)}" title="Öncelik: ${esc(t.priority)}"></span>${due}${t.status==="doing"?'<span class="chip near">Yapılıyor</span>':""}${p&&!o.noProject?`<span class="chip"><span class="sw ${esc(p.color)}" style="width:8px;height:8px;border-radius:3px"></span>${esc(p.name)}</span>`:""}${o.noTargets?"":tg.slice(0,3).map(k=>`<span class="chip target">${esc(targetLabel(k))}</span>`).join("")}${tg.length>3&&!o.noTargets?`<span class="note">+${tg.length-3}</span>`:""}</span></div>`;
  const cb=r.querySelector(".chk");
  cb.onclick=e=>e.stopPropagation();
  cb.onchange=()=>{
    const after=()=>{ if(o.onChange) o.onChange(); else render(); };
    if(!cb.checked){ t.status="todo"; t.done_at=null; saveStore(); after(); return; }
    // a ticked task waits 5 s with "Geri al" before it moves to Bitti (Nes 25.11.2026)
    r.classList.add("pending");
    const commit=()=>{ PEND.delete(t.id); t.status="done"; t.done_at=TODAY(); saveStore(); };
    const tm=setTimeout(()=>{ commit(); after(); }, 5000); PEND.set(t.id, {tm, commit});
    undoToast("Bitti olarak işaretlendi", ()=>{ clearTimeout(tm); PEND.delete(t.id); cb.checked=false; r.classList.remove("pending"); });
  };
  r.onclick=()=>todoModal(t);
  return r;
}

/* target slider on the home page (Nes 25.11.2026): 2026 so far, then the current month; 3 s per slide, stops under the mouse */
function sliderData(){
  const T=teams(); const R=(H().ekip_aylik||[]).filter(r=>T.includes(r.ekip) && r.hedef!=null && r.gerceklesen!=null);
  const ay=lastAy(); if(!ay) return [];
  const yH=R.reduce((a,r)=>a+r.hedef,0), yG=R.reduce((a,r)=>a+r.gerceklesen,0);
  const lr=R.filter(r=>r.ay_no===ay); const lH=lr.reduce((a,r)=>a+r.hedef,0), lG=lr.reduce((a,r)=>a+r.gerceklesen,0);
  const cm=pdate(TODAY()).getMonth()+1; const nx=(H().sonraki_ay_hedef||[]).filter(r=>T.includes(r.ekip));
  const nH=nx.reduce((a,r)=>a+(r.hedef||0),0), nG=nx.some(r=>r.ciro!=null) ? nx.reduce((a,r)=>a+(r.ciro||0),0) : null;
  const S1={k:`2026 · Ocak–${AY[ay]}`, p:pct(yG,yH), main:`${tl(yG)} / ${tl(yH)}`, sub:"gerçekleşen / hedef, tüm ekipler"};
  let S2;
  if(nx.length && nx[0].ay===AY[cm]) S2 = nG!=null ? {k:`${AY[cm]} · bu ay`, p:pct(nG,nH), main:`${tl(nG)} / ${tl(nH)}`, sub:"gerçekleşen / hedef"}
    : {k:`${AY[cm]} · bu ay`, p:null, big:tl(nH), main:"hedef · gerçekleşen ay kapanınca gelir", sub:`Son kapanan ay ${AY[ay]}: %${pct(lG,lH)} (${tl(lG)} / ${tl(lH)})`};
  else S2={k:`${AY[ay]} · son kapanan ay`, p:pct(lG,lH), main:`${tl(lG)} / ${tl(lH)}`, sub:"gerçekleşen / hedef"};
  // then one slide per team card, in this order (Nes 25.11.2026)
  const T5=["SAS - Yenileme","SAS - Yeni","TES - Yenileme","TES - Yeni","MoS - Yeni"].filter(e=>T.includes(e)).map(teamStat).filter(s=>s.basari!=null)
    .map(s=>({team:s, ekip:s.ekip, p:s.basari}));
  return [S1,S2,...T5];
}

function axis(max, W, H, L, T, B){
  const step=Math.pow(10, Math.floor(Math.log10(max||1))); const k=max/step; const st = k>5?step*2:k>2?step:step/2; const top=Math.ceil(max/st)*st;

  return {y, g};
}
function barChart(rows, series, top, W){
  W=W||760; const Hh=W<600?250:270,L=46,T=22,B=26; const max=Math.max(1,...rows.flatMap(r=>series.map(s=>r[s.key]||0)));

    o+=`<text x="${L+i*bw+bw/2}" y="${Hh-8}" text-anchor="middle">${AYK[r.ay_no-1]}</text>`; });

const KINDS = {kural:"Kural", yasak:"Asla", nasil:"Nasıl yapılır", tanim:"Tanım", bilgi:"Bilgi"};
function md(text, q){
  const hl = s => q ? s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>") : s;
  const inline = s => hl(esc(String(s).replace(/\b(\d{2})\/(\d{2})\/(\d{4})\b/g,"$1.$2.$3"))).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  const out=[]; let stack=[];
  const close=d=>{ while(stack.length>d){ out.push("</ul>"); stack.pop(); } };
  String(text||"").split("\n").forEach(line=>{
    const m=line.match(/^(\s*)- (.*)$/);
    if(m){ const d=Math.floor(m[1].length/3)+1; while(stack.length<d){ out.push("<ul>"); stack.push(1); } close(d); out.push(`<li>${inline(m[2])}</li>`); return; }
    close(0); if(line.trim()) out.push(`<p>${inline(line)}</p>`);
  });
  close(0); return out.join("");
}

/* multi-select dropdown for the panel's own pages (white = all, black = a custom selection) */
function msDrop(label, key, all, labels){
  const sel=S[key]; const has=v=>!sel||sel.includes(v); const lb=v=>labels[v]||v;
  const set=v=>{ S[key]=(v && v.length===all.length) ? null : v; keepUi(); render(); };
  const dd=el("div","dd");
  const txt=!sel?"Hepsi":!sel.length?"Seçilmedi":sel.length<=2?sel.map(lb).join(", "):sel.length+" seçili";
  const b=el("button"); b.type="button"; b.dataset.on=sel?"1":"0"; b.innerHTML=`<span style="opacity:.7">${esc(label)}</span> ${esc(txt)}`; b.setAttribute("aria-expanded", String(S.drop===key));
  b.onclick=e=>{ e.stopPropagation(); S.drop=S.drop===key?null:key; render(); };
  dd.appendChild(b);
  if(S.drop===key){
    const p=el("div","ddp"); p.onclick=e=>e.stopPropagation();
    const acts=el("div","acts",`<button type="button" data-a="all">tümünü seç</button><button type="button" data-a="none">temizle</button>`);
    acts.querySelector('[data-a="all"]').onclick=()=>set(null); acts.querySelector('[data-a="none"]').onclick=()=>set([]); p.appendChild(acts);
    all.forEach(v=>{ const l=el("label"); const i=document.createElement("input"); i.type="checkbox"; i.checked=has(v); i.onchange=()=>{ const cur=sel?sel.slice():all.slice(); set(i.checked?cur.concat([v]):cur.filter(x=>x!==v)); }; l.appendChild(i); l.appendChild(document.createTextNode(lb(v))); p.appendChild(l); });
    dd.appendChild(p);
  }
  return dd;
}

  const go=(hash, fn)=>()=>{ closeModal(); if(fn) fn(); keepUi(); if(location.hash!==hash) location.hash=hash; else render(); window.scrollTo(0,0); };
  ROUTES.forEach(([id,l])=>X.push({type:"Sayfa", title:l, text:l, act:go("#"+id)}));
  todos().forEach(t=>X.push({type:"İş", title:t.text, sub:[(proj(t.project)||{}).name, t.status==="done"?"bitti":t.due?dueLabel(t.due):""].filter(Boolean).join(" · "), text:[t.text,t.note].join(" "), act:()=>{ closeModal(); todoModal(t); }}));
  waiting().forEach(i=>X.push({type:"Oturum", title:i.title, sub:fmtWait(i.mins)+" bekliyor", text:[i.title,i.note,i.folder].join(" "), act:()=>{ closeModal(); if(i.link) location.href=i.link; }}));
  projects().forEach(p=>X.push({type:"Proje", title:p.name, sub:p.area||"", text:[p.name,p.note,p.area].join(" "), act:()=>{ closeModal(); projectModal(p); }}));
  C.forEach(c=>{
    const tones=Object.values(c.tones||{}).map(t=>[t.subject,t.body,t.whatsapp].join(" ")).join(" ");
    X.push({type:"Kampanya", title:c.headline||c.title, sub:`${c.team} · ${KIND[c.kind]} · ${ymLabel(m)}`, text:[c.title,c.headline,c.audience&&c.audience.who,(c.details||[]).map(d=>d.label+" "+d.text).join(" "),(c.why||[]).map(w=>w.fact+" "+(w.so||"")).join(" "),tones].join(" "), act:()=>{ closeModal(); openCampaign(c.id, m); }});
    (c.decisions||[]).forEach((q,i)=>{ const st=(D.store.decisions||{})[c.id+"#"+i]||{}; X.push({type:"Karar", title:q, sub:c.title+(st.note?" · "+st.note:st.done?" · verildi":""), text:q+" "+(st.note||""), act:go("#campaign", ()=>{ K.view="kararlar"; K.teams=null; lsSet("np_k_view","kararlar"); })}); });
  });
  teams().forEach(e=>{ const s=teamStat(e); X.push({type:"Hedef", title:e, sub:s.basari!=null?`${s.ay} %${s.basari} · ${HET[s.durum]}`:"", text:e, act:go("#targets", ()=>{ S.hT=null; S.hK=null; S.tsel=e; })}); });
  goals().forEach(g=>X.push({type:"Hedef", title:g.title, sub:"kişisel hedef", text:[g.title,g.note].join(" "), act:go("#targets")}));
  (D.library.items||[]).forEach(i=>X.push({type:"Kütüphane", title:i.title, sub:i.cat, text:[i.title,i.tldr,i.body,(i.tags||[]).join(" ")].join(" "), act:go("#library", ()=>{ S.lq=""; S.lcat="Tümü"; S.lkind=""; S.lopen[i.id]=true; })}));
  (D.ideas||[]).forEach(i=>X.push({type:"Fikir", title:i.title, sub:i.status||"yeni", text:[i.title,i.text].join(" "), act:go("#tasks", ()=>{ S.ttab="idea"; })}));
  D.store.handovers.forEach(h=>X.push({type:"Aktarım", title:h.title, sub:[h.to?"→ "+h.to:"", HST[h.status]].filter(Boolean).join(" · "), text:[h.title,h.area,h.to,h.note].join(" "), act:()=>{ closeModal(); handoverModal(h); }}));
  return X;
}
function openSearch(){
  const X=searchIndex(); let sel=0, shown=[];
  openModal(m=>{
    m.classList.add("top");
    m.innerHTML=`<label class="search big">${ic("search")}<input type="search" id="gq" placeholder="İş, oturum, proje, kampanya, karar, hedef, not, aktarım ara…" aria-label="Her şeyde ara" autocomplete="off"></label><div id="gr" class="sres"></div><p class="note">↑ ↓ seç · Enter aç · Esc kapat</p>`;
    const inp=m.querySelector("#gq"), res=m.querySelector("#gr");
    const draw=()=>{
      const q=lc(inp.value.trim()); res.innerHTML="";
      shown = q ? X.filter(x=>lc(x.title+" "+x.text).includes(q)) : X.filter(x=>x.type==="Sayfa"||x.type==="Oturum"||(x.type==="İş"&&todos().some(t=>t.text===x.title&&(isLate(t)||isToday(t)))));
      const groups={}; shown.forEach(x=>(groups[x.type]=groups[x.type]||[]).push(x));
      shown=[]; Object.entries(groups).forEach(([g,items])=>{ res.appendChild(el("p","group-h",esc(g))); items.slice(0,6).forEach(x=>{ const i=shown.length; shown.push(x);
        const hl=s=>{ const e=esc(s||""); return q ? e.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>") : e; };
        const b=el("button","sitem"+(i===sel?" on":""),`<span class="t">${hl(x.title.length>110?x.title.slice(0,107)+"…":x.title)}</span>${x.sub?`<span class="note">${esc(x.sub)}</span>`:""}`); b.type="button"; b.onclick=x.act; b.onmouseenter=()=>{ sel=i; res.querySelectorAll(".sitem").forEach((n,j)=>n.classList.toggle("on",j===i)); }; res.appendChild(b); }); });
      if(!shown.length) res.appendChild(el("div","empty",`"${esc(inp.value)}" için sonuç yok.`));
    };
    inp.oninput=()=>{ sel=0; draw(); };
    inp.onkeydown=e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(0,Math.min(shown.length-1, sel+(e.key==="ArrowDown"?1:-1))); res.querySelectorAll(".sitem").forEach((n,j)=>{ n.classList.toggle("on",j===sel); if(j===sel) n.scrollIntoView({block:"nearest"}); }); } if(e.key==="Enter" && shown[sel]){ e.preventDefault(); shown[sel].act(); } };
    draw();
  });
}

/* Pano (board) like jobness > Shortlist: status columns, cards open in place, drag between columns */
const BCOLS=[["todo","Yapılacak","lav"],["doing","Yapılıyor","butter"],["done","Bitti","mint"]];
function setStatus(t, st){
  const prev={status:t.status, done_at:t.done_at}; if((t.status||"todo")===st) return;
  t.status=st; t.done_at=st==="done"?TODAY():null; saveStore(); render();
  if(st==="done") undoToast("Bitti'ye taşındı", ()=>{ Object.assign(t,prev); saveStore(); render(); });
}
function renderBoard(v){
  const f=el("div","toolbar"); f.appendChild(el("span","note","Kartı sütunlar arasında sürükle ya da aç, durumunu değiştir.")); f.appendChild(el("span","sp")); todoFilterSelects(f); v.appendChild(f);
  const b=el("div","board"); v.appendChild(b);
  const L=byFilters(todos());
  BCOLS.forEach(([st,l,col])=>{
    let items=L.filter(t=>(t.status||"todo")===st);
    const n=items.length;
    if(st==="done") items=items.sort((a,b)=>(b.done_at||"").localeCompare(a.done_at||"")).slice(0,12);
    else items.sort((a,b)=>(isLate(b)-isLate(a))||(a.due||"9999").localeCompare(b.due||"9999")||byPrio(a,b));
    const sess = st==="todo" && !S.tproj && !S.ttarget ? waiting() : [];
    const c=el("section","bcol"+((n||sess.length)?" has "+col:""));
    c.innerHTML=`<header><span class="bdot ${col}"></span><b>${l}</b><span class="note">${n+sess.length}</span></header>`;
    c.ondragover=e=>{ e.preventDefault(); c.classList.add("over"); }; c.ondragleave=()=>c.classList.remove("over");
    c.ondrop=e=>{ e.preventDefault(); c.classList.remove("over"); const t=todos().find(x=>x.id===e.dataTransfer.getData("text/plain")); if(t) setStatus(t, st); };
    sess.forEach(i=>{ const k=el("article","bcard sess"); k.innerHTML=`<div class="bh"><span class="sdot">${ic("chat")}</span><div class="grow"><span class="t">${esc(i.title)}</span><span class="meta"><span class="due ${i.mins>=180?"late":""}">${fmtWait(i.mins)} bekliyor</span></span></div>${i.link?`<a class="ghost sm" href="${esc(i.link)}">Aç</a>`:""}</div>`; c.appendChild(k); });
    items.forEach(t=>c.appendChild(boardCard(t)));
    if(!n && !sess.length) c.appendChild(el("div","bempty","İş yok"));
    if(st==="done" && n>12) c.appendChild(el("p","note",`Son 12 gösteriliyor · tümü Yapılacaklar > Biten'de`));
    b.appendChild(c);
  });
}
function boardCard(t){
  const p=proj(t.project); const open=!!S.bopen[t.id]; const st=t.status||"todo";
  const k=el("article","bcard"+(open?" open":"")+(isLate(t)?" late":"")); k.draggable=true;
  k.ondragstart=e=>{ e.dataTransfer.setData("text/plain", t.id); k.classList.add("drag"); }; k.ondragend=()=>k.classList.remove("drag");
  const due=t.due?`<span class="due ${isLate(t)?"late":isToday(t)?"today":""}">${esc(dueLabel(t.due))}</span>`:"";
  k.innerHTML=`<div class="bh"><span class="prio ${esc(t.priority)}" title="Öncelik: ${esc(t.priority)}"></span><div class="grow"><span class="t">${esc(t.text)}</span><span class="meta">${due}${p?`<span class="chip"><span class="sw ${esc(p.color)}" style="width:8px;height:8px;border-radius:3px"></span>${esc(p.name)}</span>`:""}</span></div><button class="icon-btn xs" type="button" aria-expanded="${open}" aria-label="${open?"Kapat":"Aç"}">${ic("chev")}</button></div>`;
  k.querySelector(".icon-btn").onclick=()=>{ S.bopen[t.id]=!open; render(); };
  if(open){
    const i=BCOLS.findIndex(c=>c[0]===st);
    const body=el("div","bb");
    body.innerHTML=`${t.note?`<p class="note">${esc(t.note)}</p>`:""}<div class="steps">${BCOLS.map((c,j)=>`<span class="${j<=i?"on":""}"></span>`).join("")}</div><div class="steps-l">${BCOLS.map(c=>`<span>${c[1]}</span>`).join("")}</div>${todoTargets(t).length?`<div class="chips">${todoTargets(t).map(x=>`<span class="chip target">${esc(targetLabel(x))}</span>`).join("")}</div>`:""}<div class="bact"><select aria-label="Durum">${BCOLS.map(c=>`<option value="${c[0]}" ${c[0]===st?"selected":""}>${c[1]}</option>`).join("")}</select><button class="ghost sm" type="button">Düzenle</button></div>`;
    body.querySelector("select").onchange=e=>setStatus(t, e.target.value);
    body.querySelector("button").onclick=()=>todoModal(t);
    k.appendChild(body);
  }
  return k;
}

/* Özel günler (moved here from the home page, Nes 25.11.2026) */
function renderDays(v){
  const days=(D.special_days||[]).filter(d=>(d.end||d.date)>=TODAY()).slice(0,30);
  const c=el("div","card");
  c.innerHTML=`<div class="ch"><h3>Yaklaşan özel günler</h3><span class="sp"></span><span class="note">${days.length} gün</span></div>`;
  if(!days.length){ c.appendChild(el("div","empty","Yaklaşan özel gün yok.")); v.appendChild(c); return; }
  c.insertAdjacentHTML("beforeend", `<div class="days">${days.map(d=>{ const dd=pdate(d.date); const n=dayDiff(TODAY(), d.date); return `<div class="day"><span class="d"><b>${dd.getDate()}</b><small>${AYK[dd.getMonth()]}</small></span><div class="grow"><span class="t">${esc(d.name)}</span><div class="note">${esc(d.type||"")}${d.end?" · "+dLabel(d.date)+" – "+dLabel(d.end):""}${d.kesin===false?" · tarih tahmini":""}</div></div><span class="note nw">${n<=0?"bugün":n+" gün sonra"}</span></div>`; }).join("")}</div>`);
  v.appendChild(c);
}

/* ---------- view: Yolculuğum (Nes 25.11.2026): last day 15.01.2027 and the handovers (aktarımlar) ---------- */
const HST = {todo:"Başlamadı", doing:"Sürüyor", done:"Aktarıldı"};
function workdays(a, b){ let n=0; const d=pdate(a); const e=pdate(b); while(d<e){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w&&w<6) n++; } return n; }
function handoverModal(h){
  const isNew=!h; h = h || {id:uid("h"), title:"", area:"", to:"", status:"todo", due:null, note:""};
  openModal(m=>{
    m.innerHTML=`<h2 id="modalTitle">${isNew?"Yeni aktarım":"Aktarımı düzenle"}</h2>
      <label class="f">Ne aktarılacak<input type="text" id="hT" value="${esc(h.title)}" placeholder="ör. Aylık yenileme listeleri"></label>
      <div class="grid2"><label class="f">Kime<input type="text" id="hTo" value="${esc(h.to||"")}" placeholder="Devralacak kişi"></label>
      <label class="f">Durum<select id="hS">${Object.entries(HST).map(([k,l])=>`<option value="${k}" ${k===h.status?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="f">Tarih<input type="date" id="hD" value="${esc(h.due||"")}"></label>
      <label class="f">Klasör / sistem<input type="text" id="hA" value="${esc(h.area||"")}"></label></div>
      <label class="f">Not (ne anlatılacak, nerede durur)<textarea id="hN" rows="3">${esc(h.note||"")}</textarea></label>
      <div class="acts">${isNew?"":'<button class="ghost danger" type="button" id="hDel">Sil</button>'}<span class="sp"></span><button class="ghost" type="button" id="hX">Vazgeç</button><button class="btn" type="button" id="hOk">Kaydet</button></div>`;
    m.querySelector("#hX").onclick=closeModal;
    if(!isNew) m.querySelector("#hDel").onclick=()=>{ if(!confirm("Bu aktarım silinsin mi?")) return; D.store.handovers=D.store.handovers.filter(x=>x.id!==h.id); saveStore(); closeModal(); render(); };
    m.querySelector("#hOk").onclick=()=>{ const title=m.querySelector("#hT").value.trim(); if(!title){ m.querySelector("#hT").focus(); return; }
      Object.assign(h, {title, to:m.querySelector("#hTo").value.trim(), status:m.querySelector("#hS").value, due:m.querySelector("#hD").value||null, area:m.querySelector("#hA").value.trim(), note:m.querySelector("#hN").value.trim()});
      if(isNew) D.store.handovers.push(h); saveStore(); closeModal(); render(); toast("Kaydedildi"); };
  });
}
function renderJourney(v){
  const last=D.store.last_day; const L=D.store.handovers; const days=dayDiff(TODAY(), last);
  const done=L.filter(h=>h.status==="done").length; const p=L.length?Math.round(done/L.length*100):0;
  const order=L.slice().sort((x,y)=>(x.due||"9999").localeCompare(y.due||"9999"));
  const next=order.find(h=>h.status!=="done");
  const hero=el("section","hero"); hero.innerHTML=`<p class="eyebrow">Yolculuğum</p><h1>Son gün ${flong(last)}</h1>`; v.appendChild(hero);
  const g=el("section","jgrid"); v.appendChild(g);
  const col=el("div","jcol"); g.appendChild(col);
  const a=el("div","tile lav big jcard");
  a.innerHTML=`<div class="grow"><span class="eyebrow">Aktarım · son gün ${fdate(last)}</span><span class="v">%${p}<small>aktarıldı</small></span><div class="bar"><i style="width:${p}%;background:var(--ink)"></i></div><span class="s"><b>${days>0?days+" gün kaldı":days===0?"Bugün son gün":"Son gün geçti"}</b>${days>0?` · ${workdays(TODAY(), last)} iş günü`:""}${next?` · sıradaki: <b>${esc(next.title)}</b>`:""}</span><span class="chips"><button class="ghost sm" type="button" id="jMap">${ic("flag")}${S.jmap?"Yol haritasını gizle":"Yol haritasını göster"}</button><button class="btn sm" type="button" id="jAdd">${ic("plus")}Aktarım ekle</button></span></div><div class="ring">${ringSvg(p/100)}<div><b>%${p}</b><small>${done}/${L.length}</small></div></div>`;
  col.appendChild(a);
  a.querySelector("#jMap").onclick=()=>{ S.jmap=!S.jmap; keepUi(); render(); };
  a.querySelector("#jAdd").onclick=()=>handoverModal();
  // road map: open by default, right under the card (like jobness > My journey)
  if(S.jmap){
    const mp=el("div","card road-card");
    mp.innerHTML=`<div class="ch"><h3>Yol haritası</h3><span class="sp"></span><span class="note">${done} / ${L.length} aktarıldı</span></div>`;
    const ol=el("ol","road2");
    order.forEach(h=>{
      const li=el("li", h.status==="done"?"done":h===next?"now":"");
      li.innerHTML=`<span class="dot" aria-hidden="true">${h.status==="done"?"✓":""}</span><div class="grow"><b>${esc(h.title)}</b><span class="note">${[h.to?"Kime: "+esc(h.to):"Kime: —", h.due?fdate(h.due):"tarih yok", HST[h.status]].join(" · ")}</span>${h.status==="doing"?`<div class="bar"><i style="width:50%"></i></div>`:""}${h!==next?"":`<span class="chips">${h.status!=="doing"&&h.status!=="done"?`<button class="ghost sm" type="button" data-s="doing">Başladım</button>`:""}${h.status!=="done"?`<button class="ghost sm" type="button" data-s="done">${ic("tasks")}Aktarıldı</button>`:`<button class="ghost sm" type="button" data-s="todo">Geri al</button>`}<button class="ghost sm" type="button" data-e="1">Düzenle</button></span>`}</div>`;
      li.querySelectorAll("[data-s]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); h.status=b.dataset.s; saveStore(); render(); });
      li.classList.add("clk"); li.onclick=()=>handoverModal(h);
      ol.appendChild(li);
    });
    const end=el("li","end"); end.innerHTML=`<span class="dot" aria-hidden="true"></span><div class="grow"><b>Son gün</b><span class="note">${flong(last)}</span></div>`; ol.appendChild(end);
    mp.appendChild(ol); col.appendChild(mp);
  }
  g.appendChild(journeyCalendar());
  const c=el("div","card");
  c.innerHTML=`<div class="ch"><h3>Aktarımlar</h3><span class="sp"></span><span class="note">${done} / ${L.length} aktarıldı · satıra tıkla, düzenle</span></div>`;
  const tbl=el("div","tscroll");
  tbl.innerHTML=`<table class="htable"><tr><th>Durum</th><th>Ne</th><th>Kime</th><th class="c3">Klasör</th><th>Tarih</th></tr>${L.slice().sort((x,y)=>(x.status==="done")-(y.status==="done")||(x.due||"9999").localeCompare(y.due||"9999")).map(h=>`<tr class="clk" data-h="${esc(h.id)}"><td><span class="chip">${HST[h.status]}</span></td><td><b style="color:var(--ink);font-weight:600">${esc(h.title)}</b>${h.note?`<div class="note clamp2">${esc(h.note)}</div>`:""}</td><td>${h.to?esc(h.to):'<span class="note">—</span>'}</td><td class="c3 note">${esc(h.area||"")}</td><td class="nw">${h.due?esc(fdate(h.due)):'<span class="note">—</span>'}</td></tr>`).join("")}</table>`;
  c.appendChild(tbl);
  tbl.querySelectorAll("[data-h]").forEach(tr=>tr.onclick=()=>handoverModal(L.find(h=>h.id===tr.dataset.h)));
  if(!L.length) c.appendChild(el("div","empty","Henüz aktarım yok."));
  v.appendChild(c);
}
function journeyCalendar(){
  const c=el("div","card cal");
  const ym=S.jm||TODAY().slice(0,7); const [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1); const off=(first.getDay()+6)%7; const nd=new Date(y,m,0).getDate();
  const N=D.store.jnotes; const due={}; D.store.handovers.forEach(h=>{ if(h.due) (due[h.due]=due[h.due]||[]).push(h); });
  const last=D.store.last_day; const sel=S.jday||TODAY();
  let cells=""; for(let i=0;i<off;i++) cells+=`<span></span>`;
  for(let d=1; d<=nd; d++){ const k=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cells+=`<button type="button" data-d="${k}" class="${k===TODAY()?"today":""}${k===sel?" sel":""}${k===last?" last":""}">${d}${(N[k]||[]).length||due[k]?`<i></i>`:""}</button>`; }
  const sd=pdate(sel);
  c.innerHTML=`<div class="ch"><h3>${AY[m]} ${y}</h3><span class="sp"></span><button class="icon-btn xs" type="button" data-m="-1" aria-label="Önceki ay">${ic("left")}</button><button class="ghost sm" type="button" data-m="0">Bugün</button><button class="icon-btn xs" type="button" data-m="1" aria-label="Sonraki ay">${ic("right")}</button></div>
    <div class="cgrid">${["Pt","Sa","Ça","Pe","Cu","Ct","Pz"].map(x=>`<b>${x}</b>`).join("")}${cells}</div>
    <div class="cday"><p class="note"><b style="color:var(--ink)">${flong(sd)}</b>${sel===last?" · son gün":""}</p>
    ${(due[sel]||[]).map(h=>`<div class="cnote"><span class="chip">${HST[h.status]}</span>${esc(h.title)}</div>`).join("")}
    ${(N[sel]||[]).map((n,i)=>`<div class="cnote">${esc(n.text)}<button class="link" type="button" data-x="${i}" aria-label="Notu sil">sil</button></div>`).join("")||(due[sel]?"":`<p class="note">Bu gün için not yok.</p>`)}
    <div class="quick"><input type="text" id="cIn" placeholder="Not ekle, ör. Ayşe'yle yenileme listesi aktarımı 14:00" aria-label="Güne not ekle"><button class="btn sm" type="button" id="cAdd">Ekle</button></div></div>`;
  c.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ S.jday=b.dataset.d; render(); });

  c.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ N[sel].splice(+b.dataset.x,1); if(!N[sel].length) delete N[sel]; saveStore(); render(); });

/* ---------- Tracker inside the panel (Nes 25.11.2026) ----------
   Same logic as Tracker/tracker.py, run in the browser: Nes connects her .claude-config folder once (File System Access
   API, Chrome / Edge); the panel reads the projects folder transcripts (who spoke last) and the sessions folder files (live status, open link).
   Read only. If no folder is connected, it falls back to Tracker on localhost:8841. */
const TR = {TAIL:2000000, FILE_WINDOW:10*86400, ASK_WINDOW:7*86400, DONE_WINDOW:2*86400, ALERT_AFTER:30*60, ALERT_MAX_AGE:24*3600, STALE_TOOL:5*60};
const TR_AUTO = /^\s*<(system-reminder|side-sessions-event|task-notification|agent-message|ci-monitor-event|command-|local-command|tools-used|pasted_content_auto)/i;
const TR_ASK = new Set(["AskUserQuestion","ExitPlanMode"]);
const trCache = new Map(Object.entries(lsGet("np_tr_cache")||{}));   // path -> [lastModified, parsed]; kept between visits so only changed files are read
let trDir = null;               // FileSystemDirectoryHandle of .claude-config
let trState = "none";           // none | prompt | ok | error | unsupported

function idb(){ return new Promise((ok,no)=>{ const r=indexedDB.open("nes-panel",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise(ok=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise(ok=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>ok(true); t.onerror=()=>ok(false); }); }

const trShort = (t, n=170) => { t=String(t||"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/\s+/g," ").replace(/[`*_#>|]/g,"").trim(); return t.length<=n ? t : t.slice(0,n-1).trimEnd()+"…"; };
const trParts = m => { const c=m.content; if(typeof c==="string") return [{type:"text", text:c}]; return Array.isArray(c) ? c.filter(x=>x&&typeof x==="object") : []; };
function trParse(text){
  let title=null, cwd=null, sid=null, last=null, ask=null, recap=null, finalText=null, tools=[];
  for(const line of text.split(/\r?\n/)){
    if(!line) continue; let d; try{ d=JSON.parse(line); }catch(e){ continue; }
    const kind=d.type; sid=d.sessionId||sid;
    if(kind==="custom-title") title=d.customTitle||title;
    if((kind!=="user"&&kind!=="assistant") || d.isSidechain || d.isMeta) continue;
    cwd=d.cwd||cwd; const msg=d.message||{}; const ts=Date.parse(d.timestamp)/1000; if(!ts) continue;
    const P=trParts(msg);
    if(kind==="user"){
      const texts=P.filter(p=>p.type==="text").map(p=>p.text||""); const isRes=P.some(p=>p.type==="tool_result");
      if(texts.some(t=>t.trim() && !TR_AUTO.test(t)) && !isRes){ ask=recap=finalText=null; }
      last={who: texts.length && !isRes ? "human" : "tool_result", ts}; tools=[];
    } else {
      const names=[];
      P.forEach(p=>{ if(p.type==="text" && (p.text||"").trim()) finalText=p.text;
        else if(p.type==="tool_use"){ const n=p.name||""; names.push(n); if(n.endsWith("wrap_up")){ const i=p.input||{}; ask=i.ask||ask; recap=i.recap||recap; } } });
      if(names.length) tools=names;
      last={who:"assistant", ts, stop:msg.stop_reason};
    }
  }
  return {sid, title, cwd, last, tools, ask, recap, text:finalText};
}
function trClassify(p, status, now){
  const L=p.last; if(!L) return [null];
  const ts=L.ts, busy=status==="busy";
  if(L.who==="assistant" && L.stop==="tool_use"){
    if(p.tools.some(t=>TR_ASK.has(t))) return ["soru", ts, trShort(p.text)||"Bir soru soruyor."];
    if(now-ts>TR.STALE_TOOL) return ["izin", ts, "Bir işlem için izin bekliyor olabilir ya da uzun süren bir iş yapıyor."];
    return [null];
  }
  if(L.who==="assistant"){
    if(busy) return [null];
    if(p.ask) return ["soru", ts, trShort(p.ask)];
    const lines=(p.text||"").split(/\r?\n/).filter(l=>l.trim());
    if(lines.length && lines[lines.length-1].replace(/[ *_]+$/,"").endsWith("?")) return ["soru", ts, trShort(lines[lines.length-1])];
    return ["bitti", ts, trShort(p.recap || lines[0] || "")];
  }
  if(!busy && now-ts>TR.STALE_TOOL) return ["durdu", ts, "Cevap vermeden durdu; devam etmesi için bir mesaj gerekebilir."];
  return [null];
}
const trFolder = cwd => { if(!cwd) return ""; const m=cwd.match(/[\\/]Claude(?:[\\/](.*))?$/i); const rel=m ? (m[1]||"") : cwd; return rel ? rel.replace(/[\\/]+/g," > ") : "Ana klasör"; };
// only the first and last lines of the final text are ever used (note, question check)
function trSlim(p){ const L=(p.text||"").split(/\r?\n/).filter(l=>l.trim()); p.text=L.length>1?L[0]+"\n"+L[L.length-1]:(L[0]||null); return p; }
async function trReadFile(fh){
  const f=await fh.getFile(); const blob=f.size>TR.TAIL ? f.slice(f.size-TR.TAIL) : f; let t=await blob.text();
  if(f.size>TR.TAIL) t=t.slice(t.indexOf("\n")+1);
  return {text:t, mtime:f.lastModified/1000};
}
async function trCollect(dir){
  const now=Date.now()/1000; const procs={};
  const ids=Object.assign({}, (D.tracker_ids||{}), lsGet("np_tr_ids")||{});
  try{ const sd=await dir.getDirectoryHandle("sessions");
    for await (const [n,h] of sd.entries()){ if(h.kind!=="file"||!n.endsWith(".json")) continue; try{ const d=JSON.parse(await (await h.getFile()).text()); if(d.sessionId){ procs[d.sessionId]=d; if(d.hostSessionId) ids[d.sessionId]=d.hostSessionId; } }catch(e){} } }catch(e){}
  lsSet("np_tr_ids", ids);
  const dismissed=lsGet("np_tr_dismissed")||{}; const items=[]; const seen=new Set();
  const pd=await dir.getDirectoryHandle("projects");
  for await (const [pn,ph] of pd.entries()){
    if(ph.kind!=="directory") continue;
    for await (const [fn,fh] of ph.entries()){
      if(fh.kind!=="file"||!fn.endsWith(".jsonl")) continue;
      let p; try{
        const f=await fh.getFile(); const mt=f.lastModified/1000; if(now-mt>TR.FILE_WINDOW) continue;
        const key=pn+"/"+fn; const c=trCache.get(key);
        seen.add(key); if(c && c[0]===mt) p=c[1]; else { p=trSlim(trParse((await trReadFile(fh)).text)); trCache.set(key,[mt,p]); }
      }catch(e){ continue; }
      if(!p.title || !p.sid) continue;   // helper runs have no title
      const proc=procs[p.sid]||{};
      const [kind, since, note]=trClassify(p, proc.status, now); if(!kind) continue;
      if(now-since > (kind==="soru"||kind==="izin" ? TR.ASK_WINDOW : TR.DONE_WINDOW)) continue;
      if((dismissed[p.sid]||0) >= since) continue;
      const local=proc.hostSessionId || ids[p.sid];
      items.push({id:p.sid, title:proc.name||p.title, kind, since, note, folder:trFolder(p.cwd), link:local?`claude://claude.ai/epitaxy/${local}`:null});
    }
  }
  items.sort((a,b)=>a.since-b.since);
  const keep={}; seen.forEach(k=>keep[k]=trCache.get(k)); lsSet("np_tr_cache", keep);
  return {now, items};
}
async function trRefresh(){
  if(trState!=="ok" || !trDir) return false;
  try{ const r=await trCollect(trDir); D.tracker=Object.assign({ok:true, source:"klasör"}, r); trNotify(); return true; }
  catch(e){ trState="error"; D.tracker={ok:false, items:[]}; return false; }
}
async function trInit(){
  if(!window.showDirectoryPicker || !window.indexedDB){ trState="unsupported"; return; }
  try{ trDir=await idbGet("claude_dir"); }catch(e){ trDir=null; }
  if(!trDir){ trState="none"; return; }
  const p=await trDir.queryPermission({mode:"read"});
  trState = p==="granted" ? "ok" : "prompt";
}
async function trConnect(){
  try{
    let d;
    if(trDir && trState==="prompt"){ if(await trDir.requestPermission({mode:"read"})!=="granted") return; d=trDir; }
    else {
      d=await window.showDirectoryPicker({id:"claude-config", mode:"read"});
      // accept the Claude root folder too: then use its .claude-config
      try{ await d.getDirectoryHandle("projects"); }catch(e){ try{ d=await d.getDirectoryHandle(".claude-config"); await d.getDirectoryHandle("projects"); }catch(e2){ toast("Bu klasörde Claude oturumları yok. .claude-config klasörünü seç."); return; } }
      await idbSet("claude_dir", d);
    }
    trDir=d; trState="ok";
    if(window.Notification && Notification.permission==="default") try{ Notification.requestPermission(); }catch(e){}
    toast("Claude oturumları okunuyor…"); await trRefresh(); render();
  }catch(e){ if(e && e.name!=="AbortError") toast("Klasör bağlanamadı"); }
}
function trDismiss(i){ const d=lsGet("np_tr_dismissed")||{}; d[i.id]=i.since; lsSet("np_tr_dismissed", d); D.tracker.items=D.tracker.items.filter(x=>x.id!==i.id); render(); }
/* the 30-minute alert, while the panel is open (Tracker sends it from Windows) */
function trNotify(){
  if(!window.Notification || Notification.permission!=="granted") return;
  const T=D.tracker; const al=lsGet("np_tr_alerted")||{};
  const due=(T.items||[]).filter(i=>(i.kind==="soru"||i.kind==="izin") && T.now-i.since>=TR.ALERT_AFTER && T.now-i.since<=TR.ALERT_MAX_AGE && (al[i.id]||0)<i.since);
  if(!due.length) return;
  try{ new Notification(due.length===1 ? `${fmtWait(Math.round((T.now-due[0].since)/60))}dır seni bekliyor` : `${due.length} oturum seni bekliyor`, {body:due.map(i=>i.title).join(", ").slice(0,180)}); }catch(e){ return; }
  due.forEach(i=>al[i.id]=i.since); lsSet("np_tr_alerted", al);
}
/* the box shown where the sessions would be, when the folder is not connected */
function trConnectBox(){
  if(trState==="ok" || (D.tracker||{}).ok) return null;
  const b=el("div","trbox");
  if(trState==="unsupported"){ b.innerHTML=`<span class="note">Bekleyen Claude oturumlarını görmek için sayfayı Chrome ya da Edge'de aç.</span>`; return b; }
  b.innerHTML=`<span class="sdot">${ic("chat")}</span><span class="grow note">${trState==="prompt"?"Bekleyen Claude oturumları için klasör iznini yenile.":"Bekleyen Claude oturumlarını burada görmek için <b>.claude-config</b> klasörünü bir kez bağla."}</span><button class="btn sm" type="button">${trState==="prompt"?"İzin ver":"Klasörü bağla"}</button>`;
  b.querySelector("button").onclick=trConnect;
  return b;
}

/* ---------- date picker (Nes 26.11.2026) ----------
   Modern picker modelled on D-One > Liste fiyatları > Hızlı fiyat bul: month grid with Pzt-first weekdays, click the
   month title for a 12-month view, "Bugün" at the bottom. Every native <input type="date"> is swapped for it
   automatically (MutationObserver); the input stays as a hidden field holding yyyy-mm-dd, so callers read .value as before. */
let DP = null;
const dpText = s => { const d=pdate(s); return `${d.getDate()} ${AY[d.getMonth()+1]} ${d.getFullYear()}`; };
function dpClose(){ if(!DP) return; DP.pop.remove(); DP.btn.setAttribute("aria-expanded","false"); DP.btn.classList.remove("open"); DP=null; }
function dpEnhance(inp){
  if(inp.dataset.dp) return; inp.dataset.dp="1";
  const btn=document.createElement("button"); btn.type="button"; btn.className="dpb";
  btn.setAttribute("aria-haspopup","dialog"); btn.setAttribute("aria-expanded","false");
  inp._dpPaint=()=>{ btn.innerHTML=`${ic("cal")}<span class="${inp.value?"":"dpph"}">${inp.value?esc(dpText(inp.value)):"Tarih seç"}</span>`; };
  inp.type="hidden"; inp.after(btn); inp._dpPaint();
  btn.onclick=e=>{ e.preventDefault(); e.stopPropagation(); if(DP && DP.btn===btn) return dpClose(); dpOpen(inp, btn); };
}
function dpOpen(inp, btn){
  dpClose();
  const sel=inp.value||null, t=TODAY(), b0=pdate(sel||t);
  const st={y:b0.getFullYear(), m:b0.getMonth(), view:"day"};
  const pop=el("div","dp"); pop.setAttribute("role","dialog"); pop.setAttribute("aria-label","Tarih seç");
  document.body.appendChild(pop); DP={pop, btn, inp}; btn.setAttribute("aria-expanded","true"); btn.classList.add("open");
  const pick=v=>{ inp.value=v||""; inp.dispatchEvent(new Event("change",{bubbles:true})); inp._dpPaint(); dpClose(); btn.focus(); };
  const nav=(lbl,n)=>`<button type="button" class="dpn" data-n="${n}" aria-label="${lbl}">${ic(n<0?"left":"right")}</button>`;
  const draw=()=>{
    let head, body;
    if(st.view==="day"){
      const off=(new Date(st.y,st.m,1).getDay()+6)%7, n=new Date(st.y,st.m+1,0).getDate();
      let c=""; for(let i=0;i<off;i++) c+="<span></span>";
      for(let d=1; d<=n; d++){ const v=iso(new Date(st.y,st.m,d)); c+=`<button type="button" data-v="${v}" class="${v===sel?"sel":""}${v===t?" today":""}" aria-label="${esc(flong(v))}"${v===sel?' aria-current="date"':""}>${d}</button>`; }
      head=`${nav("Önceki ay",-1)}<button type="button" class="dpt" data-view="month" aria-label="Ay seç">${AY[st.m+1]} ${st.y}${ic("chev")}</button>${nav("Sonraki ay",1)}`;
      body=`<div class="dpg">${["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<b>${x}</b>`).join("")}${c}</div>`;
    } else {
      const sm=sel?pdate(sel):null, tm=pdate(t);
      head=`${nav("Önceki yıl",-1)}<span class="dpt yr">${st.y}</span>${nav("Sonraki yıl",1)}`;
      body=`<div class="dpm">${AYK.map((x,i)=>`<button type="button" data-mo="${i}" class="${sm&&sm.getFullYear()===st.y&&sm.getMonth()===i?"sel":""}${tm.getFullYear()===st.y&&tm.getMonth()===i?" cur":""}">${x}</button>`).join("")}</div>`;
    }
    pop.innerHTML=`<div class="dph">${head}</div>${body}<div class="dpf">${inp.value?'<button type="button" data-clear="1">Temizle</button>':""}<button type="button" data-today="1">Bugün</button></div>`;
    place();
  };
  const place=()=>{
    const r=btn.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
    let top=r.bottom+6; if(top+h>innerHeight-8 && r.top-h-6>8) top=r.top-h-6;
    pop.style.top=Math.max(8,top)+"px"; pop.style.left=Math.max(8,Math.min(r.left, innerWidth-w-8))+"px";
  };
  pop.onclick=e=>{
    e.stopPropagation(); const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.v) pick(b.dataset.v);
    else if(b.dataset.n){ const n=+b.dataset.n; if(st.view==="day"){ st.m+=n; if(st.m<0){st.m=11;st.y--;} if(st.m>11){st.m=0;st.y++;} } else st.y+=n; draw(); }
    else if(b.dataset.view){ st.view="month"; draw(); }
    else if(b.dataset.mo!=null){ st.m=+b.dataset.mo; st.view="day"; draw(); }
    else if(b.dataset.today) pick(t);
    else if(b.dataset.clear) pick("");
  };
  draw();
  (pop.querySelector(".sel")||pop.querySelector(".today")||pop.querySelector(".dpt")).focus();
}
document.addEventListener("click", ()=>dpClose());
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && DP){ e.stopImmediatePropagation(); const b=DP.btn; dpClose(); b.focus(); } }, true);

/* ---------- library topic cards (Nes 26.11.2026) ----------
   A card explains a topic for a newcomer; one-off jobs sit under it as references (jobs), a starter kit (kit: prompt for
   their Claude + intro mds) and all files (files). Drive / Docs / Sheets files open in a preview popup. */
function libSort(a,b){ return ((a.date&&b.date) ? a.date.localeCompare(b.date) : 0) || ((a.order??999)-(b.order??999)) || a.title.localeCompare(b.title,"tr"); }
function fileKind(f){
  const u=f.url||""; const n=((f.path||"")+" "+(f.label||"")).toLowerCase().replace(/\s*\([^)]*\)\s*$/,"");
  if(/spreadsheets|\.xlsx?\b|\.csv\b/.test(u+" "+n)) return ["sheet","Tablo"];
  if(/document\/|\.docx?\b/.test(u+" "+n)) return ["doc","Doküman"];
  if(/presentation|\.pptx?\b/.test(u+" "+n)) return ["deck","Sunum"];
  if(/\.pdf\b/.test(n)) return ["pdf","PDF"];
  if(/\.md/.test(n)) return ["md","Not (.md)"];
  if(/folders\//.test(u)) return ["folder","Klasör"];
  if(/\.(png|jpe?g|svg|webp)\b/.test(n)) return ["img","Görsel"];
  if(/\.html?\b/.test(n)) return ["page","Sayfa"];
  return ["link","Link"];
}
function previewUrl(u){
  let m;
  if((m=u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/))) return `https://docs.google.com/${m[1]}/d/${m[2]}/preview`;
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)) || (m=u.match(/drive\.google\.com\/open\?id=([\w-]+)/))) return `https://drive.google.com/file/d/${m[1]}/preview`;
  if((m=u.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/))) return `https://drive.google.com/embeddedfolderview?id=${m[1]}#list`;
  return null;

    return `<button type="button" class="fchip k-${k}${has?"":" local"}" data-fi="${i}" title="${esc(has?(previewUrl(f.url)?"Önizle":"Yeni sekmede aç"):"Henüz Drive'da değil: "+(f.path||""))}"><span class="fi" aria-hidden="true">${esc(kl)}</span><span class="fl">${esc(f.label||f.path||f.url)}</span></button>`; }).join("")}</div>`;

/* library v2 (26.11.2026): when the seed's version is newer, Claude's old cards are replaced; her own notes stay
   (own = ids never shipped in a seed, i.e. not in np_seen_lib). Pins she set on cards that still exist are kept. */
function libUpgrade(seed){
  if(!seed || !seed.version) return;
  const local=storeGet("np_library"); if(!local || (local.version||1)>=seed.version) return;
  const seen=new Set(storeGet("np_seen_lib")||[]);
  const own=(local.items||[]).filter(x=>!seen.has(x.id));
  const out=JSON.parse(JSON.stringify(seed)); out.items=out.items.concat(own);
  if(own.length && !out.categories.includes("Benim notlarım")) out.categories.push("Benim notlarım");
  storeSet("np_library", out);
}
