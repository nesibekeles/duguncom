<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nes Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231e1d26'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='800' font-size='17' fill='%23fff'%3En%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Nes Panel. Design language follows nesibekeles.github.io/job (jobness): soft grey canvas, white sidebar,
   pastel gradient tiles, Manrope headings + DM Sans body, 20px radius, dark pill for the active item. */
:root{
  --bg:#f4f4f8; --surface:#ffffff; --ink:#1e1d26; --ink-2:#474457; --muted:#7a7789; --line:#e7e6ee; --soft:#f3f2f7;
  --lav:#6655c4; --lav-50:#f4f2fc; --lav-100:#e9e5f8; --mint:#2f7d62; --mint-50:#ebf6f1; --butter:#7d6420; --butter-50:#f8f3e3;
  --sky:#3a6390; --sky-50:#ebf1f8; --rose:#a8475b; --rose-50:#f8ecef; --peach:#c0623d; --peach-50:#fdeee6;
  --pink:#E21B71; --dpink:#960A4B;
  --t-lav:linear-gradient(135deg,#ece8fc,#ddd5f8); --t-peach:linear-gradient(135deg,#fdeee5,#f9dccd); --t-mint:linear-gradient(135deg,#e3f4ec,#cdeadc);
  --t-sky:linear-gradient(135deg,#e6eef9,#d2e1f3); --t-rose:linear-gradient(135deg,#fbe9ed,#f4d5dd); --t-butter:linear-gradient(135deg,#fbf3dc,#f3e5b8);
  --shadow-card:0 1px 2px rgba(24,22,48,.04),0 12px 32px -16px rgba(40,36,80,.18); --shadow-pop:0 18px 50px -12px rgba(30,29,38,.35);
  --r:16px; --r-sm:12px; --side:244px;
  --head:"Manrope","DM Sans",system-ui,sans-serif; --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --ok:#2f7d62; --ok-50:#e3f4ec; --near:#8a6100; --near-50:#fdf1d3; --bad:#b8431f; --bad-50:#fde5dc;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121217; --surface:#1b1b22; --ink:#f2f1f7; --ink-2:#cfcde0; --muted:#9a97ad; --line:#2c2b36; --soft:#23222c;
  --lav:#a99cf0; --lav-50:#252238; --lav-100:#2e2a47; --mint:#7fd1b0; --mint-50:#1c2b25; --butter:#e5c46b; --butter-50:#2b2618;
  --sky:#8fb5e3; --sky-50:#1c2533; --rose:#ec9aab; --rose-50:#2e1d22; --peach:#f0a07f; --peach-50:#2e211b;
  --t-lav:linear-gradient(135deg,#2a2545,#231f3a); --t-peach:linear-gradient(135deg,#33241d,#2a1d17); --t-mint:linear-gradient(135deg,#1d2e27,#18261f);
  --t-sky:linear-gradient(135deg,#1e2838,#19212e); --t-rose:linear-gradient(135deg,#33212a,#2a1a21); --t-butter:linear-gradient(135deg,#302a1a,#272214);
  --shadow-card:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
  --ok:#7fd1b0; --ok-50:#1c2e26; --near:#e5c46b; --near-50:#2e2716; --bad:#f29a7c; --bad-50:#33201a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121217; --surface:#1b1b22; --ink:#f2f1f7; --ink-2:#cfcde0; --muted:#9a97ad; --line:#2c2b36; --soft:#23222c;
  --lav:#a99cf0; --lav-50:#252238; --lav-100:#2e2a47; --mint:#7fd1b0; --mint-50:#1c2b25; --butter:#e5c46b; --butter-50:#2b2618;
  --sky:#8fb5e3; --sky-50:#1c2533; --rose:#ec9aab; --rose-50:#2e1d22; --peach:#f0a07f; --peach-50:#2e211b;
  --t-lav:linear-gradient(135deg,#2a2545,#231f3a); --t-peach:linear-gradient(135deg,#33241d,#2a1d17); --t-mint:linear-gradient(135deg,#1d2e27,#18261f);
  --t-sky:linear-gradient(135deg,#1e2838,#19212e); --t-rose:linear-gradient(135deg,#33212a,#2a1a21); --t-butter:linear-gradient(135deg,#302a1a,#272214);
  --shadow-card:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6);
  --ok:#7fd1b0; --ok-50:#1c2e26; --near:#e5c46b; --near-50:#2e2716; --bad:#f29a7c; --bad-50:#33201a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink-2);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--head);color:var(--ink);letter-spacing:-.015em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--lav) 45%,transparent);outline-offset:2px;border-radius:8px}
img{max-width:100%}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;z-index:10;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:11px;align-items:center;text-decoration:none;padding:4px 6px 14px}
.brand .mark{width:34px;height:34px;border-radius:12px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:800 20px/1 var(--head)}
.brand b{display:block;font:800 18px/1.1 var(--head);color:var(--ink);letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.side-lab{font:700 11px/1 var(--head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 8px 8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;text-decoration:none;font-weight:600;color:var(--ink-2);transition:background .15s}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav a svg{width:18px;height:18px;flex:none}
.nav a .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.nav a[aria-current="page"] .n{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.nav a .n.hot{background:var(--rose-50);color:var(--rose);border-radius:999px;padding:1px 8px}
.side-sp{flex:1}
.side-card{background:var(--t-mint);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:6px}
.side-card:empty{display:none}
.side-card .k{font:700 11px/1 var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--mint)}
.side-card b{font:700 15px/1.3 var(--head);color:var(--ink)}
.side-card p{font-size:13px;color:var(--ink-2)}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
.me .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#b49cf0,#e48aa6);color:#fff;display:grid;place-items:center;font:700 13px var(--head);flex:none}
.me b{display:block;font-size:14px;color:var(--ink)}
.me small{display:block;font-size:12px;color:var(--muted)}
.me .icon-btn{margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none;transition:background .15s}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:17px;height:17px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 24px 0}
.crumb{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.upd{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center}
.upd::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.upd.off::before{background:var(--bad)}
.view{padding:14px 24px 48px;display:flex;flex-direction:column;gap:14px;max-width:1360px;width:100%}
.bottom{display:none}

/* collapsible sidebar: icon rail by default (html.side-min), expanded on demand; choice kept in localStorage "np_side" */
.side{transition:padding .2s var(--ease)}
.app{transition:grid-template-columns .25s var(--ease)}
.side-toggle{position:absolute;top:28px;right:-14px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;z-index:5;box-shadow:var(--shadow-card);padding:0}
.side-toggle:hover{background:var(--soft)}
.side-toggle svg{width:14px;height:14px;transition:transform .2s var(--ease)}
.side-min .side-toggle svg{transform:rotate(180deg)}
.side-min .app{grid-template-columns:68px minmax(0,1fr)}
.side-min .side{padding:18px 10px;align-items:center}
.side-min .brand{padding:4px 0 14px}
.side-min .side .txt,.side-min .side-lab,.side-min .side-card,.side-min .nav a .lbl{display:none}
.side-min .nav{width:100%}
.side-min .nav a{justify-content:center;padding:11px 0;position:relative}
.side-min .nav a .n{display:none}
.side-min .nav a .n.hot{display:block;position:absolute;top:5px;right:6px;margin:0;font-size:0;width:8px;height:8px;padding:0;border-radius:50%}
.side-min .nav a .n.hot{background:var(--rose)}
.side-min .nav a[aria-current="page"] .n{background:var(--surface)}
.side-min .me{flex-direction:column;padding:8px 6px;gap:8px}
.side-min .me .icon-btn{margin-left:0}

/* ---------- type, chips, buttons ---------- */
.eyebrow{font:700 12px/1 var(--head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(21px,2.2vw,27px);line-height:1.15;font-weight:800;margin-top:6px;text-wrap:balance}
.hero p.sub{margin-top:4px;max-width:68ch;color:var(--ink-2)}
.hero p.sub b{color:var(--ink)}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:16px;font-weight:700}
.sec-h .sp{flex:1}
.note{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.chip.SAS{background:var(--rose-50);color:var(--rose)}.chip.MoS{background:var(--sky-50);color:var(--sky)}.chip.TES{background:var(--lav-50);color:var(--lav)}
.chip.yeni{background:var(--mint-50);color:var(--mint)}.chip.yenileme{background:var(--butter-50);color:var(--butter)}
.chip.elle{background:var(--ink);color:var(--surface)}
.chip.ok{background:var(--ok-50);color:var(--ok)}.chip.near{background:var(--near-50);color:var(--near)}.chip.bad{background:var(--bad-50);color:var(--bad)}
.chip.target{background:var(--lav-50);color:var(--lav)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;background:var(--ink);color:var(--surface);font-weight:600;padding:8px 16px;display:inline-flex;gap:8px;align-items:center;transition:transform .15s var(--ease),opacity .15s;white-space:nowrap}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--ink);display:inline-flex;gap:7px;align-items:center;transition:background .15s,border-color .15s;white-space:nowrap}
.ghost:hover{background:var(--soft)}
.ghost svg{width:14px;height:14px;flex:none}
a.ghost{text-decoration:none}
.ghost.sm{padding:5px 12px;font-size:13px}
.ghost.danger{color:var(--bad)}
.link{border:0;background:none;padding:0;color:var(--lav);font-weight:600}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(24,22,48,.08),0 4px 12px -6px rgba(40,36,80,.25)}
.seg.sm button{padding:5px 12px;font-size:13px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;color:var(--ink-2);font-size:13px;transition:all .15s}
.pill:hover{border-color:var(--lav-100)}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.pill .c{opacity:.65;margin-left:4px;font-weight:500}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink);min-width:0}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:22px;color:var(--muted);text-align:center}

/* ---------- cards and tiles ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card>h3,.card .h3{font-size:15px;font-weight:700}
.card .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .ch .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card .ch h3{font-size:15px}
.tile{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;box-shadow:var(--shadow-card);text-decoration:none;color:var(--ink-2);border:0;text-align:left}
button.tile,a.tile{cursor:pointer;transition:transform .2s var(--ease)}
button.tile:hover,a.tile:hover{transform:translateY(-2px)}
.tile.lav{background:var(--t-lav)}.tile.peach{background:var(--t-peach)}.tile.mint{background:var(--t-mint)}.tile.sky{background:var(--t-sky)}.tile.rose{background:var(--t-rose)}.tile.butter{background:var(--t-butter)}
.tile .ico{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--surface) 65%,transparent);display:grid;place-items:center;color:var(--ink)}
.tile .ico svg{width:16px;height:16px}
.tile .k{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.tile .v{font:800 28px/1 var(--head);color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v small{font:600 13.5px var(--body);color:var(--ink-2);letter-spacing:0;margin-left:6px}
.tile .s{font-size:13px;color:var(--ink-2)}
.tile.big{flex-direction:row;align-items:center;gap:14px;padding:18px 20px}
.tile.big .v{font-size:40px}
.tile .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.span-2{grid-column:span 2}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.ring{width:84px;height:84px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:800 19px/1 var(--head);color:var(--ink)}
.ring small{display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--lav)}

/* ---------- lists ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .t{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row.clk{cursor:pointer;border-radius:10px}
.row.clk:hover{background:var(--soft)}
.chk{appearance:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;margin-top:2px;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.chk:hover{border-color:var(--lav)}
.chk:checked{background:var(--ink);border-color:var(--ink)}
.chk:checked::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.prio{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.prio.yüksek{background:#e0587a}.prio.orta{background:#e8b33c}.prio.düşük{background:#a9a6b8}
.due{font-weight:600}.due.late{color:var(--bad)}.due.today{color:var(--lav)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--soft)}
.alert .ai{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface)}
.alert .ai svg{width:15px;height:15px}
.alert.bad{background:var(--bad-50)}.alert.bad .ai{color:var(--bad)}
.alert.near{background:var(--near-50)}.alert.near .ai{color:var(--near)}
.alert.info{background:var(--lav-50)}.alert.info .ai{color:var(--lav)}
.alert b{color:var(--ink);display:block;font-weight:600}
.alert p{font-size:13.5px}
.alert .grow{flex:1;min-width:0}
.quick{display:flex;gap:8px}
.quick input{flex:1}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;gap:12px;align-items:center}
.day .d{width:48px;height:52px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.day .d b{font:800 18px/1 var(--head);color:var(--ink)}
.day .d small{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.day .t{color:var(--ink);font-weight:500}
.mini{display:flex;flex-direction:column;gap:12px}
.mini .r{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 52px;gap:12px;align-items:center;font-size:13.5px}
.mini .r b{color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mini .r .lbl{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tasks & projects ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
.addbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.addbar .more{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.addbar .more>*{flex:1 1 150px}
.group-h{font:700 12px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 4px 6px;display:flex;gap:8px}
.group-h.late{color:var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.proj{border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-card);background:var(--surface);min-width:0;border:0;text-align:left;cursor:pointer;transition:transform .2s var(--ease)}
.proj:hover{transform:translateY(-2px)}
.proj .top{display:flex;align-items:center;gap:10px}
.proj .sw{width:12px;height:12px;border-radius:4px;flex:none}
.proj h3{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.proj p{font-size:13.5px;color:var(--ink-2)}
.proj .foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px}
.sw.lav{background:#b9adf0}.sw.peach{background:#f2b79c}.sw.mint{background:#97d4b9}.sw.sky{background:#9fbfe6}.sw.rose{background:#ee9fb2}.sw.butter{background:#e9cf7f}
.idea{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.idea h3{font-size:15.5px;font-weight:700}
.idea p{font-size:14px;max-width:90ch}

/* ---------- targets ---------- */
.hsum{font:600 17px/1.4 var(--head);color:var(--ink);max-width:70ch;text-wrap:balance}
.hsum b{color:var(--lav);font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.kpi{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow-card);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi b{font:800 20px/1.15 var(--head);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.pos b{color:var(--ok)}.kpi.neg b{color:var(--bad)}.kpi.accent{background:var(--t-lav)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.tcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;border:2px solid transparent;text-align:left;cursor:pointer;transition:transform .2s var(--ease),border-color .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard[aria-pressed="true"]{border-color:var(--ink)}
.tcard .pct{font:800 28px/1 var(--head);color:var(--ink);font-variant-numeric:tabular-nums}
.tcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-variant-numeric:tabular-nums;font-size:13.5px}
.tcard dt{color:var(--muted)}
.tcard dd{margin:0;text-align:right;font-weight:600;color:var(--ink)}
.support{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.support .warn{color:var(--bad);font-weight:600}
.matrix td.c{text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:11.5px;fill:var(--muted)}
.chart .v{fill:var(--ink);font-weight:600}
.chart line{stroke:var(--line)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.goal{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.goal h3{font-size:15.5px;font-weight:700;flex:1;min-width:0}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tr.sel td{background:var(--lav-50)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--soft)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}.nw{white-space:nowrap}

/* ---------- library ---------- */
.search{position:relative;flex:1 1 320px;max-width:560px}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;font-size:15px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.pin{background:var(--t-rose);border-radius:var(--r-sm);padding:16px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;cursor:pointer;transition:transform .2s var(--ease);color:var(--ink-2)}
.pin:hover{transform:translateY(-2px)}
.pin b{font:700 14.5px/1.35 var(--head);color:var(--ink)}
.pin p{font-size:13px}
.lib{display:flex;flex-direction:column;gap:12px}
.entry{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow-card);overflow:hidden}
.entry>button.eh{width:100%;border:0;background:none;text-align:left;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.entry .eh .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.entry .eh h3{font-size:15.5px;font-weight:700;line-height:1.35}
.entry .eh p{font-size:14px}
.entry .eh::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:8px 4px 0 0;flex:none;transition:transform .2s var(--ease)}
.entry.open .eh::after{transform:rotate(-135deg)}
.entry .eb{padding:0 18px 18px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin:0 0 0}
.md{display:flex;flex-direction:column;gap:8px;max-width:88ch;color:var(--ink-2)}
.md ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.md ul ul{margin-top:5px}
.md b{color:var(--ink)}
.md code{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:13px;overflow-wrap:anywhere}
.kind{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.kind.kural{background:var(--lav-50);color:var(--lav)}.kind.yasak{background:var(--bad-50);color:var(--bad)}.kind.nasil{background:var(--mint-50);color:var(--mint)}
.kind.tanim{background:var(--sky-50);color:var(--sky)}.kind.bilgi{background:var(--butter-50);color:var(--butter)}
mark{background:#ffe58f;color:#1e1d26;border-radius:3px;padding:0 1px}

/* ---------- modal, toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,18,30,.42);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-pop);width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:18px;font-weight:800}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal .acts .sp{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.checks input{accent-color:var(--lav);margin:0}
.checks label:has(input:checked){border-color:var(--lav);background:var(--lav-50);color:var(--lav)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:999px;padding:10px 20px;font-weight:600;z-index:60;box-shadow:var(--shadow-pop)}

/* ---------- campaign studio (content ported from Kampanya Stüdyosu) ---------- */
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>span{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.studio{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:14px;align-items:start}
.clist{display:flex;flex-direction:column;gap:10px}
.ccard{text-align:left;border:2px solid transparent;background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-card);transition:border-color .15s,transform .2s var(--ease)}
.ccard:hover{transform:translateY(-1px)}
.ccard[aria-current="true"]{border-color:var(--ink)}
.ccard .hl{font-weight:600;color:var(--ink);font-size:13.5px;line-height:1.4}
.ccard small{color:var(--muted);font-size:12.5px}
.detail{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.chero{background:var(--t-rose);border-radius:var(--r-sm);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.chero .k{font:700 11.5px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.chero h2{font-size:19px;font-weight:800;line-height:1.25;text-wrap:balance}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec h4{font:700 12px var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sec ul,.sec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.box{background:var(--soft);border-radius:var(--r-sm);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.box b.big{font:800 20px/1.2 var(--head);color:var(--ink)}
.box small{color:var(--muted)}
.box.gift{background:var(--t-butter)}
.box.tgt{background:var(--t-lav)}
.box .lab{font:700 11.5px var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dl{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:8px 16px;margin:0}
.dl dt{font-weight:600;color:var(--ink)}
.dl dd{margin:0;max-width:72ch}
.why{display:flex;flex-direction:column;gap:10px}
.why>div{border-left:3px solid var(--lav-100);padding:2px 0 2px 14px;max-width:84ch}
.why .so{color:var(--ink);font-weight:500}
.faq dt{font-weight:600;color:var(--ink)}
.faq dd{margin:0 0 8px}
.ask{background:var(--near-50);border-radius:var(--r-sm);padding:16px}
.ask h4{color:var(--near)}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px;background:var(--soft);border-radius:var(--r-sm)}
.share>span{font-weight:700;color:var(--ink);margin-right:4px}
.ctl{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.pv{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center;background:var(--soft);border-radius:var(--r-sm);padding:22px 12px}
.pvbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.desk{width:min(100%,680px);background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(25,25,25,.12);overflow:hidden;color:#191919}
.desk .chrome{display:flex;gap:6px;padding:10px 12px;background:#eceef1}
.desk .chrome i{width:10px;height:10px;border-radius:50%;background:#cfd3d9;display:block}
.mhead{padding:12px 16px;border-bottom:1px solid #eef0f3;font-size:13px;color:#5b6470;display:flex;flex-direction:column;gap:2px}
.mhead b{color:#191919;font-size:15px}
.ph{width:300px;max-width:100%;background:#16181d;border-radius:42px;padding:9px;box-shadow:0 18px 40px rgba(25,25,25,.22)}
.ph .scr{background:#fff;border-radius:34px;overflow:hidden;color:#0f1419;font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:relative;display:flex;flex-direction:column;min-height:560px}
.ph .sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 22px 6px;font-size:13px;font-weight:600;flex:none}
.ph .isl{width:84px;height:22px;border-radius:12px;background:#16181d}
.ph .sig{display:flex;gap:4px}
.ph .sig i{display:block;background:currentColor;border-radius:2px;width:15px;height:9px}
.ph .sig i+i{width:20px;height:11px;border-radius:3px}
.ph .home{height:5px;width:110px;background:currentColor;border-radius:3px;margin:8px auto;flex:none}
.ph .scr.dark{background:#000;color:#fff}
.ph .mhead{font-size:12px}
.ph .scr.fix{height:578px;min-height:0}
.ph .mbody{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.ph .mbody::-webkit-scrollbar{display:none}
.wa{flex:1;display:flex;flex-direction:column;min-height:0}
.wa .hd{background:#f6f6f6;color:#111;border-bottom:1px solid #e3e3e3;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;font-weight:600}
.wa .hd img,.notif img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.wa .hd small{display:block;font-weight:400;color:#667781;font-size:11.5px}
.wa .chat{flex:1;background:#e9e2d8;padding:14px 10px;display:flex;flex-direction:column;gap:8px}
.wa .bub{background:#fff;border-radius:10px;padding:5px;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:14px;line-height:1.42;color:#111}
.wa .bub p{padding:4px 6px 2px;white-space:pre-wrap;word-break:break-word}
.wa .bub time{display:block;text-align:right;font-size:10.5px;color:#7a8791;padding:0 6px 2px}
.wa .img{border-radius:7px;overflow:hidden}
.lock{flex:1;margin:0;padding:18px 12px;color:#fff;background:linear-gradient(165deg,#2b1d33,#6b2a55 55%,#c2557c);display:flex;flex-direction:column;gap:18px}
.lock .clock{text-align:center;font:600 58px/1 var(--head)}
.lock .date{text-align:center;opacity:.85;margin-top:-10px}
.notif{background:rgba(255,255,255,.92);color:#191919;border-radius:18px;padding:12px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.notif img{border-radius:9px}
.notif small{color:#6b7280;font-size:11.5px;display:flex;justify-content:space-between}
.notif b{display:block;font-size:14px}
.notif p{font-size:13.5px;line-height:1.35;word-break:break-word}
.piece{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.piece>div:first-child{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.piece pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:14.5px;line-height:1.55;max-width:80ch}
.bimg{display:block;width:100%;height:auto;border-radius:8px}
.fgrid{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:20px;align-items:start}
.inputs{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);padding:20px;display:flex;flex-direction:column;gap:12px}
.inp{display:flex;flex-direction:column;gap:4px}
.inp label{font-weight:600;color:var(--ink);font-size:13.5px}
.inp input{width:100%}
.inp small{color:var(--muted);font-size:12px}
.inp.assume input{background:var(--near-50);border-color:color-mix(in srgb,var(--near) 35%,transparent)}
.frow{display:flex;flex-direction:column;gap:10px}
.frow>h4{font:700 12px var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fmain{display:flex;flex-direction:column;gap:18px;min-width:0}
.gen{background:var(--t-lav);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.gen h3{font-size:19px;font-weight:800}
.gen .row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gen textarea{width:100%;min-height:92px}
.gen .ex{display:flex;gap:6px;flex-wrap:wrap}
.gen .ex button{border:0;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.gen .ex button:hover{background:var(--surface)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--bad)}
.dd{position:relative}
.dd>button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;color:var(--ink);display:flex;gap:7px;align-items:center;font-size:13px}
.dd>button[data-on="1"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.dd>button::after{content:"";border:5px solid transparent;border-top-color:currentColor;margin-top:5px}
.ddp{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:260px;max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow-pop);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ddp .acts{display:flex;gap:12px;padding:0 0 6px}
.ddp .acts button{border:0;background:none;padding:0;color:var(--lav);font-weight:700;font-size:12.5px}
.ddp label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.ddp label.g{font-weight:700;color:var(--ink);margin-top:4px}
.ddp label.i{padding-left:22px}
.ddp input{accent-color:var(--lav);width:15px;height:15px;margin:0}
.agroup{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);overflow:hidden}
.agroup>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 18px}
.agroup>summary::-webkit-details-marker{display:none}
.agroup>summary h2{font-size:15.5px;font-weight:700}
.agroup>summary small{color:var(--muted)}
.agroup>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s var(--ease)}
.agroup[open]>summary::after{transform:rotate(-135deg)}
.agroup[open]>summary{border-bottom:1px solid var(--line)}
.acard{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.acard:last-child{border-bottom:0}
.acard h3{font-size:15.5px;font-weight:700}
.acard .lead{max-width:92ch}
.yani{background:var(--lav-50);border-radius:12px;padding:10px 14px;color:var(--ink);max-width:92ch}
.yani b{color:var(--lav)}
.acard .row1{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.acard .row1 button{flex:none}
.ttables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;align-items:start}
.ttables.wide{grid-template-columns:minmax(0,1fr)}
.ttable{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.ttable>div.th{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:700;color:var(--ink)}
.ttable .more{border:0;background:none;color:var(--lav);font-weight:700;padding:8px 10px;font-size:13px}

/* ---------- 25.11.2026: page tabs, header search, quick add, undo, board, slider, Yolculuğum ---------- */
/* page-level tabs: underlined, so they never look like filters */
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:1 1 auto;min-width:0}
.ptabs button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2.5px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0;display:inline-flex;gap:6px;align-items:center}
.ptabs button:hover{color:var(--ink);background:var(--soft)}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ptabs .cnt{background:var(--near-50);color:var(--near);border-radius:999px;padding:0 7px;font-size:12px}
.tabs .tab svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.filters{padding:2px 0}
.btn.sm{padding:6px 13px;font-size:13px}
.icon-btn.xs{width:28px;height:28px}
.icon-btn.xs svg{width:14px;height:14px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* header search + quick add */
.hsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 12px;color:var(--muted);min-width:220px;font-size:13px}
.hsearch:hover{border-color:var(--lav-100)}
.hsearch svg{width:15px;height:15px}
.hsearch kbd{margin-left:auto;font:600 11px var(--body);background:var(--soft);border-radius:6px;padding:2px 6px;color:var(--muted)}
.modal-bg:has(.modal.top){align-items:start;padding-top:10vh}
.search.big{max-width:none;flex:none}
.sres{display:flex;flex-direction:column;max-height:56vh;overflow:auto}
.sres .group-h{padding:10px 4px 4px}
.sitem{border:0;background:none;text-align:left;padding:7px 10px;border-radius:10px;display:flex;flex-direction:column;gap:1px}
.sitem .t{color:var(--ink);font-weight:500}
.sitem.on{background:var(--soft)}
.qalist{display:flex;flex-direction:column;gap:8px}
.qa{display:flex;gap:10px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px;font-weight:600;color:var(--ink)}
.qa:hover{background:var(--soft)}
.qa svg{width:17px;height:17px}
/* toast with undo */
.toast{display:flex;gap:14px;align-items:center}
.toast .undo{border:0;background:none;color:#c9bdf8;font-weight:700;padding:0}
.row.pending .t{text-decoration:line-through;color:var(--muted)}
.row.pending{opacity:.7}
/* waiting Claude sessions as to-dos */
.row.sess .sdot,.bcard .sdot{width:20px;height:20px;border-radius:7px;background:var(--near-50);color:var(--near);display:grid;place-items:center;flex:none;margin-top:2px}
.sdot svg{width:12px;height:12px}
/* notepad add line (jobness "add a to-do…") */
.npad{border-top:1px dashed var(--line);padding-top:8px}
.np-line{display:flex;gap:10px;align-items:center;border:0;background:none;width:100%;padding:6px 4px;color:var(--muted);font-style:italic;text-align:left;border-bottom:1px dotted var(--lav-100)}
.np-line:hover{color:var(--ink)}
.np-dot{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--muted);flex:none}
.np-form{display:flex;flex-direction:column;gap:8px}
.np-form .np-t{font-weight:600;border-width:0 0 1.5px;border-radius:0;border-color:var(--lav);padding:6px 2px}
.np-more{display:flex;gap:8px;flex-wrap:wrap}
.np-more>*{flex:1 1 140px}
.np-acts{display:flex;gap:8px;justify-content:flex-end}
/* home: slider tile, target bar */
.tile.slider{padding:0;overflow:hidden;flex-direction:row;align-items:stretch}
.slides{flex:1;min-width:0;display:grid}
.slide{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink-2);opacity:0;transition:opacity .45s var(--ease);pointer-events:none}
.slide{grid-area:1/1;position:static}
.slide.on{opacity:1;pointer-events:auto}
.tslide{gap:5px;padding:12px 16px}
.tslide .v{font-size:24px}
.tslide dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.tslide dt{color:var(--muted)}
.tslide dd{margin:0;text-align:right;font-weight:600;color:var(--ink)}
.slide .k{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.slide .ico{width:26px;height:26px}
.slide .bar{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.dots{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px}
.dots button{width:6px;height:6px;border-radius:99px;border:0;padding:0;background:color-mix(in srgb,var(--ink) 25%,transparent)}
.dots button.on{height:16px;background:var(--ink)}
.tbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tb{display:flex;flex-direction:column;gap:5px;text-decoration:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink-2);min-width:0}
.tb:hover{border-color:var(--lav-100)}
.tb .r2{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tb .r2 b{font:800 20px/1 var(--head);color:var(--ink)}
.tb .note{font-size:12px}
/* board (Pano) like jobness > Shortlist */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:var(--soft);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.bcol.has.lav{background:var(--t-lav)}.bcol.has.butter{background:var(--t-butter)}.bcol.has.mint{background:var(--t-mint)}
.bcol.over{outline-color:var(--ink)}
.bcol header{display:flex;gap:8px;align-items:center;padding:2px 4px 4px}
.bcol header b{color:var(--ink);font-size:13.5px}
.bdot{width:8px;height:8px;border-radius:50%}
.bdot.lav{background:var(--lav)}.bdot.butter{background:#d9a62e}.bdot.mint{background:var(--mint)}
.bempty{border:1.5px dashed color-mix(in srgb,var(--ink) 15%,transparent);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13px}
.bcard{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card);padding:9px 10px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.bcard.drag{opacity:.5}
.bcard.late{box-shadow:inset 3px 0 0 var(--bad),var(--shadow-card)}
.bcard .bh{display:flex;gap:8px;align-items:flex-start}
.bcard .bh .prio{margin-top:6px}
.bcard .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bcard .t{color:var(--ink);font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.bcard .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.bcard .icon-btn svg{transition:transform .2s var(--ease)}
.bcard.open .icon-btn svg{transform:rotate(180deg)}
.bb{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.steps span{height:4px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--lav)}
.steps-l{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:11px;color:var(--muted)}
.bact{display:flex;gap:8px;align-items:center}
.bact select{flex:1}
.day .grow{flex:1;min-width:0}
/* Yolculuğum */
.jgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.jcard .s b{color:var(--ink)}
.jcard .bar{background:color-mix(in srgb,var(--surface) 60%,transparent);max-width:360px}
.cal .cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cgrid b{font-size:11.5px;color:var(--muted);font-weight:600;padding:2px 0}
.cgrid button{border:0;background:none;border-radius:10px;padding:6px 0;font-size:13px;color:var(--ink);position:relative}
.cgrid button:hover{background:var(--soft)}
.cgrid button.today{font-weight:800;box-shadow:inset 0 0 0 1.5px var(--lav)}
.cgrid button.sel{background:var(--ink);color:var(--surface)}
.cgrid button.last{background:var(--t-rose);font-weight:800}
.cgrid button.last.sel{background:var(--ink)}
.cgrid button i{position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--lav);transform:translateX(-50%)}
.cday{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cnote{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink)}
.cnote .link{margin-left:auto;font-size:12px}
.road{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.road li{position:relative;display:flex;gap:12px;align-items:baseline}
.road li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--lav)}
.road li.done::before{background:var(--lav)}
.road li.now::before{border-color:var(--ink);background:var(--ink)}
.road li.end::before{border-color:var(--rose);background:var(--rose)}
.road li .note{width:56px;flex:none}
.htable td{vertical-align:middle}

.trbox{display:flex;gap:10px;align-items:center;background:var(--near-50);border-radius:12px;padding:8px 10px}
.trbox .sdot{width:22px;height:22px;border-radius:7px;background:var(--surface);color:var(--near);display:grid;place-items:center;flex:none}
.trbox .grow{flex:1;min-width:0}
.row.sess>.link{align-self:center;font-size:12.5px;color:var(--muted)}
/* ---------- responsive ---------- */
@media (max-width:1100px){
  .cols{grid-template-columns:1fr}
  .span-3{grid-column:span 6}.span-4{grid-column:span 6}.span-5{grid-column:span 12}.span-8{grid-column:span 12}
  .tbar{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .app,.side-min .app{grid-template-columns:1fr}
  .side{display:none}
  .hsearch span,.hsearch kbd,#qaBtn span,.upd,#bkIn,#bkOut{display:none}
  .hsearch{min-width:0}
  .tbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:1fr}
  .jgrid{grid-template-columns:1fr}
  .topbar{padding:14px 16px 0}
  .crumb span,.crumb i{display:none}
  .upd{font-size:12px}
  .tile.big .ring{display:none}
  .view{padding:12px 16px 96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 4px;border-radius:10px;min-width:58px}
  .bottom a svg{width:20px;height:20px}
  .bottom a[aria-current="page"]{color:var(--ink)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .span-5,.span-6,.span-8,.span-12{grid-column:1/-1}.span-3,.span-4,.span-2{grid-column:span 1}
  .tile.big{flex-direction:column;align-items:flex-start}
  .tile.big .v{font-size:40px}
  .tile .v{font-size:28px}
  .studio,.fgrid{grid-template-columns:1fr}
  .detail{padding:16px}
  .chero h2{font-size:20px}
  .dl{grid-template-columns:1fr;gap:2px 0}.dl dd{margin-bottom:8px}
  .c3{display:none}
  .modal .grid2{grid-template-columns:1fr}
  .addbar{grid-template-columns:1fr}
  .addbar .more{display:none}.addbar:focus-within .more{display:flex}
  .mini .r{grid-template-columns:minmax(0,100px) minmax(0,1fr) 46px}
  .ddp{width:min(260px,86vw)}.filters{position:relative}.dd{position:static}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

ibrary": {"categories": ["CRM & Sözleşme", "Fiyat & Kampanya", "Satış ekipleri", "Metrikler & tanımlar", "Veri & Qlik", "Çalışma kuralları", "Nasıl yapılır"], "items": [{"id": "l-crm-1", "cat": "CRM & Sözleşme", "kind": "yasak", "pin": true, "title": "İlk ödeme zaman aşımı olan sözleşme yok sayılır", "tldr": "Zaman aşımına düşmüş sözleşme yok gibi davranılır; üzerinden işlem yapılmaz, satış / satış destek sıfırdan yeni sözleşme gönderir.", "body": "- Kesinlikle tekrar aktife alınmaz. Pasif ikonuna tıklayınca sebep görünür: \"ilk ödeme zaman aşımı\".\n- Bu sözleşmelerden **manuel ödeme çekimi denenmez**, **manuel vade düzenlemesi yapılmaz**.\n- Pasife düşünce içindeki tüm ürünler silinir; aktife alınsa bile ürün olmadığı için yayın açılmaz. CRM'den yeniden sözleşme gönderilir.\n- Zaman aşımı süresi: **erken yenileme tikli 15 gün**, tiksiz **2 gün**.", "tags": ["sözleşme", "ödeme", "CRM"], "source": "Aktarım Dosyası (Google Doc)", "updated": "2026-11-20"}, {"id": "l-crm-2", "cat": "CRM & Sözleşme", "kind": "bilgi", "pin": false, "title": "Erken yenileme: nasıl çalışır", "tldr": "Aktif ürünü olan firma yeni ürün alabilir; yeni ürün aktif ürün bitmeden başlayamaz, ödeme başlangıç tarihine göre işlenir.", "body": "- **Başlangıç tarihi:** Sepet ve TES ekranlarında her ürüne tarih seçici var; seçilmezse bugün gider.\n- **Tarih çakışması:** Yeni ürünün başlangıcı aktif ürünün bitişinden önce olamaz; olursa uyarı çıkar.\n- **\"Erken yenileme mi?\"** alanı sepet ve sözleşme ekranında; varsayılan Hayır (saleType: earlyRenewal).\n- **Ödeme:** Ürün başlangıç tarihine göre işlenir. Kredi kartıyla ilk ödeme alınmazsa alert maili gider. Zaman aşımı 48 saatten 15 güne çıktı.\n- Ürün düzenleme modalında ürünün erken yenileme olup olmadığı kapalı bir kutucukla görünür.", "tags": ["erken yenileme", "sözleşme"], "source": "Aktarım Dosyası (Google Doc)", "updated": "2026-11-20"}, {"id": "l-crm-3", "cat": "CRM & Sözleşme", "kind": "kural", "pin": true, "title": "Erken yenilemede dikkat: yayını ödemeden önce açma", "tldr": "Alert maili için erken yenileme tikli ve yayın kapalı olmalı. Yayın ödemeden önce açılırsa çekim olmazsa alarm gelmez.", "body": "- Ödeme çekilemezse alert gelmesi için: **erken yenileme tikli**, **yayın aktif değil**.\n- Yayınlar ödeme alınmadan önden açılmaz.\n- Sözleşme tipi yalnızca **\"Abonelik Arge veya e-sözleşme\"** kalır; alertler ve otomatik çekim denemeleri yalnızca abonelik sözleşmelerinde çalışır.", "tags": ["erken yenileme", "alert", "yayın"], "source": "Aktarım Dosyası (Google Doc)", "updated": "2026-11-20"}, {"id": "l-crm-4", "cat": "CRM & Sözleşme", "kind": "nasil", "pin": false, "title": "Erken yenileme talepleri: hangi talebe ne cevap", "tldr": "Dört tipik talep ve doğru işlem; ikisi yönetim onayı ister.", "body": "**\"Ödemeyi şimdi alacağız\"**\n- Sözleşme ileri tarihli gönderilse bile ödeme linki SMS ile hemen gider; firma o an ödeyebilir. Aktif yayın sürer, yenileme yayını asıl tarihinde başlar.\n\n**\"Aynı / daha düşük ürünle devam, ödemeyi 3-4 gün sonra yapacak, kapalı kalmasın\"** → yönetim onayı gerekir. Onaylansa da erken yenileme ürünü elle açılmaz:\n- Eski ürünün bitişine istenen gün eklenip tekrar aktife alınır.\n- Yenileme ürününün başlangıcı aynı kadar ileri alınır, bekleyen ürünlere düşer.\n- Erken yenileme sözleşmesindeki ilk vade, ileri alınan başlangıçla aynı gün yapılır.\n\n**\"Upsell yaptı, yeni yayın şimdi açılsın, ödemeyi şimdi yapacak\"**\n- Sözleşme ve mail order bugünden başlar, firma şimdi öder. Önce aktif yayın pasife alınır, sonra satış bugünden başlayan sözleşmeyi gönderip ödemeyi o an çeker.\n\n**\"Upsell yaptı, yayın şimdi açılsın, ödemeyi asıl yenileme tarihinde yapacak\"** → mutlaka yönetim onayı.\n- Yayın aktif olduğu için alert gelmez; söz verilen tarihte ödemenin yapılıp yapılmadığını talep eden ve işi yapan elle takip eder.", "tags": ["erken yenileme", "upsell", "onay"], "source": "Aktarım Dosyası (Google Doc)", "updated": "2026-11-20"}, {"id": "l-crm-5", "cat": "CRM & Sözleşme", "kind": "kural", "pin": true, "title": "Ticari unvan kontrolü ve provider taşıma", "tldr": "Farklı ticari bilgili müşterinin altından sözleşme / ödeme gönderilmez; aynı kişi, ortak ya da aile olsa bile. Provider taşıma feragatname ister.", "body": "- Satışçı, CRM'deki müşteri ticari bilgisinin sözleşmedekiyle aynı olduğundan emin olur.\n- Unvan değişirse sözleşmeden önce operasyon yetkilisine haber verilir, tüm kontroller istenir.\n- Firma eski içeriklerini (fotoğraf, yorum, hakkında, teklifler) kullanmak istiyorsa CRM'de **provider taşıma** yapılır.\n\n**Provider taşıma kuralları**\n- **Feragatname olmadan taşınmaz.** Yenilemede yeni sözleşme farklı unvana yapılıyorsa feragatname zorunlu (kardeş / ortak olsa bile). Alınamıyorsa sıfırdan yeni müşteri ve RÇİ açılır, içerik baştan girilir.\n- Yeni unvanın sözleşmesi ya da **devir dilekçesi** olmadan taşınmaz. Devam eden sözleşmede unvan değişirse devir dilekçesi, iki tarafın imzası ve iki tarafın tüm ticari evrakı gerekir.\n- Devam eden vade ya da borç varsa, belgeler tamam olsa bile **finans onayı** olmadan taşınmaz.", "tags": ["unvan", "provider taşıma", "feragatname"], "source": "Aktarım Dosyası (Google Doc)", "updated": "2026-11-20"}, {"id": "l-crm-6", "cat": "CRM & Sözleşme", "kind": "kural", "pin": false, "title": "Önceki ürün bağlama (yoksa yenileme / churn raporları bozulur)", "tldr": "Ürün taşıma, kategori / paket değişikliği ve geç yenilemede yeni ürüne önceki ürün id'si işaretlenir.", "body": "Ne zaman işaretlenir (Performans ekibi / back office):\n- İlk 3 ay 2X üst paket, sonraki 9 ay satılan paket kampanyası: 9 aylık ürünün önceki ürünü 3 aylık ürün.\n- Ürün başka provider altına taşınırsa.\n- Kategori değiştirmek için yeni provider açılıp ürün tanımlanırsa.\n- Paket değiştirmek için ürün kapatılıp yenisi tanımlanırsa.\n- Satış yenilemede farklı kategori satıp yeni provider id tanımlarsa.\n- Qlik'te churn görünen ama churn olmayan ürün (PY takım lideri). Örnek: 1001 ürünü 1 ay geç 1002 ile yenilendiyse 1002'nin önceki ürünü 1001.\n\nNereden: **Firma → Product** ya da **Sözleşme → Product**. Liste: Ürün Id - Provider Id - Ürün Adı - Başlangıç/Bitiş.\n\nListe kuralları:\n- Önceki ürün aynı customer altında olmalı (customer'lar arası olmaz; customer taşınırsa olur).\n- Aynı customer'ın farklı provider'ı, farklı kategorisi olabilir.\n- Bir ürün birden çok ürüne önceki ürün olabilir.\n- Yeni ürünün başlangıcından en çok 3 ay önce bitmiş ürünler seçilebilir.\n- Hiç yayınlanmamış ürün önceki ürün olarak yok sayılır.", "tags": ["önceki ürün", "churn", "rapor"], "source": "Aktarım Dosyası (Google Doc)", "updated": "2026-11-20"}, {"id": "l-fiyat-1", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": true, "title": "Taşra ilçe = Uydu İller fiyatı (Winner)", "tldr": "Winner 2X/4X/6X'te İstanbul / Ankara / İzmir / Bursa (ve Antalya / Adana / Mersin) taşra ilçesindeki firma Uydu İller fiyatını alır.", "body": "- Winner → Winner kartının Uydu İller satırı.\n- Welcome → bölgenin kendi \"Uydu (Taşra) İlçe Satış Fiyatı\" kolonu.\n- Plus → ilçe mantığı yok.\n- İstisna (16.10.2026): Uydu listesinden FAZLA ödeyen taşra Winner sayfası şehir fiyatından satılmıştır; liste fiyatı sözleşme tarihindeki şehir kartı.\n- İlçe listesi: güncel rate card'ın `Uydu(Taşra) İlçeler` sayfası. Yeni ilçe Cities Google Sheet'e de girer.", "tags": ["fiyat", "taşra", "Winner"], "source": "_Resources/notes/tasra-ilce-uydu-fiyat.md", "updated": "2026-10-16"}, {"id": "l-fiyat-2", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": true, "title": "Yenileme tabanı: bugünkü ödeme × 1,4", "tldr": "Yenileme fiyatı bugünkü ödemenin 1,4 katının altına inmez; son teklif dahil.", "body": "- Elle verilecek her fiyattan önce bu taban kontrol edilir (Grand Makel 107285, 10.11.2026).\n- Yenileme 12 ay mantığıyla yapılır. **Senet ödeme seçeneği değildir.**\n- \"+1 ay\" hediyesi aylık eşdeğeri ×1,29'a düşürür → sessizce değil, karar olarak sorulur.", "tags": ["yenileme", "fiyat"], "source": "nes-review-standards · Kampanya Stüdyosu PROJECT.md §4", "updated": "2026-11-17"}, {"id": "l-fiyat-3", "cat": "Fiyat & Kampanya", "kind": "tanim", "pin": true, "title": "Promo hediye değildir", "tldr": "Promo = ödemeyen müşteriye verilen ücretsiz, sınırlı ürün. Hediye = normalde ücretli ürünün (Winner 2X/4X/6X) bir satışın içinde bedava verilmesi.", "body": "- Hediye sayfasına asla \"promo\" denmez; promo hediye gibi sayılmaz.\n- Upsell'deki \"2 ana + 1 hediye\" hediyeleri sayar, promoları değil.", "tags": ["promo", "hediye"], "source": "Nes 18.11.2026", "updated": "2026-11-18"}, {"id": "l-fiyat-4", "cat": "Fiyat & Kampanya", "kind": "bilgi", "pin": false, "title": "Güncel fiyat kaynağı ve sabit fiyatlar", "tldr": "Güncel rate card = adındaki tarihe göre en yeni *All Current Rate Cards_*.xlsx. Fiyat uydurulmaz.", "body": "- Klasör: `3 Pricing/Düğüncom_subscription_models` (önce `PRICING.md`).\n- Plus yıllık yenileme 6.000 ₺/ay, Plus yeni satış 9.900 ₺/ay, yalnız yıllık.\n- Welcome 12 ay peşin; başka kampanya üst üste binmez → Welcome'a hediye her zaman karar sorusu.\n- 6 ay kuralı: 6 aydan uzun süre ödemeyen eski müşteri yeni satış sayılır.", "tags": ["fiyat", "rate card", "Plus", "Welcome"], "source": "PRICING.md · Kampanya Stüdyosu PROJECT.md §4", "updated": "2026-11-17"}, {"id": "l-fiyat-5", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": false, "title": "Kampanya yazma kuralları", "tldr": "Tek cümle: \"[Kim] için; [ne zaman] [ölçülebilir hediye]!\" Hediye somut ve ölçülebilir; zaten yenileyen gruba hediye değil upsell.", "body": "- Örnek: \"Seçili firmalar için; Aralık yenilemelerinde 1 aylık Booster hediye!\"\n- Bir ayın yenileme kampanyası **sonraki 3 ayda bitenlere** erken yenilemedir, o ay bitenlere değil.\n- Kime hediye: Yeşil (~%70 yeniler) → upsell; Sarı (~%46) → hediye; Turuncu / Kırmızı (~%12-18) → performans görüşmesi.\n- Her gerekçe bir rakam + \"yani\" (karar). Kararsız bilgi yazılmaz.\n- Firmaya asla \"xx kat görünürlük\" denmez.\n- Dil: sade, saygılı. \"Geri dönene / özledik\" yok; \"yeniden aramıza katılın\", \"eski iş ortağımız\". Firmanın hiç sahip olmadığı şey için \"yeniden\" denmez.\n- Push yalnızca ödeyen firmalara. %15 kontrol grubu önerilir.", "tags": ["kampanya", "metin"], "source": "Kampanya Stüdyosu PROJECT.md §0, §4", "updated": "2026-11-19"}, {"id": "l-ekip-1", "cat": "Satış ekipleri", "kind": "bilgi", "pin": false, "title": "SAS · MoS · TES · SAD kim ne satar", "tldr": "SAS = mekanlarda Winner yenileme / geri kazanım / upsell + Adana-Mersin-Antalya Welcome. MoS = 4 büyük ilde Welcome yeni satış. TES = mekan dışı Plus (hibrit). SAD = randevu.", "body": "- **SAS:** Winner yenileme, geri kazanım ve upsell her yerde; Welcome yeni satış Adana / Mersin / Antalya ve alt bölgeleri (Gaziantep, Hatay, Denizli, Muğla).\n- **MoS:** Welcome yeni satış İstanbul / Ankara / İzmir / Bursa ve alt bölgeleri; yalnız Welcome, yenileme yapmaz.\n- **TES:** Mekan dışı Plus her yerde; \"Yeni Şehirler\"de mekana Welcome. 14.09.2026'dan beri hibrit: İstanbul saha kolu Big 5'i ziyaret eder (aynı Plus fiyatı), ofis kolu telefonla.\n- **SAD:** Randevu ayarlama, çoğunlukla MoS için.\n- **Big 5:** Gelin Saçı ve Makyajı, Düğün Organizasyon, Düğün Fotoğrafçıları, Gelinlik, Müzik.\n- Mekanlarda şehir → ekip: D-One `dw_city_sales_team`. Mekan dışı her zaman TES. Bunu Nes'e sorma.", "tags": ["SAS", "MoS", "TES", "SAD", "Big 5"], "source": "_Resources/notes/sales-team-structure.md", "updated": "2026-11-18"}, {"id": "l-met-1", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "Performans ligi skoru (firmanın panelde gördüğü)", "tldr": "Provider Contest Dashboard'daki total_score. Her ayın 2'sinde sıfırlanır; ilk günlerde herkes düşer.", "body": "Ağustos 2026 puanlaması (100):\n- Dönüş süresi 25 · Dönüş oranı 25 (%40 altı 0)\n- Aktif kampanya 15 · Dönüş yöntemi 10 (telefonla dönüş payı)\n- Panel girişi 10 · Sonuç kodu 10\n- Galeri 2 · Yorum 2 · Güncel fiyat 1\n\nRenk: **Yeşil ≥ 80 · Sarı 60–80 · Turuncu 30–60 · Kırmızı < 30**. Özel Fiyat bonusu Nisan 2026'da kalktı.\n- \"Skorum düştü\" vakası: `8 Analyses/Provider_Contest_Winners/PROJECT.md` § Score mechanics.\n- Sağlık rengi (ph_flag_dual, 8 bayrak) bu skor değildir.", "tags": ["skor", "performans", "provider contest"], "source": "Kök CLAUDE.md §2", "updated": "2026-11-05"}, {"id": "l-met-2", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "Yenileme oranı, olgun aylar, havuzlar", "tldr": "Yenileme oranı = Renewal / (Renewal + Churn); hediye sayfalar ve Lost Provider hariç. Son 2 kapanan ay olgun değildir.", "body": "- Gerçek oran `is_gift = 1` ve `Churn - Lost Provider`'ı dışlar.\n- Son 2 kapanan ay geç yenilemeler yüzünden eksik görünür → oranlar 12 olgun aydan hesaplanır.\n- Erken yenileme havuzu: ödeyen, bitişi hedef ay +1…+3 olan sayfalar, hediye sayfalar hariç.\n- Geri kazanım havuzu: 6–18 ay önce Lost Customer olmuş, bugün ödemeyenler.\n- Yeni satış = `monthly_b2b_new_detail` \"New\" ile başlar; FTS'nin üstünde sayar, yön gösterir.", "tags": ["yenileme oranı", "churn", "tanım"], "source": "Kampanya Stüdyosu PROJECT.md §2", "updated": "2026-11-17"}, {"id": "l-met-3", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "Customer, provider, RÇİ", "tldr": "Customer = faturalanan taraf. Provider = bir ilan sayfası; bir customer'ın birden çok provider'ı olabilir.", "body": "- CRM linki: `https://crm.dugun.com/customers/{customer_id}#providers`\n- Her zaman **RÇİ** de, asla \"Rİİ\".\n- \"Bağlantı\" değil **yenileme sonrası ciro**.", "tags": ["customer", "provider", "terim"], "source": "Kök CLAUDE.md §2 · nes-review-standards", "updated": "2026-11-05"}, {"id": "l-veri-1", "cat": "Veri & Qlik", "kind": "bilgi", "pin": false, "title": "Qlik uygulamaları ve anahtar", "tldr": "Executive (günlük aktivite, ppp_id, PY), General (sözleşme, reject, payment_due), Provider Contest (skor). Anahtar yalnız çalışırken okunur.", "body": "- Tenant `rx2lc2xpounq8gv.eu.qlikcloud.com`\n- Executive `3e66f065-9c5d-4d10-8454-9125686c72e8`\n- General `ce318523-86fc-4e8d-bcf5-55bc22fb56e8`\n- Provider Contest Dashboard `e7196a51-312d-4032-b0bd-070e61e965d8`\n- Anahtar `qlik_api_key.txt`: hiçbir dosyaya, koda, maile kopyalanmaz (tek istisna D-One `.env.local`).\n- Yardımcı: `tools/qlik.py`. Bir metriği Qlik'te aramadan önce `_Resources/references/BU_Knowledge_Handbook.md`.", "tags": ["Qlik", "app id"], "source": "Kök CLAUDE.md §2", "updated": "2026-11-05"}, {"id": "l-veri-2", "cat": "Veri & Qlik", "kind": "kural", "pin": false, "title": "Reload olan Qlik uygulaması boş veri döner", "tldr": "Hata vermez, boş döner. Uzun çekimler doğrulanır, yazılır, kaldığı yerden devam eder.", "body": "- Boş sonuç = belki reload. Tekrar denemeden önce kontrol et.\n- Ayrıntı: `_Resources/notes/qlik-reload-returns-empty.md`.\n- Canlı D-One veritabanı salt-okunur: `tools/d_one_ro.py` (host staging der, veri canlıdır).", "tags": ["Qlik", "reload"], "source": "_Resources/notes/qlik-reload-returns-empty.md", "updated": "2026-09-18"}, {"id": "l-kural-1", "cat": "Çalışma kuralları", "kind": "yasak", "pin": false, "title": "Claude'a kural: mail benim onayım olmadan gitmez", "tldr": "Claude hiçbir maili, o mail için sohbette açık onayım olmadan göndermez, yanıtlamaz, iletmez.", "body": "- Önce alıcı, konu ve tam metin gösterilir; açık \"evet\" beklenir. Bir onay = bir mail.\n- Okumak, aramak ve taslak oluşturmak serbest.\n- Her yol için geçerli: connector, tarayıcı, script, otomasyon, alt ajanlar.", "tags": ["mail", "onay"], "source": "Nes 06.11.2026", "updated": "2026-11-06"}, {"id": "l-kural-2", "cat": "Çalışma kuralları", "kind": "kural", "pin": false, "title": "Teslim standartları", "tldr": "Yalnızca istenen, en kısa kullanılabilir biçimde. Kontrol kolonları en solda. Teslimler Türkçe, tarih GG.AA.YYYY.", "body": "- Kontrol işi tek sayfada biter: yalnız düzeltilecek / bakılacak şeyler, ne yapılacağı ve neden.\n- Her bulgu yerini söyler: sistem > sayfa > sekme > öğe.\n- Gerçek ID'lerle elle kontrol edilmeden teslim yok.\n- Son sürüm tek dosya; `_v2` yok.\n- Dış sistemler (Chrome, Drive, CRM, Sheets) yalnız görüntüleme.\n- Sayfalarda taşan metin, ikinci kaydırma çubuğu, tıklanmayan şeyde el imleci kabul edilmez.", "tags": ["teslim", "Excel", "dil"], "source": "Kök CLAUDE.md §4 · nes-review-standards", "updated": "2026-11-06"}, {"id": "l-kural-3", "cat": "Çalışma kuralları", "kind": "kural", "pin": false, "title": "D-One PR kuralları", "tldr": "Yalnız main'e PR (Barış inceler). Her PR'dan önce d-one-pr-review + ekranları tarayıcıda gez + Barış'ın dersleri. İnceleme turunda önce yerelde göster, turun sonunda tek push.", "body": "- Bir iş = bir branch = bir worktree, yeni oturumda.\n- Her push 25-30 dk test çalıştırır → turda tek push.\n- Notlar: `_Resources/notes/D-One/` (repoya asla koyma).", "tags": ["D-One", "PR", "Barış"], "source": "Kök CLAUDE.md §1", "updated": "2026-11-13"}, {"id": "l-nasil-1", "cat": "Nasıl yapılır", "kind": "nasil", "pin": false, "title": "Aylık kampanya çalışması (her ayın 24'ü)", "tldr": "Zamanlanmış görev 24'ünde 09:30'da bir sonraki ayın önerilerini üretir; elle de \"kampanya üret: …\" denebilir.", "body": "- Qlik ve D-One çekimi → sinyaller → analizler → `campaigns/<ay>.json` → sayfa.\n- Yeni \"İlk N Ay analiz\" dosyası varsa hedef verisi de yenilenir.\n- Customer.io rakamları Chrome'da elle okunur (görüntüleme).\n- Hiçbir şey maillenmez; içerikleri Nes paylaşır.\n- Ayrıntı: `9 Monthly Campaigns/PROJECT.md` §6.", "tags": ["kampanya", "aylık"], "source": "Kampanya Stüdyosu PROJECT.md §6", "updated": "2026-11-19"}, {"id": "l-nasil-2", "cat": "Nasıl yapılır", "kind": "nasil", "pin": false, "title": "Hedef verisini yenileme", "tldr": "Aylık \"İlk N Ay analiz\" dosyası gelince Claude'a \"hedef verisini yenile\" de.", "body": "- Komut: `py \"1 Renewals/New Sales & Renewal Targets-Monthly/build_dashboard_data.py\" \"<İlk N Ay .xlsx>\" \"9 Monthly Campaigns/data/hedef\"`\n- Excel'de kaydedilmiş olmalı (formül sonuçları okunur).\n- Nes Panel > Hedefler ve Kampanya Stüdyosu aynı veriyi okur.", "tags": ["hedef", "veri"], "source": "Kampanya Stüdyosu PROJECT.md §1", "updated": "2026-11-19"}]}, "campaigns": {"months": {"2026-12": {"month": "2026-12", "label": "Aralık 2026", "generated_at": "17.11.2026", "version": 3, "products": {"booster30": {"name": "Booster (30 gün)", "status": "Öneri ürün; bugün satışta değil", "what": "Firmanın sayfası 30 gün boyunca kendi şehir ve kategori listesinde ilk 5 sırada gösterilir ve düğün.com'un o şehirdeki Instagram reklamlarında yer alır. Aynı şehir × kategoride aynı anda en fazla 5 Booster (tüm kampanyalar toplamı).", "effect": "3 aylık Turbo'da 30 firmanın sayfa görüntülemesi ortanca +%87, benzer firmalara göre talebi +%41 arttı. Firmaya rakam sözü verilmez (\"xx kat görünürlük\" denmez); sonuç karneyle gösterilir.", "measure": "Mevcut firmada Booster'dan önceki 30 gün ile Booster'lı 30 gün; yeni ya da yeniden katılan firmada aynı şehir ve kategorideki benzer firmalarla karşılaştırma. Sonuç tek sayfalık karne olarak gönderilir.", "list_value": "Liste değeri yaklaşık 33.900 ₺ (Turbo'nun ortanca 3 aylık bedeli 101.822 ₺ / 3)."}, "vitrin7": {"name": "Kategori Vitrini Haftası", "status": "Öneri ürün; bugün satışta değil", "what": "Firma, seçtiği 7 gün boyunca kendi şehir ve kategori listesinin ilk 3 sırasında sabit görünür. Her şehir × kategoride aynı hafta en fazla 3 firma (tüm kampanyalar toplamı).", "effect": "Listenin ilk 3 sırası gösterimin en büyük payını alır. Önerilen hafta 15-21 Şubat: 14 Şubat teklif günü, aramaların izleyen hafta arttığı varsayılıyor (ölçülmedi).", "measure": "Vitrin haftası ile bir önceki haftanın liste gösterimi, sayfa görüntüleme ve talep sayısı.", "list_value": "Fiyatı yok; yalnızca kampanya hediyesi."}, "kapak": {"name": "Sayfa Yenileme", "status": "Öneri hizmet; içerik ekibi yapar", "what": "İçerik ekibi firmanın kapak fotoğrafını ve ilk 12 galeri görselini yeniden seçip sıralar, eksik bilgileri (kapasite, fiyat aralığı, kampanya) tamamlar.", "effect": "Hedef: listeden sayfaya tıklama oranında artış. Ölçülmüş bir oran yok; ilk uygulamada ölçülecek.", "measure": "Yenilemeden önceki ve sonraki 35 günün liste tıklama oranı ve talep sayısı.", "list_value": "Fiyatı yok; maliyeti içerik ekibinin firma başına harcadığı süre."}, "arti1": {"name": "+1 ay hediye", "status": "Bilinen mekanizma (12 öde, 13 ay kullan)", "what": "Yıllık yenileyen firmanın yeni dönemi 12 yerine 13 ay sürer.", "effect": "Firmaya değeri bir aylık ödemesi kadar; bize maliyeti bir aylık ciro.", "measure": "Kampanyalı ve kampanyasız grubun yenileme oranı farkı.", "list_value": "Firmanın yeni aylık ödemesi kadar."}}, "analysis_notes": {"r_havuz": "Aralık kampanyasının hedefi bu 470 firma. Aralık'ta bitenler kapsam dışı.", "r_renk": "12 aylık ortalamada Yeşil %70, Sarı %46; son 4 ayda Yeşil %61, Sarı %37 (alttaki kart). Hediyenin oranı en çok değiştirebileceği grup Sarı; Yeşilden paket yükseltme istenir, Turuncu ve Kırmızıda önce performans konuşulur.", "r_upsell": "Yeşil 2X ve 4X firmalar (123) paket yükseltme kampanyasının hedefi: memnunlar, yeniliyorlar ve yükseltecek yerleri var.", "r_takvim": "Şubat bitişliler son 3 yılın 2'sinde Ocak ve Mart'tan düşük yeniledi; arama sırası Şubat bitişlilerden başlar. 3 gözlemle kesin değil.", "r_gercek": "Söz-Nişan gerçek oranla da %38: sorun hediye sayfalar değil, kategorinin kendisi. Bu kategoriye yenileme hediyesi değil, ayrı bir çalışma gerekir.", "r_erken": "Erken yenilemede +10 puan indirim zaten var, yine de yenilemelerin %4,8'i erken. Erken yenileyen 52 firmanın 32'si Yeşil, 18'i Sarı: indirim Sarı firmayı harekete geçirmiyor.", "r_kidem": "İlk yılını dolduran firma %36 yeniliyor; 4 yılı geçen %72. En büyük kayıp ilk yenilemede.", "r_ilk": "İlk yılındaki 219 firmanın 73'ü Sarı: Sarı kampanyası aynı zamanda ilk yenileme kampanyası.", "r_odeme": "Ödemesinde 2 ve üzeri gecikme olan firmalar hediye listesinden çıkarıldı (SAS Sarı 107 → 101, TES Sarı 34 → 32).", "r_sehir": "Mersin ve Antalya en düşük yenileyen şehirler ama havuzda yalnızca 22 firma var; şehir kampanyası yerine tek tek ziyaret.", "r_turbo": "Booster'ın ölçülmüş bir karşılığı var, ama firmaya rakam sözü verilmez; sonuç karneyle gösterilir.", "r_arama": "Ayda yaklaşık 2.500 giden arama, yarısı ulaşıyor. 224 firmalık SAS kampanya listesi (101 + 123) bu tempoya sığar.", "n_trend": "MoS'ta düşüş İzmir ve Ankara'da; SAS'ta Gaziantep'te (8'den 3'e) ve Söz-Nişan'da (20'den 6'ya). TES yükselişte, ona itme değil sürdürme gerekir.", "n_talep": "Ana illerde firma başına talep çoğu kategoride geçen yılın altında. Artan az sayıda yer (İstanbul Gelin Arabası 47'den 70'e, Adana Söz-Nişan 21'den 23'e) satışçının \"geçen yıl firma başına X talep vardı, bu yıl Y\" diyebileceği yerler; teklif değil, gerekçe.", "n_geri": "MoS bölgesinde 588 eski müşteri var ve ürünü tanıyor. Soğuk aramadan önce bu liste bitirilmeli; geri kazanım kampanyası buradan çıkıyor.", "n_sad": "146 firma görüşüldü ve hâlâ karar vermedi (115'i MoS, 31'i SAS bölgesinde): kapanış teklifinin hedefi bu grup. Hiç aranmayan 193 firma kampanya konusu değil, liste ve kadro konusu.", "n_sad_yer": "Karar bekleyenler tek bir şehirde toplanmıyor; kampanya şehir değil, firma listesiyle yürür.", "n_randevu": "Randevu sayısı 2 ayda neredeyse ikiye katlandı; temas sorunu yok. Not: SAD kaydında Ekim'de 90 sözleşme, saha kaydında 17 sözleşme görünüyor; iki kaynak farklı sayıyor, BI ile netleştirilmeli.", "n_saha": "MoS saha görüşmesi 3 katına çıktı ama sözleşme oranı %6,6'dan %2,9'a düştü. Sorun kapanışta; kapanışı hızlandıran, son tarihli bir teklif gerekiyor.", "n_mevsim": "Aralık için mevsim gerekçesi kullanılmıyor.", "n_welcome": "Puanlanan 69 Welcome firmasının 28'i Yeşil değil. Bunlar gelecek yılın yenileme riski ve bugünün kötü referansı; ilk 90 gün takibi ayrı bir iş olarak önerilir.", "iletisim_yeni": "Ödemeyen firmada mail 10 kişiden 1'ine ulaşıyor. Yeni satış kampanyasında mail destek, asıl kanal arama ve WhatsApp.", "iletisim_yenileme": "Ödeyen firmada mail 4 kişide
