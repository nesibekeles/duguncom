/* ---------- brief text ---------- */
function briefText(c, scope){
  const L=[]; const t=tone(c); const p=product(c);
  L.push(`${c.title} · ${c.team} · ${KIND[c.kind]} · ${ymLabel(c.month||K.month)}`, c.headline||"", "");
  L.push("HEDEF KİTLE", c.audience?.who||"", `Boyut: ${c.audience?.size||""}`, "");
  if(p) L.push("HEDİYE: "+p.name, p.what, p.effect, "");
  L.push("KAMPANYA DETAYLARI", ...(c.details||[]).map(x=>`- ${x.label}: ${x.text}`), "");
  if(scope==="tum"){
    if(c.howto) L.push("NEDİR, NASIL KULLANILIR", c.howto.what, ...(c.howto.steps||[]).map((x,i)=>`${i+1}. ${x}`), "");
    L.push("NEDEN", ...(c.why||[]).map(x=>`- ${x.fact} Yani: ${x.so||""}`), "");
    if((c.rules||[]).length) L.push("KURALLAR", ...c.rules.map(x=>"- "+x), "");
  }
  if(scope!=="icerik"){
    L.push(`MAIL (ton: ${(TONES.find(x=>x[0]===K.tone)||[])[1]||""})`, mailText(c), "");
    if(t.whatsapp) L.push("WHATSAPP", t.whatsapp, "");
    L.push("PUSH", t.push ? `${t.push.title}\n${t.push.body}` : "Yok: push yalnızca ödeme yapan firmalara gider.", "");
  }
  if(scope!=="eposta"){
    const b=c.banner||{};
    L.push("GÖRSEL METİNLERİ", `Üst satır: ${b.badge||""}`, `Başlık: ${(b.headline||"").replace(/[*\n]/g," ").replace(/ +/g," ")}`, `Hediye satırı: ${b.gift||""}`, `Buton: ${b.cta||""}`, "");
    if((c.video||[]).length) L.push("VİDEO FİKİRLERİ", ...c.video.map((x,i)=>`${i+1}. ${x}`), "");
    if((c.ideas||[]).length) L.push("YENİ PAZARLAMA FİKİRLERİ", ...c.ideas.map(x=>"- "+x), "");
  }
  if((c.plan||[]).length) L.push("GÖNDERİM PLANI", ...c.plan.map(p=>`- ${p.when} | ${p.who} | ${p.how}`), "");
  L.push("Not: {{...}} alanları gönderim aracında firma verisiyle doldurulur.");
  return L.join("\n");
}
function download(c){
  const name = `${c.title} Kampanya Brifi_${ymLabel(c.month||K.month)}.html`;
  const html = `<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>${esc(c.title)} brifi</title></head><body style="font-family:Arial,sans-serif;max-width:760px;margin:32px auto;line-height:1.55;color:#191919">${esc(briefText(c,"tum")).replace(/\n/g,"<br>")}</body></html>`;
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- shared controls ---------- */
function pillGroup(label, values, key, labels, onchange){
  const g=el("div","grp"); g.innerHTML=`<span>${esc(label)}</span>`;
  values.forEach(v=>{
    const b=el("button","pill"); b.type="button"; b.textContent=(labels&&labels[v])||v;
    b.setAttribute("aria-pressed", String(K[key]===v));
    b.onclick=()=>{ K[key]=v; if(onchange) onchange(); render(); };
    g.appendChild(b);
  });
  return g;
}
function toggle(values, key, cls){
  const t=el("div","seg "+(cls||""));
  values.forEach(([v,l])=>{
    const b=el("button"); b.type="button"; b.textContent=l; b.setAttribute("aria-pressed", String(K[key]===v));
    b.onclick=()=>{ K[key]=v; lsSet("np_k_"+key, v); render(); };
    t.appendChild(b);
  });
  return t;
}
const DROP_DEF = () => ({cities:(cityGroups()[0]||[])[1]||null});
function multiDrop(label, key, groups, extra, labels){
  const lb = v => (labels&&labels[v])||v;
  const all=groups.flatMap(g=>g[1]).concat(extra?[extra[0]]:[]);
  const sel=K[key]; const has=v=>!sel||sel.includes(v);
  const set=v=>{ K[key]=(v && v.length===all.length) ? null : v; lsSet("np_k_"+key, K[key]); K.sel=null; K.fsel=null; render(); };
  const cur=()=>sel?sel.slice():all.slice();
  const dd=el("div","dd"); let one;
  const txt =!sel ? "Hepsi" : !sel.length ? "Seçilmedi" : (one=groups.find(g=>g[0] && sel.length===g[1].length && g[1].every(v=>sel.includes(v)))) ? (one[0]==="Ana il"?"Ana iller":one[0]) : sel.length<=2 ? sel.map(v=>extra&&v===extra[0]?extra[1]:lb(v)).join(", ") : sel.length+" seçili";
  const b=el("button"); b.type="button"; const def=DROP_DEF()[key]||null; const norm=x=>x?JSON.stringify(x.slice().sort()):"all"; b.dataset.on=norm(sel)!==norm(def)?"1":"0"; b.innerHTML=`<span style="opacity:.7">${esc(label)}</span> ${esc(txt)}`; b.setAttribute("aria-expanded", String(K.drop===key));
  b.onclick=e=>{ e.stopPropagation(); K.drop = K.drop===key ? null : key; K.ddTop=0; render(); };
  dd.appendChild(b);
  if(K.drop===key){
    const p=el("div","ddp"); p.onclick=e=>e.stopPropagation(); p.onscroll=()=>{ K.ddTop=p.scrollTop; }; setTimeout(()=>{ p.scrollTop=K.ddTop||0; },0);
    const acts=el("div","acts",`<button type="button" data-a="all">tümünü seç</button><button type="button" data-a="none">temizle</button>`);
    acts.querySelector('[data-a="all"]').onclick=()=>set(null); acts.querySelector('[data-a="none"]').onclick=()=>set([]);
    p.appendChild(acts);
    const row=(cls,text,checked,onch,ind)=>{ const l=el("label",cls); const i=document.createElement("input"); i.type="checkbox"; i.checked=checked; i.indeterminate=!!ind; i.onchange=()=>onch(i.checked); l.appendChild(i); l.appendChild(document.createTextNode(text)); p.appendChild(l); };
    groups.forEach(([gn,items])=>{
      if(gn){ const n=items.filter(has).length; row("g", gn, n===items.length, on=>set(cur().filter(v=>!items.includes(v)).concat(on?items:[])), n>0&&n<items.length); }
      items.forEach(v=>row(gn?"i":"", lb(v), has(v), on=>set(cur().filter(x=>x!==v).concat(on?[v]:[]))));
    });
    if(extra) row("g", extra[1], has(extra[0]), on=>set(cur().filter(x=>x!==extra[0]).concat(on?[extra[0]]:[])));
    dd.appendChild(p);
  }
  return dd;
}
function placeFilters(f){
  if(cityGroups().length) f.appendChild(multiDrop("İl", "cities", cityGroups(), ["__diger","Diğer iller"]));
  const cg=((DATA.analyses||{}).cat_groups||[]).filter(g=>g[1].length);
  if(cg.length) f.appendChild(multiDrop("Kategori", "cats", cg));
  else { const cats=allCats(); if(cats.length) f.appendChild(multiDrop("Kategori", "cats", [["", cats]])); }
}
function filterBar(){
  const f=el("div","filters");
  const ml={}; months().forEach(m=>ml[m]=ymLabel(m));
  if(months().length>1) f.appendChild(pillGroup("Ay", months(), "month", ml, ()=>{K.sel=null;K.fsel=null;}));
  f.appendChild(multiDrop("Takım", "teams", [["",["SAS","MoS","TES"]]]));
  f.appendChild(multiDrop("Tür", "kinds", [["",["yeni","yenileme"]]], null, KIND));
  placeFilters(f);
  return f;
}
function tableHtml(cols, rows){
  return `<div class="tscroll"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>`;
}

/* ---------- Analizler ---------- */
const TEAMS3 = ["MoS","SAS","TES"];
function tableRows(t){
  return t.rows.filter(r => (t.city_col==null || cityOk(r[t.city_col])) && (t.cat_col==null || catOk(r[t.cat_col]))
    && (t.team_col==null || teamOk(r[t.team_col]) || !TEAMS3.includes(r[t.team_col])));
}
function renderAnaliz(host){
  const A=DATA.analyses; if(!A){ host.appendChild(el("div","empty","Analiz verisi yok.")); return; }
  const head=el("div","filters");
  head.appendChild(toggle([["yeni","Yeni satış"],["yenileme","Yenileme"]], "atab"));
  head.appendChild(multiDrop("Takım", "teams", [["",["SAS","MoS","TES"]]]));
  placeFilters(head);
  host.appendChild(head);
  host.appendChild(el("p","note", esc(`${A.target_label} kampanyaları için · son kapanan ay ${ymLabel(A.last_closed_month)}` + (K.atab==="yenileme" ? ` · hedef: ${A.pool_label} bitişli firmalar` : "") + ". İl ve kategori filtresi, şehir ya da kategori kolonu olan tabloları süzer; \"İl\" etiketi olmayan tablolar tüm illeri gösterir.")));
  const notes=(DATA.months[A.target]||{}).analysis_notes||{};
  const wrap=el("div","stack"); wrap.style.gap="14px"; host.appendChild(wrap);
  const cards=A.cards.filter(c=>c.tab===K.atab).map(c=>({c, tables:c.tables.filter(t=>!t.team||teamOk(t.team))})).filter(x=>x.tables.length);
  if(onlyTeam("MoS")&&K.atab==="yenileme") cards.length=0;
  if(!cards.length){ wrap.appendChild(el("div","empty", onlyTeam("MoS")&&K.atab==="yenileme" ? "MoS yalnızca yeni satış yapar; yenileme analizleri SAS ve TES içindir." : "Bu seçimde analiz yok.")); return; }
  const groups=[]; cards.forEach(x=>{ let g=groups.find(g=>g.name===x.c.group); if(!g){ g={name:x.c.group, items:[]}; groups.push(g); } g.items.push(x); });
  groups.forEach((g,gi)=>{
    const key=K.atab+"|"+g.name; const open = key in K.gopen ? K.gopen[key] : gi===0;
    const d=el("details","agroup"); d.open=open;
    d.innerHTML=`<summary><h2>${esc(g.name)}</h2><small>${g.items.length} analiz</small></summary>`;
    d.addEventListener("toggle", ()=>{ K.gopen[key]=d.open; lsSet("np_k_gopen", K.gopen); });
    const list=el("div"); d.appendChild(list);
    g.items.forEach(({c,tables})=>{
      const a=el("article","acard");
      const isOpen=!!K.topen[c.id]; const hasPlace=tables.some(t=>t.city_col!=null||t.cat_col!=null);
      a.innerHTML=`<div class="row1"><h3>${esc(c.title)} ${hasPlace?'<span class="chip">İl</span>':""}</h3><button class="ghost sm" type="button" aria-expanded="${isOpen}">${isOpen?"Tabloyu kapat":"Tabloyu aç"}</button></div><p class="lead">${esc(c.lead)}</p>${notes[c.id]?`<p class="yani"><b>Yani:</b> ${esc(notes[c.id])}</p>`:""}`;
      a.querySelector("button").onclick=()=>{ K.topen[c.id]=!isOpen; render(); };
      if(isOpen){
        const tt=el("div","ttables"+(tables.some(t=>t.cols.length>=5)?" wide":""));
        tables.forEach(t=>{
          const rows=tableRows(t); const mk=c.id+"|"+(t.team||""); const lim=K.more[mk]?rows.length:10;
          const box=el("div","ttable");
          box.innerHTML=(t.team?`<div class="th"><span class="chip ${esc(t.team)}">${esc(t.team)}</span><span class="note">${rows.length} satır</span></div>`:"")
            + (rows.length ? tableHtml(t.cols, rows.slice(0,lim)) : `<p class="note" style="padding:12px">Seçimde satır yok.</p>`)
            + (rows.length>10 ? `<button class="more" type="button">${K.more[mk]?"Daha az göster":"+"+(rows.length-10)+" satır daha"}</button>` : "");
          const mb=box.querySelector(".more"); if(mb) mb.onclick=()=>{ K.more[mk]=!K.more[mk]; render(); };
          tt.appendChild(box);
        });
        a.appendChild(tt);
        if(c.note) a.appendChild(el("p","note",esc(c.note)));
      }
      list.appendChild(a);
    });
    wrap.appendChild(d);
  });
}

    } else {
      frame=el("div","ph",`<div class="scr fix">${SBAR("11:02")}<div class="mhead"><b>${esc(fill(t.subject,c))}</b><span>Düğün.com İşOrtağım</span></div><div class="mbody"></div><div class="home"></div></div>`);

  if(K.chan==="push"){
    const n = t.push ? `<small><span>düğün.com İş Ortağım</span><span>şimdi</span></small><b>${esc(fill(t.push.title,c))}</b><p>${esc(fill(t.push.body,c))}</p>`
      : `<small><span>düğün.com İş Ortağım</span></small><b>Bu kampanyada push yok</b><p>Push yalnızca ödeme yapan firmalara gider; bu kampanyanın hedefi henüz müşteri değil.</p>`;
    pv.appendChild(el("div","ph",`<div class="scr dark">${SBAR("11:00")}<div class="lock"><div class="clock">11:00</div><div class="date">1 Aralık Salı</div><div class="notif"><img src="${AVATAR_URI}" alt=""><div>${n}</div></div></div><div class="home"></div></div>`));
    if(t.push) btn("Metni kopyala", ()=>copy(`${t.push.title}\n${t.push.body}`));

  host.appendChild(el("p","note", esc((K.chan==="mail"&&K.device==="mobile" ? "Mailin devamı telefonun içinde kaydırılarak görülür. " : "") + "Önizlemedeki firma adı, kişi ve tarihler örnektir. Kopyalanan metin ve HTML'de {{rci}}, {{yetkili_adi}} gibi alanlar olduğu gibi kalır. Görsel 1200 × 600 PNG olarak iner; mailde 600 px genişlikte kullanılır.")));
  if((c.video||[]).length){
    const v=el("div","piece",`<div><b>Video fikirleri</b><button class="ghost sm" type="button">Kopyala</button></div><pre>${esc(c.video.map((x,i)=>`${i+1}. ${x}`).join("\n\n"))}</pre>`);
    v.querySelector("button").onclick=()=>copy(c.video.map((x,i)=>`${i+1}. ${x}`).join("\n\n"));

}


/* ---------- Kararlar: every open question of the month in one queue (new in the panel) ---------- */
function renderKararlar(host){
  const dd = D.store.decisions = D.store.decisions || {};
  const f=el("div","filters"); f.appendChild(multiDrop("Takım", "teams", [["",["SAS","MoS","TES"]]])); host.appendChild(f);
  const list=campaigns().filter(c=>(c.decisions||[]).length && teamOk(c.team));
  const all=list.flatMap(c=>c.decisions.map((x,i)=>c.id+"#"+i)); const done=all.filter(k=>(dd[k]||{}).done).length;
  const top=el("div","card");
  top.innerHTML=`<div class="ch"><h3>${done} / ${all.length} karar verildi</h3><span class="sp"></span><span class="note">Kararların bu tarayıcıda saklanır. Claude'a iletmek için kopyala, sohbete yapıştır.</span><button class="ghost sm" type="button" id="kCopy">Kararları kopyala</button></div><div class="bar"><i style="width:${all.length?Math.round(done/all.length*100):0}%"></i></div>`;
  host.appendChild(top);
  top.querySelector("#kCopy").onclick=()=>{
    const L=[`Kampanya Stüdyosu ${ymLabel(K.month)} kararlarım (campaigns/${K.month}.json'a uygula):`, ""];
    list.forEach(c=>{ const ans=c.decisions.map((q,i)=>[q,dd[c.id+"#"+i]||{}]).filter(([q,st])=>st.done||st.note); if(!ans.length) return; L.push(`${c.title} (${c.id})`); ans.forEach(([q,st])=>L.push(`- ${q}
  → ${st.note||"(karar verildi, not yok)"}`)); L.push(""); });
    if(L.length<=2){ toast("Henüz kararın yok"); return; }
    copy(L.join(String.fromCharCode(10)), "Kararlar kopyalandı; Claude sohbetine yapıştır");
  };
  if(!list.length){ host.appendChild(el("div","empty","Bu seçimde karar bekleyen kampanya yok.")); return; }
  list.forEach(c=>{
    const card=el("div","card");
    card.innerHTML=`<div class="ch"><div class="chips"><span class="chip ${esc(c.team)}">${esc(c.team)}</span><span class="chip ${esc(c.kind)}">${esc(KIND[c.kind])}</span></div><span class="sp"></span><button class="link" type="button">Kampanyayı aç →</button></div><h3 style="font-size:16px">${esc(c.headline||c.title)}</h3>`;
    card.querySelector(".link").onclick=()=>{ K.view="kampanya"; K.sel=c.id; K.tab="kampanya"; lsSet("np_k_view","kampanya"); render(); window.scrollTo(0,0); };
    const rows=el("div","rows");
    c.decisions.forEach((q,i)=>{
      const k=c.id+"#"+i; const st=dd[k]||{};
      const r=el("div","row"+(st.done?" done":""));
      r.innerHTML=`<input type="checkbox" class="chk" ${st.done?"checked":""} aria-label="Karar verildi"><div class="grow"><span class="t">${esc(q)}</span><input type="text" placeholder="Kararın (ör. evet, %15 kontrol grubu olsun)" value="${esc(st.note||"")}" aria-label="Karar notu"></div><button class="ghost sm" type="button">${todos().some(t=>t.decision===k)?"İşte":ic("plus")+"İşe çevir"}</button>`;
      const save=()=>{ dd[k]={done:r.querySelector(".chk").checked, note:r.querySelector("input[type=text]").value.trim()}; saveStore(); };
      r.querySelector(".chk").onchange=()=>{ save(); render(); };
      r.querySelector("input[type=text]").onchange=save;
      const b=r.querySelector("button"); b.disabled=todos().some(t=>t.decision===k);
      b.onclick=()=>{ todos().push({id:uid("t"), text:`Karar ver: ${q.length>110?q.slice(0,107)+"…":q}`, project:proj("p-kampanya")?"p-kampanya":null, due:null, priority:"yüksek", status:"todo", targets:[], created:TODAY(), done_at:null, note:`${c.title} (${ymLabel(c.month||K.month)}): ${q}`, decision:k}); saveStore(); render(); toast("İş olarak eklendi"); };
      rows.appendChild(r);
    });
    card.appendChild(rows); host.appendChild(card);
  });
}

/* ---------- Forecast ---------- */
function fcInputs(c){
  const saved=(lsGet("np_k_fc")||{})[c.id]||{}; const f=c.forecast||{};
  return {n:+(saved.n ?? f.n ?? 0), base:+(saved.base ?? f.base ?? 0), uplift:+(saved.uplift ?? f.uplift ?? 0), value:+(saved.value ?? f.value ?? 0), cost:+(saved.cost ?? f.cost ?? 0)};
}
const bePuan = v => v < 0.1 ? "+0,1 puandan az" : "+" + fmt1(v) + " puan";
function fcCalc(i){
  const b=i.base/100, u=i.uplift/100;
  const bu=i.n*b, su=i.n*(b+u);
  const brev=bu*i.value, srev=su*i.value, cost=su*i.cost;
  const be = i.value>i.cost ? (b*i.cost/(i.value-i.cost))*100 : null;
  return {bu, su, brev, srev, cost, net:srev-cost-brev, extra:su-bu, extraRev:srev-brev, waste:bu*i.cost, be};
}
function renderForecast(host){
  host.appendChild(filterBar());
  const list=visible().filter(c=>c.forecast);
  if(!list.length){ host.appendChild(el("div","empty","Bu seçimde forecast'i olan kampanya yok.")); return; }
  const cur=list.find(c=>c.id===K.fsel)||list[0];
  let tot={extraRev:0,cost:0,net:0};
  const unkN=list.filter(c=>c.forecast.cost_unknown && !fcInputs(c).cost).length;
  const rows=list.map(c=>{ const r=fcCalc(fcInputs(c)); tot.extraRev+=r.extraRev; tot.cost+=r.cost; tot.net+=r.net; return {c,r}; });
  const tb=el("div","card");
  /* collapsed by default: only the selected campaign (first one if none) + the total; toggle shows all (Nes 26.11.2026) */
  const shown=K.fall?rows:rows.filter(({c})=>c.id===cur.id);
  tb.innerHTML=`<div class="ch"><h3>Kampanyalar yan yana</h3><span class="sp"></span>${rows.length>1?`<button class="ghost sm" type="button" id="fAll" aria-expanded="${!!K.fall}">${K.fall?"Daralt":`Tümünü göster (${rows.length})`}</button>`:""}</div><div class="tscroll"><table><tr><th>Kampanya</th><th class="c3">Kampanyasız</th><th class="c3">Kampanyayla</th><th>Ek adet</th><th>Ek ciro</th><th>Maliyet</th><th>Net katkı</th><th class="c3">Başa baş etki</th></tr>${shown.map(({c,r})=>`<tr class="clk ${c.id===cur.id&&K.fall?"sel":""}" data-id="${esc(c.id)}"><td><span class="chip ${esc(c.team)}">${esc(c.team)}</span> ${esc(c.title)}</td><td class="c3">${fmt1(r.bu)} ${esc(c.forecast.unit)}</td><td class="c3">${fmt1(r.su)}</td><td class="nw">+${fmt1(r.extra)} ${esc(c.forecast.unit)}</td><td class="nw">${tl(r.extraRev)}</td><td class="nw">${!r.cost&&(c.forecast.cost_unknown||!c.forecast.cost)?"bilinmiyor":tl(r.cost)}</td><td class="nw ${r.net>=0?"up":"down"}">${tl(r.net)}</td><td class="nw c3">${(r.be==null||!r.cost)?"–":bePuan(r.be)}</td></tr>`).join("")}<tr><td><b>Toplam${K.fall?"":` (${rows.length} kampanya)`}</b></td><td class="c3"></td><td class="c3"></td><td></td><td class="nw"><b>${tl(tot.extraRev)}</b></td><td class="nw"><b>${tl(tot.cost)}</b></td><td class="nw ${tot.net>=0?"up":"down"}"><b>${unkN?"en çok ":""}${tl(tot.net)}</b></td><td class="c3"></td></tr></table></div><p class="note">İl ve kategori filtresi yalnızca kampanya listesini süzer; forecast her kampanyanın tüm hedef kitlesi içindir. Bir satıra tıklayınca o kampanyanın varsayımları açılır. Ciro yıllık sözleşme değeridir. Kampanya etkisi (ek adet) her satırda varsayımdır. Maliyeti "bilinmiyor" olan kampanyalarda maliyet 0 alındı; net katkı orada olduğundan yüksek görünür.</p>`;
  host.appendChild(tb);
  tb.querySelectorAll("tr.clk").forEach(tr=>tr.onclick=()=>{ K.fsel=tr.dataset.id; render(); });
  const fa=tb.querySelector("#fAll"); if(fa) fa.onclick=()=>{ K.fall=!K.fall; render(); };
  const f=cur.forecast; const i=fcInputs(cur); const r=fcCalc(i);
  const g=el("div","fgrid"); host.appendChild(g);
  const inp=el("div","inputs");
  const field=(key,label,note,assume,step)=>`<div class="inp ${assume?"assume":""}"><label for="fc_${key}">${esc(label)}</label><input type="number" id="fc_${key}" data-k="${key}" value="${i[key]}" step="${step||1}" min="0"><small>${esc(note||"")}</small></div>`;
  inp.innerHTML = `<h3 style="font-size:17px;font-weight:700">${esc(cur.title)}</h3><p class="note">${esc(cur.headline||"")}</p>`
    + field("n", f.n_label||"Hedef firma", f.n_formula||"", false)
    + field("base", (f.base_label||"Kampanyasız oran")+" (%)", f.base_formula||"ölçülen oran", !!f.base_unknown, 0.1)
    + field("uplift", "Kampanyanın etkisi (+ puan)", "ölçülemedi; varsayım", true, 0.5)
    + field("value", (f.value_label||"İşlem başına ciro")+" (₺)", f.value_formula||"", false, 100)
    + field("cost", (f.cost_label||"Hediyenin maliyeti")+" (₺)", f.cost_formula||"", !!f.cost_unknown, 100)
    + `<p class="note">Sarı kutu: veriyle ölçülemiyor, varsayım. Değiştirdiğin değerler bu tarayıcıda saklanır.</p><button class="ghost" type="button" id="fcReset">Varsayılana dön</button>`;
  g.appendChild(inp);
  const main=el("div","fmain"); g.appendChild(main);
  const unk = !!f.cost_unknown && !i.cost;
  const U=f.unit;
  main.innerHTML =
    `<div class="frow"><h4>1 · Güncel durum: kampanya yok</h4><div class="kpis">`
      + kpi(`Beklenen ${U}`, fmt1(r.bu), `${fmt(i.n)} firma × %${fmt1(i.base)}`)
      + kpi("Beklenen ciro", tl(r.brev), `${fmt1(r.bu)} × ${fmt(i.value)} ₺`)
      + `</div></div>`
    + `<div class="frow"><h4>2 · Kampanya senaryosu</h4><div class="kpis">`
      + kpi(`Beklenen ${U}`, fmt1(r.su), `${fmt(i.n)} firma × %${fmt1(i.base+i.uplift)}`)
      + kpi("Beklenen ciro", tl(r.srev), `${fmt1(r.su)} × ${fmt(i.value)} ₺`)
      + kpi("Kampanya maliyeti", unk?"bilinmiyor":tl(r.cost), unk?"hediyenin firma başı maliyeti girilmedi":`${fmt1(r.su)} × ${fmt(i.cost)} ₺ (hediyeyi alan herkes)`)
      + `</div></div>`
    + `<div class="frow"><h4>3 · Fark: senaryo − güncel</h4><div class="kpis">`
      + kpi(`Ek ${U}`, "+"+fmt1(r.extra), `${fmt(i.n)} firma × ${fmt1(i.uplift)} puan`, "accent")
      + kpi("Ek ciro", tl(r.extraRev), `ek ${U} × ${fmt(i.value)} ₺`)
      + kpi("Net katkı", tl(r.net), unk?"maliyet düşülmedi":"ek ciro − kampanya maliyeti", r.net>=0?"pos":"neg")
      + kpi("Başa baş etki", (r.be==null||!r.cost)?"–":bePuan(r.be), r.cost?"bu kadar artış maliyeti karşılar":"maliyet girilmedi")
      + kpi("Boşa giden hediye", unk?"bilinmiyor":tl(r.waste), unk?`${fmt1(r.bu)} hediye zaten yapacak olana gider`:"zaten yapacak olanlara verilen")
      + `</div></div>`
    + `<p class="note">Hediye, kampanya döneminde işlemi yapan herkese verilir; bu yüzden zaten yapacak olanlara verilen pay ayrı gösterilir. Tahsilat, erken ödeme ve sonraki yıl yenileme etkisi bu hesapta yok.</p>`;
  inp.querySelectorAll("input").forEach(x=>x.onchange=()=>{ const all=lsGet("np_k_fc")||{}; all[cur.id]=Object.assign({}, fcInputs(cur), {[x.dataset.k]: +x.value}); lsSet("np_k_fc", all); render(); });
  inp.querySelector("#fcReset").onclick=()=>{ const all=lsGet("np_k_fc")||{}; delete all[cur.id]; lsSet("np_k_fc", all); render(); };
}

/* ---------- Yeni kampanya üret (local: copies the request for the Claude chat) ---------- */
const EXAMPLES = [
  "Son 6 ayda ziyaret edip satamadığımız firmalara odaklan; onları aldıracak bir kampanya.",
  "En çok yenileyen kategoriye ve paket yükseltmeye odaklan.",
  "Ödeyen firma sayısı azalan kategorilere odaklan.",
  "İlk yenilemesine gelen firmalara odaklan."
];
function genBox(host){
  const g=el("div","gen");
  g.innerHTML=`<h3>Ne üzerine kampanya istiyorsun?</h3>
    <div class="row2"><span class="eyebrow">Takım</span><select id="genTeam" aria-label="Takım"><option>SAS</option><option>MoS</option><option>TES</option></select><span class="eyebrow">Tür</span><select id="genKind" aria-label="Tür"><option value="yeni">Yeni satış</option><option value="yenileme">Yenileme</option></select><span class="eyebrow">Ay</span><span class="chip">${esc(ymLabel(K.month))}</span></div>
    <textarea id="genBrief" placeholder="Örnek: Son 6 ayda ziyaret edip satamadığımız firmalara odaklanmak istiyorum; onları aldıracak bir kampanya."></textarea>
    <div class="ex" id="genEx"></div>
    <div class="row2"><button class="btn" type="button" id="genGo">İsteği kopyala</button><button class="ghost" type="button" id="genClose">Kapat</button><span class="status" id="genStatus">Kopyala, Claude sohbetine yapıştır: kampanya campaigns/${esc(K.month)}.json dosyasına eklenir ve burada görünür.</span></div>`;
  host.appendChild(g);
  const syncKind=()=>{ const mos=g.querySelector("#genTeam").value==="MoS"; const o=g.querySelector('#genKind option[value="yenileme"]'); o.disabled=mos; o.textContent=mos?"Yenileme (MoS yapmaz)":"Yenileme"; if(mos) g.querySelector("#genKind").value="yeni"; };
  if(K.teams&&K.teams.length===1) g.querySelector("#genTeam").value=K.teams[0]; if(K.kinds&&K.kinds.length===1) g.querySelector("#genKind").value=K.kinds[0]; syncKind();
  g.querySelector("#genTeam").onchange=syncKind;
  EXAMPLES.forEach(t=>{ const b=el("button"); b.type="button"; b.textContent=t; b.onclick=()=>{ g.querySelector("#genBrief").value=t; }; g.querySelector("#genEx").appendChild(b); });
  g.querySelector("#genClose").onclick=()=>{ K.gen=false; render(); };
  g.querySelector("#genGo").onclick=()=>{
    const brief=g.querySelector("#genBrief").value.trim(); const st=g.querySelector("#genStatus");
    if(!brief){ st.className="status err"; st.textContent="Önce ne istediğini yaz."; return; }
    st.className="status";
    copy(`Kampanya Stüdyosu için yeni kampanya üret ve campaigns/${K.month}.json dosyasına ekle.\nTakım: ${g.querySelector("#genTeam").value} · Tür: ${KIND[g.querySelector("#genKind").value]} · Ay: ${ymLabel(K.month)}\nİstek: ${brief}`, "İstek kopyalandı; Claude sohbetine yapıştır");
  };
}

/* ---------- section ---------- */
function renderCampaign(v){
  if(!K.month || !DATA.months[K.month]) K.month = months()[0] || null;
  if(K.cities===undefined){ const main=(cityGroups()[0]||[])[1]; K.cities = main ? main.slice() : null; try{ if(localStorage.getItem("np_k_cities")!==null) K.cities=lsGet("np_k_cities"); if(localStorage.getItem("np_k_cats")!==null) K.cats=lsGet("np_k_cats"); }catch(e){} }
  const A=DATA.analyses||{}; const n=campaigns().length;
  const hero=el("section","hero");
  hero.innerHTML=`<p class="eyebrow">Kampanya stüdyosu</p><h1>${K.month?esc(ymLabel(K.month)):""} kampanyaları</h1><p class="sub">${n} öneri · SAS, MoS ve TES × yeni satış ve yenileme${A.last_closed_month?` · veri: son kapanan ay ${esc(ymLabel(A.last_closed_month))}`:""}${D.campaigns.analyses_updated?` · ${esc(fdate(D.campaigns.analyses_updated))} tarihinde güncellendi`:""}.</p>`;
  v.appendChild(hero);
  if(!K.month){ v.appendChild(el("div","empty","Kampanya verisi yok.")); return; }
  const tb=el("div","toolbar");
  const seg=el("div","ptabs"); seg.setAttribute("role","tablist");
  [["kampanya","Öneriler"],["analiz","Analizler"],["forecast","Forecast"],["kararlar","Kararlar"]].forEach(([id,l])=>{ const n=id==="kararlar"?decisionsCount():0; const b=el("button",null,l+(n?` <span class="cnt">${n}</span>`:"")); b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected", String(K.view===id)); b.onclick=()=>{ K.view=id; K.drop=null; lsSet("np_k_view",id); render(); }; seg.appendChild(b); });
  tb.appendChild(seg); tb.appendChild(el("span","sp"));
  const gb=el("button","btn", ic("spark")+"Yeni kampanya üret"); gb.type="button"; gb.onclick=()=>{ K.gen=!K.gen; render(); }; tb.appendChild(gb);
  v.appendChild(tb);
  if(K.gen) genBox(v);
  const host=el("div","stack"); host.style.gap="16px"; v.appendChild(host);
  if(K.view==="kararlar") renderKararlar(host);
  else if(K.view==="analiz") renderAnaliz(host);
  else if(K.view==="forecast") renderForecast(host);
  else renderKampanya(host);
}
document.addEventListener("click", ()=>{ if(K.drop){ K.drop=null; render(); } });
