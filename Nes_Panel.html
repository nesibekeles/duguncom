sil", "pin": true, "title": "Aylık hedef analizi — \"2026_İlk N Ay analiz\" dosyası", "tldr": "Her ay başında Sales Team hedef/ciro tablosu ve yeni FTS ile önceki ayın dosyası kopyalanıp güncellenir; çıktı Excel + Hedefler sayfası verisi.", "body": "**Tetikleyici (Nes 19.11.2026):** zamanlanmış görev yok. Nes iki dosyayı klasöre koyar ve \"new month files are in\" der.\n**Girdiler:** (1) Sales Team tablosu: geçen ayın Hedef + Ciro, yeni ayın Hedef (`Sales Team Targets.xlsx`); (2) yeni tüm yıl FTS (`New Month FTS_<Ay YYYY> (For -İlk N Ay-).xlsx`, sayfalar SAS 2026 / TES 2026); (3) renewal sheet › Customer Bazında Yenileme Tablosu.\n**Dosya:** `2026_İlk <N> Ay analiz_FTS_<GG.MM.YYYY>.xlsx` (N = kapanan ay sayısı). Örnek: İlk 10 Ay = 16.11.2026.\n**Adımlar** (`1 Renewals/New Sales & Renewal Targets-Monthly/PROJECT.md`):\n- Önceki dosyayı yeni isme **kopyala**, kopyayı düzenle; Excel üzerinden (PowerShell COM) düzenle ki pivotlar bozulmasın; önce yedek al.\n- **Aylık Satış Hedef Tabloları:** M ayının Ciro'su; M+1 için yeni blok (Hedef). Takımları isimle eşleştir, sıra her ay değişir.\n- **New Sale Target:** satır 2 = SAS-Yeni + TES-Yeni + MoS-Yeni Hedef; satır 6 = aynı üç takımın Ciro'su.\n- **Satış Kapanış + Hedefler:** her tabloya M satırı, TOPLAM SUM'larını genişlet. K–N (YILLIK): Customer Bazında ham tablosundan, `Yenileme mi?` = Yenileme, 01.01.2026'dan rapor ayına kadar; L = Σ Yenilemeye Gelen Toplam Fiyat × 12, M = Σ Yenilenen Toplam Fiyat × 12. **Her zaman × 12** (Nes 23.11.2026; pivot değil ham tablo — pivot Pro Start 3'ü dışarıda bırakıyordu).\n- **sas 2026:** FTS SAS 2026'ya Ekip (WINNER/WELCOME/POWER/PRO/TURBO), X Count (2X→2 … WELLCOME→2, POWER/PRO→3, TURBO→1), Süre (\" AY\" sil), Aylık Tutar = Net/Süre, X Value = Aylık/X ekle; INFLUENCER DOPİNGİ satırlarını sil. Boş Paket → önceki dosyadan (Provider ID + Sözleşme Tarihi + Net Tutar); bulunamazsa Nes'e sor, paket uydurma.\n- **tes 2026:** REVİD → YENİ; P sütunu \"Aylık Tutar\" = N/12.\n- Pivotların kaynağını yeni son satıra çek, \"silinen öğeler\" = None, hepsini yenile (FIND kalmasın). X Value Kıyas: iki yılda da M ayı seçili olmalı.\n- Sonra `build_dashboard_data.py \"<yeni dosya>\" \"9 Monthly Campaigns/data/hedef\"` → Kampanya Stüdyosu Hedef Takip ve Nes Panel › Hedefler.\n**Çıktı:** Excel + Nes'e sadece kontrol etmesi gerekenlerin kısa listesi. Ayrı panel/artifact yok (Nes 20.11.2026).", "tags": ["hedef", "FTS", "İlk N Ay", "aylık", "pivot"], "source": "1 Renewals/New Sales & Renewal Targets-Monthly/PROJECT.md; CLAUDE.md", "links": [{"label": "Renewal sheet › Customer Bazında Yenileme Tablosu", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=1812420873"}], "updated": "2026-11-23"}, {"id": "la-7", "cat": "Aylık rutin işler", "kind": "kural", "pin": false, "title": "Upsell Stüdyosu: aylık liste yenileme ve veri tarihi kuralı", "tldr": "Upsell listesi her ayın 1'inde cron ile (--refresh) yeni veri tarihine geçer; başka hiçbir revizyon veri tarihini değiştiremez.", "body": "**Veri tarihi kuralı (Nes 20.10.2026):** veri tarihi listede kimin olduğunu belirler (yenileme dönemleri ondan sayılır). Yeni liste veya yeni fiyat işi değilse hiçbir upsell revizyonu canlı build'in veri tarihini değiştiremez.\n- `python -m d_one.upsell build` → **aktif build'in veri tarihinde** yeniden kurar (liste aynı kalır).\n- Sadece `--refresh` (ayın 1'indeki cron) veya `--asof` tarihi taşır.\n- \"Deploy sonrası build\" her zaman `--refresh` OLMADAN demektir. Her D-One upsell PR'ı Veri bölümünde veri tarihinin değişip değişmediğini yazar.\n- Neden: Ekim deploy'larında her build en yeni günü aldı; müşteri 6885 toplantıdan iki gün önce \"Bu ayın upsell listesi\"nden düştü, satışçı sayfasını açamadı.\n**Satış ayı:** listeler satış takvimine göre döner; Aralık 2026 satış ayı **07.12.2026**'da başlar (gece işi o gün starter firmalı ilk listeyi verir).\n**Bir hafta kuralı** (PR #512, 13.11.2026): ücretli ürünü veri tarihinden en fazla 7 gün önce bitmiş sayfa build'de kalır — yenilemeyecek kayıp firmalar da (Nes 19.11.2026: \"thats the point\").\n**Üç liste (satış ekibine 19.10.2026 maili):** (1) Bu ayın upsell listesi — direkt randevu, önerilen sepetle satış; (2) Upsell'e uygun yenilemeler — Özgür Bey onayıyla; (3) Uygun olmayan — \"Neden\" sütununda sebep; satışçı gerekçeyle ekleme talep edebilir.\n**Kural kaynağı:** canlı kurallar D-One'ındır: GitHub `main` › `docs/modules/upsell.md` ve `engine/`. Yerel `2 Upsell/Upsell/PROJECT.md` farklıysa main kazanır.", "tags": ["Upsell Stüdyosu", "D-One", "veri tarihi", "cron"], "source": "2 Upsell/Upsell/CLAUDE.md (SCOPE); PROJECT.md §81; Ekim + Kasım 2026 Satış Kampanyaları - SAS.msg", "links": [{"label": "D-One › Upsell Stüdyosu", "url": "https://d-one.dugun.work/satis/upsell/#liste:unfit"}], "updated": "2026-11-24"}, {"id": "la-8", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": false, "title": "Winner yenileme: indirim tablosu ve minimum artış (Eylül 2026'dan beri)", "tldr": "Winner yenilemesinde son ödenen fiyata göre min. artış: aylık→yıllık +%30, aylık kalırsa +%45, yıllık→yıllık +%40; indirimler Winner listesinden, plan tipine göre.", "body": "**Minimum artış (son ödenen fiyat üzerinden, 16.09.2026 SAS maili; 19.10.2026 Ekim+Kasım mailinde aynen devam):**\n- Aylık açık hesap → **yıllık plan**: **+%30**\n- **Aylık açık hesapta kalırsa**: **+%45**\n- Zaten yıllık, yıllık kalırsa: **+%40** (mailde yok; Nes 17.09.2026 onayı — standart ≥ 1,4 × kuralı)\n- İstisna: Pro Start 3 ve ≤ 3 aylık ürünler (+%40 kuralı yok).\n**İndirim (güncel Winner listesinden):**\n- Yıllık plan: vaktinde klasik %30 · upsell %35 · downsell %20; erken yenileme +10 puan (%40 / %45 / %30).\n- Aylık açık hesap: vaktinde klasik %20 · upsell %25 · downsell %10; erken +10 puan (%30 / %35 / %20).\n- Senet: son verilen indirimden 5 puan eksik. Özgür Bey tüm indirimlere +%5 ekleyebilir.\n- Yıllık plan ödeme: KK vade farksız 3-6-12, KK tek çekim, çek, **senet**, havale.\n**Önceki kural (Ağustos 2026 maili, 03.08.2026):** tek tablo — klasik %25 (erken %35), upsell %30 (%40), downsell %15 (%25); min artış genel +%40. Eylül'de yıllık 5 puan iyileşti, aylık 5 puan kötüleşti, +30/+45 çifti geldi.\n**Öneri olarak kalanlar (politika değil):** tahsilat skoruna göre aylık %45–60 bandı, çek +%35 / KK-12 +%40 kademeleri (`Ekim_Ocak_Yenileme_SAS_Kampanya/`).", "tags": ["Winner", "yenileme", "indirim", "SAS", "min artış"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §3a; Eylül / Ekim+Kasım 2026 SAS kampanya mailleri (.msg)", "links": [], "updated": "2026-10-19"}, {"id": "la-9", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": false, "title": "Welcome Paketi: yeni satış kuralları", "tldr": "Her yeni mekan satışı Welcome Paketi'dir: 12 ay, sadece peşin, sabit satış fiyatı (CRM indirim kodu), ek kategori %20, başka kampanya eklenmez.", "body": "**Kapsam:** \"Hiç üye olmamış veya son ürünü ≥ 6 ay önce bitmiş\" firma (08.09.2026'dan beri; lansmanda \"2026 öncesi bitmiş\" idi).\n**Kim satar:** MoS (İstanbul, Ankara, İzmir, Bursa + alt bölgeleri) · SAS (Adana, Mersin, Antalya + Gaziantep, Hatay, Muğla, Denizli) · TES (\"New Cities\" mekanları, kod TESWELCOME).\n**Kurallar:**\n- Sabit satış fiyatı karttan (kategori grubu × bölge); ek kategori %20 indirim; **başka kampanya eklenmez** (referans, churn ek indirimi vb.).\n- 12 aylık ürün, **sadece yıllık peşin**, tek seferlik (yenilemede tekrar teklif edilemez; Winner'a yenilenir).\n- Ödeme: KK vade farksız 3-6-12 (12 taksit Eylül kampanyasıyla eklendi), çek (60-90-120-150, başlangıç ≤ 120), havale. **Senet yok.**\n- After Party her bölgede Kına-Söz Nişan grubu fiyatıyla (Uydu İller dahil, Nes 06.11.2026).\n- Taşra ilçe: bölgenin \"Uydu (Taşra) İlçe Satış Fiyatı\" sütunu.\n- **İndirim kodları** (\"2\"liler taşra için): ISTWELCOME/ISTWELCOME2 · ANKAWELCOME/ANKAWELCOME2 · BURWELCOME/BURWELCOME2 · IZMWELCOME/IZMWELCOME2 · AMAWELCOME/AMAWELCOME2 (Adana, Mersin, Antalya) · UYDUWELCOME · TESWELCOME.\n- Garantili satış: garanti sözleşmesi imzalayan firma 12 ayda iş alamazsa 1 yıl ücretsiz yayın.\n**Satış fiyatı örneği (İstanbul, Kır-Tarihi / Balo-Otel / Düğün Salonu / küçük grup):** 19.900 / 18.500 / 16.300 / 13.500 ₺/ay; taşra 15.900 / 14.900 / 12.900 / 10.900. Kesin rakam için güncel kartı aç.\n**Kaynak mail:** `RE_ Yeni Bir Ürünümüz Var_ Welcome Paketi!.msg` (lansman 07.09.2026 + 08.09.2026 cevabı) Welcome ve MoS için kural setidir.\n**Bilinen eksik:** Welcome one-pager PDF'leri hâlâ \"Kredi Kartı (1–6 Taksit)\" yazıyor.", "tags": ["Welcome", "yeni satış", "MoS", "indirim kodu"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §2–§3a", "links": [], "updated": "2026-11-06"}, {"id": "la-10", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": false, "title": "Plus (TES) fiyatları ve KDV / tevkifat kuralı", "tldr": "Plus listesi her il × kategori için 14.850 ₺/ay + KDV; yeni satış 9.900 sadece yıllık, yenileme yıllık 6.000 / aylık açık hesap 9.900; KDV peşinde %14 (tevkifatlı), aylıkta %20.", "body": "**Fiyatlar (Eylül 2026'dan beri, Haziran kartında liste 7.500 idi):**\n- Liste: 14.850 ₺/ay + KDV (178.200 ₺/yıl), 36 il × 11 non-venue kategori, tek fiyat.\n- Yeni satış: **9.900 + KDV, sadece yıllık** (yeni satışta aylık açık hesap yok).\n- Yenileme: yıllık ödemede **6.000 + KDV** · aylık açık hesapta **9.900 + KDV**.\n- Kodlar: `TES9900YILLIK%14` (yeni satış) · `TES6000YILLIK%14` (yıllık yenileme) · `TES9900AYLIK%20` (açık hesap yenileme). %14 / %20 = KDV oranı.\n- TES saha kolu (İstanbul, Big 5) aynı Plus ürününü aynı fiyata satar.\n**KDV:** non-venue (Plus) peşinde tevkifatlı %14, aylık açık hesapta %20.\n**Geçici tevkifat kuralı (Nes 06.11.2026, IT CRM'i düzeltene kadar):** 12.000 TL üstü faturalar tevkifatlı (Temmuz 2026 mevzuatı). CRM sadece aylık tutara bakıyor; her vade ayrı fatura. Aylık tutarı limit altında ama yıllık peşin satılan TES sözleşmesinde kod oranı = 1 − ((aylık × 1,14) / 1,2) / liste; kodun satış fiyatı = kod fiyatı × 1,2 / 1,14 (9.405 → 9.900, 5.700 → 6.000).\n**Karşılaştırma tuzağı:** FTS Net Tutar KDV hariç, renewal sheet ve Finance KDV dahil (86.400/12 = 7.200) → TES tutarlarında × 1,2 farkı normal.\n**Kontenjan:** il × kategori başına `maxItemCount` Nes'in \"Plus Pricing\" Google Sheet'inde (İstanbul Gelin Saçı 60 … Davetiye 8; diğer iller 5–15). CRM girişleri 04.09.2026 – 05.01.2027 geçerli; 384 satır 28 CRM girişine toplandı.", "tags": ["Plus", "TES", "KDV", "tevkifat", "kontenjan"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §1, §3, §3b; 3 Pricing/Plus_Pricing_CRM_Girisi/PROJECT.md", "links": [{"label": "Plus Pricing (Google Sheet)", "url": "https://docs.google.com/spreadsheets/d/1QOXTqfg_hr2nX22FpsPWy-cPnOTfKX2ltbuuHxpjt3U/edit?usp=sharing"}], "updated": "2026-11-06"}, {"id": "la-11", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": false, "title": "Sabit satış fiyatları = CRM indirim kodları", "tldr": "Welcome, Plus, Pro Start ve Power Start'ın satış fiyatı CRM indirim koduyla verilir; satış fiyatı = aylık liste × (1 − oran), en yakın tam ₺'ye yuvarlanır; kodu olmayan hücre liste fiyatını gösterir.", "body": "**Kural (Nes 06.11.2026):**\n- Kod listesi: `ALL DISCOUNT CODES FOR STATIC SALES PRICES.docx` (`3 Pricing/Düğüncom_subscription_models/`); her ayın kampanya sayfasında › Genel › İndirim kodları.\n- Satış fiyatı / ay = aylık liste × (1 − oran), **normal yuvarlama** (aşağı yuvarlama Power Start ve Welcome'da 1 ₺ eksik bırakıyordu).\n- Kodu olmayan hücre = liste fiyatı. Pro Start taşra ve Uydu İller fiyatlarının kodu yok.\n- CRM tabloları (Barış): `product_discounts`, `product_discount_cities`, `product_discount_categories`.\n- Çakışma: aynı ürün × il × kategori × taşra × ay × seçeneğe birden çok kod uyarsa en son başlangıç tarihli kazanır, eşitse en son oluşturulan; adminlere uyarı. Geçmiş kodlar özel durumlar için açık bırakılmış olabilir, hata değildir.\n- Fiyat değişince yeni kod açılır, eskisine gerçek bitiş tarihi girilir. D-One'da kod listesi repoda; yeni kod = PR.\n- Power Start'ta 9 kod (POWERIST100 vb.) kartın 1 ₺/ay altında kalıyor; CRM oranı değiştirilemiyor, öyle kaldı (Power Start satılmıyor).\n- Kontrol dosyası: `İndirim Kodları - Satış Fiyatı Kontrolü_06.11.2026.xlsx` (Welcome SAS/MoS ve Pro Start şehir satırları eşleşiyor).\n- Ağustos 2026'ya kadar Winner peşin satış kodları: PESIN10 … PESIN40.", "tags": ["indirim kodu", "CRM", "satış fiyatı", "Welcome", "Plus"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §3", "links": [], "updated": "2026-11-06"}, {"id": "la-12", "cat": "Fiyat & Kampanya", "kind": "bilgi", "pin": false, "title": "Eski fiyat kartları: hangi dönem hangi dosyada, Pro Start zaman çizelgesi", "tldr": "Bugünün fiyatı dosya 1; Eylül teklifleri 2.1; Eylül öncesi 2.2; daha eskisi dosya 3. Mevcut paketler sözleşme tarihindeki kartla değerlendirilir.", "body": "**Dosyalar** (`3 Pricing/Düğüncom_subscription_models/`, sıra önemli; güncel kartı adındaki tarihe göre seç, metin sıralamasına göre değil):\n- **1** `1. All Current Rate Cards_6.10.2026.xlsx` = Ekim 2026 kartı (Winner = Eylül × 1,10; Welcome, TES, City-Team, Uydu(Taşra) İlçeler, `Pro Start 3_SAS Renewal`).\n- **2.1** Eylül 2026 kartı (16.09.2026, +%10 öncesi).\n- **2.2** Temmuz 2026 öncesi: Haziran 2026 Winner + Power Start, MoS Pro Start sayfaları (taşra dahil), TES Haziran.\n- **3** Ocak 2024 – Haziran 2026 tüm Winner / Power Start kartları + `Pro Start-İstanbul` (Nisan 2026).\n**Satın alma tarihindeki liste (Nes 24.09.2026):** firmanın mevcut paketinin indirimi **sözleşme tarihindeki** karta göre hesaplanır (56837 Mayıs'ta imzaladı, ürünü Haziran'da başladı → Mayıs kartı). İstisna: yenilemesi 90 gün içinde olan firma bugünkü kartla.\n**Pro Start zaman çizelgesi (Nes 06.11.2026):**\n- 04/2026: sadece İstanbul (CRM 06.04.2026'dan): liste Kır-Tarihi 55.000 · Balo-Otel 50.000 · DS 45.000 · küçük grup 35.000; aylık = liste × 0,75 / 0,65 / 0,55 (Pro 3 / 6 / 12), peşin ek %20, ek kategori %30.\n- 06/2026: Ankara + Bursa eklendi (CRM 15.06.2026), İstanbul fiyatı değişmedi.\n- 07/2026: İstanbul yeni fiyat (CRM 07.07.2026: Kır 60.500, küçük grup 38.500).\n- 09/2026: Welcome ile değişti (CRM satırları 08.09.2026'da bitti).\n- Balıkesir ve Samsun Haziran–Ağustos 2026'da TES iliydi.\n**Kapanan ürünler:** Power Start (Haziran 2026'da İst/Ank/Bursa, Eylül'de her yerde), Winner 3X (6 aylık Uydu), Turbo (3 aylık booster; fiyatı firmanın kendi aylık ödemesiydi).\n**Yeni kart D-One'a nasıl gelir:** D-One artık Excel okumaz (05.11.2026); CRM liste fiyatlarını (`dw_product_list_price`) okur. Yeni kart CRM'e girilince D-One'a gelir.", "tags": ["fiyat kartı", "rate card", "Pro Start", "tarihçe"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §0, §2; CLAUDE.md; 2 Upsell/Upsell/notes/purchase-date-list-price.md", "links": [], "updated": "2026-11-06"}, {"id": "la-13", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": false, "title": "Ödeme yöntemleri ve vade farkı (tüm ekipler)", "tldr": "KK 3-6-12 taksit vade farksız (12 taksit Eylül 2026'dan beri); çek 4 aya kadar %0, 5–6 ay %15, en fazla 6 ay; 60-90-120-150 gün 4 eşit çek %0.", "body": "- **KK 3-6-12 taksit: %0 vade farkı.** 12 taksit Eylül 2026 kampanyasıyla vade farksız oldu (Ağustos'ta 12 taksit +%15 idi).\n- KK tek çekim, havale: her yerde.\n- **Çek:** 4 aya kadar %0 · 5 veya 6 ay **+%15** · en fazla 6 ay vadeli · 4 eşit parça 60-90-120-150 gün = %0. Welcome / Pro 3 yenilemelerinde çek başlangıcı ≤ 120 gün.\n- **Senet:** sadece Winner yenilemelerinde (son indirimden −5 puan). Welcome ve Pro Start 3 yenilemelerinde **senet yok**, Pro 3'te açık hesap da yok.\n- Aylık açık hesap tahsilatı ≈ %86 (son 12 ay, iptaller kayıp sayılınca) — Claude analizi, politika değil.\n- Senet/çek/havale statüleri Finance app'te güncellenmez; tahsilat analizinde güvenilir olan sadece aylık KK.", "tags": ["ödeme", "taksit", "çek", "senet", "vade farkı"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §3c; SAS kampanya mailleri", "links": [], "updated": "2026-10-19"}, {"id": "la-14", "cat": "Fiyat & Kampanya", "kind": "kural", "pin": true, "title": "Upsell Stüdyosu sepet kuralları (D-One, güncel)", "tldr": "Sepet = en az 2 ücretli ana kategori + 1 hediye; ana kategori sadece Kır, Düğün Salonları, Balo, Otel, Tarihi; Söz Nişan 11.11.2026'dan beri ana sayılmaz.", "body": "**Sepet (Nes 11.11.2026, PR #489, 12.11.2026 merge):** min **2 ücretli ana kategori + 1 hediye**. Ana kategori = Kır, Düğün Salonları, Balo, Otel, Tarihi. Önceki kural (20/10–11.11.2026): ücretli Söz Nişan ikinci ana sayılıyordu → **emekli**. Nikah Salonları hiç ana sayılmaz. 2 ana kategoriye ulaşamayan firma listeden çıkar (\"İkinci ana kategori yok\"); admin elle ekleyebilir. Daha küçük işler (ör. sadece Söz Nişan 2X → 4X) stüdyoyla değil, normal upsell indirimiyle yapılır.\n**Hediye:** her zaman 2X. Önce firmanın kendi Kına / NSY / After Party / Sosyal / Tekne sayfası, sonra kendi Söz Nişan sayfası; 6X sayfa hediye olmaz. Yeni hediye sırası: Söz Nişan → Kına → NSY → After Party; sepetin ödediği kategoriden asla.\n**Ek kategori kapasitesi (19.10.2026):** aynı mekânda — DS / Balo için kapalı alan ≥ 200 kişi, Kır için açık alan ≥ 200.\n**Fiyat kuralları:**\n- Artış tabanı: sepet ≥ max(arka plan ödeme × 1,20, + 9.900 ₺).\n- Yenileme dönemi gelen (90 gün içinde biten) **ürün** × 1,4 (firma değil, ürün bazında; 15.10.2026). 90–270 ödenmiş gün: arka planda kademeli artış (+%10 … +%26,7), müşteriye gösterilmez.\n- **Müşteriye asla %40 / × 1,4 gösterilmez**; sadece \"Yenilemede aylık ödemeniz …\".\n- Avantaj: güncel kampanyaya (liste × (1 − karşılaştırma indirimi)) göre en az %20 / %18 / %15 ucuz (kendi indirimi ≤40 / 40–50 / >50). Karşılaştırma indirimi = min(%55, max(%40, kendi)) (55 tavanı 23.11.2026).\n- Fiyat ızgarası …4.900 / …9.900; her paket adımı en az +5.000; önerilen sepetler ≥ 10.000 arayla. Bölge tabanı: İst/Ank 49.900, İzm/Bursa 39.900, diğer 29.900.\n- Güncel Kampanya kartında değişmeyen sayfa bugünkü ödemesiyle, indirim yazmadan gösterilir.\n- Taşra sayfası Uydu listesinin üstünde ödüyorsa şehir kartı kullanılır.\n**Starter ürünler (Nes 23–24.11.2026, PR #602 Barış'ta):** Welcome, Pro Start 3/6/12, Power Start Aralık 2026 satış ayından (07.12.2026) itibaren dahil; ana kategorideki starter sayfa Winner 2X sayılır; karşılaştırma indirimi sabit %40, min avantaj %17; 0 ₺ Welcome sayfası varsayılan hediye. Sepetlerde sadece Winner ürünleri.\n**Kaynak önceliği:** GitHub `main` › `docs/modules/upsell.md`; yerel PROJECT.md §0 ve §69+.", "tags": ["Upsell Stüdyosu", "D-One", "sepet", "hediye", "ana kategori"], "source": "2 Upsell/Upsell/PROJECT.md §71–§81; CLAUDE.md", "links": [{"label": "D-One › Upsell Stüdyosu", "url": "https://d-one.dugun.work/satis/upsell/#liste:unfit"}, {"label": "PR duguncom/d-one#489 (ana kategori kuralı)", "url": "https://github.com/duguncom/d-one/pull/489"}, {"label": "PR duguncom/d-one#602 (starter ürünler)", "url": "https://github.com/duguncom/d-one/pull/602"}], "updated": "2026-11-24"}, {"id": "la-15", "cat": "Fiyat & Kampanya", "kind": "nasil", "pin": false, "title": "Liste dışı firmalara elle bundle PDF'i", "tldr": "Stüdyo listesinde olmayan firmalar (ör. Power Start'tan Winner'a geçen, yeni satış) için `make_bundle_pdf.py` ile bundle fiyat PDF'i hazırlanır; Nes'in satır ve başlangıç kurallarına uyulur.", "body": "**Ne zaman:** satışçı liste dışı bir firma için paket fiyatı isteyince. Örnekler: Dadya 22/10, Uzunlar 27/10, Aşiyan Artemis 06/11, Grand Makel 10/11, Mira Wedding 16/11, Majör Garden 23/11, Urla Sahne 24.11.2026 (`2 Upsell/Upsell/` içindeki PDF'ler).\n**Nasıl:**\n- Stüdyo motoruyla fiyatla (Python 3.12, numpy gerekli): `build.read_csv` / `load_overrides` sarmala, `options_for` + `custom_catalogue`. Aynı kategori iki kez → sayfa kopyası, değeri 0.\n- `tools/make_bundle_pdf.py` CONFIG bloğunu düzenle (liste fiyatları, hediye, seçenekler), çalıştır → `<Firma> <tag> Bundle Fiyatları_<GG.AA.YYYY>.pdf`. `manual_overrides.csv` veya D-One'a yazılmaz.\n**Kurallar:**\n- **Başlangıç noktası (Nes 23.11.2026):** bugün ücretli sayfa kendi X'inden başlar; bugün ödenmeyen kategori 0X'ten (ilk adım 2X). Starter sayfa Winner 2X okunur.\n- **Yenileme tabanı (Nes 10.11.2026):** yenileme firması bundle olmasa da en az bugünkü × 1,4 öder; elle fiyatlanan bundle bunun altına inmez (Grand Makel 69.900 yanlış → 99.900).\n- **Satır kuralı (Nes 24.11.2026, her PDF):** bundle büyüdükçe aynı ürün (aynı kategori ve X) büyük kartta daha ucuz (imkânsızsa eşit) satılır; kart toplamı değişmez, fark diğer satıra gider; kesik tutarlar yuvarlak olmaz. Satır dağılımı başlangıçta liste payı.\n- Nes'in sabitlediği tutarlar asla yüze yuvarlanmaz.\n- **Hediye her zaman 2X**, sormaya gerek yok (24.11.2026).\n- **Yeni satış bundle'ı (Urla Sahne, 24.11.2026):** motor kullanılmaz. Liste = Uydu İller (taşra); kampanya = ücretli sayfaların listesi × 0,60; bundle ≤ kampanya × 0,85; …4.900 / …9.900 ızgarasına aşağı yuvarla.\n- Izgara: motorun atladığı kombinasyon, üstündeki en ucuz sepetten bir 5.000 adım aşağı.", "tags": ["bundle", "PDF", "upsell", "elle fiyat"], "source": "2 Upsell/Upsell/CLAUDE.md (Bundle PDFs)", "links": [], "updated": "2026-11-24"}, {"id": "la-16", "cat": "Fiyat & Kampanya", "kind": "bilgi", "pin": false, "title": "Kasım 2026 Welcome kampanyası: aylık ödeme riski analizi", "tldr": "Welcome'ı aylık ödemeyle aynı fiyata satmak çok riskli: aylık yeni satış 1 ₺'ye 0,53–0,64 ₺ değer, peşin ≈ 0,8–1,0; +1 ay bedava veya 3 ay hediye kategori çok daha ucuz.", "body": "**Soru (Nes 30.10.2026):** Welcome zaten indirimli; Kasım kampanyası için seçenekler: (1) 3 ay hediye kategori (Söz-Nişan grubu), (2) +1 ay bedava (12 öde 13 kullan), (3) aylık ödeme.\n**Yöntem:** Finance app'ten gerçek aylık yeni satışların tahsilatı, iptali (decay), açık borcu ve NPV'si (TÜFE %31,51 / politika faizi %37).\n**Sonuç (30.10.2026):** aylık yeni satışta tahsil edilen % — Pro Start 72,9 · tüm mekan 74,3 · Plus 63,3; iptal 9,9 / 15,8 / 26,7 %. NPV faktörü 0,54 / 0,64 / 0,53. Aynı fiyatla aylık, +%25–50 ek indirim demek.\n**Simülatör (05.11.2026):** `3 Pricing/Campaign_Pricing_Q4_2026/Kasım Kampanya Simülasyonu_05.11.2026.html`. Varsayılan Kasım (52 satış, 195.000 ₺, %46 aylık): aylık −3,19 M ₺ (yenilemeyle), başabaş için +%23 ek satış; +1 ay −0,58 M ₺; hediye −0,50 M ₺.\n**Karar:** aylık ancak ≥ +%25–50 aylık primle savunulabilir (yenileme kuralındaki aylık +%45 gibi).", "tags": ["Welcome", "kampanya", "aylık ödeme", "risk", "NPV"], "source": "3 Pricing/Campaign_Pricing_Q4_2026/notes/welcome-kasim-aylik-odeme-riski.md", "links": [], "updated": "2026-11-05"}, {"id": "la-17", "cat": "Fiyat & Kampanya", "kind": "bilgi", "pin": false, "title": "Yenileme kampanyası: tahsilat skoru ve peşine geçiş simülasyonu (Ekim 2026–Ocak 2027)", "tldr": "Aylık firmaları peşine çekmek için +%30 peşin teklifi reel olarak +%4,9 kazandırır (başabaş +%15); ama yenileme oranı 5 puan düşerse kazanç silinir.", "body": "**Ne:** Özlem Hanım'ın Ekim 2026 – Ocak 2027 SAS yenileme listesine (850 satır) liste fiyatı eklendi, sonra aylık firmalar için müşteri bazında tahsilat skoru ve peşin/aylık artış simülasyonu yapıldı (14.09.2026).\n**Kurallar:** skor sadece mevcut sözleşmesi aylık olan firmalara, listedeki sözleşmenin aylık KK vadelerinden (gecikme %40 + ödenmeyen %60). Yıllık firmalar sabit +%40. Bant: aylık artış %45–60 (5 puan adım). İskonto TÜFE %31,51 (Ağustos 2026) / politika faizi %37.\n**Bulgular:** +%30 peşin, %50 geçiş → NPV +7,2 M ₺ (+%4,9); başabaş peşin artışı +%15; −5 puan yenileme etkisi kazancı siler, −10 puan 8 M ₺ kaybettirir. Liste bağlantısı / hedef: Ekim %85 · Kasım %96 · Aralık %92 · Ocak %88.\n**Politika olan:** sadece +%30 yıllık / +%45 aylık çifti (Eylül maili). Bant ve çek/KK-12 kademeleri öneri olarak kaldı.\n**Dosyalar:** `1 Renewals/Ekim_Ocak_Yenileme_SAS_Kampanya/` (`Peşine Geçiş Simülasyonu_15.09.2026.html`, `Yenileme Kampanyası_Tahsilat Skoru ve Peşin-Aylık Artış_v5_15.09.2026.xlsx`).\n**Dikkat:** sütunun adı **RÇİ** (provider = firma ismi), Rİİ değil. Ekim satırlarındaki \"Söz. ID\" aslında Executive ppp_id.", "tags": ["yenileme", "tahsilat", "peşin", "simülasyon", "NPV"], "source": "1 Renewals/Ekim_Ocak_Yenileme_SAS_Kampanya/PROJECT.md", "links": [{"label": "Renewal sheet › Renewal Target sekmesi", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit"}], "updated": "2026-09-15"}, {"id": "la-18", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "11/2025–04/2026: Upgrade kampanyası (ilk 3 ay üst paket)", "tldr": "Kasım 2025 – Nisan 2026 satışlarında ilk 3 ay bir üst paket yayınlandı, sonra satılan paket devam etti; 137 satıştan sadece 5'i kampanya bitince upsell yaptı.", "body": "- **Kurgu:** satılan paketin ilk 3 ayı bir üst paket (2X → 4X, 4X → 6X), kalan 9 ay satılan taban paket. Qlik'te aynı sözleşmede iki ppp: `campaign_product` (3 ay) + `post_campaign_product` (9 ay).\n- Yenileme listesinde `post_campaign_product` ~9 ay çalışmışsa ok sayılır.\n- **Kontrol (22.09.2026, Qlik 21/09):** 137 satır / 134 provider / 114 müşteri → **5 upsell** (sheet'te zaten \"Yes\" olanlar), 120 taban pakette, 9 churn/pasif, 1 downsell. 5 firmanın 4'ü kampanyada kullandığı paketi 22–58 gün içinde geri aldı (Menessa, Elegant Garden, Okaliptus, Royal Bloom, Grand Love House).\n- Sonuç Kasım 2026 Welcome hediye analizinde \"kampanya sonrası ücretli devam\" oranı olarak kullanıldı (%3,7 = 5/135).\n- Dosya: `2 Upsell/Upgrade_Kampanyasi_Upsell_Kontrolu/Upgrade Kampanyası_Upsell Kontrolü_22.09.2026.xlsx`.", "tags": ["upgrade kampanyası", "upsell", "kampanya geçmişi"], "source": "2 Upsell/Upgrade_Kampanyasi_Upsell_Kontrolu/PROJECT.md; 1 Renewals/Monthly Renewal Lists/PROJECT.md", "links": [{"label": "Upgrade Kampanyalı Ürünler (Google Sheet)", "url": "https://docs.google.com/spreadsheets/d/1iw1ud--0pjy3iXtHOY_zf_N31gzq4vZ23kUIocGuHEE"}], "updated": "2026-09-22"}, {"id": "la-20", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "07.09.2026: Welcome Paketi lansmanı; Pro Start, Power Start, Winner 3X kapandı", "tldr": "07.09.2026'da Welcome Paketi tüm yeni mekan satışları için açıldı; 08/09'da kapsam '≥ 6 ay önce bitmiş' oldu; Eylül kampanyasıyla KK 12 taksit vade farksız eklendi.", "body": "- 07.09.2026 lansman maili (\"ilk defa iş ortağımız olacak firmalar\", satış fiyatı 9.900–19.900 ₺).\n- 08.09.2026 Nes'in cevabı: küçük fiyat güncellemeleri (ekli PDF'ler geçerli) ve kapsam \"hiç üye olmamış veya son ürünü ≥ 6 ay önce bitmiş\" oldu.\n- Eylül kampanya mailiyle (16.09.2026) tek değişiklik: KK 12 taksit vade farksız.\n- Aynı ay Pro Start (MoS giriş ürünü), Power Start ve Winner 3X satışı kapandı. Winner artık sadece yenileme / winback / upsell ürünü.\n- **Yeni satış tanımı (Nes 16.09.2026):** hiç ödememiş veya ≥ 6 ay önce churn olmuş provider. 0–6 ay churn'e satış = yenileme-winback; ödeyen müşteriye upsell = yenileme-upsell.", "tags": ["Welcome", "lansman", "yeni satış", "kampanya geçmişi"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §2–§3a", "links": [], "updated": "2026-09-08"}, {"id": "la-21", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "09/2026: Pro Start 3 yenilemeleri MoS'tan SAS'a (Winner) geçti", "tldr": "Eylül 2026'dan beri Pro Start 3 yenilemeleri MoS / Pro Start 12 yerine SAS tarafından Winner paketleriyle yapılır; Pro Start = Winner 2X.", "body": "- **Eski (Ağustos 2026'ya kadar):** MoS yeniliyordu; Pro Start 12 (Pro listesi × 0,55), ilk ay 1 TL; ya da 12 ay peşin −%20.\n- **Yeni (Eylül 2026):** SAS, Winner paketleri. 08.09.2026 v3 kuralı (aylık 2X %25 / 4X %35 / 6X %40, peşin ek %30) → 16.09.2026 SAS maili ile **sabit İstanbul tablosu** (Kır 26.900 / 33.900 / 46.900 …); öneri: bugünkü ödemeye Winner 4X.\n- İlk liste: 31 İstanbul firması (Temmuz 10 · Ağustos 12 · Eylül 9). Açık hesap ve senet yok.\n- 06.10.2026: tablo Winner kartıyla +%10.\n- Ekim 2026 son Qlik bazlı Pro 3 listesi; Kasım 2026'dan beri Pro 3 satırları ALL_new'den ayrılır. Eski `Pro Start_Renewal` sekmesi emekli.\n- 05.11.2026: teklif kuralları (bkz. \"Pro Start 3 yenileme teklif kuralları\").", "tags": ["Pro Start 3", "SAS", "MoS", "Winner", "kampanya geçmişi"], "source": "1 Renewals/Pro3_Yenileme_Winner/PROJECT.md; notes/renewal-min-increase-rule.md", "links": [], "updated": "2026-09-16"}, {"id": "la-22", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "14.09.2026: TES hibrit oldu — İstanbul'da Big 5 saha satışı başladı", "tldr": "14.09.2026'dan beri TES hibrit: İstanbul saha kolu Big 5 firmalarını yerinde ziyaret eder, ofis kolu telefonla satar; ürün ve fiyat aynı (Plus).", "body": "- Eylül 2026 TES kampanya maili (14.09.2026, Özlem Türkmen + Taner Duran'a): \"TES Hybrid started\" — Big 5 kategorilerinde saha satışı.\n- Big 5: Gelin Saçı ve Makyajı, Düğün Organizasyon, Düğün Fotoğrafçıları, Gelinlik, Müzik.\n- Saha kolu ayrı ürün satmaz: aynı Plus, aynı fiyat (yeni satış 9.900 + KDV yıllık).\n- Ofis kolu: diğer iller ve İstanbul'un küçük non-venue firmaları.\n- Aynı dönemde Plus listesi 7.500'den 14.850 ₺'ye çıktı; yeni satış sadece yıllık oldu.\n- **Açık soru:** saha kolunun yenilemeleri SAS takvimine (M−2) mi geçsin, TES takviminde (M−1) mi kalsın — karar yok; şimdilik ikisi de TES takviminde.", "tags": ["TES", "saha", "Big 5", "Plus", "kampanya geçmişi"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §3b, §4; 1 Renewals/Monthly Renewal Lists/PROJECT.md", "links": [], "updated": "2026-09-14"}, {"id": "la-23", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "16.09.2026: Eylül SAS kampanyası — +%30 / +%45 kuralı, KK 12 taksit vade farksız", "tldr": "16.09.2026 SAS maili yenileme indirimlerini yıllık / aylık plana ayırdı, minimum artışı aylık→yıllık +%30, aylık +%45 yaptı ve KK 12 taksiti vade farksız yaptı.", "body": "- Alıcılar: Özlem Türkmen (SAS) + Özgür Atanur. Ek: `Pro Start 3 Yenileme Firmaları_SAS_9.09.2026.xlsx`.\n- Yıllık plan indirimleri 5 puan iyileşti (klasik %30), aylık açık hesap 5 puan kötüleşti (klasik %20).\n- Ekim 2026: Winner listesi +%10 (kart 06.10.2026; CRM 07.10.2026 gece yükseltildi). Ekim kampanya duyurusu D-One kurulumu nedeniyle ertelendi; Ekim'de Eylül kampanyaları devam etti.\n- 19.10.2026 \"Ekim + Kasım 2026 Satış Kampanyaları - SAS\" maili: aynı kurallar + Upsell Stüdyosu duyurusu.", "tags": ["kampanya geçmişi", "SAS", "yenileme", "Winner"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §3a, §3d; .msg mailleri", "links": [], "updated": "2026-09-16"}, {"id": "la-24", "cat": "Kilometre taşları", "kind": "bilgi", "pin": false, "title": "02.10.2026: Upsell Stüdyosu D-One'da canlı; 19.10.2026 SAS'a duyuruldu", "tldr": "Nes'in Upsell Stüdyosu 02.10.2026'da BI'ya devredilip D-One'da canlıya alındı; 19.10.2026'da kullanım kılavuzuyla SAS ekibine duyuruldu.", "body": "- 08.09.2026: yenileme upsell çalışması başladı (bant 10–30K → 50K, 30–50K → 70K, 50–70K → 100K; her seçenekte 2X hediye ek kategori). Eylül boyunca Excel / simülasyon → stüdyo sayfası (`dashboard/satis_paneli.html`).\n- 02.10.2026: BI hand-off (`2 Upsell/Upsell/BI_Handoff/`), D-One'da canlı. Simülasyon dashboard'u ve Excel'ler emekli (Nes 29/09 ve 15.10.2026: \"never use the upsell simulation anymore\").\n- 16.10.2026: `Upsell Stüdyosu Kullanım Kılavuzu_16.10.2026.pdf`.\n- 19.10.2026: SAS'a mail (\"daha yüksek paket → daha yüksek performans → memnun müşteri ve artan yenileme oranları\"). Ekim'de \"Kendi sepetini oluştur\" kapalıydı.\n- **İlk sonuç (Nes 01–05.11.2026):** Ekim'de stüdyodan gelen 7 bundle satışı: 73004, 92242, 6885, 2310, 55354, 2191, 31576. Bundle sayılma şartı: min 2 ücretli ana kategori + 1 hediye; yenilemede zaten gelecek %40 artış düşülür. Sayım dosyası `Stüdyo Sonrası Upsell Satışları_04.11.2026.xlsx` (Qlik'in upsell etiketi Mart 2025'ten beri boş, ürün geçmişinden çıkarılır).\n- 11.11.2026: Söz Nişan ana kategori olmaktan çıktı (PR #489). 23–24.11.2026: starter ürünler (Welcome, Pro Start, Power Start) Aralık'tan dahil (PR #602).\n- 24.11.2026: \"Gerçekleşen Upsell'ler\" sekmesi düzeltmesi (Barış, PR #598); 73004 = 99.900 ₺/ay, kazanç 22.900 ₺/ay (25.11.2026 doğrulandı).", "tags": ["Upsell Stüdyosu", "D-One", "lansman", "kampanya geçmişi"], "source": "2 Upsell/Upsell/CLAUDE.md; PROJECT.md §64, §80–81; Ekim + Kasım 2026 Satış Kampanyaları - SAS.msg", "links": [{"label": "D-One › Upsell Stüdyosu", "url": "https://d-one.dugun.work/satis/upsell/#liste:unfit"}, {"label": "PR duguncom/d-one#489 (ana kategori kuralı)", "url": "https://github.com/duguncom/d-one/pull/489"}, {"label": "PR duguncom/d-one#602 (starter ürünler)", "url": "https://github.com/duguncom/d-one/pull/602"}], "updated": "2026-11-25"}, {"id": "la-25", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "Decay ve churn farkı; Decay Takip durumları", "tldr": "Decay = provider yenilemeye ulaşmadan kaybedildi; yenileme listesine gelip yenilemeyen churn'dür ve decay çalışmasına girmez.", "body": "- **Decay:** ürünü planlanan bitişinden belirgin önce yayını durmuş provider. Her Decay satırı bu testi geçmeli.\n- **Churn:** yenileme listesine (ALL_new) geldi, `Yenileme Durumu` = Yenilemedi.\n- ALL_new'de bir yenileme listesine giren provider \"2026 Yenilemeye Geldi\" veya \"Farklı Tarihte Yenilemeye Geldi\"dir; yenileyip yenilemediğine bakılmaz.\n- **Durumlar:** 2026 Yenilemeye Geldi · Farklı Tarihte Yenilemeye Geldi (2026 Öncesi / 2026 ilk 6 ay içinde / 2026 Haziran Sonrası) · Aktif Provider (bitiş ileri itilmiş) · ID Değişikliği (yayın başka provider id ile devam) · Satış Değil (ödeme hiç başlamadı / iptal) · Decay · Control (veri karar veremedi, elle CRM kontrolü).\n- **Ay sonu kayması gerçek:** 02.10.2025'te satılan 12 aylık ürün 30.09.2026'da biter → Eylül listesinde → \"Farklı Tarihte\".\n- `Otomatik Yenilenmesin` iptal değildir (26.02.2026'da topluca basılmış).\n- Ciro: `2025 Ciro (aylık)`, `2025 Ciro (yıllık)` = aylık × 12 (Power Start / Winner 3X × 6). Sadece Durum = Decay gerçek kayıptır.", "tags": ["decay", "churn", "tanım"], "source": "1 Renewals/Decay/PROJECT.md; Monthly Renewal Lists/Renewal_Data_Sheet_Guide.md §5", "links": [{"label": "Google Doc: Decay List (yöntem)", "url": "https://docs.google.com/document/d/1RdDg0YyikwQncZCPyjjHPo7D0ub_EZNqWq96YOxtRMM"}, {"label": "Decay List (doküman)", "url": "https://docs.google.com/document/d/1RdDg0YyikwQncZCPyjjHPo7D0ub_EZNqWq96YOxtRMM/edit"}], "updated": "2026-09-18"}, {"id": "la-26", "cat": "Metrikler & tanımlar", "kind": "kural", "pin": false, "title": "Sözleşme tipi Aylık / Yıllık / Ücretsiz nasıl belirlenir", "tldr": "Finance app'te recurring_month'u olan vade varsa Aylık; recurring month olmayan tüm sözleşmeler Yıllık'tır (ödeme planı girilmemiş olsa bile).", "body": "- `regular` / `zero_tax` → **Yıllık** (tasarım gereği ödeme planı yok).\n- `subscription` / `subscription_rnd` → Finance app (`b723e906-…`, `payment_due`) — herhangi bir vadede `recurring_month` varsa **Aylık**, yoksa **Yıllık**.\n- Nes 01.10.2026: **mutlak kural** — \"recurring month olmayan tüm sözleşmeler yıllıktır\"; \"belirsiz\" sınıfı uydurma.\n- Değer 0 → sadece bir not ücretsiz listelemeyi doğruluyorsa **Ücretsiz**; yoksa `KONTROL: fiyatı yok.`\n- CRM'den bakınca aynı kural: 12 KK vadesi + recurring month = aylık; KK tek çekim / taksit, çek, senet, havale, barter = yıllık.\n- Renewal sheet'te iki sözlük var: 2026 öncesi satırlar Aylık/Yıllık, bazı 2026 satırları ham CRM tipi (subscription_rnd / zero_tax). Kasım 2026'dan beri Aylık/Yıllık yazılıyor.\n- Yenilenen sözleşme aranırken: Finance `agreements` + `agreement_providers`, provider bazında eşle (müşteri id sözleşmeler arasında değişebilir; CRM birkaç id altında pasif \"kabuk\" sözleşme bırakabilir).", "tags": ["sözleşme tipi", "aylık", "yıllık", "Finance", "recurring_month"], "source": "1 Renewals/Monthly Renewal Lists/PROJECT.md; notes/monthly-renewal-lists.md", "links": [], "updated": "2026-10-01"}, {"id": "la-27", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "2026 Satış Takvimi ve FTS'nin yenileme tarihleri", "tldr": "Satış ayları takvim ayı değildir (ör. Eylül = 07/09–05.10.2026); FTS yenilemeyi imza gününe göre, sistemden en fazla 60 gün önce tarihler.", "body": "**2026 Satış Takvimi (FTS `Sözleşme Ayı` bu takvimi izler):** Ocak 05/01–01/02 … Eylül 07/09–05/10, Ekim 06/10–01/11, Kasım 02/11–29/11, Aralık 30.11.2026–03.01.2027. Takvimin dışında kalan 01–04/01 → Ocak, 31/08–06/09 → Eylül. (Upsell'de Aralık satış ayı 07.12.2026 başlıyor.)\n**FTS nedir:** satış operasyonunun (Özlem Türkmen) elle tuttuğu satış listesi (`FTS_2026_<tarih>.xlsx`, sas 2026 + tes 2026). Prim Statüsü / Statü en önemli sütun; Net Tutar = firmanın ödediği toplam (KDV hariç).\n**FTS vs renewal sheet (15.10.2026 tüm yıl):** FTS 24,81 M ₺ aylık vs sheet 22,52 M ₺. Eşleşen 675 firmanın 293'ünde FTS tarihi sheet/Finance'tan önce (108'inde > 30 gün, maks 60). Bu yüzden FTS Ocak ≈ sheet Şubat vb.\n**Yaygın FTS hataları:** provider id yerine ppp id (153078 → 8923), yazım hatası (1173978 → 117397), Ekim sözleşmeleri 30.09 tarihli; TES tutarları KDV farkı (× 1,2).\n**Sheet okuma kuralı:** Yenileme Tarihi (AJ) ayın 1'i ise yer tutucudur → Finance sözleşme tarihi kullanılır. 2025 Kasım/Aralık listelerinde olup 2026'da imzalananlar da sayılır.\n**Dosyalar:** `1 Renewals/FTS_Eylul_Yenileme/` (`FTS - Sheet Eşleşme Durumları_2026_21.10.2026_v2.xlsx`; `FTS 2025-26_Agreement ID_Unique_10.11.2026_v3.xlsx`).", "tags": ["FTS", "satış takvimi", "yenileme", "karşılaştırma"], "source": "1 Renewals/FTS_Eylul_Yenileme/PROJECT.md", "links": [{"label": "Renewal sheet › Customer Bazında Yenileme Tablosu", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=1812420873"}], "updated": "2026-10-21"}, {"id": "la-28", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "Renewal sheet sütun sözlüğü: PY Tahmin, Yenilememe Sebep, Yenileme Durumu", "tldr": "ALL_new'de PY'ler tahmin ve sebep girer; Yenileme Durumu'nda sadece 'Yenilendi' tutarlı işlenir, gerisi yenilenmedi sayılır.", "body": "- **Anahtarlar:** RÇİ = provider_id · Müşteri İD = customer_id · Ürün ID = ppp_id · Söz. ID = customer_agreement_id. Tutarlar her yerde **aylık TL**.\n- **Kim yazar:** A–V Nes (liste açılırken, sonra değişmez) · W–Y PY (tahmin) · Z+ Nes / satış (gerçekleşen).\n- **PY Tahmin:** Yeniler / Yenilemez / OYD İletti - Yenilemez / OYD İletti - Yeniler / Yenilendi / Yenileme İptal.\n- **Yenilememe Sebep:** Verim alamama · Zaman ayıramama · Mekan kapanış/devir · Borçlu/yasal süreçte · Yüksek fiyat · 3 ayda 1 veya OY gibi sözleşme itirazları · Trafikten Memnun Değil.\n- **Yenileme Durumu:** Yenilendi / Yenilemedi / Bağlantı (satış ziyaret etti, ekmob'da kayıtlı, sonuç yok) / Beklemede (sözleşme imzalandı ama ilk ödeme zaman aşımına uğradı). **Sadece Yenilendi tutarlı işlenir** → Yenilendi = yenilendi, gerisi değil.\n- **Yenileme mi?:** Yenileme / Yenileme Değil — \"Yenileme Değil\" satırlar oran ve funnel hesaplarından çıkarılır.\n- **Tahmin Tutarlılık Kodu:** 11 / 12 / 21 / 22 = tahmin × gerçekleşen. **Yenileme Kampanya:** ör. \"Referans %30\", \"İlk ay 1 TL\".\n- Sekmeler: ALL_new · Pivot Tablo (Provider) · Customer Bazında Yenileme Tablosu · Pivot Tablo (Customer) · Renewal Target · Pro Start_Renewal (emekli) · Decay Takip · Decay Dağılımı · Referans · Mail …\n- BI için tam sütun rehberi: `1 Renewals/Monthly Renewal Lists/Renewal_Data_Sheet_Guide.md` (24.09.2026).", "tags": ["renewal sheet", "PY tahmin", "sözlük", "ALL_new"], "source": "1 Renewals/Monthly Renewal Lists/PROJECT.md; Renewal_Data_Sheet_Guide.md", "links": [{"label": "1. Renewal Data_2025-26 (renewal sheet)", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit"}, {"label": "Renewal sheet › ALL_new", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=559070021"}, {"label": "Renewal sheet › Customer Bazında Yenileme Tablosu", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=1812420873"}], "updated": "2026-09-24"}, {"id": "la-29", "cat": "Metrikler & tanımlar", "kind": "bilgi", "pin": false, "title": "İkinci kategori (DS + Balo) gerçekten değer katıyor mu", "tldr": "Balo sayfası DS sayfasından farklı çiftlere ulaşır (%11 örtüşme), toplam lead +%34, çift kategorili müşteri daha çok yeniler (%69 vs %57); ama dolu İstanbul 6X salonlarında lead'i böler.", "body": "- Çalışma 25.09.2026, `2 Upsell/DS_Balo_Cift_Kategori/` (`DS + Balo Davet Birlikte Satış Analizi_25.09.2026.xlsx`).\n- 119 çift kategorili müşterinin 95'i aynı salon iki kategoride.\n- Ek kategori sonrası toplam lead medyan +%34 (piyasa etkisi düşülmüş); 10K TL başına lead düşer (DS-only 28 → DS+Balo 18).\n- Ayda 100+ lead alan İstanbul 6X salonlarında ikinci sayfa lead ekler değil böler → bunlara X yükseltmesi öner.\n- Satış dili: \"farklı kitleye erişim + toplam lead artışı\", ikinci bir DS büyüklüğünde lead akışı değil.\n- Tuzak: bir firmanın kendi öncesi/sonrasında lead/TL kıyaslama; aynı dönem kesitini kullan.", "tags": ["ek kategori", "DS", "Balo", "upsell", "lead"], "source": "2 Upsell/DS_Balo_Cift_Kategori/notes/second-category-listing-value.md", "links": [], "updated": "2026-09-25"}, {"id": "la-30", "cat": "Veri & Qlik", "kind": "kural", "pin": false, "title": "Yenileme / decay verisinde Qlik tuzakları", "tldr": "Executive 'Yenileme Listesi' master item'ı canlı okunur; ay seçimi sadece list object ile tutar; Providers - PY app'inin load_date'i kilitli ve reload sırasında eski veri döner.", "body": "- **Master item:** Executive app › B2B Metrics › \"Yenileme Listesi\" (`9f14ef1a-588d-453e-a5d4-3e97b904b2f3`). \"1. …\" ölçüleri `v_flagdate_1` (Churn Referance Date = bugün), \"2. …\" ölçüleri `v_flagdate_2` (Churn Check Date; decay için).\n- **Seçim:** `product_ended_ym` / `product_started_ym` dual alan; `Field.SelectValues` sessizce hiçbir şey yapmaz → session list object ile seç ve seçimin tuttuğunu doğrula (bir kez tüm app'i \"kohort\" diye çekti: 1.200 provider). Önce ClearAll.\n- **Providers - PY app** (`670d9666-a22a-4177-8dfb-6f7013190c10`): `load_date` \"one and only one\", ClearAll sonrası 2023-09-13'te kalır → en yeni tarihi list object'te azalan sırada 0. eleman olarak seç (Nes'in \"Yükleme Tarihi = bugün\" filtresi). Reload sırasında 2023 verisi döner; `pull_py_app.py --wait` bekler. TES listesinin lead / ödeme / profil metrikleri buradan.\n- **Söz. Kodu** (GT…, ÖTS…) Executive / General'da yok; Providers - PY › `agreements.agreement_code`'da var (her load_date ayrı seçilmeli).\n- **General vs Finance:** son günlerde imzalanan sözleşmelerde General / Executive, Finance'ın gerisinde kalır.\n- **Upsell etiketi:** Qlik'in `B2B Upsell Listesi` kaynak etiketi Mart 2025'ten beri boş — upsell ürün geçmişinden çıkarılır.\n- **Liste fiyatı:** Qlik General `product_prices.listing_price` tam dönem fiyatıdır → ürün süresine böl (12; Power Start / Winner 3X / Pro Start 6 = 6; Pro Start 3 = 3). Satıldığı andaki liste: `dw_provider_master.pm_current_pp_id` → `dw_product_list_price` (sadece Winner 2X/4X/6X).", "tags": ["Qlik", "tuzak", "Executive", "Providers - PY", "list object"], "source": "1 Renewals/Monthly Renewal Lists/PROJECT.md; Decay/PROJECT.md; FTS_Eylul_Yenileme/PROJECT.md", "links": [], "updated": "2026-11-10"}, {"id": "la-31", "cat": "CRM & Sözleşme", "kind": "kural", "pin": false, "title": "CRM ürün düzenleme geçmişi: tek izinli CRM kullanımı", "tldr": "Kontrol satırlarının gerçek sebebi CRM ürün düzenleme geçmişindeki 'Sebep Açıklaması'dır; Qlik'te yok. Sadece okuma, CRM API'si üzerinden, satır ikonlarına asla tıklanmaz.", "body": "- **Neden:** \"ürün düzenleme notları\"nın serbest metin Sebep Açıklaması hiçbir Qlik app'inde yok (churn_comment, görüşme notları, müşteri notları kontrol edildi).\n- **Yol (sadece GET, Nes'in Chrome oturumu):** `api.dugun.com/provider-product-price-activity?providerProductPriceId=<Ürün Id>&scopes[]=transformChanges` + `/provider-product-price/<id>` (`predecessor` = kalan hakkın geldiği ürün). Sayfanın Angular `$http`'si ile çağrılır (`1 Renewals/Monthly Renewal Lists/tools/crm_history.js`).\n- **Asla:** satırdaki göz ikonu (hoş geldin mail/SMS diyaloğu açar), kalem (düzenleme formu). Görüşme ve sözleşme notları CRM'den değil Qlik General'dan okunur.\n- BI bu alanı Qlik'e yükleyince CRM kullanımı tamamen biter (Nes söyleyecek).\n- **Sık sonuçlar:** kalan yayın hakkı eklendi · önceki ürün bağlandı (kategori devri / RÇİ değişikliği, `predecessorId`) · ödeme sözü alındı, kapalı kalan süre eklendi · mühür / tadilat / mekan kapanışı → yayın saklı · +1 ay kampanya · sözleşme 8 aylık yapıldı / bitiş eşitlendi.\n- Her Aşama 3'ten önce listedeki tüm ürünlerin Aşama 1 sonrası CRM aktivitesi taranır (315 ürün ≈ 2 dk).\n- CRM linki: `https://crm.dugun.com/customers/{customer_id}#providers`.", "tags": ["CRM", "ürün geçmişi", "Kontrol", "salt okunur"], "source": "1 Renewals/Monthly Renewal Lists/PROJECT.md › Resolving Kontrol rows", "links": [], "updated": "2026-10-30"}, {"id": "la-32", "cat": "CRM & Sözleşme", "kind": "bilgi", "pin": false, "title": "Qlik / CRM liste fiyatı ile fiyat kartı kontrolü", "tldr": "Yeni fiyat kartı geldiğinde CRM'e doğru girilip girilmediği `check_qlik_prices.py` ile kontrol edilir; Ekim 2026'da +%10 önce girilmemişti, sonra bazı hücreler hatalı kaldı.", "body": "- Araç: `3 Pricing/Düğüncom_subscription_models/tools/check_qlik_prices.py` → `Qlik Liste Fiyatı Kontrolü_<GG.AA.YYYY>.xlsx` (Qlik General `product_prices` + Executive `monthly_listing_price` vs dosya 1).\n- 30.09.2026: Eylül kartıyla ana şehirler, alt bölgeler, Welcome, Plus ₺ bazında eşleşti.\n- 06.10.2026: CRM'deki Ekim Winner fiyatları = Eylül (+%10 girilmemiş). 07.10.2026 gece yükseltildi; kalan CRM hataları: Uydu İller Kır/Tarihi 6X 688.992/yıl (rakamlar yer değiştirmiş, doğrusu 570.192), Bursa Balo + Otel 2X 26.871/yıl (aylık yıllığa yazılmış), Balıkesir Kır/Tarihi 4X Eylül fiyatında. Düzeltme listesi: `CRM Liste Fiyatı Düzeltme Listesi_06.11.2026.xlsx`.\n- Açık konu: 59 TES mekan ilinde Qlik'te kartta olmayan düz Winner fiyatı (2X 130.000 / 4X 180.000 ₺/yıl) — Nes karar verecek.\n- Qlik taşra Winner provider'larına şehir fiyatı verir (bilinen davranış); taşra kuralı scriptlerde uygulanır.\n- D-One fiyatları CRM'den okuduğu için CRM hatası doğrudan D-One'a yansır.", "tags": ["CRM", "liste fiyatı", "Qlik", "kontrol", "rate card"], "source": "3 Pricing/Düğüncom_subscription_models/PRICING.md §6a, §7", "links": [], "updated": "2026-11-06"}, {"id": "la-33", "cat": "Nasıl yapılır", "kind": "nasil", "pin": false, "title": "Renewal sheet'i (peradora) Claude in Chrome ile okuma", "tldr": "Renewal sheet sadece peradora hesabıyla açılır; Chrome'da kendi sekmende açıp aynı origin gviz sorgusuyla CSV/HTML okunur, sheet'e asla yazılmaz.", "body": "- Sheet'i Claude in Chrome'da **yeni, kendi sekmende** aç (Nes'in CRM sekmesi aynı grupta olabilir, dokunma). Sadece görüntüleme.\n- Sayfadan: `fetch('/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/gviz/tq?tqx=out:csv&gid=559070021')` (ALL_new). Customer Bazında gid 1812420873. `/export` URL'si çalışmaz (cross-origin).\n- Toplu sorgu (Hedef dosyası K–N için): `gviz/tq?tqx=out:html&sheet=Customer%20Baz%C4%B1nda%20Yenileme%20Tablosu&tq=select A, sum(X), sum(AH) where C='Yenileme' and A >= date '2026-01-01' group by A order by A` — önce başlık satırını kontrol et, sütunlar kayabilir.\n- Araç sonuçları ~1.000 karakterde kesilir: sayfada topla, `<pre>`'ye `|` ayraçla yaz, `get_page_text` ile oku veya 950 karakterlik dilimlerle al; base64 engellenir. Alternatif: Nes filtreyi temizledikten sonra seç-kopyala + `Get-Clipboard`, FNV checksum ile doğrula.\n- **Filtre tuzağı:** gviz Nes'in aktif filtresine uyar (bir kez 4.863 satırdan 5'i görünüyordu) → ayın satır sayısını filtresiz toplamla karşılaştır.\n- Alternatif: Nes sheet'i .xlsx indirip klasöre koyar.", "tags": ["Google Sheet", "Chrome", "gviz", "renewal sheet"], "source": "1 Renewals/Monthly Renewal Lists/PROJECT.md; New Sales & Renewal Targets-Monthly/PROJECT.md", "links": [{"label": "1. Renewal Data_2025-26 (renewal sheet)", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit"}, {"label": "Renewal sheet › ALL_new", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=559070021"}, {"label": "Renewal sheet › Customer Bazında Yenileme Tablosu", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=1812420873"}], "updated": "2026-11-23"}, {"id": "la-34", "cat": "Nasıl yapılır", "kind": "nasil", "pin": false, "title": "FTS satırlarına Agreement ID bulma", "tldr": "FTS satırlarına Agreement ID: önce Kontrat No, sonra provider + tarih (±20, tutar ve ürün uyuyorsa ±60 gün), sonra müşteri, en son isim; FTS sütunlarına dokunulmaz, yeni sütunlar en başa.", "body": "- İş (10.11.2026): `FTS 2025-26.xlsx` (sas/tes 2025 + 2026, 4.538 satır) → `FTS 2025-26_Agreement ID_10.11.2026_v2.xlsx` (4.469 satır ID'li, 3.926 temiz) ve tekil sözleşme versiyonu `…_Unique_10.11.2026_v3.xlsx` (3.369 sözleşme).\n- Sıra: Kontrat No (Söz. Kodu: Providers - PY `agreements.agreement_code`) → provider + tarih ±20 gün (ppp id'ler ve General `provider_master` birleşmeleri çözülür; eşitlikte fiyat, sonra aylık/yıllık tipi) → aynı müşteri + tarih → katı firma adı + tarih.\n- Nes 10.11.2026: tutar ve ürün uyuyorsa ±60 gün kabul. Tutar: %5 içinde, KDV için × 1 veya × 1,2.\n- Sözleşme başına ürün = Finance `agr_product_name`; Finance `agreement_price` sözleşme toplamıdır.\n- Tekrar çalıştırmak için hazır prompt: `1 Renewals/FTS_Eylul_Yenileme/FTS 2025-26_Agreement ID_Prompt.md`; yöntem ve sütun rehberi aynı klasörde.", "tags": ["FTS", "agreement id", "eşleştirme"], "source": "1 Renewals/FTS_Eylul_Yenileme/PROJECT.md › Agreement ID", "links": [], "updated": "2026-11-10"}, {"id": "la-35", "cat": "Nasıl yapılır", "kind": "nasil", "pin": false, "title": "Taşra ilçede şehir fiyatıyla satılmış firmaları bulma", "tldr": "Taşra ilçe yenilemelerinde firmanın şehir fiyatıyla mı Uydu fiyatıyla mı satıldığı, ödenen/liste oranının ana şehir medyanına (0,53) yakınlığıyla tahmin edilir.", "body": "- İş (16.11.2026, Nes: taşra firmalarına daha adil yenileme kampanyası): `1 Renewals/Monthly Renewal Lists/Taşra İlçe Yenilemeleri_Şehir Fiyatı Kontrolü_Ekim-Aralık 2026_16.11.2026.xlsx`, 54 satır (Plus hariç).\n- Fiyat: sözleşme ayının Winner kartı (Ekim 2025 bloğu Ekim 2025–Ocak 2026 satışları için), şehir vs Uydu İller; Pro Start 3 = Temmuz 2026 MoS şehir vs taşra.\n- Karar: Uydu listesinin üstünde ödüyorsa = Şehir fiyatı; değilse ödenen/liste oranı aynı dönemin ana şehir medyanına (0,53; p10–p90 0,43–0,66) hangi listeyle daha yakınsa; ikisi de aralıktaysa Belirsiz.\n- Sonuç: Şehir 5 · Muhtemelen şehir 9 · Belirsiz 10 · Taşra 29 · Kontrol 1.\n- **Dikkat:** Temmuz 2026 `Taşra İlçeler` sayfasında sadece İstanbul / Ankara / Bursa var; İzmir, Antalya, Adana, Mersin ilçeleri Eylül 2026 listesiyle, Çeşme 30.09.2026'da geldi → 2025'te oralarda şehir fiyatı meşruydu.\n- Upsell'de de aynı istisna: Uydu listesinin üstünde ödeyen taşra sayfası şehir kartıyla değerlendirilir (16.10.2026).", "tags": ["taşra", "uydu", "şehir fiyatı", "yenileme"], "source": "1 Renewals/Monthly Renewal Lists/PROJECT.md › Runs 16.11.2026", "links": [], "updated": "2026-11-16"}, {"id": "la-36", "cat": "Linkler", "kind": "bilgi", "pin": false, "title": "Yenileme, fiyat ve upsell için önemli linkler", "tldr": "Renewal sheet, Decay yöntem dokümanı, Plus Pricing, Upgrade Kampanyalı Ürünler sheet'i ve D-One Upsell Stüdyosu linkleri.", "body": "- **1. Renewal Data_2025-26** (renewal sheet, peradora hesabı): ALL_new (gid 559070021), Customer Bazında Yenileme Tablosu (gid 1812420873), Decay Takip, Renewal Target, pivotlar. Sahibi Nes.\n- **Decay List** Google Doc: decay listesinin orijinal yöntemi (herkese açık).\n- **Plus Pricing** Google Sheet: Plus il × kategori kontenjanı ve CRM girişleri (link paylaşımlı).\n- **Upgrade Kampanyalı Ürünler** Google Sheet: Kasım 2025 – Şubat 2026 upgrade kampanyalı satışlar (peradora).\n- **D-One › Upsell Stüdyosu:** satış ekibinin firma bazlı bundle listesi.\n- CRM müşteri sayfası şablonu: `https://crm.dugun.com/customers/{customer_id}#providers`.", "tags": ["link", "Google Sheet", "renewal sheet", "D-One"], "source": "1 Renewals, 2 Upsell, 3 Pricing klasörleri", "links": [{"label": "1. Renewal Data_2025-26 (renewal sheet)", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit"}, {"label": "Renewal sheet › ALL_new", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=559070021"}, {"label": "Renewal sheet › Customer Bazında Yenileme Tablosu", "url": "https://docs.google.com/spreadsheets/d/1KM-sTZvsUEDSDsiUfara8Ms5xhZEV06pPXVP97lCzCE/edit#gid=1812420873"}, {"label": "Google Doc: Decay List (yöntem)", "url": "https://docs.google.com/document/d/1RdDg0YyikwQncZCPyjjHPo7D0ub_EZNqWq96YOxtRMM"}, {"label": "Plus Pricing (Google Sheet)", "url": "https://docs.google.com/spreadsheets/d/1QOXTqfg_hr2nX22FpsPWy-cPnOTfKX2ltbuuHxpjt3U/edit?usp=sharing"}, {"label": "Upgrade Kampanyalı Ürünler (Google Sheet)", "url": "https://docs.google.com/spreadsheets/d/1iw1ud--0pjy3iXtHOY_zf_N31gzq4vZ23kUIocGuHEE"}, {"label": "D-One › Upsell Stüdyosu", "url": "https://d-one.dugun.work/satis/upsell/#liste:unfit"}], "updated": "2026-11-25"}, {"id": "la-37", "cat": "Çalışma kuralları", "kind": "yasak", "pin": false, "title": "Upsell: emekli araçlar ve müşteriye gösterilmeyenler", "tldr": "Upsell simülasyon dashboard'u, referans sayfası ve Eylül Excel'leri emekli; sadece Upsell Stüdyosu ve D-One. Müşteriye %40 / × 1,4 asla gösterilmez.", "body": "- **Emekli (Nes 29/09 ve 15.10.2026):** `dashboard/index.html` (simülasyon), `dashboard/referans.html`, Firma Listesi / v2 / CSO / Referans Çağrı Planı Excel'leri, Eylül kural geçmişi. Bunlardan başlama, güncel diye anlatma, silme de.\n- Yerel `2 Upsell/Upsell/PROJECT.md` 2.000+ satır tarihçedir; sadece §0 ve §69+ okunur. Canlı kural GitHub `main`'dedir.\n- **Müşteri görünümü (Nes 15.10.2026):** stüdyo (müşteriye açık) asla %40 veya × 1,4 yazmaz; sadece \"Yenilemede aylık ödemeniz …\" ve \"yenileme öncesi: X ₺\". × 1,4 ifadesi sadece iç sayfalarda.\n- **Veri tarihi:** yeni liste / yeni fiyat işi değilse hiçbir revizyon veri tarihini değiştirmez (deploy sonrası build `--refresh` olmadan).\n- **Etkilenen yerler:** stüdyodaki bir değişiklik Güncel Kampanyalar › müşteriler, Listelerim, PY Ekranı › Özel fiyat › Upsell, firma çubuğundaki Upsell sekmesi, üst arama, Yenileme ekranında da kontrol edilir (PR #602 sonrası 19407 vakası, 25.11.2026).", "tags": ["Upsell", "emekli", "yasak", "müşteri görünümü"], "source": "2 Upsell/Upsell/CLAUDE.md (SCOPE); PROJECT.md §73", "links": [{"label": "D-One › Upsell Stüdyosu", "url": "https://d-one.dugun.work/satis/upsell/#liste:unfit"}], "updated": "2026-11-25"}, {"id": "lb-1", "cat": "Sözleşmeler", "kind": "nasil", "pin": true, "title": "Yeni KDV kuralı: GA / GY sözleşmesi nasıl doldurulur", "tldr": "Satıştan önce listeleme bedeli (GA 250 / GY 3.000 KDV hariç) düşülür; kalanın %85'i KDV'siz lisans bedeli, %15'i %20 KDV'li pazarlama bedeli yazılır.", "body": "- **Ne zaman başladı:** 21.09.2026 (yeni KDV kuralı). **22.09.2026'dan beri** listeleme bedeli önce satıştan düşülüyor; önceki kuralda düşülmüyordu (10.000 TL örneği 10.600 çıkıyordu, şimdi 10.342,50).\n- **Hangi sözleşme:** GA = aylık ödemeli AR-GE ve Üyelik Sözleşmesi (eski adı GTS) · GY = yıllık / peşin (eski adı GT). Mekan (SAS / MoS) satışları içindir. **TES / Plus bu formla yazılmaz** (Plus, TES'in KDV'li sözleşmesiyle satılır; Nes 21.09.2026).\n- **GA (aylık) adımları** — örnek: aylık satış 10.000 TL, İstanbul Kır Düğünü Winner 2X:\n   - Fiyat / Lisans Kullanım Bedeli = (satış − 250) × %85 = **8.287,50** (KDV yok, 'KDVK Geç. 20/1 kapsamında KDV'den müstesna').\n   - Listeleme satırı formda basılı gelir: 250 + 50 KDV = 300 TL, bir şey yazılmaz.\n   - Pazarlama ve Organizasyon (Seri Üretim) Bedeli KDV hariç = (satış − 250) × %15 = **1.462,50**; KDV %20 = **292,50**; KDV dahil = **1.755,00**.\n   - Aylık Liste Fiyatı = ürünün güncel rate card aylık liste fiyatı; Aylık İndirim = liste − satış; **Kampanya İndirim Tutarı yalnızca 'ilk ay 1 TL' gibi kampanyalarda** yazılır, yoksa boş.\n   - Aylık Ödenecek Tutar = lisans + 300 + pazarlama KDV dahil = **(satış − 250) × 1,03 + 300** → 10.342,50.\n- **GY (yıllık) adımları** — örnek: sözleşme toplam tutarı 180.000 TL:\n   - Lisans = (180.000 − 3.000) × %85 = **150.450** · Pazarlama KDV hariç = × %15 = **26.550** · KDV %20 = **5.310**.\n   - Listeleme basılı: 3.000 + 600 KDV = 3.600.\n   - Net Toplam = lisans + 3.000 + pazarlama = **180.000** (= satış) · Tevkifatlı KDV = 600 + 5.310 = **5.910** · Genel Toplam = **185.910** = (satış − 3.000) × 1,03 + 3.600.\n- Tutarlardan biri kuruşluysa o formdaki tüm tutarlar 2 ondalıkla yazılır (8.287,50 · 300,00).\n- İlk Ay Ödenecek Tutar / Vade Tarihi (GA) ve GY ödeme planı satırları kılavuzda işaretlenmedi, satışçı doldurur.\n- Yasal not (Nes'in metni): 4691 sayılı kanun kapsamında Pazarlama ve Organizasyon Hizmeti bedeli istisna dışında olduğundan KDV'ye tabidir.", "tags": ["sözleşme", "KDV", "GA", "GY", "SAS", "MoS"], "source": "Desktop/Nesibe İşler/Claude/6 Contracts/Agreements/CLAUDE.md · Sözleşme Doldurma Kılavuzu_Aylık ve Yıllık_Yeni KDV Kuralı_06.10.2026.html", "links": [{"label": "Sözleşme Doldurma Kılavuzu (D-One)", "url": "https://d-one.dugun.work/satis/kampanyalar/sozlesme-kilavuzu"}], "updated": "2026-09-22"}, {"id": "lb-2", "cat": "Sözleşmeler", "kind": "kural", "pin": false, "title": "Sözleşme Doldurma Kılavuzu artık yalnızca D-One'da", "tldr": "10.11.2026'dan beri tek geçerli kılavuz D-One › Güncel Kampanyalar › 3. sekme; GitHub sayfası sadece oraya yönlendirir.", "body": "- **Güncel yer:** D-One › Satış › Güncel Kampanyalar › üçüncü sekme 'Sözleşme Kılavuzu' (TES için değil). Liste fiyatları CRM'deki `dw_product_list_price`'tan gelir (Excel'den değil) — D-One kopyası 04.11.2026.\n- **10.11.2026 SCOPE (Nes):** eski GitHub sayfası `nesibekeles.github.io/duguncom/Sozlesme_Doldurma_Kilavuzu.html` yalnızca D-One'a yönlendirme notu gösterir. **`build_sozlesme_kilavuzu.py --publish` bir daha çalıştırılmaz** — notu eski kılavuzla ezer.\n- Önceki durum (geçmiş): 21.09.2026–10.11.2026 arası kılavuz GitHub Pages'te herkese açıktı; yerel sürümler 21.09 / 22.09 / 30.09 / **06.10.2026** (Ekim 2026 Winner kartı +%10, Çeşme İzmir uydu ilçelerine eklendi).\n- Kılavuzda bir değişiklik = hem `6 Contracts/Agreements/tools/` hem D-One'daki `_sozlesme_form.html.twig` / `kampanya_sozlesme_controller.js` / `kampanya_sozlesme.css` (`docs/modules/kampanya.md` §0c) güncellenir.\n- Paket seçici: il → ilçe → kategori → paket (Winner 2X/4X/6X; taşra ilçe → Uydu İller satırı; Seferihisar otelleri İzmir fiyatında kalır). Welcome Paketi seçicide **kapalı** (`INCLUDE_WELCOME = False`), çünkü Welcome yalnızca yıllık satılır; aylık Welcome açılırsa True yapılıp yeniden derlenir. GY tarafında seçici yok.", "tags": ["sözleşme", "D-One", "kılavuz"], "source": "Desktop/Nesibe İşler/Claude/6 Contracts/Agreements/CLAUDE.md", "links": [{"label": "Sözleşme Kılavuzu (D-One)", "url": "https://d-one.dugun.work/satis/kampanyalar/sozlesme-kilavuzu"}, {"label": "Eski GitHub sayfası (yalnızca yönlendirme)", "url": "https://nesibekeles.github.io/duguncom/Sozlesme_Doldurma_Kilavuzu.html"}], "updated": "2026-11-10"}, {"id": "lb-3", "cat": "Sözleşmeler", "kind": "bilgi", "pin": false, "title": "AR-GE sözleşme formları: GT/GTS → GY/GA ve 21.08.2026 revizyon kontrolü", "tldr": "Yeni basılan GY (yıllık) ve GA (aylık) formları eski GT/GTS'in yerini aldı; arka yüz maddelerinin otoritesi 07.08.2026 revizyonlu Word dosyalarıdır.", "body": "- **Eski:** `ar-ge-GT.pdf` (yıllık peşin) ve `ar-ge-GTS.pdf` (aylık), 24.07.2026. **Yeni:** `ar-ge-GY.pdf` ve `ar-ge-GA.pdf`, 21.08.2026.\n- Arka yüz (sözleşme maddeleri) için **otorite:** 'İstanbul Üniversitesi Teknokent AR-GE ve (Aylık Ödemeli) Üyelik Sözleşmesi (07.08.2026 revizyon)' .docx dosyaları. Kontrolde GY'de 2.514 kelimede 0 fark, GA'da 3.061 kelimede yalnızca 2 noktalama farkı çıktı (hatalı olan Word).\n- **21.08.2026 kontrolünde ön yüzde teyit edilmesi istenen 6 nokta:**\n   - GA: listeleme 250 TL 'KDV dahil' iken 'KDV hariç' sütununa geçti, KDV dahil 300 TL oldu (sonradan yeni KDV kuralıyla doğru kabul edildi).\n   - GA imza bloğunda 'SD' alanı 'İ.G.Y.' oldu.\n   - IBAN'lar değişti (İş Bankası TR54…6138 49, Garanti TR09…2958 46); Denizbank IBAN'ı ve Ticaret Sicil No footer'dan kalktı.\n   - 'Sözleşme No' etiketi kayboldu (kutuda yalnızca GY / GA yazıyor).\n   - E-fatura 'ONAY' kutusu kaldırıldı.\n   - GY'de Tevkifatlı KDV kutusundaki ön baskılı 600 TL silindi (alan boş kalma riski).\n- Adres (Şennur Yüksel, Slack 14.08.2026): Merkez Hacımimi Mh. Serdar-ı Ekrem Cd. No:28 34421 Beyoğlu · Şube Üniversite Mah. Sarıgül Sk. No:35/2 İç Kapı 1 Avcılar. Footer'a tek satır olarak eklendi.\n- Sözleşmeyi kesen firma: **Perador Bilişim ve Yazılım Hizmetleri A.Ş.** (İstanbul Teknokent).", "tags": ["sözleşme", "GA", "GY", "AR-GE", "Teknokent"], "source": "Desktop/Nesibe İşler/Claude/6 Contracts/Agreements/AR-GE Sözleşme Revizyon Kontrolü 21.08.2026.html", "links": [], "updated": "2026-08-21"}, {"id": "lb-4", "cat": "Sözleşmeler", "kind": "bilgi", "pin": false, "title": "TES (Plus) sözleşmeleri ve TES saha sözleşmesi formları (A / Y)", "tldr": "TES, Plus'ı AR-GE formu yerine KDV'li Üyelik Sözleşmesi ile satar; saha ekibi için 'A' (aylık) ve 'Y' (yıllık) basılı formlar 01.10.2026'da hazırlandı.", "body": "- **Neden ayrı:** Plus non-venue üründür; GA/GY'deki lisans (%85 KDV'siz) bölmesi yoktur, tutar düz KDV'li yazılır (Nes 21.09.2026).\n- **Saha formları** (`TES/SAHA/`, 01.10.2026 — TES hibrit modeli 14.09.2026'da başladı):\n   - `A.pdf` = aylık 'Üyelik Sözleşmesi A': Genel Toplam = Aylık Liste Fiyatı · Aylık İndirim Tutarı · Kampanya İndirim Tutarı · Aylık Ödenecek Tutar; ödeme 'Kredi Kartı Aylık Ödeme', her ayın vadesi. Katılım bedeli = 1 aylık liste fiyatı, 12 ay taahhütte alınmaz.\n   - `Y.pdf` = yıllık 'Üyelik Sözleşmesi Y': Net Toplam · Tevkifatlı KDV · Genel Toplam; ödeme planı N (nakit) / H (havale) / Ç (çek) / KK satırları.\n   - Her ikisinde ürün tablosu yok; Yeni / Yenileme kutusu, E-fatura mükellefi mi?, İ.G.Y. alanı var. Arka yüz metni `Aylık (KDVli).docx` / `Yıllık (KDV'li).docx`.\n   - `Tasarım Formu.pdf` = sözleşmenin eki (müşterinin reklam / bilgi formu).\n- **Hazırlık klasörü** (`TES/Hazırlık/`): `Aylık (KDVli).docx` (ALPASLAN ÖZKAN'ın 26.06.2026 izli eklemeleri duruyor; basılı `örnek_e-sözleşme.pdf`'e göre 7.7 maddesi eksik), `yıllık (KDV'li).pdf` + Word'e çevrilmiş hali (15.09.2026), `ar-ge-Y_TES.pdf` (29.09.2026, GY ön yüzünden 'SATIN ALINAN …' bölümleri çıkarılmış TES yıllık ön yüzü).\n- Dikkat: aylık metinde taraf adresi Beyoğlu, yıllıkta Avcılar yazıyor.\n- Plus fiyatları (Eylül 2026): liste 14.850 + KDV/ay; yeni satış 9.900 + KDV yalnız yıllık; yenileme yıllık 6.000 + KDV, aylık açık hesap 9.900 + KDV. Kodlar `TES9900YILLIK%14`, `TES6000YILLIK%14`, `TES9900AYLIK%20` (% = KDV oranı).", "tags": ["sözleşme", "TES", "Plus", "saha", "KDV"], "source": "Desktop/Nesibe İşler/Claude/6 Contracts/Agreements/TES/ · Desktop/Nesibe İşler/Claude/3 Pricing/Düğüncom_subscription_models/PRICING.md §3b", "links": [], "updated": "2026-10-01"}, {"id": "lb-5", "cat": "Sözleşmeler", "kind": "kural", "pin": false, "title": "Garanti Belgesi (Garantili Üyelik) 2026 koşulları", "tldr": "İlk kez üye olan firmaya 12 ay içinde hiç anlaşma olmazsa kullandığı süre kadar (en fazla 12 ay) ücretsiz kullanım hakkı; şartlar çok sıkı.", "body": "- **Güncel belge:** `6 Contracts/Agreements/garanti-belgesi-2026.pdf` (30.10.2026). AR-GE ve üyelik sözleşmesinin ekidir; CEO Emek Kırbıyık imzalı, firma yetkilisi imzalar, Sözleşme No yazılır.\n- **Kimler:** yalnızca ilk kez Düğün.com'a üye olanlar, bir kereye mahsus. Yenilemede garanti yoktur. Welcome Paketi satışlarında 'garantili satış' uygulanır (PRICING.md).\n- **Firmanın yükümlülükleri:**\n   - 12 ay aktif üyelik ve hiçbir borç olmaması.\n   - Başlangıçtan en geç **7 gün** içinde panel eksiksiz: en az **30** düğün/kına/nişan temalı görsel, tanıtım yazısı, eksiksiz firma bilgisi.\n   - Her teklife (form, arama, artı) **24 saat** içinde telefonla dönüş; ulaşamadığı çifte anında yazılı bilgi ve **en az 3 kez** tekrar arama.\n   - Paket yükseltme veya düşürme, devir / birleşme / ortak değişimi garantiyi iptal eder; başka kampanya ile birleşmez.\n- **Anlaşma sayılan durumlar:** çiftin Düğün.com'daki numaradan araması, panelde yazılı teklif, profili ziyaret, 'anlaştım' işaretleri, yorum, WP geri bildirim aramasında anlaştığını söylemesi. **Tek bir iş** bile garantiyi yerine getirir.\n- **Talep:** sözleşme bitişinden itibaren **15 gün** içinde yazılı olarak satis.destek@dugun.com'a (son gün tatile denk gelirse ilk iş günü 17:45'e kadar). Süre geçerse hak düşer. Bitişten sonraki 1 ay firma faaliyette olmalı.\n- **Önceki belgeler (2026 öncesi, `5 Provider Reports/guarantee_agreements/`):** '6 Ay' (12 ay sözleşme, 6 ayda iş yoksa ödemelerin iadesi + 6 ay ücretsiz; yalnız Düğün Mekanları Winner 2X/4X/6X; 40 görsel; **12 saat** içinde dönüş; talep 6. ay bitiminden 15 gün içinde) ve '1 Yıl'. 2026 belgesi bunların yerini aldı: görsel 40 → 30, dönüş 12 → 24 saat (+3 tekrar arama), iade maddesi yok.", "tags": ["garanti", "sözleşme", "Welcome", "yeni satış"], "source": "Desktop/Nesibe İşler/Claude/6 Contracts/Agreements/garanti-belgesi-2026.pdf · Desktop/Nesibe İşler/Claude/5 Provider Reports/guarantee_agreements/", "links": [], "updated": "2026-10-30"}, {"id": "lb-6", "cat": "Sözleşmeler", "kind": "nasil", "pin": false, "title": "Garanti talebi değerlendirme raporu nasıl yazılır", "tldr": "Firma garanti talep ettiğinde PY ekibine giden Word raporu: madde madde kanıt, sade dil, ölçü yöntemi yok.", "body": "- **Girdi:** provider_name / provider_id / product_id. **Çıktı:** `<Firma>_Garanti Sözleşmesi Kontrol_<GG.AA.YYYY>.docx` (`5 Provider Reports/guarantee_agreements/`). Örnekler: Zin Urla (06.08.2026), Celtik Garden (17.08.2026), Blue Mudanya Hotel (18.08.2026).\n- **Okuyucu PY (hesap yönetimi)** — Qlik alan adı, metrik yöntemi, uygulama adı yazılmaz.\n- **Kontrol edilecek maddeler:** 7 günde panel içeriği (görsel sayısının gün gün ilerleyişini tablo yap), teklife dönüş süresi, anlaşma kanıtı kriterleri, borç / ödeme, yazılı talep süresi.\n- **Kurallar:**\n   - Yalnız product_start_date **sonrası** notlar; sadece `pm_note` = PY notu sayılır, `note` = Finans/tahsilat (etiketle, sayma). Tabloda herkesi departmanıyla yaz: (PY), (Finans), (Satış), (Wedding Planner).\n   - Oranları yuvarlama: '%19,4 (84 lead)'.\n   - Firma kusurunu 'karşılıklı sorun' diye yumuşatma; iç ekip eleştirisini kısa ve olgusal tut.\n   - Profil yorumu yalnız düğün tarihi sözleşme başlangıcından sonraysa kanıttır. WP çift arama sonuçlarına (ör. 'Organizasyon İptal') da bak.\n   - PY notlarındaki çelişkileri işaretle ('sezon çok iyi' deyip sıfır anlaşma iddiası gibi).\n   - Her firma tek başına değerlendirilir, başka firmayla emsal kurulmaz. Önemli noktalar kalın / kırmızı.\n- Çağrı kayıtları: `tools/transcribe.py` (yerel Türkçe Whisper, `--split-channels`).", "tags": ["garanti", "PY", "rapor"], "source": "Desktop/Nesibe İşler/Claude/5 Provider Reports/guarantee_agreements/notes/guarantee-agreement-analysis.md", "links": [], "updated": "2026-08-17"}, {"id": "lb-7", "cat": "Raporlar & paneller", "kind": "nasil", "pin": false, "title": "Firma Karnesi (Pro Start 3 ve diğer ürünler) nasıl hazırlanır", "tldr": "Yenileme görüşmesine saha ekibinin götürdüğü 9 sayfalık PPTX + PDF karne; talep gelince provider_id listesiyle üretilir.", "body": "- **Ne:** firmanın paket dönemindeki trafik, teklif, dönüş süresi ve rakip kıyası. **Kim alır:** PY / saha satış (SAS) yenileme görüşmesi için. **Sıklık:** düzenli değil, talep üzerine (partiler: 02/09, 04/09, 18/09, 22/09, 17.11.2026).\n- **Adımlar** (`5 Provider Reports/Firma_Karnesi/`):\n   - `python tools/pull.py <id'ler>` (Pro Start 3) veya `--latest` (herhangi bir ürün); ayrılmış firma için `--asof YYYY-MM-DD`.\n   - `data/bullets.json`'a her yeni firma için 'Çiftler mekanınızı çok sevdi!' maddelerini firmanın dugun.com sayfasındaki 'Neden Tercih Etmelisin?' bölümünden elle yaz.\n   - `python tools/build.py` → `powershell -File tools/export.ps1 -OutDir <çıktı> -QaDir <scratch>` → `output/<GG.AA.YYYY>/`.\n- **Kurallar:** Ortalama Dönüş Süresi = aritmetik ortalama (medyan değil, Nes 04.09.2026). Dönüş Yok > %20 ise övgü satırı basılmaz (18.09.2026). Pro Start firmalarında 7. sayfa upsell hedefi **Winner 4X** (Nes 18.09.2026); Pro Start dışı ürünlerde upsell sayfası silinir (8 sayfa). Birden çok sayfalı müşteri: `--together` veya `--combined`.\n- Renk eşikleri: Fotoğraf <40 kırmızı / 40–50 sarı / >50 yeşil · CR <%2 turuncu / 2–3 sarı / ≥3 yeşil · Dönüş süresi 0–2 sa yeşil … 12 sa+ kırmızı · Dönülen teklif ≥90 yeşil / 60–89 sarı / <60 kırmızı.\n- Qlik tuzağı: oturum seçimleri taşınır → `ClearAll` + yalnız set analysis; tarih aralığı metin formatında.\n- Açık konu: Winner 4X kartının alt 'ayrıcalık' satırı hâlâ Pro Start 12 metni. BI devri: `Firma_Karnesi_BI_Handover_15.09.2026.zip`.", "tags": ["karne", "yenileme", "Qlik", "PY"], "source": "Desktop/Nesibe İşler/Claude/5 Provider Reports/Firma_Karnesi/PROJECT.md", "links": [], "updated": "2026-09-24"}, {"id": "lb-8", "cat": "Raporlar & paneller", "kind": "nasil", "pin": false, "title": "Turbo Karne Stüdyosu: yeni firma ekleme", "tldr": "Turbo alan firmaların performans karnesi canlı stüdyo sayfasında; talep gelince firma çekilip sayfaya eklenir ve push edilir.", "body": "- **Canlı sayfa:** Turbo Karne Stüdyosu (GitHub Pages, repo `nesibekeles/duguncom`). Firma karnesi A4 PDF olarak buradan indirilir. 06.08.2026'da 30 firmayla kuruldu.\n- **Kim ister:** satış / PY, talep üzerine (yıl içinde birkaç kez). **Sadece Turbo dönemi bitmiş firmalar** eklenir (Nes 16.09.2026 — Botanik Garden bu yüzden çıkarıldı).\n- **Adımlar** (`5 Provider Reports/Turbo_Karne/`): `python tools/pull.py <id'ler>` → `python tools/build.py` → tarayıcıda kontrol → `repo/` içinde commit + push → 1–2 dk sonra canlı URL'de firma adını kontrol et. Firma silmek: `tools/remove.py`.\n- **Tanımlar:** Turbo yalnız Executive app'te (`booster_ppps`, General bilmez). Boost penceresi = ilk 'Boost' günü → bitiş; referans = başlangıçtan önceki 182 gün. Söz: sayfa görüntülenme en az **2 kat** (+%100). Teklif oranları yalnız organik lead ile.\n- Turbo kaydı olmayan firma eklenmez (ör. 117385). 'Ürün Analiz' sekmesi tek seferlik çalışma, güncellenmez.\n- Açık konu (13.11.2026): Qlik'te `instagram_visit` geriye dönük yukarı düzeltildi; Ağustos firmalarının Instagram değerlerini yenileme kararı Nes'te bekliyor.", "tags": ["Turbo", "karne", "GitHub"], "source": "Desktop/Nesibe İşler/Claude/5 Provider Reports/Turbo_Karne/PROJECT.md", "links": [{"label": "Turbo Karne Stüdyosu", "url": "https://nesibekeles.github.io/duguncom/Turbo_Firma_Karnesi.html"}], "updated": "2026-11-13"}, {"id": "lb-9", "cat": "Raporlar & paneller", "kind": "nasil", "pin": false, "title": "Müşteri şikâyeti performans değerlendirmesi", "tldr": "'Teklif / trafik alamıyorum' diyen ödeyen müşteri için iç rapor (.docx) + müşteriye gidecek tek sayfalık özet.", "body": "- **Ne zaman:** PY / satış memnuniyetsiz bir müşteri için sorduğunda, talep üzerine. İlk örnek: 77391 Margaret Davet, Tuzla (21.09.2026).\n- **Cevaplanan sorular:** firma kendi işini yaptı mı, ortalamanın altında mı (İstanbul / aynı X / komşu ilçe medyanları), bölgede düğünler nasıl dağılıyor, ürün başarısız mı, öneri paketi.\n- **Yöntem:** kart görüntülemeyi aynı-X medyanıyla kıyasla (ürün sözünü tuttu mu); CTR/CR'ı komşu ilçelerle kıyasla (profil mi lokasyon mu); X değişimini İstanbul kategori payı üzerinden ölç (dürüst upgrade etkisi). WP red nedenleri ('Lokasyon uymadı' %53 belirleyiciydi). Feedback app'te ilçe yalnız ~%10 satırda dolu → 'örneklem' diye yaz.\n- **Dosyalar:** iç rapor `<Firma>_<id>_Performans ve Memnuniyet Değerlendirmesi_<tarih>.docx`, kısa iç sürüm `…_Özet_…`, müşteri sürümü `<Firma>_Performans Özeti_Firma için_<tarih>` (.docx + PDF). Script'ler `tools/` içinde, id ve tarihler sabit yazılı — yeniden kullanmadan önce düzenle.", "tags": ["müşteri", "şikâyet", "performans", "PY"], "source": "Desktop/Nesibe İşler/Claude/5 Provider Reports/Musteri_Performans_Degerlendirme/PROJECT.md", "links": [], "updated": "2026-09-21"}, {"id": "lb-10", "cat": "Çalışma kuralları", "kind": "yasak", "pin": false, "title": "Firmanın okuyacağı raporlarda yazılmayacaklar", "tldr": "Müşteriye giden her metinde 'haklısınız' yok, teklif / teslimatımız düştü yok; düşüş varsa yalnız veri doğruluyorsa sektöre bağlanır.", "body": "- 'Haklısınız' yazılmaz.\n- Müşterinin teklif sayısının ya da bizim teslimatımızın azaldığı yazılmaz. Açıklamak şartsa sektöre bağla ('evlilik sayıları azaldı'), **yalnız veri doğruluyorsa** (İstanbul resmi evlilik 2024 104.572 → 2025 99.032). Tercihen Ekim–Ocak araştırma sezonunun geldiğini vurgula.\n- 'Danışmanlarımız' değil **'Wedding Planner ekibimiz'**.\n- Bölüm başlıkları kısa, altında açıklama cümlesi yok. Teklif kartı yalnız BUGÜN ➜ ÖNERİMİZ paketi; emoji ikon ve etki kutucukları eklenmez.\n- Pazar rakamları oran olarak (\"%35 daha yüksek\"), mutlak lead sayısı değil. Ödeme gecikmesi, PY notu alıntısı, rakip adı / fiyatı, indirim oranı, teklif başı maliyet yazılmaz.\n- Ürün gerçeği: **ek ilçe yalnız Düğün Salonları kategorisinde** vardır; Söz-Nişan, Kına vb. için önerilmez.\n- Tarih: kurallar Nes 21.09.2026.", "tags": ["müşteri", "yazım", "rapor"], "source": "Desktop/Nesibe İşler/Claude/5 Provider Reports/notes/customer-facing-report-rules.md", "links": [], "updated": "2026-09-21"}, {"id": "lb-11", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Satış Küpü / saha satış sunumu (SAS & MoS)", "tldr": "Saha ekiplerinin mekan görüşmesinde açtığı canlı sunum; 07.10.2026'dan beri D-One'da (/satis-kupu/) BI tarafından barındırılıyor.", "body": "- **Kimin için:** SAS ve MoS saha ekipleri (TES ve SAD kapsam dışı). 20.08.2026'da başladı.\n- **İçerik:** 8 konuluk bento pano — Her düğün Düğün.com ile başlar (canlı Türkiye haritası) · Kendi hikâyeni yarat (satışçının en iyi sayfaları, gerçek veri) · Satış simülatörü (BI'ın Apps Script simülatörü, erişim kodlu) · Ne vereceksiniz, ne alacaksınız (ROI) · Ortaklık · Instagram · Rakipler ne durumda · Boş günler (Özel Fiyat).\n- **Kurallar:** model çıktıları 'tahmin, taahhüt değil' etiketli; anlaşma sayısı firmaya gösterilmez (WP geri bildirimi çiftlerin en fazla yarısına ulaşır). Özel Fiyat için yalnız '+%6 kart tıklama' söylenir, 'daha çok teklif getirir' denmez.\n- **Haftalık veri yenileme:** 12.10.2026'dan beri BI'ın (Barış) işi, D-One içinde (`docs/WEEKLY_DATA_REFRESH_BI.md`, 06.10.2026). Önceden Nes'in laptopunda elle ~7 dk + pazartesi harita görevi çalışıyordu.\n- Kullanıcı / ekip listesi Google Sheet (İsim + Ekip) `build_story_js.py`'nin girdisi.\n- Satış metodu: CSO'nun 'Yeni Satış Metodumuz' eğitimi (31.08.2026) deşifre ve sunum eşlemesi `docs/` içinde.", "tags": ["SAS", "MoS", "sunum", "D-One", "saha"], "source": "Desktop/Nesibe İşler/Claude/4 Sales Dashboards/Sale_Dashboard/docs/PROJECT.md · docs/WEEKLY_DATA_REFRESH_BI.md · dist_d_one/README.md", "links": [{"label": "Satış Küpü (D-One)", "url": "https://d-one.dugun.work/satis-kupu/"}, {"label": "Eski GitHub sunumu", "url": "https://nesibekeles.github.io/sunum/"}, {"label": "Kullanıcı / ekip sheet'i (İsim + Ekip)", "url": "https://docs.google.com/spreadsheets/d/1ahRclFZjguwGk7ZHtIkZuO6zRQqbY5fKXKZEgR8clnU"}], "updated": "2026-10-12"}, {"id": "lb-12", "cat": "Raporlar & paneller", "kind": "bilgi", "pin": false, "title": "Canlı etkileşim haritası: zaman sözlüğü ve iki haftalık veri", "tldr": "Sunumdaki harita gerçek couple_interaction verisini bir hafta gecikmeli 'canlı' gibi oynatır; veri tabanı hep iki hafta tutar.", "body": "- **Nes'in sözlüğü (21.09.2026):** 'bugün' = bir hafta önceki aynı gün ve saat · Son 24 saat = (şimdi−7g−24s, şimdi−7g] · Son 7 gün = (şimdi−14g, şimdi−7g].\n- Her pazartesi yeni haftalık `interactions*.xlsx` export'u eklenir, en eski hafta silinir. Anlaşmalar (`Feedbacks.xlsx`, WP çağrı sonuçları) iki hafta geriden oynatılır, kartlarda değil yalnız akışta / haritada görünür.\n- Kategori filtresi yalnız 5 mekan grubunu tutar; toplamlar tüm kategoriler.\n- Ham export'larda çiftlerin tam adı var → projeye kopyalanmaz, yükte yalnız baş harfler.\n- Laptop görevi 'Nes Harita Haftalik Yenileme' (pazartesi 09:00–19:00) 21.09.2026'da kuruldu; 07.10.2026'da harita D-One'a devredildi (`dist_d_one/`), haftalık yenileme BI'da.", "tags": ["harita", "sunum", "veri"], "source": "Desktop/Nesibe İşler/Claude/4 Sales Dashboards/Sale_Dashboard/canli_harita/PROJECT.md · notes/canli-harita-deck-preview.md", "links": [], "updated": "2026-10-07"}, {"id": "lb-13", "cat": "Satış ekipleri", "kind": "bilgi", "pin": false, "title": "SAD günlük arama listesi: kurallar ve dağıtım", "tldr": "SAD (randevu ekibi) için müşteri bazında günlük arama listesi spec'i; BI'a verildi, skor ile sıralanır, şehir bazında temsilciye dağıtılır.", "body": "- **SAD ne yapar:** ofisten soğuk arama + gelen B2B lead'lere (REVİD) dönüş; amaç saha (çoğunlukla MoS) takvimini kaliteli randevuyla doldurmak.\n- **Listeye girme şartları (müşteri bazında):** hiçbir sayfası `Paid` değil · en son ürün bitişinden **≥ 190 gün** geçmiş (daha yenisi yenileme ekibinde) · en az bir mekan sayfası · şehir 'MoS & SAS' şehri (22 il). Blacklist kimseyi çıkarmaz, `BL Alert` sütununda gösterilir.\n- **Sıralama:** Call Priority Score v3.1 (GSC gösterim / aynı şehir-kategori ödeyen medyanı × trend × etkileşim × winback; REVİD skora dahil). Tıklama değil **gösterim** kullanılır (reklam organik tıklamayı çalar).\n- **Dağıtım:** müşterinin şehrine göre, 'Cities_Venue-Sales-Team' sheet'inden (kaynak bu sheet — kota değişikliği BI gerektirmez). Temsilci başına günde **en az 100 müşteri**; eksik şehir önceliğe göre başka şehirden en fazla +%20 tamamlanır.\n- Ekip (sheet'e göre değişir): Ceylan Çaçan (lider), Sıla Uysal, Semanur Kuru, Cagla Askar.\n- 'Randevu' sonucu → listeden çıkar; 45 gün sonra hâlâ ödememişse hatırlatma ile döner. Hatırlatmalar ve sonuç yazma (write-back) arama sonucu kaydı olmadan çalışmaz — açık konu (BI).\n- Ekip Panosu spec 1.2 (30.09.2026): hedef ekip için günde **15 randevu** (temsilci başı 3), görüşme = Sonitel'de 45 sn üstü, günde 100/kişi; 'Kota' değil 'Hedef'; sıralamada 'rakip', 'prim', isim yok. Sonitel / Ekmob verisi henüz Qlik'te yok.\n- Örnek panel `sample_dashboard/SAD_Ornek_Panel.html` **05.11.2026'dan beri kullanılmıyor** (test sayfası) — revize edilmez.", "tags": ["SAD", "arama listesi", "MoS", "skor"], "source": "Desktop/Nesibe İşler/Claude/4 Sales Dashboards/Sales Support - Call List Dashboard/PROJECT.md (17.08.2026) · SAD_CALL_SCORE_SPEC.md · Satış Destek, Ekip Panosu 1.2.md", "links": [{"label": "Cities_Venue-Sales-Team sheet'i (SAD şehir / kota)", "url": "https://docs.google.com/spreadsheets/d/1qz58tnoEyEeKqVhImVEj_0JrlnrDA4H7N4v1kYJXcqo/edit?usp=sharing"}], "updated": "2026-11-05"}, {"id": "lb-14", "cat": "Metrikler & tanımlar", "kind": "tanim", "pin": false, "title": "Potansiyel skor (ödemeyen mekanlar için win-back önceliği)", "tldr": "score = demand_ratio × trend × engagement × winback_bonus; ödemeyen sayfanın Google gösterimini aynı şehir-kategorideki ödeyen medyanıyla kıyaslar.", "body": "- **demand_ratio** = son 12 ay GSC gösterimi (eski / yönlendirilmiş URL'ler dahil) ÷ aynı şehir × kategorideki **ödeyen** sayfaların medyan gösterimi (taban değerli). 1,0 = tipik ödeyen kadar görünür.\n- **Gösterim kullan, tıklama değil:** ödeyen sayfalarda reklam organik tıklamayı çalıyor (ödeyenlerde organik pay %32, ödemeyenlerde %52); tıklama ödemeyenleri şişirir.\n- Sıralama
